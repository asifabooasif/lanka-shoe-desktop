  }
  views.users = viewUsers;
  window.viewUsers = viewUsers;

  function describePerm(p) {
    return {
      read: 'View any data',
      write: 'Create / edit records',
      delete: 'Delete records',
      users: 'Manage users',
      backup: 'Backup / restore',
      settings: 'Change settings',
      reports: 'Run reports'
    }[p] || '';
  }

  /* ═════════════════════════════════════════════════════════════════════
     USER FORM
  ═════════════════════════════════════════════════════════════════════ */
  function openUserForm(id) {
    if (!requirePerm('users')) return;
    const u = id ? arr(db.users).find(x => x.id === id) : null;
    openModal(u ? '✎ Edit User — ' + esc(u.username) : '＋ Add User',
      '<form onsubmit="saveUser(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Username <span class="req">*</span>'
      + '<input name="uUser" required ' + (u ? 'disabled ' : '')
      + 'value="' + esc(u ? u.username : '') + '" '
      + 'placeholder="lowercase, no spaces"></label>'
      + '<label class="field">Display Name'
      + '<input name="uName" value="'
      + esc(u ? (u.displayName || '') : '') + '"></label>'
      + '<label class="field">Role'
      + '<select name="uRole">'
      + Object.keys(ROLES).map(k =>
          '<option value="' + k + '" '
          + (u && u.role === k ? 'selected' : '') + '>'
          + ROLES[k].label + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Status'
      + '<select name="uActive">'
      + '<option value="1" ' + (!u || u.active ? 'selected' : '') + '>'
      + 'Active</option>'
      + '<option value="0" ' + (u && !u.active ? 'selected' : '') + '>'
      + 'Disabled</option>'
      + '</select></label>'
      + (u ? '' :
          '<label class="field" style="grid-column:1/-1">Password '
          + '<span class="req">*</span>'
          + '<input name="uPwd" type="password" required minlength="4" '
          + 'placeholder="Minimum 4 characters"></label>')
      + '</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (u ? 'Save Changes' : 'Create User') + '</button>'
      + '</div></form>');
  }
  window.openUserForm = openUserForm;

  function saveUser(e, existingId) {
    e.preventDefault();
    if (!requirePerm('users')) return;
    const f = e.target;

    if (existingId) {
      const u = arr(db.users).find(x => x.id === existingId);
      if (!u) return;
      const oldRole = u.role;
      u.displayName = f.uName.value.trim() || u.username;
      u.role = f.uRole.value;
      u.active = f.uActive.value === '1';
      /* Safety: prevent removing last owner */
      if (oldRole === 'owner' && u.role !== 'owner'
        && arr(db.users).filter(x => x.role === 'owner' && x.active)
            .length <= 1) {
        toast('Cannot change role — last owner', 'error');
        return;
      }
      logActivity('USER_UPDATED', 'User', u.username,
        'role ' + oldRole + ' → ' + u.role);
    } else {
      const username = f.uUser.value.trim().toLowerCase();
      if (!/^[a-z0-9_]+$/.test(username)) {
        toast('Username: lowercase letters, numbers, _ only', 'error');
        return;
      }
      if (arr(db.users).some(x => x.username === username)) {
        toast('Username already exists', 'error');
        return;
      }
      const pwd = f.uPwd.value;
      if (pwd.length < 4) { toast('Password too short', 'error'); return; }
      db.users.push({
        id: uid(),
        username: username,
        displayName: f.uName.value.trim() || username,
        role: f.uRole.value,
        passwordHash: hashPassword(pwd),
        active: f.uActive.value === '1',
        mustChangePassword: true,
        createdAt: nowISO(),
        lastLoginAt: null,
        lastLoginDevice: null
      });
      logActivity('USER_CREATED', 'User', username,
        'role ' + f.uRole.value);
    }
    save();
    closeModal();
    render();
    toast('✅ User saved', 'success');
  }
  window.saveUser = saveUser;

  /* ═════════════════════════════════════════════════════════════════════
     RESET PASSWORD (by owner)
  ═════════════════════════════════════════════════════════════════════ */
  function openResetPassword(userId) {
    if (!requirePerm('users')) return;
    const u = arr(db.users).find(x => x.id === userId);
    if (!u) return;
    openModal('🔑 Reset Password — ' + esc(u.username),
      '<div class="alert warn" style="background:var(--amber-soft);'
      + 'color:var(--amber);padding:12px 16px;border-radius:10px;'
      + 'font-size:12.5px;margin-bottom:16px">'
      + '⚠ User will be asked to change this on next login.</div>'
      + '<form onsubmit="saveResetPassword(event,\'' + userId + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">New Password'
      + '<input name="npPwd" type="password" required minlength="4"></label>'
      + '<label class="field">Confirm Password'
      + '<input name="npPwd2" type="password" required minlength="4"></label>'
      + '</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">Reset Password</button>'
      + '</div></form>');
  }
  window.openResetPassword = openResetPassword;

  function saveResetPassword(e, userId) {
    e.preventDefault();
    const f = e.target;
    if (f.npPwd.value !== f.npPwd2.value) {
      toast('Passwords do not match', 'error');
      return;
    }
    const u = arr(db.users).find(x => x.id === userId);
    if (!u) return;
    u.passwordHash = hashPassword(f.npPwd.value);
    u.mustChangePassword = true;
    logActivity('PASSWORD_RESET', 'User', u.username, '');
    save();
    closeModal();
    toast('✅ Password reset', 'success');
  }
  window.saveResetPassword = saveResetPassword;

  /* ═════════════════════════════════════════════════════════════════════
     DELETE USER
  ═════════════════════════════════════════════════════════════════════ */
  function deleteUser(userId) {
    if (!requirePerm('users')) return;
    const me = getCurrentUser();
    if (me && me.id === userId) {
      toast('Cannot delete yourself', 'error');
      return;
    }
    const u = arr(db.users).find(x => x.id === userId);
    if (!u) return;
    if (u.role === 'owner'
      && arr(db.users).filter(x => x.role === 'owner' && x.active)
          .length <= 1) {
      toast('Cannot delete last owner', 'error');
      return;
    }
    confirmBox('Delete User?',
      'Permanently remove "' + u.username + '"?\n'
      + 'They won\'t be able to log in.',
      () => {
        db.users = arr(db.users).filter(x => x.id !== userId);
        logActivity('USER_DELETED', 'User', u.username, '');
        save();
        render();
        toast('User deleted', 'success');
      },
      { confirmLabel: 'Delete', danger: true });
  }
  window.deleteUser = deleteUser;

  /* ═════════════════════════════════════════════════════════════════════
     ACTIVITY LOG VIEW
  ═════════════════════════════════════════════════════════════════════ */
  let auditState = { search: '', filterUser: '', limit: 200 };

  function viewActivityLog() {
    if (!requirePerm('reports')) {
      return '<div class="card"><div class="empty">⛔ No access</div></div>';
    }
    let list = arr(db.activityLog).slice().reverse();
    if (auditState.search) {
      const q = auditState.search.toLowerCase();
      list = list.filter(x =>
        (x.label || '').toLowerCase().includes(q)
        || (x.username || '').toLowerCase().includes(q)
        || (x.action || '').toLowerCase().includes(q));
    }
    if (auditState.filterUser) {
      list = list.filter(x => x.username === auditState.filterUser);
    }
    list = list.slice(0, auditState.limit);

    const users = Array.from(new Set(
      arr(db.activityLog).map(x => x.username).filter(Boolean)
    )).sort();

    return '<div class="kpi-strip">'
      + kpi('Total Events', arr(db.activityLog).length, 'All time')
      + kpi('Users', users.length, 'Distinct users')
      + kpi('Today',
          arr(db.activityLog).filter(x =>
            (x.at || '').slice(0, 10) === today()).length,
          'Since midnight')
      + '</div>'
      + '<div class="card">'
      + '<div class="card-head"><h3>📜 Activity Log</h3>'
      + '<button class="btn sm" onclick="exportActivityCSV()">⬇ CSV</button>'
      + '</div>'
      + '<div class="form-grid" style="grid-template-columns:1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(auditState.search) + '" '
      + 'oninput="auditState.search=this.value;render()" '
      + 'placeholder="Label, user, action…"></label>'
      + '<label class="field">User'
      + '<select onchange="auditState.filterUser=this.value;render()">'
      + '<option value="">All users</option>'
      + users.map(u => '<option value="' + esc(u) + '" '
          + (auditState.filterUser === u ? 'selected' : '') + '>'
          + esc(u) + '</option>').join('')
      + '</select></label>'
      + '</div>'
      + '<div style="overflow-x:auto;max-height:600px">'
      + '<table style="width:100%;border-collapse:collapse;font-size:12.5px">'
      + '<thead><tr style="background:var(--surface-2)">'
      + ['When','User','Action','Entity','Detail']
          .map(h => '<th style="text-align:left;padding:11px 12px;'
            + 'font-size:10.5px;text-transform:uppercase;'
            + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
            + 'border-bottom:1px solid var(--border)">' + h + '</th>')
          .join('')
      + '</tr></thead><tbody>'
      + (list.length
        ? list.map(x =>
            '<tr style="border-bottom:1px solid var(--border-2)">'
            + '<td style="padding:9px 12px;font-size:11.5px;'
            + 'color:var(--text-3);white-space:nowrap">'
            + dateTimeFmt(x.at) + '</td>'
            + '<td style="padding:9px 12px">'
            + '<span class="role-pill role-'
            + (x.role || 'viewer') + '">'
            + esc(x.username || 'system') + '</span></td>'
            + '<td style="padding:9px 12px"><strong>'
            + esc(x.action) + '</strong></td>'
            + '<td style="padding:9px 12px;font-size:11.5px">'
            + esc(x.entity || '') + '</td>'
            + '<td style="padding:9px 12px;font-size:11.5px;'
            + 'color:var(--text-3)">'
            + esc((x.label || '') + (x.detail ? ' — ' + x.detail : ''))
            + '</td></tr>').join('')
        : '<tr><td colspan="5" style="padding:40px;text-align:center;'
          + 'color:var(--text-4)">No events match</td></tr>')
      + '</tbody></table></div>'
      + '</div>';
  }
  views.activityLog = viewActivityLog;
  window.viewActivityLog = viewActivityLog;
  window.auditState = auditState;

  function exportActivityCSV() {
    const rows = arr(db.activityLog).map(x => [
      x.at, x.username || '', x.role || '', x.action || '',
      x.entity || '', x.label || '', x.detail || ''
    ]);
    download('activity_log_' + today() + '.csv',
      toCSV(['When','User','Role','Action','Entity','Label','Detail'], rows),
      'text/csv');
    toast('Exported activity log', 'success');
  }
  window.exportActivityCSV = exportActivityCSV;

  /* ═════════════════════════════════════════════════════════════════════
     PATCH DASHBOARD — add Users + Activity Log nav entries
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    /* Extend sidebar by appending a group */
    const nav = document.getElementById('nav');
    if (!nav) return;
    if (nav.querySelector('[data-view="users"]')) return;

    const me = getCurrentUser();
    if (!me) return;
    const role = ROLES[me.role] || {};
    const canSeeUsers = role.perms && role.perms.indexOf('users') !== -1;

    let extra = '<div class="nav-group">'
      + '<div class="nav-label">System</div>'
      + (canSeeUsers
          ? '<div class="nav-item' + (ui.view === 'users' ? ' active' : '')
            + '" data-view="users" onclick="goTo(\'users\')" '
            + 'title="Users & Roles">'
            + '<span class="ico">👥</span><span>Users & Roles</span></div>'
          : '')
      + '<div class="nav-item' + (ui.view === 'activityLog' ? ' active' : '')
      + '" data-view="activityLog" onclick="goTo(\'activityLog\')" '
      + 'title="Activity Log">'
      + '<span class="ico">📜</span><span>Activity Log</span></div>'
      + '</div>';

    nav.insertAdjacentHTML('beforeend', extra);
  };

  /* Title overrides */
  window.titles = Object.assign(window.titles || {}, {
    users: 'Users & Roles',
    activityLog: 'Activity Log'
  });

  /* ═════════════════════════════════════════════════════════════════════
     PATCH TOPBAR — show current user with logout + lock buttons
  ═════════════════════════════════════════════════════════════════════ */
  (function patchTopbar() {
    function add() {
      const topbar = document.querySelector('.topbar-actions');
      if (!topbar || topbar.querySelector('[data-user-chip]')) return;
      const u = getCurrentUser();
      if (!u) return;
      const role = ROLES[u.role] || { label: u.role };
      const initials = (u.displayName || u.username || '?')
        .slice(0, 1).toUpperCase();
      const chip = document.createElement('div');
      chip.setAttribute('data-user-chip', '1');
      chip.style.cssText = 'display:flex;align-items:center;gap:8px;'
        + 'padding:6px 12px 6px 6px;background:var(--surface-2);'
        + 'border:1px solid var(--border);border-radius:22px;'
        + 'cursor:pointer';
      chip.innerHTML = '<div style="width:28px;height:28px;'
        + 'border-radius:50%;background:linear-gradient(135deg,'
        + 'var(--accent),var(--pink));color:#fff;display:grid;'
        + 'place-items:center;font-weight:700;font-size:12px">'
        + esc(initials) + '</div>'
        + '<div style="font-size:12px;line-height:1.2">'
        + '<div style="font-weight:600;color:var(--text)">'
        + esc(u.displayName || u.username) + '</div>'
        + '<div style="font-size:10px;color:var(--text-3)">'
        + esc(role.label) + '</div></div>';
      chip.onclick = showUserMenu;
      topbar.insertBefore(chip, topbar.firstChild);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () =>
        setTimeout(add, 200));
    } else {
      setTimeout(add, 200);
    }
  })();

  function showUserMenu() {
    const u = getCurrentUser();
    if (!u) return;
    const role = ROLES[u.role] || { label: u.role };
    openModal('👤 ' + esc(u.displayName || u.username),
      '<div style="text-align:center;padding:10px 0 20px">'
      + '<div style="width:64px;height:64px;border-radius:50%;'
      + 'background:linear-gradient(135deg,var(--accent),var(--pink));'
      + 'color:#fff;display:grid;place-items:center;font-weight:800;'
      + 'font-size:24px;margin:0 auto 12px">'
      + esc((u.displayName || u.username || '?').slice(0, 1).toUpperCase())
      + '</div>'
      + '<div style="font-size:16px;font-weight:700">'
      + esc(u.displayName || u.username) + '</div>'
      + '<div style="font-size:12.5px;color:var(--text-3);margin-top:2px">'
      + esc(role.label) + '</div>'
      + '<div style="font-size:11.5px;color:var(--text-4);margin-top:8px">'
      + 'Last login: '
      + (u.lastLoginAt ? dateTimeFmt(u.lastLoginAt) : 'this session')
      + '</div></div>'
      + '<div style="display:grid;gap:8px">'
      + '<button class="btn" onclick="closeModal();changeOwnPassword()">'
      + '🔑 Change My Password</button>'
      + '<button class="btn" onclick="closeModal();lockScreen()">'
      + '🔒 Lock Session</button>'
      + '<button class="btn" onclick="closeModal();'
      + 'ui.view=\'activityLog\';render()">'
      + '📜 View My Activity</button>'
      + '<button class="btn danger" onclick="closeModal();logout()">'
      + '🚪 Logout</button>'
      + '</div>');
  }
  window.showUserMenu = showUserMenu;

  /* ═════════════════════════════════════════════════════════════════════
     BOOT HOOK — show login screen if not authenticated
  ═════════════════════════════════════════════════════════════════════ */
  function bootAuth() {
    /* Ensure a fresh DB has the default owner */
    window.normalizeDb();
    ensureOwnerUser();

    /* If not logged in → show login screen and stop */
    if (!getCurrentUser()) {
      showLoginScreen();
      return;
    }

    /* Logged in — start session watcher, patch dashboard */
    startSessionWatch();
    logActivity('APP_OPEN', 'System', '', '');
  }

  /* Run auth on next tick so all earlier scripts finish */
  setTimeout(bootAuth, 100);

  /* ═════════════════════════════════════════════════════════════════════
     INJECT PART-3 CSS
  ═════════════════════════════════════════════════════════════════════ */
  (function injectCSS() {
    if (document.getElementById('_part3CSS')) return;
    const style = document.createElement('style');
    style.id = '_part3CSS';
    style.textContent = ''
      + '.role-pill{display:inline-block;padding:3px 9px;border-radius:12px;'
      + 'font-size:10.5px;font-weight:700;white-space:nowrap}'
      + '.role-owner{background:linear-gradient(135deg,#fef3c7,#fcd34d);'
      + 'color:#78350f}'
      + '.role-manager{background:#dbeafe;color:#1e40af}'
      + '.role-viewer{background:#e5e7eb;color:#374151}'
      + '.role-system{background:#f3f4f6;color:#6b7280}'
      + '.status-pill{display:inline-block;padding:3px 9px;border-radius:12px;'
      + 'font-size:10.5px;font-weight:700}'
      + '.status-ok{background:#d1fae5;color:#047857}'
      + '.status-off{background:#fee2e2;color:#b91c1c}'
      + '.badge-mini{display:inline-block;padding:1px 7px;border-radius:10px;'
      + 'font-size:9.5px;font-weight:700;background:var(--accent-soft);'
      + 'color:var(--accent-text);margin-left:4px;text-transform:uppercase;'
      + 'letter-spacing:.04em}';
    document.head.appendChild(style);
  })();

  console.log('%c✅ Part 3 — Users, Login & Roles loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Default login: owner / owner',
    'color:#f59e0b;font-size:12px;font-weight:600');
  console.log('%c   Change it after first login',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 4 — MASTER DATA
   Adds: Customers · Suppliers · Categories · Banks
         with list views, forms, detail modals, balances.
   Depends on: Parts 1 + 2 + 3
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part4Loaded) return;
  window._part4Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════════════════ */
  const custObj = id => arr(db.customers).find(c => c.id === id);
  const supObj  = id => arr(db.suppliers).find(s => s.id === id);
  const catObj  = id => arr(db.categories).find(c => c.id === id);
  const bankObj = id => arr(db.banks).find(b => b.id === id);

  window.custObj = custObj;
  window.supObj = supObj;
  window.catObj = catObj;
  window.bankObj = bankObj;

  const custName = id => custObj(id) ? custObj(id).name : '—';
  const supName = id => supObj(id) ? supObj(id).name : '—';
  const catName = id => catObj(id) ? catObj(id).name : '—';
  window.custName = custName;
  window.supName = supName;
  window.catName = catName;

  /* ─── Customer balance ───
     = opening + (credit sales − receipts) + bounced cheques outstanding */
  function customerBalance(id) {
    const c = custObj(id);
    if (!c) return 0;
    let bal = NN(c.openingBalance);
    /* Credit sales add to what they owe */
    arr(db.sales)
      .filter(s => s.customerId === id && s.type === 'credit')
      .forEach(s => { bal += NN(s.amount); });
    /* Receipts reduce */
    arr(db.receipts)
      .filter(r => r.customerId === id)
      .forEach(r => { bal -= NN(r.amount); });
    /* Bounced cheques re-add outstanding */
    arr(db.customerCheques)
      .filter(cq => cq.customerId === id && cq.status === 'Bounced')
      .forEach(cq => {
        const settled = arr(db.chequeSettlements)
          .filter(x => x.chequeId === cq.id)
          .reduce((a, x) => a + NN(x.amount), 0);
        bal += Math.max(0, NN(cq.amount) - settled);
      });
    /* Refunds reduce further */
    arr(db.payments)
      .filter(p => p.customerId === id && p.type === 'customer_refund')
      .forEach(p => { bal -= NN(p.amount); });
    return bal;
  }
  window.customerBalance = customerBalance;

  /* ─── Supplier balance ───
     = opening + purchases − payments − returns */
  function supplierBalance(id) {
    const s = supObj(id);
    if (!s) return 0;
    let bal = NN(s.openingBalance);
    arr(db.purchases)
      .filter(p => p.supplierId === id)
      .forEach(p => { bal += NN(p.amount); });
    arr(db.payments)
      .filter(p => p.supplierId === id && !p.fullyReversed)
      .forEach(p => { bal -= NN(p.amount); });
    arr(db.supplierReturns)
      .filter(r => r.supplierId === id)
      .forEach(r => { bal -= NN(r.amount); });
    return bal;
  }
  window.supplierBalance = supplierBalance;

  /* ─── Bank balance ───
     = opening + receipts(deposit) − payments(bank) − expenses(bank) */
  function bankBalance(id) {
    const b = bankObj(id);
    if (!b) return 0;
    let bal = NN(b.openingBalance);
    /* Non-cheque receipts deposited to bank */
    arr(db.receipts)
      .filter(r => r.bankAccountId === id && r.method !== 'Cheque')
      .forEach(r => { bal += NN(r.amount); });
    /* Payments made from this bank */
    arr(db.payments)
      .filter(p => p.bankAccountId === id && !p.fullyReversed)
      .forEach(p => { bal -= NN(p.amount); });
    /* Expenses paid from this bank */
    arr(db.expenses)
      .filter(e => e.bankAccountId === id)
      .forEach(e => { bal -= NN(e.amount); });
    /* Bank transactions (deposits, withdrawals, fees, transfers) */
    arr(db.bankTransactions)
      .filter(t => t.bankAccountId === id && t.status !== 'reversed')
      .forEach(t => {
        if (t.type === 'deposit' || t.type === 'transfer_in'
          || t.type === 'credit') bal += NN(t.amount);
        else if (t.type === 'withdrawal' || t.type === 'transfer_out'
          || t.type === 'bank_fee' || t.type === 'debit') {
          bal -= NN(t.amount);
        }
      });
    return bal;
  }
  window.bankBalance = bankBalance;

  /* ═════════════════════════════════════════════════════════════════════
     CUSTOMERS — list
  ═════════════════════════════════════════════════════════════════════ */
  let custState = { q: '', type: '', area: '' };
  window.custState = custState;

  function viewCustomers() {
    let rows = arr(db.customers).slice();
    if (custState.q) {
      const q = custState.q.toLowerCase();
      rows = rows.filter(c =>
        (c.name || '').toLowerCase().includes(q)
        || (c.phone || '').toLowerCase().includes(q)
        || (c.business || '').toLowerCase().includes(q)
        || (c.email || '').toLowerCase().includes(q));
    }
    if (custState.type) {
      rows = rows.filter(c => c.type === custState.type);
    }
    if (custState.area) {
      rows = rows.filter(c => c.area === custState.area);
    }
    rows.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    const areas = Array.from(new Set(arr(db.customers)
      .map(c => c.area).filter(Boolean))).sort();
    const totalOwed = rows.reduce((a, c) =>
      a + Math.max(0, customerBalance(c.id)), 0);

    return '<div class="kpi-strip">'
      + kpi('Total Customers', arr(db.customers).length, 'All records')
      + kpi('Showing', rows.length, custState.q || custState.type
          ? 'Filtered' : 'All')
      + kpi('Total Owed to You', money(totalOwed), 'Receivable')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>👥 Customers (' + rows.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportCustomersCSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openCustomerForm()">'
      + '＋ New Customer</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:2fr 1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(custState.q) + '" '
      + 'oninput="custState.q=this.value;render()" '
      + 'placeholder="Name, phone, business, email…"></label>'
      + '<label class="field">Type'
      + '<select onchange="custState.type=this.value;render()">'
      + '<option value="">All types</option>'
      + ['Walk-in','Regular','VIP','Wholesale','Dealer'].map(t =>
          '<option value="' + t + '" '
          + (custState.type === t ? 'selected' : '') + '>'
          + t + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Area'
      + '<select onchange="custState.area=this.value;render()">'
      + '<option value="">All areas</option>'
      + areas.map(a => '<option value="' + esc(a) + '" '
          + (custState.area === a ? 'selected' : '') + '>'
          + esc(a) + '</option>').join('')
      + '</select></label>'
      + '</div>'

      + (rows.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Name','Business','Phone','Type','Credit Days','Balance','Status','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + rows.map(c => {
            const bal = customerBalance(c.id);
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showCustomerDetail(\''
              + c.id + '\')">'
              + '<td style="padding:11px 12px"><strong>'
              + esc(c.name) + '</strong>'
              + (c.blacklisted
                  ? ' <span class="pill pill-danger">⛔</span>' : '')
              + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + esc(c.business || '—') + '</td>'
              + '<td style="padding:11px 12px">'
              + esc(c.phone || '—') + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px">'
              + (c.type
                  ? '<span class="pill pill-soft">' + esc(c.type) + '</span>'
                  : '—') + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px">'
              + (NN(c.creditDays) || 0) + 'd</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600;'
              + 'color:' + (bal > 0 ? 'var(--red)'
                                    : bal < 0 ? 'var(--green)'
                                    : 'var(--text-3)') + '">'
              + money(bal) + '</td>'
              + '<td style="padding:11px 12px">'
              + (c.blacklisted
                  ? '<span class="pill pill-danger">Blacklisted</span>'
                  : '<span class="pill pill-ok">Active</span>')
              + '</td>'
              + '<td style="padding:11px 12px" onclick="event.stopPropagation()">'
              + '<div style="display:flex;gap:4px">'
              + '<button class="btn sm" onclick="openCustomerForm(\''
              + c.id + '\')">✎</button>'
              + '<button class="btn sm danger" onclick="deleteCustomer(\''
              + c.id + '\')">🗑</button>'
              + '</div></td>'
              + '</tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">👥</div>'
          + 'No customers yet<br>'
          + '<button class="btn primary" style="margin-top:12px" '
          + 'onclick="openCustomerForm()">＋ Add First Customer</button></div>')
      + '</div>';
  }
  views.customers = viewCustomers;
  window.viewCustomers = viewCustomers;

  /* ═════════════════════════════════════════════════════════════════════
     CUSTOMERS — form
  ═════════════════════════════════════════════════════════════════════ */
  function openCustomerForm(id) {
    if (!requirePerm('write')) return;
    const c = id ? custObj(id) : null;
    const existing = id ? NN(c.openingBalance) : 0;

    openModal(c ? '✎ Edit Customer' : '＋ New Customer',
      '<form onsubmit="saveCustomer(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Full Name <span class="req">*</span>'
      + '<input name="cName" required value="'
      + esc(c ? c.name : '') + '" autofocus></label>'
      + '<label class="field">Customer Type'
      + '<select name="cType">'
      + ['Walk-in','Regular','VIP','Wholesale','Dealer'].map(t =>
          '<option value="' + t + '" '
          + (c && c.type === t ? 'selected' : '') + '>'
          + t + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Phone'
      + '<input name="cPhone" value="'
      + esc(c ? (c.phone || '') : '') + '"></label>'
      + '<label class="field">WhatsApp'
      + '<input name="cWhatsapp" value="'
      + esc(c ? (c.whatsapp || '') : '') + '"></label>'
      + '<label class="field">Email'
      + '<input name="cEmail" type="email" value="'
      + esc(c ? (c.email || '') : '') + '"></label>'
      + '<label class="field">Business / Shop Name'
      + '<input name="cBusiness" value="'
      + esc(c ? (c.business || '') : '') + '"></label>'
      + '<label class="field">NIC / ID'
      + '<input name="cNic" value="'
      + esc(c ? (c.nic || '') : '') + '"></label>'
      + '<label class="field">Area / District'
      + '<input name="cArea" value="'
      + esc(c ? (c.area || '') : '') + '"></label>'
      + '<label class="field">Credit Days'
      + '<input name="cCreditDays" type="number" min="0" max="365" '
      + 'value="' + (c ? NN(c.creditDays) : 30) + '"></label>'
      + '<label class="field">Credit Limit (Rs.)'
      + '<input name="cCreditLimit" type="number" step="0.01" min="0" '
      + 'value="' + (c ? NN(c.creditLimit) : 0) + '"></label>'
      + '<label class="field">Opening Balance (Rs.)'
      + '<input name="cOpening" type="number" step="0.01" '
      + 'value="' + existing + '"></label>'
      + '<label class="field">Customer Since'
      + '<input name="cSince" type="date" '
      + 'value="' + (c ? (c.since || today()) : today()) + '"></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Address'
      + '<textarea name="cAddress" rows="2">'
      + esc(c ? (c.address || '') : '') + '</textarea></label>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="cNotes" rows="2">'
      + esc(c ? (c.notes || '') : '') + '</textarea></label>'
      + '<label style="display:flex;align-items:center;gap:10px;'
      + 'margin-top:16px;padding:12px 14px;background:var(--red-soft);'
      + 'border:1px solid var(--red-bd);border-radius:10px;cursor:pointer;'
      + 'font-size:12.5px">'
      + '<input type="checkbox" name="cBlacklisted" '
      + (c && c.blacklisted ? 'checked' : '') + '>'
      + '<span style="color:var(--red);font-weight:600">'

  function saveCustomer(e, existingId) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const name = f.cName.value.trim();
    if (!name) { toast('Name required', 'error'); return; }

    /* Duplicate name check (new only) */
    if (!existingId) {
      const dupe = arr(db.customers).find(c =>
        (c.name || '').toLowerCase().trim() === name.toLowerCase());
      if (dupe) {
        toast('Customer "' + name + '" already exists', 'error');
        return;
      }
    }

    const data = {
      name: name,
      type: f.cType.value,
      phone: f.cPhone.value.trim(),
      whatsapp: f.cWhatsapp.value.trim(),
      email: f.cEmail.value.trim(),
      business: f.cBusiness.value.trim(),
      nic: f.cNic.value.trim(),
      area: f.cArea.value.trim(),
      creditDays: NN(f.cCreditDays.value),
      creditLimit: NN(f.cCreditLimit.value),
      openingBalance: NN(f.cOpening.value),
      since: f.cSince.value || today(),
      address: f.cAddress.value.trim(),
      notes: f.cNotes.value.trim(),
      blacklisted: f.cBlacklisted.checked
    };

    if (existingId) {
      const c = custObj(existingId);
      if (!c) return;
      Object.assign(c, data);
      c.updatedAt = nowISO();
      logActivity('CUSTOMER_UPDATED', 'Customer', name, '');
    } else {
      db.customers.push(Object.assign({
        id: uid(),
        createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      }, data));
      logActivity('CUSTOMER_CREATED', 'Customer', name, '');
    }
    save();
    closeModal();
    render();
    toast(existingId ? '✅ Customer updated' : '✅ Customer created',
      'success');
  }
  window.saveCustomer = saveCustomer;

  function deleteCustomer(id) {
    if (!requirePerm('delete')) return;
    const c = custObj(id);
    if (!c) return;
    /* Block if has transactions */
    const hasCheques = arr(db.customerCheques).some(x => x.customerId === id);
    const hasSales = arr(db.sales).some(x => x.customerId === id);
    if (hasCheques || hasSales) {
      toast('Cannot delete — customer has transactions', 'error');
      return;
    }
    confirmBox('Delete Customer?',
      'Remove "' + c.name + '" permanently?\nThis cannot be undone.',
      () => {
        db.customers = arr(db.customers).filter(x => x.id !== id);
        logActivity('CUSTOMER_DELETED', 'Customer', c.name, '');
        save();
        render();
        toast('Customer deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteCustomer = deleteCustomer;

  function showCustomerDetail(id) {
    const c = custObj(id);
    if (!c) return;
    const bal = customerBalance(id);
    const salesCount = arr(db.sales)
      .filter(s => s.customerId === id).length;
    const creditSales = arr(db.sales)
      .filter(s => s.customerId === id && s.type === 'credit')
      .reduce((a, s) => a + NN(s.amount), 0);
    const chequesInHand = arr(db.customerCheques)
      .filter(cq => cq.customerId === id && cq.status === 'In Hand')
      .reduce((a, cq) => a + NN(cq.amount), 0);
    const bouncedOutstanding = arr(db.customerCheques)
      .filter(cq => cq.customerId === id && cq.status === 'Bounced')
      .reduce((a, cq) => {
        const settled = arr(db.chequeSettlements)
          .filter(x => x.chequeId === cq.id)
          .reduce((s, x) => s + NN(x.amount), 0);
        return a + Math.max(0, NN(cq.amount) - settled);
      }, 0);

    openModal('👤 ' + esc(c.name),
      '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">'
      + kpi('Balance', money(bal),
          bal > 0 ? 'Owes you' : bal < 0 ? 'Advance' : 'Clear')
      + kpi('Total Sales', salesCount, money(creditSales) + ' credit')
      + kpi('Cheques In Hand', money(chequesInHand),
          arr(db.customerCheques).filter(cq =>
            cq.customerId === id && cq.status === 'In Hand').length
          + ' cheques')
      + kpi('Bounced Owed', money(bouncedOutstanding),
          'Recoverable')
      + '</div>'

      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;'
      + 'margin-bottom:18px">'
      + '<div class="detail-block">'
      + '<div class="detail-block-title">Contact</div>'

      + detailRow('WhatsApp', c.whatsapp || '—')

      + detailRow('Area', c.area || '—')
      + detailRow('NIC', c.nic || '—')
      + '</div>'
      + '<div class="detail-block">'
      + '<div class="detail-block-title">Terms</div>'
      + detailRow('Type', c.type || '—')
      + detailRow('Credit Days', (NN(c.creditDays) || 0) + ' days')
      + detailRow('Credit Limit', money(c.creditLimit))
      + detailRow('Opening Balance', money(c.openingBalance))
      + detailRow('Since', dateFmt(c.since))
      + detailRow('Status', c.blacklisted ? '⛔ Blacklisted' : '✓ Active')
      + '</div>'
      + '</div>'

      + (c.address
        ? '<div class="detail-block" style="margin-bottom:14px">'
          + '<div class="detail-block-title">Address</div>'
          + '<div style="font-size:12.5px;white-space:pre-wrap">'
          + esc(c.address) + '</div></div>'
        : '')
      + (c.notes
        ? '<div class="detail-block" style="margin-bottom:14px">'
          + '<div class="detail-block-title">Notes</div>'
          + '<div style="font-size:12.5px;white-space:pre-wrap">'
          + esc(c.notes) + '</div></div>'
        : '')

      + '<div class="form-actions">'
      + '<button class="btn" onclick="closeModal();openCustomerForm(\''
      + id + '\')">✎ Edit</button>'

      + 'deleteCustomer(\'' + id + '\')">🗑 Delete</button>'

              + c.id + '\')">✎</button>'
              + '<button class="btn sm danger" onclick="deleteCategory(\''
              + c.id + '\')">🗑</button>'
              + '</div></div>'
              + '<div style="font-size:11.5px;color:var(--text-3)">'
              + supCount + ' supplier' + (supCount === 1 ? '' : 's')
              + '</div>'
              + (c.prefix
                  ? '<div style="margin-top:8px;font-family:var(--mono);'
                    + 'font-size:11px;color:var(--text-4)">'
                    + 'Prefix: ' + esc(c.prefix) + '</div>'
                  : '')
              + '</div>';
          }).join('')
          + '</div>'
        : '<div class="empty"><div class="big">🏷️</div>'
          + 'No categories yet<br>'
          + '<button class="btn primary" style="margin-top:12px" '
          + 'onclick="openCategoryForm()">＋ Add First Category</button>'
          + '</div>')
      + '</div>';
  }
  views.categories = viewCategories;
  window.viewCategories = viewCategories;

  function openCategoryForm(id) {
    if (!requirePerm('write')) return;
    const c = id ? catObj(id) : null;
    openModal(c ? '✎ Edit Category' : '＋ New Category',
      '<form onsubmit="saveCategory(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Name <span class="req">*</span>'
      + '<input name="catName" required value="'
      + esc(c ? c.name : '') + '" autofocus></label>'
      + '<label class="field">Colour'
      + '<input name="catColor" type="color" value="'
      + esc(c ? (c.color || '#7c3aed') : '#7c3aed') + '"></label>'
      + '<label class="field">Invoice Prefix (3 letters)'
      + '<input name="catPrefix" maxlength="6" value="'
      + esc(c ? (c.prefix || '') : '') + '" '
      + 'placeholder="e.g. SHO"></label>'
      + '</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (c ? 'Save' : 'Create') + '</button>'
      + '</div></form>');
  }
  window.openCategoryForm = openCategoryForm;

  function saveCategory(e, id) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const name = f.catName.value.trim();
    if (!name) { toast('Name required', 'error'); return; }

    const dupe = arr(db.categories).find(c =>
      c.id !== id && (c.name || '').toLowerCase() === name.toLowerCase());
    if (dupe) { toast('Category already exists', 'error'); return; }

    const data = {
      name: name,
      color: f.catColor.value,
      prefix: f.catPrefix.value.trim().toUpperCase()
    };

    if (id) {
      const c = catObj(id);
      if (!c) return;
      Object.assign(c, data);
      logActivity('CATEGORY_UPDATED', 'Category', name, '');
    } else {
      db.categories.push(Object.assign({
        id: uid(), createdAt: nowISO()
      }, data));
      logActivity('CATEGORY_CREATED', 'Category', name, '');
    }
    save();
    closeModal();
    render();
    toast('✅ Category saved', 'success');
  }
  window.saveCategory = saveCategory;

  function deleteCategory(id) {
    if (!requirePerm('delete')) return;
    const c = catObj(id);
    if (!c) return;
    const inUse = arr(db.suppliers).some(s => s.categoryId === id);
    if (inUse) {
      toast('Category is used by suppliers — cannot delete', 'error');
      return;
    }
    confirmBox('Delete Category?',
      'Remove "' + c.name + '"?',
      () => {
        db.categories = arr(db.categories).filter(x => x.id !== id);
        logActivity('CATEGORY_DELETED', 'Category', c.name, '');
        save();
        render();
        toast('Category deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteCategory = deleteCategory;

  /* ═════════════════════════════════════════════════════════════════════
     BANKS
  ═════════════════════════════════════════════════════════════════════ */
  function viewBanks() {
    const rows = arr(db.banks);
    const total = rows.reduce((a, b) => a + bankBalance(b.id), 0);

    return '<div class="kpi-strip">'
      + kpi('Accounts', rows.length, 'Active bank accounts')
      + kpi('Total Balance', money(total), 'Combined')
      + '</div>'
      + '<div class="card">'
      + '<div class="card-head"><h3>🏛️ Bank Accounts</h3>'
      + '<button class="btn primary" onclick="openBankForm()">'
      + '＋ New Bank Account</button></div>'
      + (rows.length
        ? '<div style="display:grid;grid-template-columns:'
          + 'repeat(auto-fill,minmax(280px,1fr));gap:14px">'
          + rows.map(b => {
            const bal = bankBalance(b.id);
            const initials = (b.bankName || '?').slice(0, 2).toUpperCase();
            const color = pickBankColor(b.bankName);
            return '<div class="bank-card" style="cursor:pointer" '
              + 'onclick="showBankDetail(\'' + b.id + '\')">'
              + '<div style="display:flex;gap:12px;align-items:center;'
              + 'margin-bottom:12px">'
              + '<div style="width:44px;height:44px;border-radius:12px;'
              + 'background:' + color + ';color:#fff;display:grid;'
              + 'place-items:center;font-weight:800;font-size:14px">'
              + initials + '</div>'
              + '<div style="flex:1;min-width:0">'
              + '<div style="font-weight:700;font-size:13.5px">'
              + esc(b.accountName || b.bankName) + '</div>'
              + '<div style="font-size:11.5px;color:var(--text-3);'
              + 'margin-top:2px">' + esc(b.bankName) + '</div>'
              + '</div></div>'
              + '<div style="font-size:10.5px;text-transform:uppercase;'
              + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
              + 'margin-bottom:6px">Balance</div>'
              + '<div style="font-size:22px;font-weight:800;'
              + 'font-variant-numeric:tabular-nums;color:'
              + (bal < 0 ? 'var(--red)' : 'var(--text)') + '">'
              + money(bal) + '</div>'
              + '<div style="display:flex;justify-content:space-between;'
              + 'margin-top:12px;padding-top:12px;'
              + 'border-top:1px dashed var(--border-2);font-size:11px;'
              + 'color:var(--text-4)">'
              + '<span>' + esc(b.accountNo || '—') + '</span>'
              + '<span>' + esc(b.branch || '—') + '</span>'
              + '</div></div>';
          }).join('')
          + '</div>'
        : '<div class="empty"><div class="big">🏛️</div>'
          + 'No bank accounts yet<br>'
          + '<button class="btn primary" style="margin-top:12px" '
          + 'onclick="openBankForm()">＋ Add First Bank</button></div>')
      + '</div>';
  }
  views.banks = viewBanks;
  window.viewBanks = viewBanks;

  function pickBankColor(name) {
    const colors = ['#7c3aed', '#ec4899', '#10b981', '#f59e0b',
                    '#3b82f6', '#14b8a6', '#ef4444', '#8b5cf6'];
    let h = 0;
    for (let i = 0; i < (name || '').length; i++) {
      h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    }
    return colors[h % colors.length];
  }

  function openBankForm(id) {
    if (!requirePerm('write')) return;
    const b = id ? bankObj(id) : null;
    openModal(b ? '✎ Edit Bank Account' : '＋ New Bank Account',
      '<form onsubmit="saveBank(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Bank <span class="req">*</span>'
      + '<select name="bBankName" required>'
      + '<option value="">— Select bank —</option>'
      + (window.SL_BANKS || []).map(name =>
          '<option value="' + esc(name) + '" '
          + (b && b.bankName === name ? 'selected' : '') + '>'
          + esc(name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Account Name'
      + '<input name="bAccountName" value="'
      + esc(b ? (b.accountName || '') : 'Main') + '"></label>'
      + '<label class="field">Account Number'
      + '<input name="bAccountNo" value="'
      + esc(b ? (b.accountNo || '') : '') + '"></label>'
      + '<label class="field">Branch'

      + esc(b ? (b.branch || '') : '') + '"></label>'
      + '<label class="field">Account Type'

      + ['Current','Savings','Other'].map(t =>

      + '<label class="field">Opening Balance (Rs.)'

      bankName: bankName,

      branch: f.bBranch.value.trim(),

      const b = bankObj(id);

    confirmBox('Delete Bank?',
      'Remove "' + (b.accountName || b.bankName) + '"?',
      () => {
        db.banks = arr(db.banks).filter(x => x.id !== id);
        logActivity('BANK_DELETED', 'Bank', b.bankName, '');
        save();
        render();
        toast('Bank deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });

  window.deleteBank = deleteBank;

  function showBankDetail(id) {
    const b = bankObj(id);

    const bal = bankBalance(id);
    const opening = NN(b.openingBalance);

    openModal('🏛️ ' + esc(b.accountName || b.bankName),
      '<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">'
      + kpi('Current Balance', money(bal), 'As of today')

          dateFmt(b.openingDate))

      + '<div class="detail-block" style="margin-bottom:14px">'
      + '<div class="detail-block-title">Account Details</div>'
      + detailRow('Bank', b.bankName)
      + detailRow('Account Name', b.accountName || '—')
      + detailRow('Account Number', b.accountNo || '—')

      + '</div>'
      + '<div class="form-actions">'
      + '<button class="btn" onclick="closeModal();openBankForm(\''

  /* ═════════════════════════════════════════════════════════════════════

  window.detailRow = detailRow;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK — add Master Data group
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);

    const item = (view, ico, label) =>

      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    /* Build group */
    const group = '<div class="nav-group" data-group="master">'
      + '<div class="nav-label">Master Data</div>'
      + item('customers', '👥', 'Customers')
      + item('suppliers', '🏭', 'Suppliers')
      + item('categories', '🏷️', 'Categories')
      + item('banks', '🏛️', 'Banks')
      + '</div>';

    /* Insert before the "System" group from Part 3 */
    const systemGroup = nav.querySelector('[data-view="users"]')
      ? nav.querySelector('[data-view="users"]').parentElement
      : nav.querySelector('[data-view="activityLog"]')
        ? nav.querySelector('[data-view="activityLog"]').parentElement

    if (systemGroup) {
      systemGroup.insertAdjacentHTML('beforebegin', group);
    } else {
      /* Otherwise, insert after the "Coming Soon" placeholder group */
      const placeholder = nav.querySelectorAll('.nav-group');
      if (placeholder.length >= 2) {
        placeholder[1].insertAdjacentHTML('afterend', group);
      } else {
        nav.insertAdjacentHTML('beforeend', group);
      }
    }

    /* Remove placeholder nav items for the modules we've now delivered */
    const placeholderItems = nav.querySelectorAll('.nav-item.disabled');
    placeholderItems.forEach(el => {
      if (el.textContent.includes('Customers')
        || el.textContent.includes('Suppliers')
        || el.textContent.includes('Banks')) {
        el.remove();
      }
    });
  };

  /* Titles for new views */
  window.titles = Object.assign(window.titles || {}, {
    customers: 'Customers',
    suppliers: 'Suppliers',
    categories: 'Categories',
    banks: 'Bank Accounts'
  });

  /* ═════════════════════════════════════════════════════════════════════
     COMMAND PALETTE EXTENSION
  ═════════════════════════════════════════════════════════════════════ */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Customers', ico: '👥', kind: 'view',
        action: () => goTo('customers') },
      { label: 'New Customer', ico: '＋', kind: 'action',
        action: () => openCustomerForm() },
      { label: 'Go to Suppliers', ico: '🏭', kind: 'view',
        action: () => goTo('suppliers') },
      { label: 'New Supplier', ico: '＋', kind: 'action',
        action: () => openSupplierForm() },
      { label: 'Go to Categories', ico: '🏷️', kind: 'view',
        action: () => goTo('categories') },
      { label: 'Go to Banks', ico: '🏛️', kind: 'view',
        action: () => goTo('banks') },
      { label: 'New Bank Account', ico: '＋', kind: 'action',
        action: () => openBankForm() }
    ]);
  };

  /* ═════════════════════════════════════════════════════════════════════
     CSS
  ═════════════════════════════════════════════════════════════════════ */
  (function injectCSS() {
    if (document.getElementById('_part4CSS')) return;
    const style = document.createElement('style');
    style.id = '_part4CSS';
    style.textContent = ''
      + '.pill{display:inline-block;padding:2px 9px;border-radius:12px;'

      + '.pill-ok{background:var(--green-soft);color:var(--green)}'
      + '.pill-danger{background:var(--red-soft);color:var(--red)}'
      + '.pill-soft{background:var(--accent-soft);color:var(--accent-text)}'
      + '.cat-card{background:var(--surface-2);border:1px solid var(--border-2);'
      + 'border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px}'
      + '.bank-card{background:var(--surface);border:1px solid var(--border);'
      + 'border-radius:14px;padding:18px;transition:all .15s;'
      + 'box-shadow:var(--shadow-card)}'
      + '.bank-card:hover{transform:translateY(-2px);'
      + 'box-shadow:0 8px 24px -8px rgba(26,21,51,.15);'
      + 'border-color:var(--accent)}'
      + '.detail-block{background:var(--surface-2);border:1px solid var(--border-2);'
      + 'border-radius:10px;padding:14px 18px}'
      + '.detail-block-title{font-size:11px;font-weight:700;'
      + 'text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);'
      + 'margin-bottom:10px}'
      + '.detail-row-v2{display:grid;grid-template-columns:130px 1fr;gap:12px;'
      + 'padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--border-2)}'
      + '.detail-row-v2:last-child{border-bottom:none}'
      + '.detail-row-label{color:var(--text-3);font-weight:500}'
      + '.detail-row-value{color:var(--text);word-break:break-word;'
      + 'font-weight:500}';
    document.head.appendChild(style);
  })();

  console.log('%c✅ Part 4 — Master Data loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Customers · Suppliers · Categories · Banks',
    'color:#a78bfa;font-size:12px');

})();

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 5 — SALES & RECEIPTS
   Adds: Sales module (cash / credit per sale) with auto-classifier,
         Receipts with FIFO matching to sales, customer KPI analytics.
   Depends on: Parts 1 + 2 + 3 + 4
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part5Loaded) return;
  window._part5Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════════════════ */
  const saleObj = id => arr(db.sales).find(s => s.id === id);
  const receiptObj = id => arr(db.receipts).find(r => r.id === id);
  window.saleObj = saleObj;
  window.receiptObj = receiptObj;

  /* ─── Auto-classifier labels ─── */
  const SPEED_CLASSES = {
    immediate: { label: 'Immediate', color: 'var(--green)',
                 days: 0, desc: 'Same day' },
    fast:      { label: 'Fast',      color: 'var(--green)',
                 days: 2, desc: '1–2 days' },
    normal:    { label: 'Normal',    color: 'var(--accent)',
                 days: 9, desc: '3–9 days' },
    slow:      { label: 'Slow',      color: 'var(--amber)',
                 days: 30, desc: '10–30 days' },
    verySlow:  { label: 'Very Slow', color: 'var(--red)',
                 days: Infinity, desc: '31+ days' },
    outstanding: { label: 'Outstanding', color: 'var(--text-3)',
                 days: -1, desc: 'Not settled' }
  };
  window.SPEED_CLASSES = SPEED_CLASSES;

  function classifySale(sale) {
    if (sale.type === 'cash') return 'immediate';
    const allocated = NN(sale.allocatedAmount);
    if (allocated < NN(sale.amount) - 0.01) return 'outstanding';
    const days = NN(sale.daysToSettle);
    if (days <= 0) return 'immediate';
    if (days <= 2) return 'fast';
    if (days <= 9) return 'normal';
    if (days <= 30) return 'slow';
    return 'verySlow';
  }

  /* Recalculate a sale's status + classifier from its allocations */
  function refreshSale(sale) {
    if (!sale) return sale;
    const allocated = NN(sale.allocatedAmount);
    const total = NN(sale.amount);
    if (sale.type === 'cash') {
      sale.status = 'settled';
      sale.speedClass = 'immediate';
      return sale;
    }
    if (allocated >= total - 0.01) {
      sale.status = 'settled';
      /* Compute daysToSettle from the settled date (from last allocation) */
      if (!sale.settledDate) sale.settledDate = sale.lastAllocDate || sale.date;
      sale.daysToSettle = Math.max(0,
        daysBetween(sale.date, sale.settledDate));
      sale.speedClass = classifySale(sale);
    } else if (allocated > 0) {
      sale.status = 'partial';
      sale.speedClass = 'outstanding';
    } else {
      sale.status = 'unpaid';
      sale.speedClass = 'outstanding';
    }
    return sale;
  }
  window.refreshSale = refreshSale;

  /* Rebuild all sale allocations from receipts */
  function rebuildSaleAllocations() {
    arr(db.sales).forEach(s => {
      s.allocatedAmount = 0;
      s.allocations = [];
      if (s.type === 'cash') {
        s.status = 'settled';
        s.speedClass = 'immediate';
        s.settledDate = s.date;
      }
    });
    /* Apply every receipt's allocations */
    arr(db.receipts).forEach(r => {
      arr(r.allocations).forEach(a => {
        const sale = saleObj(a.saleId);
        if (!sale) return;
        sale.allocatedAmount = NN(sale.allocatedAmount) + NN(a.amount);
        if (!Array.isArray(sale.allocations)) sale.allocations = [];
        sale.allocations.push({
          receiptId: r.id,
          date: r.date,
          amount: NN(a.amount)
        });
        sale.lastAllocDate = r.date;
      });
    });
    arr(db.sales).forEach(refreshSale);
  }
  window.rebuildSaleAllocations = rebuildSaleAllocations;

  /* FIFO allocate a receipt amount to a customer's unpaid credit sales */
  function autoAllocateReceipt(receipt) {
    if (!receipt || !receipt.customerId) return [];
    const allocations = [];
    let remaining = NN(receipt.amount);
    const unpaid = arr(db.sales)
      .filter(s => s.customerId === receipt.customerId
        && s.type === 'credit'
        && NN(s.allocatedAmount) < NN(s.amount) - 0.01)
      .sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);

    for (const sale of unpaid) {
      if (remaining <= 0) break;
      const outstanding = NN(sale.amount) - NN(sale.allocatedAmount);
      const alloc = Math.min(remaining, outstanding);
      allocations.push({ saleId: sale.id, amount: alloc });
      remaining -= alloc;
    }
    return allocations;
  }
  window.autoAllocateReceipt = autoAllocateReceipt;

  /* ═════════════════════════════════════════════════════════════════════
     SALES — list
  ═════════════════════════════════════════════════════════════════════ */
  let saleState = {
    q: '',
    type: '',
    status: '',
    customerId: '',
    from: '',
    to: ''
  };
  window.saleState = saleState;

  function viewSales() {
    let rows = arr(db.sales).slice();
    if (saleState.q) {
      const q = saleState.q.toLowerCase();
      rows = rows.filter(s =>
        (s.customerName || '').toLowerCase().includes(q)
        || (s.reference || '').toLowerCase().includes(q));
    }
    if (saleState.type) rows = rows.filter(s => s.type === saleState.type);
    if (saleState.status) {
      rows = rows.filter(s => {
        refreshSale(s);
        return s.status === saleState.status;
      });
    } else {
      rows.forEach(refreshSale);
    }
    if (saleState.customerId) {
      rows = rows.filter(s => s.customerId === saleState.customerId);
    }
    if (saleState.from) rows = rows.filter(s => s.date >= saleState.from);
    if (saleState.to) rows = rows.filter(s => s.date <= saleState.to);
    rows.sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);

    const totals = {
      cash: 0, credit: 0, outstanding: 0
    };
    rows.forEach(s => {
      if (s.type === 'cash') totals.cash += NN(s.amount);
      else {
        totals.credit += NN(s.amount);
        totals.outstanding += Math.max(0,
          NN(s.amount) - NN(s.allocatedAmount));
      }
    });

    return '<div class="kpi-strip">'
      + kpi('Total Sales', money(totals.cash + totals.credit),
          rows.length + ' transactions')
      + kpi('Cash Sales', money(totals.cash), 'Immediate')
      + kpi('Credit Sales', money(totals.credit),
          money(totals.outstanding) + ' outstanding')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>🛒 Sales (' + rows.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportSalesCSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openSaleForm()">'
      + '＋ New Sale</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(saleState.q) + '" '
      + 'oninput="saleState.q=this.value;render()" '
      + 'placeholder="Customer or reference"></label>'
      + '<label class="field">Type'
      + '<select onchange="saleState.type=this.value;render()">'
      + '<option value="">All types</option>'
      + '<option value="cash" ' + (saleState.type === 'cash'
          ? 'selected' : '') + '>Cash</option>'
      + '<option value="credit" ' + (saleState.type === 'credit'
          ? 'selected' : '') + '>Credit</option>'
      + '</select></label>'
      + '<label class="field">Status'
      + '<select onchange="saleState.status=this.value;render()">'
      + '<option value="">All statuses</option>'
      + ['settled','partial','unpaid'].map(st =>
          '<option value="' + st + '" '
          + (saleState.status === st ? 'selected' : '') + '>'
          + st.charAt(0).toUpperCase() + st.slice(1) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(saleState.from) + '" '
      + 'onchange="saleState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(saleState.to) + '" '
      + 'onchange="saleState.to=this.value;render()"></label>'
      + '</div>'

      + (rows.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Date','Customer','Type','Ref','Amount','Settled','Days','Speed','Status','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + rows.map(s => {
            refreshSale(s);
            const speed = SPEED_CLASSES[s.speedClass]
              || SPEED_CLASSES.outstanding;
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showSaleDetail(\''
              + s.id + '\')">'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'white-space:nowrap">' + dateFmt(s.date) + '</td>'
              + '<td style="padding:11px 12px"><strong>'
              + esc(s.customerName || '—') + '</strong></td>'
              + '<td style="padding:11px 12px">'
              + '<span class="pill ' + (s.type === 'cash'
                  ? 'pill-ok' : 'pill-soft') + '">'
              + s.type + '</span></td>'
              + '<td style="padding:11px 12px;font-family:var(--mono);'
              + 'font-size:11px;color:var(--text-3)">'
              + esc(s.reference || '—') + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600">'
              + money(s.amount) + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-size:11.5px">'
              + money(s.allocatedAmount || 0) + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + (s.type === 'cash' ? '—'
                  : (s.status === 'settled'
                      ? (NN(s.daysToSettle) + 'd') : '—'))
              + '</td>'
              + '<td style="padding:11px 12px">'
              + '<span style="color:' + speed.color
              + ';font-weight:600;font-size:11px">'
              + speed.label + '</span></td>'
              + '<td style="padding:11px 12px">'
              + statusPillSale(s.status) + '</td>'
              + '<td style="padding:11px 12px" onclick="event.stopPropagation()">'
              + '<div style="display:flex;gap:4px">'
              + '<button class="btn sm" onclick="openSaleForm(\''
              + s.id + '\')">✎</button>'
              + '<button class="btn sm danger" onclick="deleteSale(\''
              + s.id + '\')">🗑</button>'
              + '</div></td></tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">🛒</div>'
          + 'No sales yet<br>'
          + '<button class="btn primary" style="margin-top:12px" '
          + 'onclick="openSaleForm()">＋ Record First Sale</button></div>')
      + '</div>';
  }
  views.sales = viewSales;
  window.viewSales = viewSales;

  function statusPillSale(status) {
    const map = {
      settled: { cls: 'pill-ok', label: 'Settled' },
      partial: { cls: 'pill-warn', label: 'Partial' },
      unpaid: { cls: 'pill-danger', label: 'Unpaid' }
    };
    const s = map[status] || { cls: 'pill-soft', label: status || '—' };
    return '<span class="pill ' + s.cls + '">' + s.label + '</span>';
  }

  /* ═════════════════════════════════════════════════════════════════════
     SALES — form
  ═════════════════════════════════════════════════════════════════════ */
  function nextSaleRef() {
    const year = new Date().getFullYear();
    const n = arr(db.sales).filter(s =>
      (s.reference || '').startsWith('SAL-' + year)
    ).length + 1;
    return 'SAL-' + year + '-' + String(n).padStart(4, '0');
  }
  window.nextSaleRef = nextSaleRef;

  function openSaleForm(id) {
    if (!requirePerm('write')) return;
    const s = id ? saleObj(id) : null;
    const customers = arr(db.customers).slice()
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!customers.length) {
      toast('Add a customer first', 'warn');
      return;
    }

    openModal(s ? '✎ Edit Sale' : '＋ New Sale',
      '<form onsubmit="saveSale(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="sDate" type="date" required '
      + 'value="' + (s ? s.date : today()) + '"></label>'
      + '<label class="field">Customer <span class="req">*</span>'
      + '<select name="sCustomer" required>'
      + '<option value="">— Select customer —</option>'
      + customers.map(c =>
          '<option value="' + c.id + '" '
          + (s && s.customerId === c.id ? 'selected' : '') + '>'
          + esc(c.name) + (c.phone ? ' · ' + esc(c.phone) : '')
          + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Sale Type <span class="req">*</span>'
      + '<select name="sType" onchange="onSaleTypeChange(this.value)">'
      + '<option value="cash" '
      + (s && s.type === 'cash' ? 'selected' : '') + '>'
      + '💵 Cash (paid now)</option>'
      + '<option value="credit" '
      + (s && s.type === 'credit' ? 'selected' : '') + '>'
      + '📝 Credit (on account)</option>'
      + '</select></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="sAmount" type="number" step="0.01" min="0.01" '
      + 'required value="' + (s ? NN(s.amount) : '') + '" autofocus></label>'
      + '<label class="field">Category'
      + '<select name="sCategory">'
      + '<option value="">— None —</option>'
      + arr(db.categories).map(c =>
          '<option value="' + c.id + '" '
          + (s && s.categoryId === c.id ? 'selected' : '') + '>'
          + esc(c.name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Reference'
      + '<input name="sReference" value="'
      + esc(s ? (s.reference || '') : nextSaleRef()) + '"></label>'
      + '<label class="field" id="creditDaysWrap" '
      + 'style="' + (s && s.type === 'credit' ? '' : 'display:none')
      + '">Credit Days'
      + '<input name="sCreditDays" type="number" min="0" max="365" '
      + 'value="' + (s ? NN(s.creditDays) : 30) + '"></label>'
      + '<label class="field" id="vatWrap" style="display:none">'
      + 'VAT Amount'
      + '<input name="sVat" type="number" step="0.01" min="0" '
      + 'value="' + (s ? NN(s.vatAmount) : 0) + '"></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="sNotes" rows="2">'
      + esc(s ? (s.notes || '') : '') + '</textarea></label>'
      + '<div id="salePaymentStatus" style="margin-top:14px"></div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (s ? 'Save Changes' : 'Create Sale') + '</button>'
      + '</div></form>', { wide: true });

    /* Pre-fill credit days from the customer */
    setTimeout(() => {
      const custSel = document.querySelector('#modalWrap [name="sCustomer"]');
      const typeSel = document.querySelector('#modalWrap [name="sType"]');
      const daysInp = document.querySelector('#modalWrap [name="sCreditDays"]');
      if (!custSel || !typeSel || !daysInp || s) return;
      custSel.addEventListener('change', () => {
        const c = custObj(custSel.value);
        if (c && c.creditDays) daysInp.value = NN(c.creditDays) || 30;
      });
      const c = custObj(custSel.value);
      if (c && c.creditDays) daysInp.value = NN(c.creditDays) || 30;
    }, 60);
  }
  window.openSaleForm = openSaleForm;

  function onSaleTypeChange(type) {
    const wrap = document.getElementById('creditDaysWrap');
    if (wrap) wrap.style.display = type === 'credit' ? '' : 'none';
  }
  window.onSaleTypeChange = onSaleTypeChange;

  function saveSale(e, id) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const customerId = f.sCustomer.value;
    const customer = custObj(customerId);
    if (!customer) { toast('Customer required', 'error'); return; }
    const amount = NN(f.sAmount.value);
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }
    const type = f.sType.value;
    const date = f.sDate.value || today();

    const data = {
      date: date,
      customerId: customerId,
      customerName: customer.name,
      type: type,
      amount: amount,
      categoryId: f.sCategory.value,
      reference: f.sReference.value.trim(),
      creditDays: type === 'credit' ? NN(f.sCreditDays.value) : 0,
      vatAmount: NN(f.sVat.value) || 0,
      notes: f.sNotes.value.trim()
    };

    /* Compute expected payment date for credit */
    if (type === 'credit') {
      data.expectedPaymentDate = shiftDate(date,
        NN(f.sCreditDays.value) || 30);
    }

    if (id) {
      const s = saleObj(id);
      if (!s) return;
      Object.assign(s, data);
      s.updatedAt = nowISO();
      logActivity('SALE_UPDATED', 'Sale',
        customer.name + ' — ' + money(amount), '');
    } else {
      const newSale = Object.assign({
        id: uid(),
        allocatedAmount: 0,
        allocations: [],
        status: type === 'cash' ? 'settled' : 'unpaid',
        speedClass: type === 'cash' ? 'immediate' : 'outstanding',
        settledDate: type === 'cash' ? date : null,
        daysToSettle: type === 'cash' ? 0 : null,
        createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      }, data);
      db.sales.push(newSale);
      logActivity('SALE_CREATED', 'Sale',
        customer.name + ' — ' + money(amount), type);
    }

    /* If this sale is cash and the customer owes us, offer to allocate */
    rebuildSaleAllocations();
    save();
    closeModal();
    render();
    toast(id ? '✅ Sale updated' : '✅ Sale created', 'success');

    /* Reminder for credit sales — handled later in Part 14 */
  }
  window.saveSale = saveSale;

  function deleteSale(id) {
    if (!requirePerm('delete')) return;
    const s = saleObj(id);
    if (!s) return;
    if (NN(s.allocatedAmount) > 0) {
      toast('Cannot delete — sale has receipt allocations', 'error');
      return;
    }
    confirmBox('Delete Sale?',
      'Remove sale of ' + money(s.amount) + ' for ' + s.customerName
      + '?\nThis cannot be undone.',
      () => {
        db.sales = arr(db.sales).filter(x => x.id !== id);
        logActivity('SALE_DELETED', 'Sale',
          s.customerName + ' — ' + money(s.amount), '');
        save();
        render();
        toast('Sale deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteSale = deleteSale;

  /* ═════════════════════════════════════════════════════════════════════
     SALES — detail modal
  ═════════════════════════════════════════════════════════════════════ */
  function showSaleDetail(id) {
    const s = saleObj(id);
    if (!s) return;
    refreshSale(s);
    const speed = SPEED_CLASSES[s.speedClass] || SPEED_CLASSES.outstanding;
    const outstanding = Math.max(0, NN(s.amount) - NN(s.allocatedAmount));
    const allocs = arr(s.allocations);

    openModal('🛒 Sale — ' + esc(s.customerName),
      '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">'
      + kpi('Amount', money(s.amount), s.type + ' sale')
      + kpi('Settled', money(s.allocatedAmount || 0),
          s.status === 'settled' ? '✓ Complete'
            : s.status === 'partial' ? 'Partial' : 'Not yet')
      + kpi('Outstanding', money(outstanding), 'Still owed')
      + kpi('Speed', speed.label,
          s.type === 'credit' && s.status === 'settled'
            ? (NN(s.daysToSettle) + ' days') : speed.desc)
      + '</div>'

      + '<div class="detail-block" style="margin-bottom:14px">'
      + '<div class="detail-block-title">Details</div>'
      + detailRow('Date', dateFmt(s.date))
      + detailRow('Customer', s.customerName)
      + detailRow('Type', s.type === 'cash' ? '💵 Cash' : '📝 Credit')
      + detailRow('Reference', s.reference || '—')
      + detailRow('Category',
          s.categoryId ? catName(s.categoryId) : '—')
      + (s.type === 'credit'
          ? detailRow('Credit Days', NN(s.creditDays) + ' days')
            + detailRow('Expected Payment',
                dateFmt(s.expectedPaymentDate))
          : '')
      + (s.vatAmount
          ? detailRow('VAT', money(s.vatAmount)) : '')
      + detailRow('Notes', s.notes || '—')
      + '</div>'

      + (allocs.length
        ? '<div class="detail-block" style="margin-bottom:14px">'
          + '<div class="detail-block-title">Receipt Allocations ('
          + allocs.length + ')</div>'
          + allocs.map(a => {
            const r = receiptObj(a.receiptId);
            return '<div style="display:flex;justify-content:space-between;'
              + 'padding:6px 0;font-size:12.5px;border-bottom:1px dashed '
              + 'var(--border-2)">'
              + '<span>' + dateFmt(a.date)
              + (r ? ' · ' + esc(r.method) : '') + '</span>'
              + '<strong>' + money(a.amount) + '</strong></div>';
          }).join('')
          + '</div>'
        : '')

      + '<div class="form-actions">'
      + (outstanding > 0
          ? '<button class="btn primary" onclick="closeModal();'
            + 'openReceiptForm(\'\',\'' + s.customerId + '\','
            + outstanding + ')">💸 Record Payment</button>'
          : '')
      + '<button class="btn" onclick="closeModal();openSaleForm(\''
      + id + '\')">✎ Edit</button>'
      + '<button class="btn danger" onclick="closeModal();'
      + 'deleteSale(\'' + id + '\')">🗑 Delete</button>'
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.showSaleDetail = showSaleDetail;

  function exportSalesCSV() {
    arr(db.sales).forEach(refreshSale);
    const rows = arr(db.sales).map(s => [
      s.date, s.customerName || '', s.type || '',
      s.reference || '', NN(s.amount), NN(s.allocatedAmount),
      NN(s.amount) - NN(s.allocatedAmount),
      s.status || '', s.speedClass || '',
      s.daysToSettle != null ? s.daysToSettle : '',
      s.categoryId ? catName(s.categoryId) : '',
      s.notes || ''
    ]);
    download('sales_' + today() + '.csv',
      toCSV(['Date','Customer','Type','Reference','Amount','Settled',
             'Outstanding','Status','SpeedClass','DaysToSettle',
             'Category','Notes'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' sales', 'success');
  }
  window.exportSalesCSV = exportSalesCSV;

  /* ═════════════════════════════════════════════════════════════════════
     RECEIPTS — list
  ═════════════════════════════════════════════════════════════════════ */
  let receiptState = { q: '', from: '', to: '', method: '' };
  window.receiptState = receiptState;

  function viewReceipts() {
    let rows = arr(db.receipts).slice();
    if (receiptState.q) {
      const q = receiptState.q.toLowerCase();
      rows = rows.filter(r =>
        (r.customerName || '').toLowerCase().includes(q)
        || (r.reference || '').toLowerCase().includes(q));
    }
    if (receiptState.method) {
      rows = rows.filter(r => r.method === receiptState.method);
    }
    if (receiptState.from) rows = rows.filter(r => r.date >= receiptState.from);
    if (receiptState.to) rows = rows.filter(r => r.date <= receiptState.to);
    rows.sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);

    const total = rows.reduce((a, r) => a + NN(r.amount), 0);

    return '<div class="kpi-strip">'
      + kpi('Total Receipts', money(total),
          rows.length + ' entries')

            .reduce((a, r) => a + NN(r.amount), 0)),
