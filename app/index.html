            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showLeafDetail(\''
              + l.id + '\')">'
              + '<td style="padding:11px 12px;font-family:var(--mono);'
              + 'font-weight:600">' + esc(l.leafNo) + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px">'
              + esc(l.bankName || '—') + '</td>'
              + '<td style="padding:11px 12px">'
              + '<span class="pill ' + statusInfo.cls + '">'
              + esc(statusInfo.label) + '</span></td>'
              + '<td style="padding:11px 12px;font-size:11.5px">'
              + (l.supplierId ? esc(supName(l.supplierId)) : '—')
              + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600">'
              + (l.amount ? money(l.amount) : '—') + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + (l.dueDate ? dateFmt(l.dueDate) : '—') + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + (l.issuedDate ? dateFmt(l.issuedDate) : '—') + '</td>'
              + '<td style="padding:11px 12px" '
              + 'onclick="event.stopPropagation()">'
              + '<button class="btn sm" onclick="showLeafDetail(\''
              + l.id + '\')">👁</button></td>'
              + '</tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">🎯</div>'
          + 'No ' + esc(ownState.tab.toLowerCase()) + ' leaves'
          + (ownState.tab === 'Available'
              ? '<br><span style="font-size:11px">Register a cheque '
                + 'book from the Cheque Books page</span>'
              : '') + '</div>')
      + '</div>';
  }
  views.ownCheques = viewOwnCheques;
  window.viewOwnCheques = viewOwnCheques;

  /* ═════════════════════════════════════════════════════════════════════
     ISSUE OWN CHEQUE
  ═════════════════════════════════════════════════════════════════════ */
  function openIssueOwnChequeForm() {
    if (!requirePerm('write')) return;
    if (!arr(db.suppliers).length) {
      toast('Add a supplier first', 'warn');
      return;
    }
    /* Find banks with available leaves */
    const banksWithLeaves = arr(db.banks)
      .filter(b => arr(db.chequeLeaves)
        .some(l => l.bankId === b.id && l.status === 'Available'));
    if (!banksWithLeaves.length) {
      toast('No available leaves. Register a cheque book first.', 'warn');
      return;
    }

    openModal('＋ Issue Own Cheque',
      '<form onsubmit="saveIssueOwnCheque(event)">'
      + '<div class="alert-mini">Issuing a cheque creates a payment '
      + 'to the supplier and reduces your bank balance on the due date '
      + '(pending deduction).</div>'
      + '<div class="form-grid" style="margin-top:14px">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="ioDate" type="date" required value="' + today()
      + '"></label>'
      + '<label class="field">Supplier <span class="req">*</span>'
      + '<select name="ioSupplier" required '
      + 'onchange="onIssueSupplierChange()">'
      + '<option value="">— Select supplier —</option>'
      + arr(db.suppliers).map(s =>
          '<option value="' + s.id + '">'
          + esc(s.name) + ' · Payable ' + money(supplierBalance(s.id))
          + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Bank <span class="req">*</span>'
      + '<select name="ioBank" required '
      + 'onchange="onIssueBankChange(this.value)">'
      + '<option value="">— Select bank —</option>'
      + banksWithLeaves.map(b =>
          '<option value="' + b.id + '">'
          + esc(b.accountName || b.bankName) + ' · '
          + esc(b.bankName) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Cheque Book <span class="req">*</span>'
      + '<select name="ioBook" required '
      + 'onchange="onIssueBookChange(this.value)" disabled>'
      + '<option value="">— Select bank first —</option>'
      + '</select></label>'
      + '<label class="field">Leaf No <span class="req">*</span>'
      + '<select name="ioLeaf" required disabled>'
      + '<option value="">— Select book first —</option>'
      + '</select></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="ioAmount" type="number" step="0.01" min="0.01" '
      + 'required></label>'
      + '<label class="field">Cheque Due Date'
      + '<input name="ioDueDate" type="date" value="'
      + shiftDate(today(), 30) + '"></label>'
      + '<label class="field">Payee'
      + '<input name="ioPayee" placeholder="Supplier name (defaults)">'
      + '</label>'
      + '</div>'
      + '<div id="issueInfo" style="margin-top:14px"></div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">Issue Cheque</button>'
      + '</div></form>', { wide: true });
  }
  window.openIssueOwnChequeForm = openIssueOwnChequeForm;

  function onIssueSupplierChange() {
    const supSel = document.querySelector('#modalWrap [name="ioSupplier"]');
    const info = document.getElementById('issueInfo');
    if (!supSel || !info) return;
    const sid = supSel.value;
    if (!sid) { info.innerHTML = ''; return; }
    const bal = supplierBalance(sid);
    const aging = supplierAging(sid);
    info.innerHTML = '<div style="padding:12px 16px;'
      + 'background:var(--surface-2);border-radius:10px;font-size:12.5px">'
      + '<strong>Current payable: ' + money(bal) + '</strong>'
      + (aging.d90 > 0
          ? '<span style="color:var(--red);margin-left:14px;'
            + 'font-weight:600">⚠ 90+ overdue: '
            + money(aging.d90) + '</span>'
          : '')
      + '</div>';
  }
  window.onIssueSupplierChange = onIssueSupplierChange;

  function onIssueBankChange(bankId) {
    const bookSel = document.querySelector('#modalWrap [name="ioBook"]');
    const leafSel = document.querySelector('#modalWrap [name="ioLeaf"]');
    if (!bookSel || !leafSel) return;
    bookSel.innerHTML = '<option value="">— Select book —</option>';
    leafSel.innerHTML = '<option value="">— Select book first —</option>';
    leafSel.disabled = true;
    if (!bankId) { bookSel.disabled = true; return; }
    const books = arr(db.chequeBooks).filter(b => b.bankId === bankId);
    books.forEach(b => {
      const available = arr(db.chequeLeaves)
        .filter(l => l.bookId === b.id && l.status === 'Available').length;
      if (available > 0) {
        bookSel.innerHTML += '<option value="' + b.id + '">'
          + esc(b.bookNo || '—') + ' (' + available + ' avail)</option>';
      }
    });
    bookSel.disabled = false;
  }
  window.onIssueBankChange = onIssueBankChange;

  function onIssueBookChange(bookId) {
    const leafSel = document.querySelector('#modalWrap [name="ioLeaf"]');
    if (!leafSel) return;
    leafSel.innerHTML = '<option value="">— Select leaf —</option>';
    if (!bookId) { leafSel.disabled = true; return; }
    const leaves = arr(db.chequeLeaves)
      .filter(l => l.bookId === bookId && l.status === 'Available')
      .sort((a, b) => String(a.leafNo).localeCompare(String(b.leafNo)));
    leaves.forEach(l => {
      leafSel.innerHTML += '<option value="' + l.id + '">'
        + esc(l.leafNo) + '</option>';
    });
    leafSel.disabled = false;
  }
  window.onIssueBookChange = onIssueBookChange;

  function saveIssueOwnCheque(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const supplierId = f.ioSupplier.value;
    const supplier = supObj(supplierId);
    if (!supplier) { toast('Supplier required', 'error'); return; }
    const leafId = f.ioLeaf.value;
    const leaf = leafObj(leafId);
    if (!leaf || leaf.status !== 'Available') {
      toast('Invalid leaf selected', 'error');
      return;
    }
    const amount = NN(f.ioAmount.value);
    if (amount <= 0) { toast('Amount required', 'error'); return; }
    const date = f.ioDate.value || today();
    const dueDate = f.ioDueDate.value || shiftDate(today(), 30);
    const payee = f.ioPayee.value.trim() || supplier.name;

    /* Update leaf */
    leaf.status = 'Issued';
    leaf.supplierId = supplierId;
    leaf.amount = amount;
    leaf.issuedDate = date;
    leaf.dueDate = dueDate;
    leaf.payee = payee;
    leaf.notes = '';

    /* Create payment */
    const payment = {
      id: uid(),
      date: date,
      supplierId: supplierId,
      mode: 'Cheque',
      amount: amount,
      reference: 'CHQ-' + leaf.leafNo,
      chequeNo: leaf.leafNo,
      chequeBank: leaf.bankName,
      chequeDueDate: dueDate,
      chequeStatus: 'Issued',
      notes: 'Cheque issued to ' + payee,
      allocations: [{
        leafId: leaf.id,
        amount: amount
      }],
      fullyReversed: false,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    };
    db.payments.push(payment);

    /* Deferred bank deduction entry */
    if (!Array.isArray(db.bankTransactions)) db.bankTransactions = [];
    db.bankTransactions.push({
      id: uid(),
      bankAccountId: leaf.bankId,
      date: dueDate,
      type: 'cheque_issued',
      amount: amount,
      reference: leaf.leafNo,
      chequeId: leaf.id,
      paymentId: payment.id,
      description: 'Cheque to ' + supplier.name,
      status: 'pending',
      createdAt: nowISO()
    });

    logActivity('OWN_CHEQUE_ISSUED', 'Own Cheque',
      'Leaf ' + leaf.leafNo + ' → ' + supplier.name, money(amount));
    save();
    closeModal();
    render();
    toast('✅ Cheque issued — deduction pending on ' + dateFmt(dueDate),
      'success');
  }
  window.saveIssueOwnCheque = saveIssueOwnCheque;

  /* ═════════════════════════════════════════════════════════════════════
     LEAF DETAIL + ACTIONS
  ═════════════════════════════════════════════════════════════════════ */
  function showLeafDetail(id) {
    const l = leafObj(id);
    if (!l) return;
    const statusInfo = LEAF_STATUS[l.status] || { label: l.status, cls: '' };
    const bank = bankObj(l.bankId);
    const supplier = l.supplierId ? supObj(l.supplierId) : null;
    const pendingTx = arr(db.bankTransactions)
      .find(t => t.chequeId === id && t.type === 'cheque_issued');

    let actions = '';
    if (l.status === 'Issued') {
      actions = '<button class="btn primary" '
        + 'onclick="closeModal();markLeafCleared(\'' + id + '\')">'
        + '✅ Mark Cleared</button>'
        + '<button class="btn danger" '
        + 'onclick="closeModal();markLeafBounced(\'' + id + '\')">'
        + '⛔ Mark Bounced</button>'
        + '<button class="btn" '
        + 'onclick="closeModal();markLeafStopped(\'' + id + '\')">'
        + '🚫 Stop Payment</button>';
    } else if (l.status === 'Bounced') {
      actions = '<button class="btn primary" '
        + 'onclick="closeModal();reissueLeaf(\'' + id + '\')">'
        + '↻ Re-issue</button>';
    }

    openModal('🎯 Cheque Leaf ' + esc(l.leafNo),
      '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">'
      + kpi('Leaf', l.leafNo, '')
      + kpi('Status', statusInfo.label, '')
      + kpi('Amount', l.amount ? money(l.amount) : '—', '')
      + kpi('Bank', bank ? bank.bankName : '—', '')
      + '</div>'

      + '<div class="detail-block">'
      + '<div class="detail-block-title">Details</div>'
      + detailRow('Bank', l.bankName || '—')
      + detailRow('Status', statusInfo.label)
      + (supplier ? detailRow('Supplier', supplier.name) : '')
      + (l.amount ? detailRow('Amount', money(l.amount)) : '')
      + (l.issuedDate ? detailRow('Issued', dateFmt(l.issuedDate)) : '')
      + (l.dueDate ? detailRow('Due', dateFmt(l.dueDate)) : '')
      + (l.payee ? detailRow('Payee', l.payee) : '')
      + (l.clearedDate
          ? detailRow('Cleared', dateFmt(l.clearedDate)) : '')
      + (l.bouncedDate
          ? detailRow('Bounced', dateFmt(l.bouncedDate)) : '')
      + (pendingTx
          ? detailRow('Bank Deduction',
              pendingTx.status === 'pending' ? '⏳ Pending'
              : pendingTx.status === 'deducted' ? '✓ Deducted'
              : pendingTx.status === 'rejected' ? '✕ Rejected'
              : pendingTx.status)
          : '')
      + '</div>'

      + (actions
          ? '<div class="form-actions" style="justify-content:flex-start;'
            + 'flex-wrap:wrap">' + actions + '</div>'
          : '')

      + '<div class="form-actions" style="border-top:1px solid var(--border);'
      + 'margin-top:14px;padding-top:14px">'
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.showLeafDetail = showLeafDetail;

  function markLeafCleared(id) {
    if (!requirePerm('write')) return;
    const l = leafObj(id);
    if (!l) return;
    confirmBox('Mark Cheque Cleared?',
      'Leaf ' + l.leafNo + ' · ' + money(l.amount)
      + '\n\nBank deduction will be applied.',
      () => {
        l.status = 'Cleared';
        l.clearedDate = today();
        /* Apply the pending deduction */
        const tx = arr(db.bankTransactions)
          .find(t => t.chequeId === id && t.type === 'cheque_issued');
        if (tx && tx.status === 'pending') {
          tx.status = 'deducted';
          tx.deductedAt = nowISO();
        }
        logActivity('OWN_CHEQUE_CLEARED', 'Own Cheque',
          'Leaf ' + l.leafNo, money(l.amount));
        save();
        render();
        toast('✅ Cheque cleared', 'success');
      }, { confirmLabel: 'Mark Cleared', danger: false });
  }
  window.markLeafCleared = markLeafCleared;

  function markLeafBounced(id) {
    if (!requirePerm('write')) return;
    const l = leafObj(id);
    if (!l) return;
    confirmBox('Mark Cheque Bounced?',
      'Leaf ' + l.leafNo + ' · ' + money(l.amount)
      + '\n\nThis will restore the supplier payable and reverse the '
      + 'pending bank deduction.',
      () => {
        l.status = 'Bounced';
        l.bouncedDate = today();
        /* Reverse the payment */
        const payment = arr(db.payments).find(p =>
          arr(p.allocations).some(a => a.leafId === id));
        if (payment) payment.fullyReversed = true;
        /* Reverse the bank transaction */
        const tx = arr(db.bankTransactions)
          .find(t => t.chequeId === id && t.type === 'cheque_issued');
        if (tx) tx.status = 'reversed';
        logActivity('OWN_CHEQUE_BOUNCED', 'Own Cheque',
          'Leaf ' + l.leafNo, money(l.amount));
        save();
        render();
        toast('⛔ Cheque bounced — payable restored', 'warn');
      }, { confirmLabel: 'Confirm Bounce', danger: true });
  }
  window.markLeafBounced = markLeafBounced;

  function markLeafStopped(id) {
    if (!requirePerm('write')) return;
    const l = leafObj(id);
    if (!l) return;
    confirmBox('Stop Cheque?',
      'Leaf ' + l.leafNo + ' will be marked Stopped.\n'
      + 'The pending bank deduction will be cancelled.',
      () => {
        l.status = 'Stopped';
        l.stoppedDate = today();
        const payment = arr(db.payments).find(p =>
          arr(p.allocations).some(a => a.leafId === id));
        if (payment) payment.fullyReversed = true;
        const tx = arr(db.bankTransactions)
          .find(t => t.chequeId === id && t.type === 'cheque_issued');
        if (tx) tx.status = 'rejected';
        logActivity('OWN_CHEQUE_STOPPED', 'Own Cheque',
          'Leaf ' + l.leafNo, money(l.amount));
        save();
        render();
        toast('Cheque stopped', 'warn');
      }, { confirmLabel: 'Stop Payment', danger: true });
  }
  window.markLeafStopped = markLeafStopped;

  function reissueLeaf(id) {
    if (!requirePerm('write')) return;
    const l = leafObj(id);
    if (!l) return;
    confirmBox('Re-issue Cheque?',
      'This will reset leaf ' + l.leafNo
      + ' back to Available so you can issue a new one.',
      () => {
        l.status = 'Available';
        l.supplierId = null;
        l.amount = 0;
        l.issuedDate = null;
        l.dueDate = null;
        l.payee = '';
        l.bouncedDate = null;
        l.clearedDate = null;
        logActivity('OWN_CHEQUE_REISSUED', 'Own Cheque',
          'Leaf ' + l.leafNo, '');
        save();
        render();
        toast('Leaf re-issued (Available)', 'success');
      }, { confirmLabel: 'Re-issue', danger: false });
  }
  window.reissueLeaf = reissueLeaf;

  /* ═════════════════════════════════════════════════════════════════════
     EXPORT CUSTOMER CHEQUES
  ═════════════════════════════════════════════════════════════════════ */
  function exportCustomerChequesCSV() {
    const rows = arr(db.customerCheques).map(c => [
      c.receivedDate || '', c.customerName || '', c.chequeNo || '',
      c.bank || '', c.dueDate || '', NN(c.amount), c.status || '',
      c.issuedToSupplierId ? supName(c.issuedToSupplierId) : '',
      c.depositedToBankId
        ? (bankObj(c.depositedToBankId)
            ? bankObj(c.depositedToBankId).bankName : '') : '',
      c.bounceReason || '', c.notes || ''
    ]);
    download('customer_cheques_' + today() + '.csv',
      toCSV(['ReceivedDate','Customer','ChequeNo','Bank','DueDate',
             'Amount','Status','IssuedTo','DepositedTo','BounceReason',
             'Notes'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' cheques', 'success');
  }
  window.exportCustomerChequesCSV = exportCustomerChequesCSV;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="chequeBooks"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const group = '<div class="nav-group" data-group="cheques">'
      + '<div class="nav-label">Cheques</div>'
      + item('customerCheques', '🧾', 'Customer Cheques')
      + item('ownCheques', '🎯', 'Own Cheques')
      + item('chequeBooks', '📚', 'Cheque Books')
      + '</div>';

    /* Insert after Accounting group */
    const accountingGroup = nav.querySelector('[data-view="cashDrawer"]');
    if (accountingGroup) {
      accountingGroup.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    customerCheques: 'Customer Cheques',
    ownCheques: 'Own Cheques',
    chequeBooks: 'Cheque Books'
  });

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Customer Cheques', ico: '🧾', kind: 'view',
        action: () => goTo('customerCheques') },
      { label: 'Receive Customer Cheque', ico: '＋', kind: 'action',
        action: () => openCustomerChequeForm() },
      { label: 'Go to Own Cheques', ico: '🎯', kind: 'view',
        action: () => goTo('ownCheques') },
      { label: 'Issue Own Cheque', ico: '＋', kind: 'action',
        action: () => openIssueOwnChequeForm() },
      { label: 'Go to Cheque Books', ico: '📚', kind: 'view',
        action: () => goTo('chequeBooks') },
      { label: 'Register Cheque Book', ico: '＋', kind: 'action',
        action: () => openChequeBookForm() }
    ]);
  };

  /* CSS */
  (function injectCSS() {
    if (document.getElementById('_part8CSS')) return;
    const style = document.createElement('style');
    style.id = '_part8CSS';
    style.textContent = ''
      + '.pill-info{background:var(--accent-soft);color:var(--accent-text)}'
      + '.pill-muted{background:var(--surface-3);color:var(--text-3)}'
      + '.book-card{background:var(--surface-2);border:1px solid '
      + 'var(--border-2);border-radius:12px;padding:16px 20px;'
      + 'margin-bottom:12px}'
      + '.leaf-chip{padding:10px 8px;border-radius:8px;font-size:12px;'
      + 'text-align:center;font-family:var(--mono);font-weight:600}'
      + '.leaf-Available{background:var(--green-soft);color:var(--green)}'
      + '.leaf-Issued{background:var(--accent-soft);color:var(--accent-text)}'
      + '.leaf-Cleared{background:var(--surface-3);color:var(--text-3)}'
      + '.leaf-Bounced{background:var(--red-soft);color:var(--red)}'
      + '.leaf-Stopped{background:var(--surface-3);color:var(--text-3);'
      + 'opacity:.6}'
      + '.tabs-bar{display:flex;gap:6px;flex-wrap:wrap;'
      + 'border-bottom:1px solid var(--border);padding-bottom:10px;'
      + 'margin-bottom:4px}'
      + '.tab-chip{padding:7px 14px;border-radius:8px;font-size:12.5px;'
      + 'font-weight:500;color:var(--text-3);cursor:pointer;'
      + 'background:var(--surface-2);border:1px solid transparent;'
      + 'white-space:nowrap}'
      + '.tab-chip:hover{background:var(--surface-3);color:var(--text)}'
      + '.tab-chip.active{background:var(--accent);color:#fff;'
      + 'border-color:var(--accent)}'
      + '.tab-chip-count{display:inline-block;padding:1px 7px;'
      + 'background:rgba(255,255,255,.2);border-radius:10px;'
      + 'font-size:10px;font-weight:700;margin-left:4px}'
      + '.tab-chip:not(.active) .tab-chip-count{'
      + 'background:var(--surface-3);color:var(--text-3)}'
      + '.alert-mini{padding:10px 14px;background:var(--accent-soft);'
      + 'border-radius:8px;font-size:12px;color:var(--accent-text);'
      + 'line-height:1.5}';
    document.head.appendChild(style);
  })();

  console.log('%c✅ Part 8 — Cheques loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Customer Cheques · Own Leaves · Books · Endorsement · '
    + 'Splits · Bounce recovery', 'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 9 — STOCK SUMMARY & COGS
   Adds: Monthly stock values by category (opening/closing), auto-carry,
         COGS calculation, stock trend chart.
   Depends on: Parts 1–8
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part9Loaded) return;
  window._part9Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════════════════ */
  const stockObj = id => arr(db.stockMonths).find(s => s.id === id);
  const stockCatObj = id => arr(db.stockCategories).find(c => c.id === id);
  window.stockObj = stockObj;
  window.stockCatObj = stockCatObj;

  /* Find stock month entry by month string */
  function stockMonthByYM(ym) {
    return arr(db.stockMonths).find(s => s.month === ym);
  }
  window.stockMonthByYM = stockMonthByYM;

  /* Purchases in a given month */
  function monthlyPurchases(ym) {
    return arr(db.purchases)
      .filter(p => (p.date || '').slice(0, 7) === ym)
      .reduce((a, p) => a + NN(p.amount), 0);
  }
  window.monthlyPurchases = monthlyPurchases;

  /* Compute opening of month from previous month's closing (auto-carry) */
  function getAutoOpening(ym) {
    const [y, m] = ym.split('-').map(Number);
    const prev = new Date(y, m - 2, 1);
    const prevYM = prev.getFullYear() + '-'
      + String(prev.getMonth() + 1).padStart(2, '0');
    const prevEntry = stockMonthByYM(prevYM);
    if (!prevEntry) return null;
    return prevEntry.categories.map(c => ({
      categoryId: c.categoryId,
      categoryName: c.categoryName,
      opening: NN(c.closing)
    }));
  }
  window.getAutoOpening = getAutoOpening;

  /* Compute COGS for a month */
  function computeCOGS(ym) {
    const entry = stockMonthByYM(ym);
    if (!entry) return { opening: 0, purchases: 0, closing: 0, cogs: 0 };
    const opening = entry.categories.reduce((a, c) => a + NN(c.opening), 0);
    const closing = entry.categories.reduce((a, c) => a + NN(c.closing), 0);
    const purchases = monthlyPurchases(ym);
    const cogs = opening + purchases - closing;
    return { opening, purchases, closing, cogs };
  }
  window.computeCOGS = computeCOGS;

      + (entries.length >= 2

  /* ═════════════════════════════════════════════════════════════════════
     TREND CHART
  ═════════════════════════════════════════════════════════════════════ */
  function renderStockTrendChart(entries) {
    if (!entries.length) return '';
    const max = Math.max(1,
      ...entries.map(e => {
        const t = computeCOGS(e.month);
        return Math.max(t.opening, t.purchases, t.closing);
      }));
    const W = 720, H = 220, PAD = 40;
    const cw = (W - PAD * 2) / Math.max(1, entries.length - 1);

    const pathFor = values =>
      values.map((v, i) => {
        const x = PAD + i * cw;
        const y = H - PAD - (v / max) * (H - PAD * 2);
        return (i === 0 ? 'M' : 'L') + x + ',' + y;
      }).join(' ');

    const openings = entries.map(e => computeCOGS(e.month).opening);
    const closings = entries.map(e => computeCOGS(e.month).closing);
    const purchases = entries.map(e => computeCOGS(e.month).purchases);

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" '
      + 'style="width:100%;height:auto;display:block">'
      /* Grid */
      + [0, 0.25, 0.5, 0.75, 1].map(t =>
          '<line x1="' + PAD + '" y1="' + (H - PAD - t * (H - PAD * 2))
          + '" x2="' + (W - PAD) + '" y2="'
          + (H - PAD - t * (H - PAD * 2)) + '" '
          + 'stroke="var(--border-2)" stroke-dasharray="2,4"/>'
        ).join('')
      /* Closing line (blue) */
      + '<path d="' + pathFor(closings) + '" fill="none" '
      + 'stroke="var(--accent)" stroke-width="2.5"/>'
      /* Opening line (green) */
      + '<path d="' + pathFor(openings) + '" fill="none" '
      + 'stroke="var(--green)" stroke-width="2" stroke-dasharray="4,3"/>'
      /* Purchases line (red) */
      + '<path d="' + pathFor(purchases) + '" fill="none" '
      + 'stroke="var(--red)" stroke-width="2" stroke-dasharray="2,3"/>'
      /* X labels */
      + entries.map((e, i) => {
          const x = PAD + i * cw;
          return '<text x="' + x + '" y="' + (H - 12) + '" '
            + 'text-anchor="middle" font-size="10" '
            + 'fill="var(--text-3)">'
            + monthLabel(e.month) + '</text>';
        }).join('')
      + '</svg>'
      + '<div style="display:flex;justify-content:center;gap:20px;'
      + 'margin-top:12px;font-size:11.5px">'
      + '<span><span style="display:inline-block;width:16px;height:3px;'
      + 'background:var(--accent);vertical-align:middle"></span> '
      + 'Closing</span>'
      + '<span><span style="display:inline-block;width:16px;height:3px;'
      + 'background:var(--green);vertical-align:middle"></span> '
      + 'Opening</span>'
      + '<span><span style="display:inline-block;width:16px;height:3px;'
      + 'background:var(--red);vertical-align:middle"></span> '
      + 'Purchases</span>'
      + '</div>';
  }
  window.renderStockTrendChart = renderStockTrendChart;

  /* ═════════════════════════════════════════════════════════════════════
     ENTER / EDIT STOCK MONTH
  ═════════════════════════════════════════════════════════════════════ */
  function openStockMonthForm(ym) {
    if (!requirePerm('write')) return;
    if (!arr(db.stockCategories).length) {
      toast('Set up stock categories first', 'warn');
      openStockCategoriesManager();
      return;
    }

    ym = ym || thisMonth();
    const existing = stockMonthByYM(ym);
    const autoOpening = getAutoOpening(ym);
    const cats = arr(db.stockCategories);

    /* Build per-category rows */
    const rows = cats.map(c => {
      const ex = existing
        ? existing.categories.find(x => x.categoryId === c.id)
        : null;
      const autoOpen = autoOpening
        ? autoOpening.find(x => x.categoryId === c.id)
        : null;
      return {
        categoryId: c.id,
        categoryName: c.name,
        opening: ex ? NN(ex.opening)
          : (autoOpen ? NN(autoOpen.opening) : NN(c.openingValue)),
        closing: ex ? NN(ex.closing) : 0,
        autoCarried: !ex && autoOpen !== null
      };
    });

    const purchases = monthlyPurchases(ym);
    const suggestedClosing = rows.reduce((a, r) =>
      a + NN(r.opening), 0) + purchases;

    openModal(existing
        ? '✎ Edit Stock — ' + monthName(ym)
        : '＋ Enter Stock — ' + monthName(ym),
      '<div class="alert-mini">'
      + 'ℹ Enter opening and closing stock values from your Busy '
      + 'records for <strong>' + monthName(ym) + '</strong>. '
      + 'The system calculates COGS as <strong>Opening + Purchases − '
      + 'Closing</strong>.'
      + (autoOpening ? '<br><strong style="color:var(--green)">'
          + '✓ Opening values auto-carried from previous month'
          + '</strong>' : '')
      + '</div>'

      + '<form onsubmit="saveStockMonth(event,\'' + ym + '\',\''
      + (existing ? existing.id : '') + '\')" style="margin-top:16px">'
      + '<div class="form-grid" style="grid-template-columns:1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Month <span class="req">*</span>'
      + '<input name="smMonth" type="month" required value="' + ym + '" '
      + (existing ? 'disabled ' : '')
      + 'onchange="reloadStockForm(this.value)"></label>'
      + '<label class="field">Purchases (auto)'
      + '<input value="' + money(purchases) + '" disabled '
      + 'style="background:var(--surface-2);font-weight:600"></label>'
      + '</div>'

      + '<div style="overflow-x:auto">'
      + '<table class="stock-entry-table"><thead><tr>'
      + '<th>Category</th>'
      + '<th style="text-align:right">Opening (Rs.)</th>'
      + '<th style="text-align:right">Closing (Rs.)</th>'
      + '<th style="text-align:right">Change</th>'
      + '</tr></thead><tbody>'
      + rows.map((r, i) =>
          '<tr>'
          + '<td><strong>' + esc(r.categoryName) + '</strong>'
          + (r.autoCarried
              ? '<div style="font-size:10.5px;color:var(--green)">'
                + 'auto-carried</div>' : '')
          + '</td>'
          + '<td><input type="number" step="0.01" min="0" '
          + 'name="open_' + r.categoryId + '" '
          + 'value="' + NN(r.opening) + '" '
          + 'oninput="updateStockRow(this)" '
          + 'style="padding:9px 10px;text-align:right;font-size:12.5px"></td>'
          + '<td><input type="number" step="0.01" min="0" '
          + 'name="close_' + r.categoryId + '" '
          + 'value="' + NN(r.closing) + '" '
          + 'oninput="updateStockRow(this)" '
          + 'style="padding:9px 10px;text-align:right;font-size:12.5px"></td>'
          + '<td class="stock-change-cell" '
          + 'data-open="' + NN(r.opening) + '" '
          + 'data-close="' + NN(r.closing) + '" '
          + 'style="text-align:right;font-variant-numeric:tabular-nums;'
          + 'font-size:12px;font-weight:600;color:'
          + (NN(r.closing) - NN(r.opening) > 0 ? 'var(--green)'
            : NN(r.closing) - NN(r.opening) < 0 ? 'var(--red)'
            : 'var(--text-3)') + '">'
          + (NN(r.closing) - NN(r.opening) > 0 ? '+' : '')
          + money(NN(r.closing) - NN(r.opening))
          + '</td>'
          + '</tr>').join('')
      + '</tbody>'
      + '<tfoot>'
      + '<tr style="background:var(--surface-2);font-weight:700">'
      + '<td>Total</td>'
      + '<td id="totalOpening" style="text-align:right;'
      + 'font-variant-numeric:tabular-nums">'
      + money(rows.reduce((a, r) => a + NN(r.opening), 0)) + '</td>'
      + '<td id="totalClosing" style="text-align:right;'
      + 'font-variant-numeric:tabular-nums">'
      + money(rows.reduce((a, r) => a + NN(r.closing), 0)) + '</td>'
      + '<td id="totalChange" style="text-align:right;'
      + 'font-variant-numeric:tabular-nums">'
      + money(rows.reduce((a, r) => a + NN(r.closing) - NN(r.opening), 0))
      + '</td>'
      + '</tr>'
      + '</tfoot>'
      + '</table>'
      + '</div>'

      + '<div id="cogsPreview" style="margin-top:16px;padding:14px 18px;'
      + 'background:var(--accent-soft);border-radius:10px;font-size:13px;'
      + 'color:var(--accent-text)">'
      + '<div style="display:flex;justify-content:space-between;'
      + 'padding:3px 0">'
      + '<span>Opening + Purchases − Closing = COGS</span>'
      + '<strong id="cogsValue">'
      + money(rows.reduce((a, r) => a + NN(r.opening), 0)
        + purchases - rows.reduce((a, r) => a + NN(r.closing), 0))
      + '</strong></div>'
      + '<div style="font-size:11.5px;opacity:.8;margin-top:4px" '
      + 'id="cogsBreakdown">'
      + '(' + money(rows.reduce((a, r) => a + NN(r.opening), 0))
      + ' + ' + money(purchases) + ' − '
      + money(rows.reduce((a, r) => a + NN(r.closing), 0)) + ')'
      + '</div></div>'

      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="smNotes" rows="2" '
      + 'placeholder="Any notes about this month\'s stock">'
      + esc(existing ? (existing.notes || '') : '') + '</textarea></label>'

      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">'
