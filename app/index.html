      + 'oninput="journalUpdateLine(' + i + ',\'credit\',this.value);'
      + 'renderJournalTotals()" '
      + 'style="text-align:right">'
      + '<input type="text" placeholder="Memo (optional)" '
      + 'value="' + esc(l.description || '') + '" '
      + 'oninput="journalUpdateLine(' + i + ',\'description\',this.value)">'
      + '<button type="button" class="btn sm danger" '
      + 'onclick="journalRemoveLine(' + i + ')" '
      + 'title="Remove">✕</button>'
      + '</div>'
      + '</div>').join('');
  }
  window.renderJournalLines = renderJournalLines;

  function renderJournalTotals() {
    const box = document.getElementById('journalTotalsBox');
    if (!box) return;
    const totalDebit = _journalDraft.lines
      .reduce((a, l) => a + NN(l.debit), 0);
    const totalCredit = _journalDraft.lines
      .reduce((a, l) => a + NN(l.credit), 0);
    const diff = totalDebit - totalCredit;
    const balanced = Math.abs(diff) < 0.01
      && totalDebit > 0 && totalCredit > 0;

    box.innerHTML = '<div style="display:grid;'
      + 'grid-template-columns:1fr 1fr 1fr;gap:12px">'
      + '<div><span style="color:var(--text-3)">Total Debits</span><br>'
      + '<strong style="font-size:15px">' + money(totalDebit)
      + '</strong></div>'
      + '<div><span style="color:var(--text-3)">Total Credits</span><br>'
      + '<strong style="font-size:15px">' + money(totalCredit)
      + '</strong></div>'
      + '<div><span style="color:var(--text-3)">Difference</span><br>'
      + '<strong style="font-size:15px;color:'
      + (balanced ? 'var(--green)' : 'var(--red)') + '">'
      + (balanced ? '✓ Balanced' : money(diff)) + '</strong></div>'
      + '</div>';
  }
  window.renderJournalTotals = renderJournalTotals;

  function saveJournalForm(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const totalDebit = _journalDraft.lines
      .reduce((a, l) => a + NN(l.debit), 0);
    const totalCredit = _journalDraft.lines
      .reduce((a, l) => a + NN(l.credit), 0);

    /* Validate */
    if (!_journalDraft.description) {
      toast('Description required', 'error');
      return;
    }
    const validLines = _journalDraft.lines.filter(l =>
      l.accountId && (NN(l.debit) > 0 || NN(l.credit) > 0));
    if (validLines.length < 2) {
      toast('At least 2 valid lines required', 'error');
      return;
    }
    if (Math.abs(totalDebit - totalCredit) > 0.01) {
      toast('Debits must equal credits', 'error');
      return;
    }

    /* Build full lines */
    const finalLines = validLines.map(l => {
      const acc = accountObj(l.accountId);
      return {
        accountId: l.accountId,
        accountCode: acc ? acc.code : '',
        accountName: acc ? acc.name : '',
        debit: NN(l.debit),
        credit: NN(l.credit),
        description: l.description || ''
      };
    });

    db.journals.push({
      id: uid(),
      date: _journalDraft.date || today(),
      reference: _journalDraft.reference || nextJournalRef(),
      description: _journalDraft.description,
      lines: finalLines,
      totalDebit: totalDebit,
      totalCredit: totalCredit,
      isOpening: false,
      isAuto: false,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    });
    logActivity('JOURNAL_POSTED', 'Journal',
      _journalDraft.reference, _journalDraft.description);
    _journalDraft = null;
    save();
    closeModal();
    render();
    toast('✅ Journal posted', 'success');
  }
  window.saveJournalForm = saveJournalForm;

  function deleteJournal(id) {
    if (!requirePerm('delete')) return;
    const j = journalObj(id);
    if (!j) return;
    if (j.isOpening) {
      toast('Opening entries cannot be deleted here', 'warn');
      return;
    }
    if (j.isAuto) {
      toast('Auto entries are locked. Post a reversing entry instead.',
        'warn');
      return;
    }
    confirmBox('Delete Journal?',
      'Remove ' + (j.reference || '') + '?\n'
      + 'This affects balances but is not auto-reversed.',
      () => {
        db.journals = arr(db.journals).filter(x => x.id !== id);
        logActivity('JOURNAL_DELETED', 'Journal', j.reference, '');
        save();
        render();
        toast('Journal deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteJournal = deleteJournal;

  function exportJournalsCSV() {
    /* Export both journals and their lines */

  /* ═════════════════════════════════════════════════════════════════════
     GENERAL LEDGER
  ═════════════════════════════════════════════════════════════════════ */
  let ledgerState = {
    accountId: '',
    from: '',
    to: ''
  };
  window.ledgerState = ledgerState;

  function viewGeneralLedger() {
    const accounts = arr(db.chartOfAccounts).slice()
      .sort((a, b) => a.code.localeCompare(b.code));
    if (!accounts.length) {
      return '<div class="card"><div class="empty">'
        + '<div class="big">📒</div>'
        + 'No accounts. Set up your Chart of Accounts first.'
        + '</div></div>';
    }
    if (!ledgerState.accountId) {
      ledgerState.accountId = accounts[0].id;
    }
    const account = accountObj(ledgerState.accountId) || accounts[0];

    /* Movements with running balance */
    const moves = accountMovements(account.id, {
      from: ledgerState.from,
      to: ledgerState.to
    });
    /* Opening balance = sum of everything before 'from' */
    let openingBal = 0;
    if (ledgerState.from) {
      const priorLines = accountMovements(account.id, {
        to: shiftDate(ledgerState.from, -1)
      });
      openingBal = priorLines.reduce((a, l) => a + l.debit - l.credit, 0);
    }
    let running = openingBal;
    const runningRows = moves.map(m => {
      running += m.debit - m.credit;
      return Object.assign({}, m, { runningBalance: running });
    });

    const totalDebit = moves.reduce((a, l) => a + l.debit, 0);
    const totalCredit = moves.reduce((a, l) => a + l.credit, 0);
    const closing = openingBal + totalDebit - totalCredit;
    const normal = ACCOUNT_TYPES[account.type].normal;
    const showClosing = normal === 'debit'
      ? (closing >= 0 ? 'Dr' : 'Cr')
      : (closing <= 0 ? 'Cr' : 'Dr');

    return '<div class="kpi-strip">'
      + kpi('Account', account.code + ' — ' + account.name,
          ACCOUNT_TYPES[account.type].label)
      + kpi('Opening Balance',
          (ledgerState.from ? money(Math.abs(openingBal)) : '—'),
          ledgerState.from ? (openingBal >= 0 ? 'Dr' : 'Cr') : '')
      + kpi('Movements', moves.length, 'Lines in period')
      + kpi('Closing Balance',
          money(Math.abs(closing)), showClosing)
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📒 General Ledger</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportLedgerCSV()">⬇ CSV</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:2fr 1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Account'
      + '<select onchange="ledgerState.accountId=this.value;render()">'
      + accounts.map(a =>
          '<option value="' + a.id + '" '
          + (ledgerState.accountId === a.id ? 'selected' : '') + '>'
          + esc(a.code) + ' — ' + esc(a.name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(ledgerState.from) + '" '
      + 'onchange="ledgerState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(ledgerState.to) + '" '
      + 'onchange="ledgerState.to=this.value;render()"></label>'
      + '</div>'

      + (runningRows.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Date','Reference','Description','Debit','Credit','Balance']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + (openingBal !== 0 && ledgerState.from
              ? '<tr style="background:var(--surface-2)">'
                + '<td colspan="5" style="padding:10px 12px;'
                + 'font-style:italic;text-align:right">'
                + 'Opening balance as at '
                + dateFmt(ledgerState.from) + '</td>'
                + '<td style="padding:10px 12px;text-align:right;'
                + 'font-weight:700">' + money(Math.abs(openingBal))
                + ' ' + (openingBal >= 0 ? 'Dr' : 'Cr') + '</td></tr>'
              : '')
          + runningRows.map(r =>
              '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showJournalDetail(\''
              + r.journalId + '\')">'
              + '<td style="padding:10px 12px;font-size:11.5px;'
              + 'white-space:nowrap">' + dateFmt(r.date) + '</td>'
              + '<td style="padding:10px 12px;font-family:var(--mono);'
              + 'font-size:11px;color:var(--text-3)">'
              + esc(r.reference || '—') + '</td>'
              + '<td style="padding:10px 12px;font-size:11.5px">'
              + esc(r.description || '') + '</td>'
              + '<td style="padding:10px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--green)">'
              + (r.debit ? money(r.debit) : '—') + '</td>'
              + '<td style="padding:10px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--red)">'
              + (r.credit ? money(r.credit) : '—') + '</td>'
              + '<td style="padding:10px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600">'
              + money(Math.abs(r.runningBalance)) + ' '
              + (r.runningBalance >= 0 ? 'Dr' : 'Cr') + '</td>'
              + '</tr>').join('')
          + '<tr style="background:var(--surface-2);font-weight:700">'
          + '<td colspan="3" style="padding:11px 12px;text-align:right">'
          + 'PERIOD TOTALS</td>'
          + '<td style="padding:11px 12px;text-align:right">'
          + money(totalDebit) + '</td>'
          + '<td style="padding:11px 12px;text-align:right">'
          + money(totalCredit) + '</td>'
          + '<td style="padding:11px 12px;text-align:right">'
          + money(Math.abs(closing)) + ' ' + showClosing + '</td>'
          + '</tr>'
          + '</tbody></table></div>'
        : '<div class="empty">No movements in this range</div>')
      + '</div>';
  }
  views.generalLedger = viewGeneralLedger;
  window.viewGeneralLedger = viewGeneralLedger;

  function exportLedgerCSV() {
    const account = accountObj(ledgerState.accountId);
    if (!account) { toast('No account selected', 'warn'); return; }
    const moves = accountMovements(account.id, {
      from: ledgerState.from,
      to: ledgerState.to
    });
    let running = 0;
    const rows = moves.map(m => {
      running += m.debit - m.credit;
      return [
        m.date, m.reference || '', m.description || '',
        m.debit, m.credit, running
      ];
    });
    download('ledger_' + account.code + '_' + today() + '.csv',
      toCSV(['Date','Reference','Description','Debit','Credit',
             'RunningBalance'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' lines', 'success');
  }
  window.exportLedgerCSV = exportLedgerCSV;

  /* ═════════════════════════════════════════════════════════════════════
     TRIAL BALANCE
  ═════════════════════════════════════════════════════════════════════ */
  let tbState = { from: '', to: '', showZero: false };
  window.tbState = tbState;

  function viewTrialBalance() {
    const accounts = arr(db.chartOfAccounts).slice()
      .sort((a, b) => a.code.localeCompare(b.code));

    /* Compute debit/credit columns per account */
    const rows = accounts.map(a => {
      const lines = accountMovements(a.id, {
        from: tbState.from, to: tbState.to
      });
      const totalDebit = lines.reduce((x, l) => x + l.debit, 0);
      const totalCredit = lines.reduce((x, l) => x + l.credit, 0);
      const net = totalDebit - totalCredit;
      /* Determine which column the balance goes into */
      let debitCol = 0, creditCol = 0;
      const normal = ACCOUNT_TYPES[a.type].normal;
      if (normal === 'debit') {
        if (net >= 0) debitCol = net;
        else creditCol = -net;
      } else {
        if (net <= 0) creditCol = -net;
        else debitCol = net;
      }
      return {
        account: a,
        totalDebit: totalDebit,
        totalCredit: totalCredit,
        debitCol: debitCol,
        creditCol: creditCol
      };
    });

    const visible = tbState.showZero
      ? rows
      : rows.filter(r =>
          Math.abs(r.debitCol) > 0.01
          || Math.abs(r.creditCol) > 0.01);

    const grandDebit = rows.reduce((a, r) => a + r.debitCol, 0);
    const grandCredit = rows.reduce((a, r) => a + r.creditCol, 0);
    const diff = grandDebit - grandCredit;
    const balanced = Math.abs(diff) < 0.01;

    return '<div class="kpi-strip">'
      + kpi('Total Debits', money(grandDebit), '')
      + kpi('Total Credits', money(grandCredit), '')
      + kpi('Difference', money(Math.abs(diff)),
          balanced ? '✓ Balanced' : '⚠ Unbalanced')
      + kpi('Accounts', visible.length,
          tbState.showZero ? 'Showing all' : 'Non-zero only')
      + '</div>'

      + (balanced
        ? '<div class="card" style="border-color:var(--green);'
          + 'background:var(--green-soft);padding:14px 20px">'
          + '<div style="display:flex;align-items:center;gap:12px;'
          + 'font-size:13px;color:var(--green)">'
          + '<span style="font-size:22px">✓</span>'
          + '<strong>Trial Balance is balanced — your books are correct'
          + '</strong></div></div>'
        : '<div class="card" style="border-color:var(--red);'
          + 'background:var(--red-soft);padding:14px 20px">'
          + '<div style="display:flex;align-items:center;gap:12px;'
          + 'font-size:13px;color:var(--red)">'
          + '<span style="font-size:22px">⚠</span>'
          + '<div><strong>Out of balance by ' + money(Math.abs(diff))
          + '</strong><div style="font-size:11.5px;margin-top:2px">'
          + 'Check for unbalanced journals or missing entries.</div>'
          + '</div></div></div>')

      + '<div class="card">'
      + '<div class="card-head"><h3>⚖️ Trial Balance</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportTrialBalanceCSV()">'
      + '⬇ CSV</button>'
      + '<button class="btn sm" onclick="printTrialBalance()">🖨 Print</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(tbState.from) + '" '
      + 'onchange="tbState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(tbState.to) + '" '
      + 'onchange="tbState.to=this.value;render()"></label>'
      + '<label class="field">'
      + '<span style="visibility:hidden">Toggle</span>'
      + '<button type="button" class="btn" '
      + 'onclick="tbState.showZero=!tbState.showZero;render()">'
      + (tbState.showZero ? 'Hide' : 'Show') + ' zero accounts</button>'
      + '</label>'
      + '</div>'

      + (visible.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Code','Account','Type','Debit','Credit']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + visible.map(r =>
              '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showAccountDetail(\''
              + r.account.id + '\')">'
              + '<td style="padding:10px 12px;font-family:var(--mono);'
              + 'font-size:11.5px;color:var(--text-3)">'
              + esc(r.account.code) + '</td>'
              + '<td style="padding:10px 12px"><strong>'
              + esc(r.account.name) + '</strong></td>'
              + '<td style="padding:10px 12px;font-size:11px">'
              + '<span class="pill pill-soft">'
              + ACCOUNT_TYPES[r.account.type].label + '</span></td>'
              + '<td style="padding:10px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums">'
              + (r.debitCol ? money(r.debitCol) : '—') + '</td>'
              + '<td style="padding:10px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums">'
              + (r.creditCol ? money(r.creditCol) : '—') + '</td>'
              + '</tr>').join('')
          + '<tr style="background:var(--surface-2);font-weight:700;'
          + 'border-top:2px solid var(--border)">'
          + '<td colspan="3" style="padding:12px;text-align:right">'
          + 'TOTALS</td>'

  }
  views.trialBalance = viewTrialBalance;
  window.viewTrialBalance = viewTrialBalance;

  function exportTrialBalanceCSV() {
    const accounts = arr(db.chartOfAccounts).slice()
      .sort((a, b) => a.code.localeCompare(b.code));
    const rows = accounts.map(a => {
      const lines = accountMovements(a.id, {
        from: tbState.from, to: tbState.to
      });
      const td = lines.reduce((x, l) => x + l.debit, 0);
      const tc = lines.reduce((x, l) => x + l.credit, 0);
      const net = td - tc;
      const normal = ACCOUNT_TYPES[a.type].normal;
      let dCol = 0, cCol = 0;
      if (normal === 'debit') {
        if (net >= 0) dCol = net; else cCol = -net;
      } else {
        if (net <= 0) cCol = -net; else dCol = net;
      }
      return [a.code, a.name, a.type, dCol, cCol];
    });
    download('trial_balance_' + today() + '.csv',
      toCSV(['Code','Account','Type','Debit','Credit'], rows),
      'text/csv');
    toast('Trial Balance exported', 'success');
  }
  window.exportTrialBalanceCSV = exportTrialBalanceCSV;

  function printTrialBalance() {
    const accounts = arr(db.chartOfAccounts).slice()
      .sort((a, b) => a.code.localeCompare(b.code));
    let grandDebit = 0, grandCredit = 0;
    const rows = accounts.map(a => {
      const lines = accountMovements(a.id, {
        from: tbState.from, to: tbState.to
      });
      const td = lines.reduce((x, l) => x + l.debit, 0);
      const tc = lines.reduce((x, l) => x + l.credit, 0);
      const net = td - tc;
      const normal = ACCOUNT_TYPES[a.type].normal;
      let dCol = 0, cCol = 0;
      if (normal === 'debit') {
        if (net >= 0) dCol = net; else cCol = -net;
      } else {
        if (net <= 0) cCol = -net; else dCol = net;
      }
      grandDebit += dCol;
      grandCredit += cCol;
      return { a: a, d: dCol, c: cCol };
    }).filter(r => r.d > 0.01 || r.c > 0.01);

    const shop = db.settings.shopName || 'Lanka Shoe';
    const dateRange = (tbState.from || tbState.to)
      ? (tbState.from ? dateFmt(tbState.from) : 'Start')
        + ' — ' + (tbState.to ? dateFmt(tbState.to) : 'Today')
      : 'All time';

    const html = '<div style="padding:8px">'
      + '<div style="text-align:center;padding-bottom:14px;'

      + 'TRIAL BALANCE</div>'
      + '<div style="font-size:13px;margin-top:6px">'
      + esc(shop) + '</div>'
      + '<div style="font-size:11px;color:#666;margin-top:4px">'
      + esc(dateRange) + '</div></div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:12px">'
      + '<thead><tr style="border-bottom:2px solid #111">'
      + '<th style="text-align:left;padding:8px;font-size:10px;'
      + 'text-transform:uppercase;letter-spacing:.06em">Code</th>'
      + '<th style="text-align:left;padding:8px;font-size:10px;'
      + 'text-transform:uppercase;letter-spacing:.06em">Account</th>'
      + '<th style="text-align:right;padding:8px;font-size:10px;'
      + 'text-transform:uppercase;letter-spacing:.06em">Debit</th>'
      + '<th style="text-align:right;padding:8px;font-size:10px;'
      + 'text-transform:uppercase;letter-spacing:.06em">Credit</th>'
      + '</tr></thead><tbody>'
      + rows.map(r =>
          '<tr style="border-bottom:1px solid #eee">'
          + '<td style="padding:6px 8px;font-family:monospace;'
          + 'font-size:11px;color:#666">' + esc(r.a.code) + '</td>'
          + '<td style="padding:6px 8px">' + esc(r.a.name) + '</td>'
          + '<td style="padding:6px 8px;text-align:right;'
          + 'font-variant-numeric:tabular-nums">'
          + (r.d ? money(r.d) : '—') + '</td>'
          + '<td style="padding:6px 8px;text-align:right;'
          + 'font-variant-numeric:tabular-nums">'
          + (r.c ? money(r.c) : '—') + '</td>'
          + '</tr>').join('')
      + '<tr style="border-top:2px solid #111;font-weight:800">'
      + '<td colspan="2" style="padding:10px 8px;text-align:right">'
      + 'TOTAL</td>'
      + '<td style="padding:10px 8px;text-align:right">'
      + money(grandDebit) + '</td>'
      + '<td style="padding:10px 8px;text-align:right">'
      + money(grandCredit) + '</td></tr>'
      + '</tbody></table>'
      + '<div style="margin-top:30px;padding-top:12px;'
      + 'border-top:1px solid #ddd;font-size:10px;color:#888;'
      + 'text-align:center">Generated '
      + new Date().toLocaleString('en-GB') + '</div></div>';

    if (window.iframePrint) iframePrint('Trial Balance', html);
    else window.print();
  }
  window.printTrialBalance = printTrialBalance;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="chartOfAccounts"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')

    const group = '<div class="nav-group" data-group="ledger">'

      + item('journalEntries', '📒', 'Journal Entries')
      + item('generalLedger', '📗', 'General Ledger')
      + item('trialBalance', '⚖️', 'Trial Balance')
      + '</div>';

    /* Insert after Accounting group (Expenses/Cash) */
    const cashItem = nav.querySelector('[data-view="cashDrawer"]');
    if (cashItem) {
      cashItem.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    chartOfAccounts: 'Chart of Accounts',
    journalEntries: 'Journal Entries',
    generalLedger: 'General Ledger',
    trialBalance: 'Trial Balance'
  });

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Chart of Accounts', ico: '📊', kind: 'view',
        action: () => goTo('chartOfAccounts') },
      { label: 'Go to Journal Entries', ico: '📒', kind: 'view',
        action: () => goTo('journalEntries') },
      { label: 'New Journal Entry', ico: '＋', kind: 'action',
        action: () => openJournalForm() },
      { label: 'Go to General Ledger', ico: '📗', kind: 'view',
        action: () => goTo('generalLedger') },
      { label: 'Go to Trial Balance', ico: '⚖️', kind: 'view',
        action: () => goTo('trialBalance') }
    ]);
  };

  /* CSS */
  (function injectCSS() {
    if (document.getElementById('_part11CSS')) return;
    const style = document.createElement('style');
    style.id = '_part11CSS';
    style.textContent = ''
      + '.pill-info{background:var(--accent-soft);color:var(--accent-text)}'
      + '.pill-muted{background:var(--surface-3);color:var(--text-3)}'
      + '.alert-mini{padding:10px 14px;background:var(--accent-soft);'
      + 'border-radius:8px;font-size:12px;color:var(--accent-text);'
      + 'line-height:1.5;margin-top:12px}'

    + 'Trial Balance', 'color:#a78bfa;font-size:12px');

})();

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 12 — FINANCIAL REPORTS
   Adds: Profit & Loss · Balance Sheet · Cash Flow · Net Worth ·
         Contra Entries (Bank ↔ Cash, Bank ↔ Bank)
   Depends on: Parts 1–11
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part12Loaded) return;
  window._part12Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS — sum balances by account type
  ═════════════════════════════════════════════════════════════════════ */
  function accountsByType(type) {
    return arr(db.chartOfAccounts)
      .filter(a => a.type === type)
      .sort((a, b) => a.code.localeCompare(b.code));
  }
  window.accountsByType = accountsByType;

  /* Sum of signed balances for a set of accounts, honouring normal side */
  function sumNormal(accounts, opts) {
    return accounts.reduce((a, acc) => {
      const b = accountBalance(acc.id, opts);
      return a + b.net;
    }, 0);
  }
  window.sumNormal = sumNormal;

  /* ═════════════════════════════════════════════════════════════════════
     P&L REPORT
  ═════════════════════════════════════════════════════════════════════ */
  let pnlState = { from: '', to: '', period: 'thisMonth' };
  window.pnlState = pnlState;

  function computePnL(from, to) {
    const opts = { from: from, to: to };
    const incomeAccounts = accountsByType('income');
    const expenseAccounts = accountsByType('expense');

    const incomeRows = incomeAccounts.map(a => {
      const b = accountBalance(a.id, opts);
      return { account: a, amount: b.net, debit: b.debit, credit: b.credit };
    }).filter(r => Math.abs(r.amount) > 0.01);

    const expenseRows = expenseAccounts.map(a => {
      const b = accountBalance(a.id, opts);
      return { account: a, amount: b.net, debit: b.debit, credit: b.credit };
    }).filter(r => Math.abs(r.amount) > 0.01);

    const totalIncome = incomeRows.reduce((a, r) => a + r.amount, 0);
    const totalExpenses = expenseRows.reduce((a, r) => a + r.amount, 0);
    const netProfit = totalIncome - totalExpenses;

    /* COGS: look for account named 'Cost of Goods Sold' or code 5000 */
    const cogsRow = expenseRows.find(r =>
      r.account.code === '5000'
      || /cost of goods/i.test(r.account.name));
    const cogs = cogsRow ? cogsRow.amount : 0;
    const grossProfit = totalIncome - cogs;
    const operatingExpenses = totalExpenses - cogs;

    return {
      incomeRows: incomeRows,
      expenseRows: expenseRows,
      totalIncome: totalIncome,
      totalExpenses: totalExpenses,
      cogs: cogs,
      grossProfit: grossProfit,
      operatingExpenses: operatingExpenses,
      netProfit: netProfit
    };
  }
  window.computePnL = computePnL;

  function resolvePeriodRange(period, from, to) {
    const t = today();
    if (period === 'thisMonth') {
      return { from: thisMonth() + '-01', to: thisMonth() + '-31' };
    }
    if (period === 'lastMonth') {
      const d = new Date();
      d.setDate(1);
      d.setMonth(d.getMonth() - 1);
      const ym = d.getFullYear() + '-'
        + String(d.getMonth() + 1).padStart(2, '0');
      return { from: ym + '-01', to: ym + '-31' };
    }
    if (period === 'thisQuarter') {
      const d = new Date();
      const q = Math.floor(d.getMonth() / 3);
      const sm = q * 3 + 1;
      const em = sm + 2;
      return {
        from: d.getFullYear() + '-' + String(sm).padStart(2, '0') + '-01',
        to: d.getFullYear() + '-' + String(em).padStart(2, '0') + '-31'
      };
    }
    if (period === 'thisYear') {
      return { from: thisYear() + '-01-01', to: thisYear() + '-12-31' };
    }
    if (period === 'lastYear') {
      const y = thisYear() - 1;
      return { from: y + '-01-01', to: y + '-12-31' };
    }
    if (period === 'allTime') return { from: '', to: '' };
    /* custom */
    return { from: from || '', to: to || '' };
  }
  window.resolvePeriodRange = resolvePeriodRange;

  function viewProfitLoss() {
    const range = resolvePeriodRange(pnlState.period,
      pnlState.from, pnlState.to);
    const pnl = computePnL(range.from, range.to);

    return '<div class="kpi-strip">'
      + kpi('Total Income', money(pnl.totalIncome), 'Revenue')
      + kpi('Cost of Goods Sold', money(pnl.cogs), 'Direct cost')
      + kpi('Gross Profit', money(pnl.grossProfit),
          pnl.totalIncome > 0
            ? ((pnl.grossProfit / pnl.totalIncome) * 100).toFixed(1)
              + '% margin'
            : '—')
      + kpi('Net Profit', money(pnl.netProfit),
          pnl.netProfit >= 0 ? '✓ Profit' : '⚠ Loss')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📊 Profit & Loss Statement</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="printPnL()">🖨 Print</button>'
      + '<button class="btn sm" onclick="exportPnLCSV()">⬇ CSV</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Period'
      + '<select onchange="pnlState.period=this.value;render()">'
      + [['thisMonth','This Month'],['lastMonth','Last Month'],
         ['thisQuarter','This Quarter'],['thisYear','This Year'],
         ['lastYear','Last Year'],['allTime','All Time'],
         ['custom','Custom Range']].map(([k, l]) =>
          '<option value="' + k + '" '
          + (pnlState.period === k ? 'selected' : '') + '>'
          + l + '</option>').join('')
      + '</select></label>'
      + (pnlState.period === 'custom'
        ? '<label class="field">From'
          + '<input type="date" value="' + esc(pnlState.from) + '" '
          + 'onchange="pnlState.from=this.value;render()"></label>'
          + '<label class="field">To'
          + '<input type="date" value="' + esc(pnlState.to) + '" '
          + 'onchange="pnlState.to=this.value;render()"></label>'
        : '<label class="field">Range'
          + '<input value="' + dateFmt(range.from) + ' → '
          + dateFmt(range.to) + '" disabled '
          + 'style="background:var(--surface-2)"></label>'
          + '<div></div>')
      + '</div>'

      + '<div class="pnl-statement">'
      + renderPnLSection('📈 Income', pnl.incomeRows, pnl.totalIncome,
          'income')
      + (pnl.cogs > 0
          ? '<div class="pnl-row pnl-subtotal">'
            + '<span>Less: Cost of Goods Sold</span>'
            + '<span>' + money(pnl.cogs) + '</span></div>'
            + '<div class="pnl-row pnl-total">'
            + '<span>GROSS PROFIT</span>'
            + '<span>' + money(pnl.grossProfit) + '</span></div>'
          : '')
      + renderPnLSection('📉 Operating Expenses',
          pnl.expenseRows.filter(r =>
            r.account.code !== '5000'
            && !/cost of goods/i.test(r.account.name)),
          pnl.operatingExpenses, 'expense')
      + '<div class="pnl-row pnl-grand ' + (pnl.netProfit >= 0
          ? 'pnl-profit' : 'pnl-loss') + '">'
      + '<span>' + (pnl.netProfit >= 0 ? 'NET PROFIT' : 'NET LOSS')
      + '</span>'
      + '<span>' + money(Math.abs(pnl.netProfit)) + '</span>'
      + '</div>'
      + '</div>'
      + '</div>';
  }
  views.profitLoss = viewProfitLoss;
  window.viewProfitLoss = viewProfitLoss;

  function renderPnLSection(title, rows, total, type) {
    const color = type === 'income' ? 'var(--green)' : 'var(--red)';
    return '<div class="pnl-section">'
      + '<div class="pnl-section-title">' + title + '</div>'
      + (rows.length
        ? rows.map(r =>
            '<div class="pnl-row">'
            + '<span style="padding-left:20px">' + esc(r.account.name)
            + ' <span style="font-size:10.5px;color:var(--text-4);'
            + 'font-family:var(--mono)">' + esc(r.account.code)
            + '</span></span>'
            + '<span>' + money(r.amount) + '</span>'
            + '</div>').join('')
        : '<div class="pnl-row" style="color:var(--text-3);'
          + 'font-style:italic"><span style="padding-left:20px">'
          + 'No entries</span><span>' + money(0) + '</span></div>')
      + '<div class="pnl-row pnl-subtotal" '
      + 'style="color:' + color + '">'
      + '<span>Total ' + title.replace(/[^\w\s]/g, '').trim() + '</span>'
      + '<span>' + money(total) + '</span></div>'
      + '</div>';
  }
  window.renderPnLSection = renderPnLSection;

  function exportPnLCSV() {
    const range = resolvePeriodRange(pnlState.period,
      pnlState.from, pnlState.to);
    const pnl = computePnL(range.from, range.to);
    const rows = [];
    rows.push(['INCOME', '']);
    pnl.incomeRows.forEach(r =>
      rows.push([r.account.code + ' — ' + r.account.name, r.amount]));
    rows.push(['Total Income', pnl.totalIncome]);
    if (pnl.cogs > 0) {
      rows.push(['Cost of Goods Sold', pnl.cogs]);
      rows.push(['Gross Profit', pnl.grossProfit]);
    }
    rows.push(['', '']);
    rows.push(['EXPENSES', '']);
    pnl.expenseRows.forEach(r => {
      if (r.account.code === '5000') return;
      rows.push([r.account.code + ' — ' + r.account.name, r.amount]);
    });
    rows.push(['Total Expenses', pnl.operatingExpenses]);
    rows.push(['', '']);
    rows.push(['NET PROFIT / (LOSS)', pnl.netProfit]);
    download('profit_loss_' + today() + '.csv',
      toCSV(['Account','Amount'], rows), 'text/csv');
    toast('P&L exported', 'success');
  }
  window.exportPnLCSV = exportPnLCSV;

  function printPnL() {
    const range = resolvePeriodRange(pnlState.period,
      pnlState.from, pnlState.to);
    const pnl = computePnL(range.from, range.to);
    const shop = db.settings.shopName || 'Lanka Shoe';
    const rangeLabel = (range.from || range.to)
      ? (range.from ? dateFmt(range.from) : 'Start') + ' — '
        + (range.to ? dateFmt(range.to) : 'Today')
      : 'All time';

    const html = '<div style="padding:8px">'
      + '<div style="text-align:center;padding-bottom:14px;'
      + 'border-bottom:2px solid #111;margin-bottom:20px">'
      + '<div style="font-size:22px;font-weight:800;letter-spacing:.14em">'
      + 'PROFIT & LOSS</div>'
      + '<div style="font-size:13px;margin-top:6px">'
      + esc(shop) + '</div>'
      + '<div style="font-size:11px;color:#666;margin-top:4px">'
      + esc(rangeLabel) + '</div></div>'

      + '<table style="width:100%;border-collapse:collapse;font-size:12px">'
      + '<tbody>'
      + '<tr><td colspan="2" style="padding:10px 0;font-weight:800;'
      + 'text-transform:uppercase;letter-spacing:.08em;'
      + 'border-bottom:1px solid #ddd">Income</td></tr>'
      + pnl.incomeRows.map(r =>
          '<tr><td style="padding:5px 0 5px 20px">'
          + esc(r.account.name) + '</td>'
          + '<td style="padding:5px 0;text-align:right;'
          + 'font-variant-numeric:tabular-nums">' + money(r.amount)
          + '</td></tr>').join('')
      + '<tr style="font-weight:700;border-top:1px solid #eee">'
      + '<td style="padding:8px 0 8px 20px">Total Income</td>'
      + '<td style="padding:8px 0;text-align:right">'
      + money(pnl.totalIncome) + '</td></tr>'

      + (pnl.cogs > 0
          ? '<tr><td colspan="2" style="padding:16px 0 10px;'
            + 'font-weight:800;text-transform:uppercase;'
            + 'letter-spacing:.08em;border-bottom:1px solid #ddd">'
            + 'Cost of Goods Sold</td></tr>'
            + '<tr><td style="padding:5px 0 5px 20px">'
            + 'Cost of Goods Sold</td>'
            + '<td style="padding:5px 0;text-align:right">'
            + money(pnl.cogs) + '</td></tr>'
            + '<tr style="font-weight:800;border-top:1px solid #eee">'
            + '<td style="padding:10px 0 10px 20px">GROSS PROFIT</td>'
            + '<td style="padding:10px 0;text-align:right">'
            + money(pnl.grossProfit) + '</td></tr>'
          : '')

      + '<tr><td colspan="2" style="padding:16px 0 10px;font-weight:800;'
      + 'text-transform:uppercase;letter-spacing:.08em;'
      + 'border-bottom:1px solid #ddd">Operating Expenses</td></tr>'
      + pnl.expenseRows.filter(r =>
          r.account.code !== '5000'
          && !/cost of goods/i.test(r.account.name))
        .map(r =>
          '<tr><td style="padding:5px 0 5px 20px">'
          + esc(r.account.name) + '</td>'
          + '<td style="padding:5px 0;text-align:right;'
          + 'font-variant-numeric:tabular-nums">' + money(r.amount)
          + '</td></tr>').join('')
      + '<tr style="font-weight:700;border-top:1px solid #eee">'
      + '<td style="padding:8px 0 8px 20px">Total Expenses</td>'
      + '<td style="padding:8px 0;text-align:right">'
      + money(pnl.operatingExpenses) + '</td></tr>'

      + '<tr style="border-top:2px solid #111;border-bottom:2px solid #111;'
      + 'font-weight:900;font-size:14px">'
      + '<td style="padding:14px 0;letter-spacing:.06em">'
      + (pnl.netProfit >= 0 ? 'NET PROFIT' : 'NET LOSS') + '</td>'
      + '<td style="padding:14px 0;text-align:right;color:'
      + (pnl.netProfit >= 0 ? '#10b981' : '#ef4444') + '">'
      + money(Math.abs(pnl.netProfit)) + '</td></tr>'
      + '</tbody></table>'
      + '<div style="margin-top:30px;padding-top:12px;'
      + 'border-top:1px solid #ddd;font-size:10px;color:#888;'
      + 'text-align:center">Generated '
      + new Date().toLocaleString('en-GB') + '</div></div>';

    if (window.iframePrint) iframePrint('Profit & Loss', html);
    else window.print();

  function computeBalanceSheet(asOf) {
    const opts = { to: asOf };
    const assets = accountsByType('asset').map(a => ({
      account: a,
      balance: accountBalance(a.id, opts)
    }));
    const liabilities = accountsByType('liability').map(a => ({
      account: a,
      balance: accountBalance(a.id, opts)
    }));
    const equity = accountsByType('equity').map(a => ({
      account: a,
      balance: accountBalance(a.id, opts)
    }));

    const totalAssets = assets.reduce((a, x) => a + x.balance.net, 0);
    const totalLiabilities = liabilities
      .reduce((a, x) => a + x.balance.net, 0);
    const totalEquity = equity.reduce((a, x) => a + x.balance.net, 0);

    /* Retained earnings = Income − Expenses over all time (net profit) */
    const income = sumNormal(accountsByType('income'), opts);
    const expenses = sumNormal(accountsByType('expense'), opts);
    const retainedEarnings = income - expenses;

    const totalEquityWithRetained = totalEquity + retainedEarnings;
    const totalLiabAndEquity = totalLiabilities + totalEquityWithRetained;
    const diff = totalAssets - totalLiabAndEquity;

    return {
      assets: assets,
      liabilities: liabilities,
      equity: equity,
      totalAssets: totalAssets,
      totalLiabilities: totalLiabilities,
      totalEquity: totalEquity,
      retainedEarnings: retainedEarnings,
      totalEquityWithRetained: totalEquityWithRetained,
      totalLiabAndEquity: totalLiabAndEquity,
      difference: diff,
      balanced: Math.abs(diff) < 0.01
    };
  }
  window.computeBalanceSheet = computeBalanceSheet;

  function computeCashFlow(from, to) {
    /* Operating: cash sales + receipts − expenses − payments (cash only) */
    const sales = arr(db.sales).filter(s =>
      (!from || s.date >= from) && (!to || s.date <= to));
    const cashSales = sales.filter(s => s.type === 'cash')
      .reduce((a, s) => a + NN(s.amount), 0);

    const receipts = arr(db.receipts).filter(r =>
      (!from || r.date >= from) && (!to || r.date <= to));
    const cashReceipts = receipts.filter(r => r.method === 'Cash')
      .reduce((a, r) => a + NN(r.amount), 0);
    const bankReceipts = receipts.filter(r => r.method === 'Bank')
      .reduce((a, r) => a + NN(r.amount), 0);

    const expenses = arr(db.expenses).filter(e =>
      (!from || e.date >= from) && (!to || e.date <= to));
    const cashExpenses = expenses.filter(e => !e.bankAccountId)
      .reduce((a, e) => a + NN(e.amount), 0);
    const bankExpenses = expenses.filter(e => e.bankAccountId)
      .reduce((a, e) => a + NN(e.amount), 0);

    const payments = arr(db.payments).filter(p =>
      !p.fullyReversed
      && (!from || p.date >= from) && (!to || p.date <= to));
    const cashPayments = payments.filter(p => p.mode === 'Cash')
      .reduce((a, p) => a + NN(p.amount), 0);
    const bankPayments = payments.filter(p => p.mode === 'Bank')
      .reduce((a, p) => a + NN(p.amount), 0);
    /* Cheque payments only affect cash flow when cleared */
    const clearedChequePayments = payments.filter(p =>
      p.mode === 'Cheque' && p.chequeStatus === 'Cleared')
      .reduce((a, p) => a + NN(p.amount), 0);

    const cashIn = cashSales + cashReceipts;
    const cashOut = cashExpenses + cashPayments;
    const bankIn = bankReceipts;
    const bankOut = bankExpenses + bankPayments + clearedChequePayments;

    /* Manual cash transactions (from cash drawer + contra entries) */
    const cashTxns = arr(db.cashTransactions).filter(t =>
      (!from || t.date >= from) && (!to || t.date <= to));
    const manualCashIn = cashTxns
      .filter(t => t.type === 'in'
        && !t.sourceId)
      .reduce((a, t) => a + NN(t.amount), 0);
    const manualCashOut = cashTxns
      .filter(t => t.type === 'out'
        && !t.sourceId)
      .reduce((a, t) => a + NN(t.amount), 0);

    /* Bank transfers */
    const transfers = arr(db.bankTransfers).filter(t =>
      (!from || t.date >= from) && (!to || t.date <= to));
    const transferIn = transfers.reduce((a, t) => a + NN(t.amount), 0);
    const transferOut = transferIn;

    const openingCash = NN(db.settings.openingCash);
    const openingBank = arr(db.banks)
      .reduce((a, b) => a + NN(b.openingBalance), 0);

    return {
      cashIn: cashIn,
      cashOut: cashOut,
      bankIn: bankIn,
      bankOut: bankOut,
      manualCashIn: manualCashIn,
      manualCashOut: manualCashOut,
      transferIn: transferIn,
      transferOut: transferOut,
      openingCash: openingCash,
      openingBank: openingBank,
      netCash: cashIn - cashOut + manualCashIn - manualCashOut,
      netBank: bankIn - bankOut,
      netTotal: (cashIn - cashOut + manualCashIn - manualCashOut)
        + (bankIn - bankOut)
    };
  }
  window.computeCashFlow = computeCashFlow;

  function exportCashFlowCSV() {
    const range = resolvePeriodRange(cfState.period,
      cfState.from, cfState.to);
    const cf = computeCashFlow(range.from, range.to);
    const rows = [
      ['Opening Cash', cf.openingCash],
      ['Cash In', cf.cashIn],
      ['Manual Cash In', cf.manualCashIn],
      ['Cash Out', cf.cashOut],
      ['Manual Cash Out', cf.manualCashOut],
      ['Net Cash Movement', cf.netCash],
      ['', ''],
      ['Opening Bank', cf.openingBank],
      ['Bank In', cf.bankIn],
      ['Bank Out', cf.bankOut],
      ['Net Bank Movement', cf.netBank],
      ['', ''],
      ['Net Total', cf.netTotal]
    ];
    download('cash_flow_' + today() + '.csv',
      toCSV(['Item','Amount'], rows), 'text/csv');
    toast('Cash Flow exported', 'success');
  }
  window.exportCashFlowCSV = exportCashFlowCSV;

  function printCashFlow() {
    const range = resolvePeriodRange(cfState.period,
      cfState.from, cfState.to);
    const cf = computeCashFlow(range.from, range.to);
    const shop = db.settings.shopName || 'Lanka Shoe';
    const rangeLabel = (range.from || range.to)
      ? (range.from ? dateFmt(range.from) : 'Start') + ' — '
        + (range.to ? dateFmt(range.to) : 'Today')
      : 'All time';

    const html = '<div style="padding:8px">'
      + '<div style="text-align:center;padding-bottom:14px;'
      + 'border-bottom:2px solid #111;margin-bottom:20px">'
      + '<div style="font-size:22px;font-weight:800;letter-spacing:.14em">'
      + 'CASH FLOW STATEMENT</div>'
      + '<div style="font-size:13px;margin-top:6px">'
      + esc(shop) + '</div>'
      + '<div style="font-size:11px;color:#666;margin-top:4px">'
      + esc(rangeLabel) + '</div></div>'

      + '<table style="width:100%;border-collapse:collapse;font-size:12px">'
      + '<tbody>'
      + '<tr><td colspan="2" style="padding:10px 0;font-weight:800;'
      + 'text-transform:uppercase;letter-spacing:.06em;'
      + 'border-bottom:1px solid #ddd">Cash (Physical)</td></tr>'
      + '<tr><td style="padding:5px 0 5px 20px">Opening cash</td>'
      + '<td style="padding:5px 0;text-align:right">'
      + money(cf.openingCash) + '</td></tr>'
      + '<tr><td style="padding:5px 0 5px 20px">+ Cash in</td>'
      + '<td style="padding:5px 0;text-align:right;color:#10b981">'
      + money(cf.cashIn + cf.manualCashIn) + '</td></tr>'
      + '<tr><td style="padding:5px 0 5px 20px">− Cash out</td>'
      + '<td style="padding:5px 0;text-align:right;color:#ef4444">'
      + money(cf.cashOut + cf.manualCashOut) + '</td></tr>'
      + '<tr style="font-weight:700;border-top:1px solid #eee">'
      + '<td style="padding:8px 0 8px 20px">Net cash</td>'
      + '<td style="padding:8px 0;text-align:right">'
      + money(cf.netCash) + '</td></tr>'

      + '<tr><td colspan="2" style="padding:20px 0 10px;font-weight:800;'
      + 'text-transform:uppercase;letter-spacing:.06em;'
      + 'border-bottom:1px solid #ddd">Bank</td></tr>'
      + '<tr><td style="padding:5px 0 5px 20px">Opening bank</td>'
      + '<td style="padding:5px 0;text-align:right">'
      + money(cf.openingBank) + '</td></tr>'
      + '<tr><td style="padding:5px 0 5px 20px">+ Bank in</td>'
      + '<td style="padding:5px 0;text-align:right;color:#10b981">'
      + money(cf.bankIn) + '</td></tr>'
      + '<tr><td style="padding:5px 0 5px 20px">− Bank out</td>'
      + '<td style="padding:5px 0;text-align:right;color:#ef4444">'
      + money(cf.bankOut) + '</td></tr>'
      + '<tr style="font-weight:700;border-top:1px solid #eee">'
      + '<td style="padding:8px 0 8px 20px">Net bank</td>'
      + '<td style="padding:8px 0;text-align:right">'
      + money(cf.netBank) + '</td></tr>'

      + '<tr style="border-top:2px solid #111;border-bottom:2px solid #111;'
      + 'font-weight:900;font-size:14px">'
      + '<td style="padding:14px 0">'
      + (cf.netTotal >= 0 ? 'NET INCREASE' : 'NET DECREASE') + '</td>'
      + '<td style="padding:14px 0;text-align:right;color:'
      + (cf.netTotal >= 0 ? '#10b981' : '#ef4444') + '">'
      + money(Math.abs(cf.netTotal)) + '</td></tr>'
      + '</tbody></table>'
      + '<div style="margin-top:30px;padding-top:12px;'
      + 'border-top:1px solid #ddd;font-size:10px;color:#888;'
      + 'text-align:center">Generated '
      + new Date().toLocaleString('en-GB') + '</div></div>';

    if (window.iframePrint) iframePrint('Cash Flow Statement', html);
    else window.print();

  window.printCashFlow = printCashFlow;

  /* ═════════════════════════════════════════════════════════════════════
     CONTRA ENTRIES (Bank ↔ Cash, Bank ↔ Bank)
  ═════════════════════════════════════════════════════════════════════ */
  function openContraForm() {
    if (!requirePerm('write')) return;
    openModal('🔄 Contra Entry',
      '<div class="alert-mini">'
      + 'Move money between Cash and Bank, or between two Bank accounts. '
      + 'This creates balanced journal entries and updates the bank/cash '
      + 'balances automatically.'
      + '</div>'
      + '<form onsubmit="saveContra(event)" style="margin-top:14px">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="cnDate" type="date" required value="' + today()
      + '"></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="cnAmount" type="number" step="0.01" min="0.01" '
      + 'required></label>'
      + '<label class="field">From <span class="req">*</span>'
      + '<select name="cnFrom" required>'
      + '<option value="">— Source —</option>'
      + '<option value="_cash">💵 Cash</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '">🏦 '
          + esc(b.accountName || b.bankName) + ' · '
          + esc(b.bankName) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">To <span class="req">*</span>'
      + '<select name="cnTo" required>'
      + '<option value="">— Destination —</option>'
      + '<option value="_cash">💵 Cash</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '">🏦 '
          + esc(b.accountName || b.bankName) + ' · '
          + esc(b.bankName) + '</option>').join('')
      + '</select></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Reference'
      + '<input name="cnReference" placeholder="Optional"></label>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="cnNotes" rows="2"></textarea></label>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">Post Contra</button>'
      + '</div></form>', { wide: true });
  }
  window.openContraForm = openContraForm;

  function saveContra(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const date = f.cnDate.value || today();
    const amount = NN(f.cnAmount.value);
    const from = f.cnFrom.value;
    const to = f.cnTo.value;
    const reference = f.cnReference.value.trim()
      || ('CTR-' + Date.now().toString(36).slice(-4));
    const notes = f.cnNotes.value.trim();

    if (!from || !to) { toast('Source and destination required', 'error'); return; }
    if (from === to) { toast('Source and destination must differ', 'error'); return; }
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }

    /* Warn on negative from-side */
    const fromBal = from === '_cash' ? cashBalanceForDate(date)
      : bankBalance(from);
    if (fromBal - amount < 0) {
      if (!confirm('⚠ Source balance will go negative.\n\n'
        + 'Current: ' + money(fromBal) + '\n'
        + 'Transfer: ' + money(amount) + '\n'
        + 'After: ' + money(fromBal - amount) + '\n\nProceed?')) {
        return;
      }
    }

    /* Determine accounts */
    const accCash = accountByName('Cash in Hand');
    const accBank = accountByName('Bank Account');

    /* Auto-create accounts if missing */
    if (!accCash || !accBank) {
      toast('Missing Cash/Bank accounts. Run setup again.', 'error');
      return;
    }

    /* Compute from/to account for journal */
    const fromAcc = from === '_cash' ? accCash
      : (from ? accBank : null);
    const toAcc = to === '_cash' ? accCash
      : (to ? accBank : null);

    /* Post journal (cr from, dr to) */
    const lines = [
      {
        accountId: toAcc.id, accountCode: toAcc.code,
        accountName: toAcc.name,
        debit: amount, credit: 0,
        description: 'Contra in — '
          + (to === '_cash' ? 'cash' : (bankObj(to)
              ? bankObj(to).bankName : ''))
      },
      {
        accountId: fromAcc.id, accountCode: fromAcc.code,
        accountName: fromAcc.name,
        debit: 0, credit: amount,
        description: 'Contra out — '
          + (from === '_cash' ? 'cash' : (bankObj(from)
              ? bankObj(from).bankName : ''))
      }
    ];
    db.journals.push({
      id: uid(),
      date: date,
      reference: reference,
      description: notes || 'Contra entry',
      lines: lines,
      totalDebit: amount,
      totalCredit: amount,
      isOpening: false,
      isAuto: false,
      isContra: true,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    });

    /* Add cash transactions for cash side */
    if (!Array.isArray(db.cashTransactions)) db.cashTransactions = [];
    if (from === '_cash') {
      db.cashTransactions.push({
        id: uid(),
        date: date,
        type: 'out',
        amount: amount,
        category: 'Contra to bank',
        reference: reference,
        notes: notes,
        sourceType: 'contra',
        createdAt: nowISO()
      });
    }
    if (to === '_cash') {
      db.cashTransactions.push({
        id: uid(),
        date: date,
        type: 'in',
        amount: amount,
        category: 'Contra from bank',
        reference: reference,
        notes: notes,
        sourceType: 'contra',
        createdAt: nowISO()
      });
    }
    /* Bank transactions */
    if (!Array.isArray(db.bankTransactions)) db.bankTransactions = [];
    if (from !== '_cash') {
      db.bankTransactions.push({
        id: uid(),
        bankAccountId: from,
        date: date,
        type: 'transfer_out',
        amount: amount,
        reference: reference,
        description: 'Contra out to '
          + (to === '_cash' ? 'cash'
              : (bankObj(to) ? bankObj(to).bankName : '')),
        createdAt: nowISO()
      });
    }
    if (to !== '_cash') {
      db.bankTransactions.push({
        id: uid(),
        bankAccountId: to,
        date: date,
        type: 'transfer_in',
        amount: amount,
        reference: reference,
        description: 'Contra in from '
          + (from === '_cash' ? 'cash'
              : (bankObj(from) ? bankObj(from).bankName : '')),
        createdAt: nowISO()
      });
    }
    /* Bank transfers log */
    if (from !== '_cash' || to !== '_cash') {
      if (!Array.isArray(db.bankTransfers)) db.bankTransfers = [];
      db.bankTransfers.push({
        id: uid(),
        date: date,
        from: from,
        to: to,
        amount: amount,
        reference: reference,
        notes: notes,
        createdAt: nowISO()
      });
    }

    logActivity('CONTRA_POSTED', 'Contra', reference,
      (from === '_cash' ? 'Cash' : (bankObj(from)
          ? bankObj(from).bankName : '')) + ' → '
      + (to === '_cash' ? 'Cash' : (bankObj(to)
          ? bankObj(to).bankName : ''))
      + ' · ' + money(amount));

    save();
    closeModal();
    render();
    toast('✅ Contra posted', 'success');
  }
  window.saveContra = saveContra;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);

    if (!nav || nav.querySelector('[data-view="profitLoss"]')) return;

    const item = (view, ico, label) =>

      + '" data-view="' + view + '" '

    const group = '<div class="nav-group" data-group="reports">'
      + '<div class="nav-label">Reports</div>'
      + item('profitLoss', '📊', 'Profit & Loss')
      + item('balanceSheet', '⚖️', 'Balance Sheet')

    /* Insert after Ledger group */
    const tbItem = nav.querySelector('[data-view="trialBalance"]');
    if (tbItem) {
      tbItem.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    profitLoss: 'Profit & Loss',
    balanceSheet: 'Balance Sheet',
    cashFlow: 'Cash Flow Statement',
    netWorth: 'Net Worth',
    contraEntry: 'Contra Entry'
  });

  /* Add a special "view" for contra that opens the modal */
  views.contraEntry = function () {
    /* Auto-open the contra form and return to previous view */
    setTimeout(() => {
      openContraForm();
      ui.view = 'journalEntries';
      render();
    }, 50);
    return '<div class="card"><div class="empty">'
      + '<div class="big">🔄</div>Opening contra form…</div></div>';
  };

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Profit & Loss', ico: '📊', kind: 'view',
        action: () => goTo('profitLoss') },
      { label: 'Go to Balance Sheet', ico: '⚖️', kind: 'view',
        action: () => goTo('balanceSheet') },
      { label: 'Go to Cash Flow', ico: '💹', kind: 'view',
        action: () => goTo('cashFlow') },
      { label: 'Go to Net Worth', ico: '💎', kind: 'view',
        action: () => goTo('netWorth') },
      { label: 'Post Contra Entry', ico: '🔄', kind: 'action',
        action: () => openContraForm() }
    ]);
  };

  /* CSS */
  (function injectCSS() {

      + 'border-bottom:1px solid var(--border)}'
      + '.bs-row{display:flex;justify-content:space-between;padding:9px 0;'

      + 'padding:24px;font-size:13px}'
      + '.cf-section-title{font-size:11.5px;font-weight:800;'

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 13 — DASHBOARD / ONE-EYE DAILY REPORT
   Adds: Live dashboard with cash + banks + today's activity + receivables
         + payables + net position + cheques due + alerts + mini-trend.
         Printable daily report.
   Depends on: Parts 1–12
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part13Loaded) return;
  window._part13Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     LIVE SNAPSHOT — everything needed for the daily report
  ═════════════════════════════════════════════════════════════════════ */
  function buildDailySnapshot(date) {
    date = date || today();

    /* ─── Cash in hand ─── */
    const cashInHand = cashBalanceForDate(date);

    /* ─── Banks ─── */
    const banks = arr(db.banks).map(b => ({
      id: b.id,
      name: b.accountName || b.bankName,
      bankName: b.bankName,
      accountNo: b.accountNo,
      balance: bankBalance(b.id)
    }));
    const bankTotal = banks.reduce((a, b) => a + b.balance, 0);
    const totalLiquid = cashInHand + bankTotal;

    /* ─── Today's activity ─── */
    const todaySales = arr(db.sales).filter(s => s.date === date);
    const todayReceipts = arr(db.receipts).filter(r => r.date === date);
    const todayPayments = arr(db.payments)
      .filter(p => !p.fullyReversed && p.date === date);
    const todayExpenses = arr(db.expenses).filter(e => e.date === date);

    const activity = {
      salesCount: todaySales.length,
      salesTotal: todaySales.reduce((a, s) => a + NN(s.amount), 0),
      cashSales: todaySales.filter(s => s.type === 'cash')
        .reduce((a, s) => a + NN(s.amount), 0),
      creditSales: todaySales.filter(s => s.type === 'credit')
        .reduce((a, s) => a + NN(s.amount), 0),
      receiptsCount: todayReceipts.length,
      receiptsTotal: todayReceipts.reduce((a, r) => a + NN(r.amount), 0),
      paymentsCount: todayPayments.length,
      paymentsTotal: todayPayments.reduce((a, p) => a + NN(p.amount), 0),
      expensesCount: todayExpenses.length,
      expensesTotal: todayExpenses.reduce((a, e) => a + NN(e.amount), 0)
    };

    /* ─── Receivables ─── */
    let customerReceivable = 0;
    let bouncedOutstanding = 0;
    let chequesInHand = 0;
    let chequesInHandCount = 0;
    arr(db.customers).forEach(c => {
      const bal = customerBalance(c.id);
      if (bal > 0) customerReceivable += bal;
    });
    arr(db.customerCheques).forEach(c => {
      if (c.status === 'Bounced') {
        const settled = arr(db.chequeSettlements)
          .filter(s => s.chequeId === c.id)
          .reduce((a, s) => a + NN(s.amount), 0);
        bouncedOutstanding += Math.max(0, NN(c.amount) - settled);
      }
      if (c.status === 'In Hand') {
        chequesInHand += NN(c.amount);
        chequesInHandCount++;
      }
    });
    /* Committed receivables = future plan installments not yet paid */
    let futureInstallments = 0;
    let futureInstallmentsCount = 0;
    arr(db.paymentPlans)
      .filter(p => p.status === 'active')
      .forEach(p => {
        (p.installments || []).forEach(i => {
          const out = NN(i.amount) - NN(i.paidAmount);
          if (out > 0.01 && i.dueDate >= date) {
            futureInstallments += out;
            futureInstallmentsCount++;
          }
        });
      });

    const totalReceivable = customerReceivable + bouncedOutstanding
      + chequesInHand;

    /* ─── Payables ─── */
    let supplierPayable = 0;
    let ownChequesPending = 0;
    let ownChequesCount = 0;
    let overdueOwnCheques = 0;
    arr(db.suppliers).forEach(s => {
      const bal = supplierBalance(s.id);
      if (bal > 0) supplierPayable += bal;
    });
    arr(db.chequeLeaves).forEach(l => {
      if (l.status === 'Issued') {
        ownChequesPending += NN(l.amount);
        ownChequesCount++;
        if (l.dueDate && l.dueDate < date) {
          overdueOwnCheques += NN(l.amount);
        }
      }
    });
    const totalPayable = supplierPayable + ownChequesPending;

    /* ─── Net position ─── */
    const netPosition = totalLiquid + totalReceivable - totalPayable;

    /* ─── Alerts ─── */
    const alerts = [];

    /* Overdue own cheques */
    if (overdueOwnCheques > 0) {
      alerts.push({
        severity: 'critical',
        icon: '🚫',
        title: money(overdueOwnCheques) + ' in own cheques overdue',
        desc: 'Immediate funding required',
        link: { view: 'ownCheques' }
      });
    }

    /* Low bank balances */
    banks.forEach(b => {
      if (b.balance < 5000 && b.balance >= 0) {
        alerts.push({
          severity: 'warn',
          icon: '🏦',
          title: b.name + ' low balance: ' + money(b.balance),
          desc: 'Consider topping up',
          link: { view: 'banks' }
        });
      }
      if (b.balance < 0) {
        alerts.push({
          severity: 'critical',
          icon: '⚠️',
          title: b.name + ' overdrawn: ' + money(b.balance),
          desc: 'Overdraft on bank',
          link: { view: 'banks' }
        });
      }
    });

    /* Bounced cheques to recover */
    if (bouncedOutstanding > 0) {
      alerts.push({
        severity: 'warn',
        icon: '⛔',
        title: money(bouncedOutstanding) + ' bounced cheques outstanding',
        desc: 'Follow up with customers',
        link: { view: 'customerCheques' }
      });
    }

    /* Overdue installments */
    const overdueInstallments = getOverdueInstallments().slice(0, 5);
    if (overdueInstallments.length) {
      const total = overdueInstallments.reduce((a, x) => a + x.amount, 0);
      alerts.push({
        severity: 'warn',
        icon: '💳',
        title: overdueInstallments.length
          + ' plan installment(s) overdue — ' + money(total),
        desc: 'Chase customers',
        link: { view: 'paymentPlans' }
      });
    }

    /* Supplier aging 90+ */
    const aging = globalAging();
    if (aging.d90 > 0) {
      alerts.push({
        severity: 'critical',
        icon: '📋',
        title: money(aging.d90) + ' supplier payables 90+ days overdue',
        desc: 'Pay to maintain credit',
        link: { view: 'payments' }
      });
    }

    /* Cheques due this week */
    const upcomingOwn = arr(db.chequeLeaves)
      .filter(l => l.status === 'Issued' && l.dueDate
        && l.dueDate >= date
        && daysBetween(date, l.dueDate) <= 7);
    const upcomingOwnTotal = upcomingOwn.reduce((a, l) =>
      a + NN(l.amount), 0);
    if (upcomingOwnTotal > 0 && totalLiquid < upcomingOwnTotal) {
      alerts.push({
        severity: 'critical',
        icon: '🔔',
        title: money(upcomingOwnTotal)
          + ' in own cheques due within 7 days',
        desc: 'Cash on hand: ' + money(totalLiquid)
          + ' — funding gap ' + money(upcomingOwnTotal - totalLiquid),
        link: { view: 'cashFlow' }
      });
    }

    /* Stock this month not entered */
    if (arr(db.stockCategories).length
      && !stockMonthByYM(thisMonth())) {
      alerts.push({
        severity: 'warn',
        icon: '📦',
        title: 'Stock for ' + monthName(thisMonth()) + ' not entered',
        desc: 'Enter opening + closing to get accurate COGS',
        link: { view: 'stockSummary' }
      });
    }

    /* ─── 30-day mini-trend ─── */
    const trendDays = 30;
    const trend = [];
    for (let i = trendDays - 1; i >= 0; i--) {
      const d = shiftDate(date, -i);
      const sales = arr(db.sales).filter(s => s.date === d)
        .reduce((a, s) => a + NN(s.amount), 0);
      const expenses = arr(db.expenses).filter(e => e.date === d)
        .reduce((a, e) => a + NN(e.amount), 0);
      trend.push({ date: d, sales: sales, expenses: expenses });
    }

    return {
      date: date,
      cashInHand: cashInHand,
      banks: banks,
      bankTotal: bankTotal,
      totalLiquid: totalLiquid,
      activity: activity,
      customerReceivable: customerReceivable,
      bouncedOutstanding: bouncedOutstanding,
      chequesInHand: chequesInHand,
      chequesInHandCount: chequesInHandCount,
      futureInstallments: futureInstallments,
      futureInstallmentsCount: futureInstallmentsCount,
      totalReceivable: totalReceivable,
      supplierPayable: supplierPayable,
      ownChequesPending: ownChequesPending,
      ownChequesCount: ownChequesCount,
      overdueOwnCheques: overdueOwnCheques,
      totalPayable: totalPayable,
      netPosition: netPosition,
      alerts: alerts,
      trend: trend
    };
  }
  window.buildDailySnapshot = buildDailySnapshot;

  /* Helper: bank colours */
  function pickBankColorPart13(name) {
    const colors = ['#7c3aed', '#ec4899', '#10b981', '#f59e0b',
                    '#3b82f6', '#14b8a6', '#ef4444', '#8b5cf6'];
    let h = 0;
    for (let i = 0; i < (name || '').length; i++) {
      h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    }
    return colors[h % colors.length];
  }

  /* ═════════════════════════════════════════════════════════════════════

  function renderChequeCalendarBlock(date) {
    const t = date;

    /* Outgoing own cheques next 7 days */
    const outgoing = arr(db.chequeLeaves)
      .filter(l => l.status === 'Issued' && l.dueDate
        && l.dueDate >= t
        && daysBetween(t, l.dueDate) <= 7)
      .sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
    const outgoingTotal = outgoing.reduce((a, l) =>
      a + NN(l.amount), 0);

    /* Incoming customer cheques next 7 days */
    const incoming = arr(db.customerCheques)
      .filter(c => (c.status === 'In Hand' || c.status === 'Deposited')
        && c.dueDate
        && c.dueDate >= t
        && daysBetween(t, c.dueDate) <= 7)
      .sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
    const incomingTotal = incoming.reduce((a, c) =>
      a + NN(c.amount), 0);

    return '<div class="section-title">📅 Cheques This Week</div>'
      + '<div class="dash-split">'

      /* Outgoing */
      + '<div class="dash-panel dash-panel-outgoing">'
      + '<div class="dash-panel-title">'
      + '<span>🔴 Own cheques due ('
      + outgoing.length + ')</span>'
      + '<span class="dash-panel-total">'
      + money(outgoingTotal) + '</span></div>'
      + (outgoing.length
        ? outgoing.slice(0, 5).map(l => {
            const daysAway = daysBetween(t, l.dueDate);
            const dayLabel = daysAway === 0 ? 'Today'
              : daysAway === 1 ? 'Tomorrow'
              : 'in ' + daysAway + 'd';
            return '<div class="dash-panel-row" '
              + 'onclick="showLeafDetail(\'' + l.id + '\')" '
              + 'style="cursor:pointer">'
              + '<span>' + dateFmt(l.dueDate) + ' <span '
              + 'style="color:'
              + (daysAway === 0 ? 'var(--red)' : 'var(--text-3)') + ';'
              + 'font-size:11px">' + dayLabel + '</span> '
              + '· Leaf ' + esc(l.leafNo)
              + ' · ' + esc(l.bankName || '') + '</span>'
              + '<strong>' + money(l.amount) + '</strong></div>';

        : '<div class="dash-panel-empty">No cheques due this week</div>')
      + '</div>'

      /* Incoming */
      + '<div class="dash-panel dash-panel-incoming">'
      + '<div class="dash-panel-title">'
      + '<span>🟢 Party cheques due ('
      + incoming.length + ')</span>'
      + '<span class="dash-panel-total">'
      + money(incomingTotal) + '</span></div>'
      + (incoming.length
        ? incoming.slice(0, 5).map(c => {
            const daysAway = daysBetween(t, c.dueDate);
            const dayLabel = daysAway === 0 ? 'Today'
              : daysAway === 1 ? 'Tomorrow'
              : 'in ' + daysAway + 'd';
            return '<div class="dash-panel-row" '
              + 'onclick="showCustomerChequeDetail(\'' + c.id + '\')" '

              + (daysAway === 0 ? 'var(--green)' : 'var(--text-3)') + ';'
              + 'font-size:11px">' + dayLabel + '</span> '
              + '· ' + esc(c.customerName) + ' · #'
              + esc(c.chequeNo) + '</span>'
              + '<strong>' + money(c.amount) + '</strong></div>';

        : '<div class="dash-panel-empty">No cheques due this week</div>')

  /* ═════════════════════════════════════════════════════════════════════
     MINI TREND CHART (30 days sales vs expenses)
  ═════════════════════════════════════════════════════════════════════ */
  function renderMiniTrendChart(trend) {
    if (!trend || !trend.length) return '';
    const maxVal = Math.max(1,
      ...trend.map(t => Math.max(t.sales, t.expenses)));
    const W = 720, H = 180, PAD = 30;
    const stepX = (W - PAD * 2) / Math.max(1, trend.length - 1);

    const lineFor = key =>
      trend.map((t, i) => {
        const x = PAD + i * stepX;
        const y = H - PAD - (t[key] / maxVal) * (H - PAD * 2);
        return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');

    /* Area under sales */
    const areaPath = lineFor('sales')
      + ' L' + (W - PAD) + ',' + (H - PAD)
      + ' L' + PAD + ',' + (H - PAD) + ' Z';

    /* Labels: show every 5th date */
    const labels = trend.map((t, i) => {
      if (i % 5 !== 0 && i !== trend.length - 1) return '';
      const x = PAD + i * stepX;
      return '<text x="' + x.toFixed(1) + '" y="' + (H - 8)
        + '" text-anchor="middle" font-size="9" '
        + 'fill="var(--text-3)">' + monthLabel(t.date.slice(0, 7))
        + ' ' + t.date.slice(8, 10) + '</text>';
    }).join('');

    const totalSales = trend.reduce((a, t) => a + t.sales, 0);
    const totalExp = trend.reduce((a, t) => a + t.expenses, 0);
    const bestDay = trend.slice().sort((a, b) =>
      b.sales - a.sales)[0];

    return '<div style="display:flex;justify-content:space-between;'
      + 'align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">'
      + '<div style="display:flex;gap:20px;font-size:12.5px">'
      + '<div><span style="color:var(--text-3)">30d sales:</span> '
      + '<strong>' + money(totalSales) + '</strong></div>'

  /* ═════════════════════════════════════════════════════════════════════
     REFRESH DASHBOARD EVERY 60s (live counters)
