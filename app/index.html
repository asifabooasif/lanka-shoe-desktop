              + esc((r.ref || r.desc || '').slice(0, 40)) + '</span>'
              + '<span style="text-align:right;font-weight:600">'
              + money(r.balance) + '</span></div>').join('')
          + '</div>';
        const fa = body.querySelector('.form-actions');
        if (fa) fa.insertAdjacentHTML('beforebegin', block);
      }, 60);
    };
    patched.__part6Patched = true;
    window.showSupplierDetail = patched;
  }

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="purchases"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const group = '<div class="nav-group" data-group="purchases">'
      + '<div class="nav-label">Purchases</div>'
      + item('purchases', '🛒', 'Purchases')
      + item('payments', '💸', 'Payments')
      + '</div>';

    /* Insert after Sales group */
    const salesGroup = nav.querySelector('[data-view="receipts"]');
    if (salesGroup) {
      salesGroup.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    purchases: 'Purchases',
    payments: 'Payments'
  });

  /* Command palette extension */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Purchases', ico: '🛒', kind: 'view',
        action: () => goTo('purchases') },
      { label: 'New Purchase', ico: '＋', kind: 'action',
        action: () => openPurchaseForm() },
      { label: 'Go to Payments', ico: '💸', kind: 'view',
        action: () => goTo('payments') },
      { label: 'New Payment', ico: '＋', kind: 'action',
        action: () => openPaymentForm() },
      { label: 'Record Supplier Return', ico: '↩️', kind: 'action',
        action: () => openSupplierReturnForm() }
    ]);
  };

  /* ═════════════════════════════════════════════════════════════════════
     AMOUNT IN WORDS (used by voucher printing)
  ═════════════════════════════════════════════════════════════════════ */
  const ONES = ['', 'one','two','three','four','five','six','seven','eight',
    'nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen',
    'seventeen','eighteen','nineteen'];
  const TENS = ['', '', 'twenty','thirty','forty','fifty','sixty','seventy',
    'eighty','ninety'];

  function threeDigit(n) {
    n = Math.floor(n);
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)]
      + (n % 10 ? ' ' + ONES[n % 10] : '');
    return ONES[Math.floor(n / 100)] + ' hundred'
      + (n % 100 ? ' ' + threeDigit(n % 100) : '');
  }

  function amountInWords(amount) {
    const v = Math.round(NN(amount) * 100) / 100;
    if (v === 0) return 'zero rupees only';
    const rupees = Math.floor(v);
    const cents = Math.round((v - rupees) * 100);
    const parts = [];
    const crore = Math.floor(rupees / 10000000);
    const lakh = Math.floor((rupees % 10000000) / 100000);
    const thousand = Math.floor((rupees % 100000) / 1000);
    const hundred = rupees % 1000;
    if (crore) parts.push(threeDigit(crore) + ' crore');
    if (lakh) parts.push(threeDigit(lakh) + ' lakh');
    if (thousand) parts.push(threeDigit(thousand) + ' thousand');
    if (hundred) parts.push(threeDigit(hundred));
    let out = parts.join(' ') + ' rupees';
    if (cents) out += ' and ' + threeDigit(cents) + ' cents';
    return out + ' only';
  }
  window.amountInWords = amountInWords;

  /* CSS injection */
  (function injectCSS() {
    if (document.getElementById('_part6CSS')) return;
    const style = document.createElement('style');
    style.id = '_part6CSS';
    style.textContent = ''
      + '.alert-mini{padding:10px 14px;background:var(--accent-soft);'
      + 'border-radius:8px;font-size:11.5px;color:var(--accent-text);'
      + 'margin-top:10px;line-height:1.5}';
    document.head.appendChild(style);
  })();

  console.log('%c✅ Part 6 — Purchases & Payments loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Purchases · Payments (Bank/Cash/Cheque) · Supplier Returns · Voucher',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 7 — EXPENSES & CASH DRAWER
   Adds: Expenses with auto-categorisation, Bank fee tracking,
         Cash Drawer daybook (opening, transactions, closing),
         Expense trends & category breakdown.
   Depends on: Parts 1–6
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part7Loaded) return;
  window._part7Loaded = true;

  const expObj = id => arr(db.expenses).find(e => e.id === id);
  const cashTxObj = id => arr(db.cashTransactions).find(t => t.id === id);
  window.expObj = expObj;
  window.cashTxObj = cashTxObj;

  /* ═════════════════════════════════════════════════════════════════════
     AUTO-CATEGORISATION
  ═════════════════════════════════════════════════════════════════════ */
  const CATEGORY_KEYWORDS = {
    'Rent':                ['rent','lease','landlord','premises','building'],
    'Utilities':           ['electricity','water','gas','ceb','nelco','bill','utility','power'],
    'Internet & Phone':    ['internet','wifi','broadband','phone','mobile','dialog','mobitel','slt','airtel','hutch'],
    'Salaries':            ['salary','wage','payroll','staff','employee','bonus'],
    'Transport':           ['fuel','petrol','diesel','transport','delivery','courier','taxi','uber','pickme'],
    'Packaging':           ['box','carton','packaging','bag','wrapper','label'],
    'Marketing':           ['ad','advert','marketing','promo','facebook','google ads','banner'],
    'Office Supplies':     ['stationery','pen','paper','office','printer','toner'],
    'Repairs & Maintenance': ['repair','maintenance','fix','service','install'],
    'Bank Fees':           ['bank charge','bank fee','commission','service charge','cheque return'],
    'Taxes':               ['tax','vat','ssr','ird','revenue','customs'],
    'Insurance':           ['insurance','policy','premium','cover'],
    'Food & Beverage':     ['lunch','dinner','food','meal','tea','coffee','snack'],
    'Legal & Professional': ['legal','lawyer','audit','accountant','consulting','notary'],
    'Miscellaneous':       ['misc','other','general','various']
  };
  window.CATEGORY_KEYWORDS = CATEGORY_KEYWORDS;

  function suggestCategory(description) {
    if (!description) return null;
    const d = String(description).toLowerCase();
    const scores = {};
    Object.keys(CATEGORY_KEYWORDS).forEach(cat => {
      let score = 0;
      CATEGORY_KEYWORDS[cat].forEach(kw => {
        if (d.includes(kw)) score += (kw.length >= 5 ? 2 : 1);
      });
      if (score > 0) scores[cat] = score;
    });
    /* Also learn from history: same words past expenses */
    arr(db.expenses).forEach(e => {
      if (!e.category) return;
      const ed = String(e.description || '').toLowerCase();
      if (!ed) return;
      const words = d.split(/\s+/).filter(w => w.length >= 4);
      const shared = words.filter(w => ed.includes(w)).length;
      if (shared > 0) scores[e.category] = (scores[e.category] || 0) + shared;
    });
    const best = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
    return best ? best[0] : null;
  }
  window.suggestCategory = suggestCategory;

  /* ═════════════════════════════════════════════════════════════════════
     EXPENSES — list
  ═════════════════════════════════════════════════════════════════════ */
  let expState = {
    q: '', category: '', from: '', to: '', bankId: ''
  };
  window.expState = expState;

  function viewExpenses() {
    let rows = arr(db.expenses).slice();
    if (expState.q) {
      const q = expState.q.toLowerCase();
      rows = rows.filter(e =>
        (e.category || '').toLowerCase().includes(q)
        || (e.description || '').toLowerCase().includes(q)
        || (e.payee || '').toLowerCase().includes(q));
    }
    if (expState.category) {
      rows = rows.filter(e => e.category === expState.category);
    }
    if (expState.bankId) {
      if (expState.bankId === '_cash') rows = rows.filter(e => !e.bankAccountId);
      else rows = rows.filter(e => e.bankAccountId === expState.bankId);
    }
    if (expState.from) rows = rows.filter(e => e.date >= expState.from);
    if (expState.to) rows = rows.filter(e => e.date <= expState.to);
    rows.sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);

    const total = rows.reduce((a, e) => a + NN(e.amount), 0);
    const thisMonthTotal = arr(db.expenses)
      .filter(e => e.date.slice(0, 7) === thisMonth())
      .reduce((a, e) => a + NN(e.amount), 0);

    const categories = Array.from(new Set(arr(db.expenses)
      .map(e => e.category).filter(Boolean))).sort();

    return '<div class="kpi-strip">'
      + kpi('Total Expenses',
          money(arr(db.expenses).reduce((a, e) => a + NN(e.amount), 0)),
          arr(db.expenses).length + ' entries')
      + kpi('This Month', money(thisMonthTotal), monthName(thisMonth()))
      + kpi('Filtered', money(total), rows.length + ' matching')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📉 Expenses (' + rows.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportExpensesCSV()">⬇ CSV</button>'
      + '<button class="btn sm" onclick="viewExpenseTrend()">📊 Trend</button>'
      + '<button class="btn primary" onclick="openExpenseForm()">'
      + '＋ New Expense</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(expState.q) + '" '
      + 'oninput="expState.q=this.value;render()" '
      + 'placeholder="Category, description, payee"></label>'
      + '<label class="field">Category'
      + '<select onchange="expState.category=this.value;render()">'
      + '<option value="">All categories</option>'
      + categories.map(c => '<option value="' + esc(c) + '" '
          + (expState.category === c ? 'selected' : '') + '>'
          + esc(c) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Paid From'
      + '<select onchange="expState.bankId=this.value;render()">'
      + '<option value="">Any source</option>'
      + '<option value="_cash" '
      + (expState.bankId === '_cash' ? 'selected' : '')
      + '>💵 Cash</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '" '
          + (expState.bankId === b.id ? 'selected' : '') + '>'
          + esc(b.accountName || b.bankName) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(expState.from) + '" '
      + 'onchange="expState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(expState.to) + '" '
      + 'onchange="expState.to=this.value;render()"></label>'
      + '</div>'

      + (rows.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Date','Category','Description','Paid From','Amount','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + rows.map(e => {
            const bank = e.bankAccountId ? bankObj(e.bankAccountId) : null;
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showExpenseDetail(\''
              + e.id + '\')">'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'white-space:nowrap">' + dateFmt(e.date) + '</td>'
              + '<td style="padding:11px 12px">'
              + (e.category
                  ? '<span class="pill pill-soft">'
                    + esc(e.category) + '</span>'
                  : '—') + '</td>'
              + '<td style="padding:11px 12px"><strong>'
              + esc(e.description || '—') + '</strong>'
              + (e.payee
                  ? '<div style="font-size:11px;color:var(--text-3)">'
                    + esc(e.payee) + '</div>' : '')
              + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + (bank ? esc(bank.accountName || bank.bankName) : '💵 Cash')
              + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600">'
              + money(e.amount) + '</td>'
              + '<td style="padding:11px 12px" onclick="event.stopPropagation()">'
              + '<div style="display:flex;gap:4px">'
              + '<button class="btn sm" onclick="openExpenseForm(\''
              + e.id + '\')">✎</button>'
              + '<button class="btn sm danger" onclick="deleteExpense(\''
              + e.id + '\')">🗑</button>'
              + '</div></td></tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">📉</div>'
          + 'No expenses yet<br>'
          + '<button class="btn primary" style="margin-top:12px" '
          + 'onclick="openExpenseForm()">＋ Record First Expense</button></div>')
      + '</div>';
  }
  views.expenses = viewExpenses;
  window.viewExpenses = viewExpenses;

  /* ═════════════════════════════════════════════════════════════════════
     EXPENSES — form
  ═════════════════════════════════════════════════════════════════════ */
  function openExpenseForm(id) {
    if (!requirePerm('write')) return;
    const e = id ? expObj(id) : null;
    const categories = Array.from(new Set(
      arr(db.expenses).map(x => x.category).filter(Boolean)
    )).concat(Object.keys(CATEGORY_KEYWORDS));
    const uniqueCats = Array.from(new Set(categories)).sort();

    openModal(e ? '✎ Edit Expense' : '＋ New Expense',
      '<form onsubmit="saveExpense(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="eDate" type="date" required '
      + 'value="' + (e ? e.date : today()) + '"></label>'
      + '<label class="field">Category <span class="req">*</span>'
      + '<input name="eCategory" required list="expenseCatList" '
      + 'value="' + esc(e ? (e.category || '') : '') + '" '
      + 'placeholder="e.g. Rent, Utilities, Salaries">'
      + '<datalist id="expenseCatList">'
      + uniqueCats.map(c =>
          '<option value="' + esc(c) + '"></option>').join('')
      + '</datalist></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="eAmount" type="number" step="0.01" min="0.01" '
      + 'required value="' + (e ? NN(e.amount) : '') + '" autofocus></label>'
      + '<label class="field">Paid From <span class="req">*</span>'
      + '<select name="eBank">'
      + '<option value="_cash" '
      + (e && !e.bankAccountId ? 'selected' : '') + '>💵 Cash</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '" '
          + (e && e.bankAccountId === b.id ? 'selected' : '') + '>'
          + esc(b.accountName || b.bankName) + ' · '
          + esc(b.bankName) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Payee / Vendor'
      + '<input name="ePayee" value="'
      + esc(e ? (e.payee || '') : '') + '" '
      + 'placeholder="Who was paid"></label>'
      + '<label class="field">Reference'
      + '<input name="eReference" value="'
      + esc(e ? (e.reference || '') : '') + '" '
      + 'placeholder="Receipt / bill no."></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Description'
      + '<textarea name="eDescription" rows="2" '
      + 'oninput="onExpenseDescChange(this.value)">'
      + esc(e ? (e.description || '') : '') + '</textarea></label>'
      + '<div id="expenseSuggest" style="margin-top:8px"></div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (e ? 'Save Changes' : 'Record Expense') + '</button>'
      + '</div></form>', { wide: true });

    setTimeout(() => {
      if (e) return;
      const desc = document.querySelector('#modalWrap [name="eDescription"]');
      if (desc) desc.addEventListener('input', ev =>
        onExpenseDescChange(ev.target.value));
    }, 80);
  }
  window.openExpenseForm = openExpenseForm;

  function onExpenseDescChange(description) {
    const el = document.getElementById('expenseSuggest');
    if (!el) return;
    const catEl = document.querySelector('#modalWrap [name="eCategory"]');
    if (!description || !catEl) { el.innerHTML = ''; return; }
    const sug = suggestCategory(description);
    if (!sug || sug === catEl.value.trim()) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="alert-mini" style="cursor:pointer" '
      + 'onclick="document.querySelector(\'#modalWrap [name=&quot;eCategory&quot;]\')'
      + '.value=' + JSON.stringify(sug) + ';'
      + 'document.getElementById(\'expenseSuggest\').innerHTML=\'\'">'
      + '💡 Suggested category: <strong>' + esc(sug)
      + '</strong> — click to apply</div>';
  }
  window.onExpenseDescChange = onExpenseDescChange;

  function saveExpense(e, id) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const category = f.eCategory.value.trim();
    if (!category) { toast('Category required', 'error'); return; }
    const amount = NN(f.eAmount.value);
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }
    const bankValue = f.eBank.value;
    const bankAccountId = bankValue === '_cash' ? null : bankValue;

    /* Bank balance warning */
    if (bankAccountId && !id) {
      const bal = bankBalance(bankAccountId);
      if (bal - amount < 0) {
        if (!confirm('⚠ Bank balance will go negative.\n\n'
          + 'Current: ' + money(bal) + '\n'
          + 'Expense: ' + money(amount) + '\n'
          + 'After: ' + money(bal - amount) + '\n\nProceed anyway?')) {
          return;
        }
      }
    }

    const data = {
      date: f.eDate.value || today(),
      category: category,
      amount: amount,
      bankAccountId: bankAccountId,
      payee: f.ePayee.value.trim(),
      reference: f.eReference.value.trim(),
      description: f.eDescription.value.trim()
    };

    if (id) {
      const old = expObj(id);
      if (!old) return;
      Object.assign(old, data);
      old.updatedAt = nowISO();
      logActivity('EXPENSE_UPDATED', 'Expense', category, money(amount));
    } else {
      db.expenses.push(Object.assign({
        id: uid(), createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      }, data));
      /* Also add to cash drawer if paid via cash */
      if (!bankAccountId) {
        if (!Array.isArray(db.cashTransactions)) db.cashTransactions = [];
        db.cashTransactions.push({
          id: uid(),
          date: data.date,
          type: 'out',
          amount: amount,
          category: 'Expense · ' + category,
          reference: data.reference || '',
          notes: data.description || '',
          sourceType: 'expense',
          sourceId: db.expenses[db.expenses.length - 1].id,
          createdAt: nowISO()
        });
      }
      logActivity('EXPENSE_CREATED', 'Expense', category, money(amount));
    }

    save();
    closeModal();
    render();
    toast(id ? '✅ Expense updated' : '✅ Expense recorded', 'success');
  }
  window.saveExpense = saveExpense;

  function deleteExpense(id) {
    if (!requirePerm('delete')) return;
    const e = expObj(id);
    if (!e) return;
    confirmBox('Delete Expense?',
      'Remove ' + money(e.amount) + ' (' + e.category + ')?',
      () => {
        db.expenses = arr(db.expenses).filter(x => x.id !== id);
        db.cashTransactions = arr(db.cashTransactions)
          .filter(t => t.sourceId !== id);
        logActivity('EXPENSE_DELETED', 'Expense', e.category,
          money(e.amount));
        save();
        render();
        toast('Expense deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteExpense = deleteExpense;

  /* ═════════════════════════════════════════════════════════════════════
     EXPENSES — detail
  ═════════════════════════════════════════════════════════════════════ */
  function showExpenseDetail(id) {
    const e = expObj(id);
    if (!e) return;
    const bank = e.bankAccountId ? bankObj(e.bankAccountId) : null;

    openModal('📉 Expense — ' + esc(e.category),
      '<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">'
      + kpi('Amount', money(e.amount), '')
      + kpi('Date', dateFmt(e.date), '')
      + kpi('Paid From', bank
          ? (bank.accountName || bank.bankName) : '💵 Cash', '')
      + '</div>'
      + '<div class="detail-block">'
      + '<div class="detail-block-title">Details</div>'
      + detailRow('Category', e.category)
      + (e.payee ? detailRow('Payee', e.payee) : '')
      + (e.reference ? detailRow('Reference', e.reference) : '')
      + (e.description ? detailRow('Description', e.description) : '')
      + detailRow('Created', dateTimeFmt(e.createdAt))
      + '</div>'
      + '<div class="form-actions">'
      + '<button class="btn" onclick="closeModal();openExpenseForm(\''
      + id + '\')">✎ Edit</button>'
      + '<button class="btn danger" onclick="closeModal();'
      + 'deleteExpense(\'' + id + '\')">🗑 Delete</button>'
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.showExpenseDetail = showExpenseDetail;

  function exportExpensesCSV() {
    const rows = arr(db.expenses).map(e => [
      e.date, e.category || '', e.description || '', e.payee || '',
      NN(e.amount),
      e.bankAccountId
        ? (bankObj(e.bankAccountId)
            ? bankObj(e.bankAccountId).accountName : '') : 'Cash',
      e.reference || ''
    ]);
    download('expenses_' + today() + '.csv',
      toCSV(['Date','Category','Description','Payee','Amount','PaidFrom',
             'Reference'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' expenses', 'success');
  }
  window.exportExpensesCSV = exportExpensesCSV;

  /* ═════════════════════════════════════════════════════════════════════
     EXPENSE TREND VIEW
  ═════════════════════════════════════════════════════════════════════ */
  function viewExpenseTrend() {
    const months = lastMonths(12);
    const monthly = months.map(m => ({
      month: m,
      total: arr(db.expenses)
        .filter(e => e.date.slice(0, 7) === m)
        .reduce((a, e) => a + NN(e.amount), 0),
      count: arr(db.expenses).filter(e => e.date.slice(0, 7) === m).length
    }));

    /* Category breakdown */
    const byCat = {};
    arr(db.expenses).forEach(e => {
      const c = e.category || 'Uncategorised';
      if (!byCat[c]) byCat[c] = { total: 0, count: 0 };
      byCat[c].total += NN(e.amount);
      byCat[c].count++;
    });
    const cats = Object.entries(byCat)
      .map(([name, d]) => ({ name: name, total: d.total, count: d.count }))
      .sort((a, b) => b.total - a.total);
    const maxCat = Math.max(1, ...cats.map(c => c.total));
    const maxMonthly = Math.max(1, ...monthly.map(m => m.total));

    openModal('📊 Expense Trend',
      '<div class="section-title">12-Month Total</div>'
      + '<div style="display:grid;grid-template-columns:'
      + 'repeat(12,1fr);gap:4px;margin-bottom:20px">'
      + monthly.map(m =>
          '<div style="text-align:center">'
          + '<div style="height:120px;display:flex;align-items:flex-end;'
          + 'justify-content:center">'
          + '<div style="width:70%;background:var(--accent);'
          + 'border-radius:4px 4px 0 0;height:'
          + (m.total / maxMonthly * 120).toFixed(0) + 'px"></div></div>'
          + '<div style="font-size:10px;color:var(--text-3);'
          + 'margin-top:4px">' + monthLabel(m.month) + '</div>'
          + '<div style="font-size:10px;font-weight:700;'
          + 'color:var(--text-2)">'
          + (m.total ? fmtCompact(m.total) : '—') + '</div>'
          + '</div>').join('')
      + '</div>'
      + '<div class="section-title">By Category ('
      + cats.length + ')</div>'
      + (cats.length
          ? cats.map(c =>
              '<div style="margin-bottom:12px">'
              + '<div style="display:flex;justify-content:space-between;'
              + 'font-size:12.5px;margin-bottom:4px">'
              + '<span><strong>' + esc(c.name) + '</strong> · '
              + c.count + ' entries</span>'
              + '<span>' + money(c.total) + '</span></div>'
              + '<div style="height:8px;background:var(--surface-3);'
              + 'border-radius:4px;overflow:hidden">'
              + '<div style="height:100%;width:'
              + (c.total / maxCat * 100).toFixed(1) + '%;background:'
              + 'linear-gradient(90deg,var(--accent),var(--pink))"></div>'
              + '</div></div>').join('')
          : '<div class="empty">No expenses yet</div>')
      + '<div class="form-actions">'
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.viewExpenseTrend = viewExpenseTrend;

  /* ═════════════════════════════════════════════════════════════════════
     CASH DRAWER
  ═════════════════════════════════════════════════════════════════════ */
  let cashState = { date: today() };
  window.cashState = cashState;

  function cashDrawerTransactions(date) {
    return arr(db.cashTransactions)
      .filter(t => t.date === date)
      .sort((a, b) =>
        (a.createdAt || '') < (b.createdAt || '') ? -1 : 1);
  }

  /* Cash balance for a date = opening + all in − all out for that day, plus carry-forward */
  function cashBalanceForDate(date) {
    const opening = NN(db.settings.openingCash);
    let bal = opening;
    /* All cash transactions up to and including date */
    arr(db.cashTransactions)
      .filter(t => t.date <= date)
      .forEach(t => {
        bal += (t.type === 'in' ? NN(t.amount) : -NN(t.amount));
      });
    /* Receipts marked Cash and NOT already in cashTransactions (older ones) */
    const existingReceiptIds = new Set(
      arr(db.cashTransactions)
        .filter(t => t.sourceType === 'receipt' && t.sourceId)
        .map(t => t.sourceId)
    );
    arr(db.receipts)
      .filter(r => r.method === 'Cash'
        && r.date <= date
        && !existingReceiptIds.has(r.id))
      .forEach(r => { bal += NN(r.amount); });
    /* Expenses already added via cashTransactions so skip here */
    return bal;
  }
  window.cashBalanceForDate = cashBalanceForDate;

  function viewCashDrawer() {
    const date = cashState.date;
    const txns = cashDrawerTransactions(date);
    const totalIn = txns.filter(t => t.type === 'in')
      .reduce((a, t) => a + NN(t.amount), 0);
    const totalOut = txns.filter(t => t.type === 'out')
      .reduce((a, t) => a + NN(t.amount), 0);
    const opening = cashBalanceForDate(shiftDate(date, -1));
    const closing = opening + totalIn - totalOut;

    return '<div class="kpi-strip">'
      + kpi('Opening Balance', money(opening), 'Carried forward')
      + kpi('Today In', money(totalIn), txns.filter(t => t.type === 'in').length + ' entries')
      + kpi('Today Out', money(totalOut), txns.filter(t => t.type === 'out').length + ' entries')
      + kpi('Closing Balance', money(closing), dateFmt(date))
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>💵 Cash Drawer — '
      + dateFmt(date) + '</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
      + '<button class="btn sm" onclick="cashDrawerPrevDay()">‹ Prev</button>'
      + '<input type="date" value="' + date + '" '
      + 'onchange="cashState.date=this.value;render()" '
      + 'style="padding:7px 10px;font-size:12.5px;width:150px">'
      + '<button class="btn sm" onclick="cashDrawerNextDay()">Next ›</button>'
      + '<button class="btn sm" onclick="cashState.date=today();render()">'
      + 'Today</button>'
      + '<button class="btn primary" onclick="openCashForm(\'in\')">'
      + '＋ Cash In</button>'
      + '<button class="btn danger" onclick="openCashForm(\'out\')">'
      + '－ Cash Out</button>'
      + '</div></div>'

      + '<div style="background:var(--surface-2);border-radius:10px;'
      + 'padding:14px 18px;margin-bottom:14px;font-size:12.5px;'
      + 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">'
      + '<div><span style="color:var(--text-3)">Opening</span> '
      + '<strong>' + money(opening) + '</strong></div>'
      + '<div><span style="color:var(--green)">+ In</span> '
      + '<strong>' + money(totalIn) + '</strong></div>'
      + '<div><span style="color:var(--red)">− Out</span> '
      + '<strong>' + money(totalOut) + '</strong></div>'
      + '</div>'

      + (txns.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Time','Type','Category / Ref','Notes','Amount','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + txns.map(t =>
              '<tr style="border-bottom:1px solid var(--border-2)">'
              + '<td style="padding:10px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + (t.createdAt
                  ? new Date(t.createdAt).toLocaleTimeString('en-GB',
                      { hour: '2-digit', minute: '2-digit' })
                  : '—') + '</td>'
              + '<td style="padding:10px 12px">'
              + '<span class="pill ' + (t.type === 'in'
                  ? 'pill-ok' : 'pill-danger') + '">'
              + (t.type === 'in' ? '↓ In' : '↑ Out') + '</span></td>'
              + '<td style="padding:10px 12px">'
              + esc(t.category || '—')
              + (t.reference
                  ? '<div style="font-family:var(--mono);font-size:11px;'
                    + 'color:var(--text-3)">' + esc(t.reference) + '</div>'
                  : '') + '</td>'
              + '<td style="padding:10px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">' + esc(t.notes || '') + '</td>'
              + '<td style="padding:10px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600;'
              + 'color:' + (t.type === 'in' ? 'var(--green)'
                  : 'var(--red)') + '">'
              + (t.type === 'in' ? '+' : '−')
              + money(t.amount) + '</td>'
              + '<td style="padding:10px 12px">'
              + '<button class="btn sm danger" onclick="deleteCashTx(\''
              + t.id + '\')">🗑</button></td>'
              + '</tr>').join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">💵</div>'
          + 'No cash transactions on ' + dateFmt(date)
          + '<br><span style="font-size:11px">Use Cash In / Cash Out '
          + 'buttons above to record manual entries.</span></div>')
      + '</div>';
  }
  views.cashDrawer = viewCashDrawer;
  window.viewCashDrawer = viewCashDrawer;

  function cashDrawerPrevDay() {
    cashState.date = shiftDate(cashState.date, -1);
    render();
  }
  window.cashDrawerPrevDay = cashDrawerPrevDay;

  function cashDrawerNextDay() {
    cashState.date = shiftDate(cashState.date, 1);
    render();
  }
  window.cashDrawerNextDay = cashDrawerNextDay;

  /* ═════════════════════════════════════════════════════════════════════
     CASH TRANSACTION — form
  ═════════════════════════════════════════════════════════════════════ */
  function openCashForm(type) {
    if (!requirePerm('write')) return;
    openModal(type === 'in' ? '＋ Cash In' : '－ Cash Out',
      '<form onsubmit="saveCashTx(event,\'' + type + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="cDate" type="date" required '
      + 'value="' + cashState.date + '"></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="cAmount" type="number" step="0.01" min="0.01" '
      + 'required autofocus></label>'
      + '<label class="field">Category / Reason'
      + '<input name="cCategory" list="cashCatList" '
      + 'placeholder="e.g. Petty cash, Owner withdrawal">'
      + '<datalist id="cashCatList">'
      + ['Petty cash','Owner withdrawal','Owner capital','Change given',
         'Bank deposit','Bank withdrawal','Misc'].map(c =>
          '<option value="' + c + '"></option>').join('')
      + '</datalist></label>'
      + '<label class="field">Reference'
      + '<input name="cReference" placeholder="Optional"></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="cNotes" rows="2"></textarea></label>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn ' + (type === 'in'
          ? 'primary' : 'danger') + '">'
      + (type === 'in' ? 'Add Cash' : 'Remove Cash') + '</button>'
      + '</div></form>', { wide: true });
  }
  window.openCashForm = openCashForm;

  function saveCashTx(e, type) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const amount = NN(f.cAmount.value);
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }

    /* Warn if taking out more than balance */
    if (type === 'out') {
      const bal = cashBalanceForDate(f.cDate.value || today());
      if (bal - amount < 0) {
        if (!confirm('⚠ Cash drawer will go negative.\n\n'
          + 'Current: ' + money(bal) + '\n'
          + 'Out: ' + money(amount) + '\n'
          + 'After: ' + money(bal - amount) + '\n\nProceed anyway?')) {
          return;
        }
      }
    }

    db.cashTransactions.push({
      id: uid(),
      date: f.cDate.value || today(),
      type: type,
      amount: amount,
      category: f.cCategory.value.trim(),
      reference: f.cReference.value.trim(),
      notes: f.cNotes.value.trim(),
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    });
    logActivity('CASH_' + type.toUpperCase(), 'Cash',
      f.cCategory.value.trim(), money(amount));
    save();
    closeModal();
    cashState.date = f.cDate.value || today();
    render();
    toast('✅ Cash ' + (type === 'in' ? 'received' : 'removed'),
      'success');
  }
  window.saveCashTx = saveCashTx;

  function deleteCashTx(id) {
    if (!requirePerm('delete')) return;
    const t = cashTxObj(id);
    if (!t) return;
    if (t.sourceType) {
      toast('Auto-generated from ' + t.sourceType
        + ' — delete that record instead', 'warn');
      return;
    }
    confirmBox('Delete Cash Transaction?',
      'Remove ' + money(t.amount) + ' (' + t.category + ')?',
      () => {
        db.cashTransactions = arr(db.cashTransactions)
          .filter(x => x.id !== id);
        logActivity('CASH_DELETED', 'Cash',
          t.category || '', money(t.amount));
        save();
        render();
        toast('Deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteCashTx = deleteCashTx;

  /* ═════════════════════════════════════════════════════════════════════
     HOOK RECEIPTS (Cash method) → cashTransactions
     When a receipt is marked Cash, it should auto-append to the drawer.
  ═════════════════════════════════════════════════════════════════════ */
  const origSaveReceipt = window.saveReceipt;
  if (typeof origSaveReceipt === 'function'
    && !origSaveReceipt.__part7Patched) {
    const patched = function (e, id) {
      const custId = e && e.target
        ? e.target.rCustomer.value : null;
      const method = e && e.target
        ? e.target.rMethod.value : null;
      const amount = e && e.target
        ? NN(e.target.rAmount.value) : 0;
      const date = e && e.target
        ? (e.target.rDate.value || today()) : today();
      const ref = e && e.target
        ? e.target.rReference.value.trim() : '';

      /* Pre-check to find the receipt object created before add */
      const before = arr(db.receipts).length;
      const r = origSaveReceipt.apply(this, arguments);

      /* After save, if a new receipt was added and method is Cash,
         append a cash transaction */
      if (!id && method === 'Cash' && db.receipts.length > before) {
        const created = db.receipts[db.receipts.length - 1];
        if (created && !arr(db.cashTransactions)
            .some(t => t.sourceId === created.id)) {
          db.cashTransactions.push({
            id: uid(),
            date: date,
            type: 'in',
            amount: amount,
            category: 'Receipt',
            reference: ref,
            notes: 'Customer: '
              + (custObj(custId) ? custObj(custId).name : ''),
            sourceType: 'receipt',
            sourceId: created.id,
            createdAt: nowISO()
          });
          save();
        }
      }
      return r;
    };
    patched.__part7Patched = true;
    window.saveReceipt = patched;
  }

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="expenses"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const group = '<div class="nav-group" data-group="accounting">'
      + '<div class="nav-label">Accounting</div>'
      + item('expenses', '📉', 'Expenses')
      + item('cashDrawer', '💵', 'Cash Drawer')
      + '</div>';

    /* Insert after Purchases group */
    const purchasesGroup = nav.querySelector('[data-view="payments"]');
    if (purchasesGroup) {
      purchasesGroup.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    expenses: 'Expenses',
    cashDrawer: 'Cash Drawer'
  });

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Expenses', ico: '📉', kind: 'view',
        action: () => goTo('expenses') },
      { label: 'New Expense', ico: '＋', kind: 'action',
        action: () => openExpenseForm() },
      { label: 'Go to Cash Drawer', ico: '💵', kind: 'view',
        action: () => goTo('cashDrawer') },
      { label: 'Cash In', ico: '↓', kind: 'action',
        action: () => openCashForm('in') },
      { label: 'Cash Out', ico: '↑', kind: 'action',
        action: () => openCashForm('out') }
    ]);
  };

  console.log('%c✅ Part 7 — Expenses & Cash Drawer loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Expenses · Auto-categorisation · Cash Drawer daybook',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 8 — CHEQUES
   Adds: Cheque Books · Own Leaves · Customer Cheques · Endorsement
         Splits · Bounce recovery · Deferred bank deduction
   Depends on: Parts 1–7
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part8Loaded) return;
  window._part8Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════════════════ */
  const bookObj = id => arr(db.chequeBooks).find(b => b.id === id);
  const leafObj = id => arr(db.chequeLeaves).find(l => l.id === id);
  const custChequeObj = id => arr(db.customerCheques).find(c => c.id === id);
  window.bookObj = bookObj;
  window.leafObj = leafObj;
  window.custChequeObj = custChequeObj;

  /* Customer cheque statuses */
  const CUST_CHEQUE_STATUS = {
    'In Hand':     { label: 'In Hand',     cls: 'pill-soft' },
    'Deposited':   { label: 'Deposited',   cls: 'pill-warn' },
    'Issued':      { label: 'Issued',      cls: 'pill-info' },
    'Cleared':     { label: 'Cleared',     cls: 'pill-ok' },
    'Bounced':     { label: 'Bounced',     cls: 'pill-danger' },
    'Stopped':     { label: 'Stopped',     cls: 'pill-muted' },
    'Settled':     { label: 'Settled',     cls: 'pill-ok' }
  };
  window.CUST_CHEQUE_STATUS = CUST_CHEQUE_STATUS;

  const LEAF_STATUS = {
    'Available': { label: 'Available', cls: 'pill-ok' },
    'Issued':    { label: 'Issued',    cls: 'pill-info' },
    'Cleared':   { label: 'Cleared',   cls: 'pill-soft' },
    'Bounced':   { label: 'Bounced',   cls: 'pill-danger' },
    'Stopped':   { label: 'Stopped',   cls: 'pill-muted' }
  };
  window.LEAF_STATUS = LEAF_STATUS;

  /* ═════════════════════════════════════════════════════════════════════
     SECTION — CHEQUE BOOKS VIEW
  ═════════════════════════════════════════════════════════════════════ */
  let bookState = { q: '', bankId: '' };
  window.bookState = bookState;

  function viewChequeBooks() {
    let rows = arr(db.chequeBooks).slice();
    if (bookState.bankId) {
      rows = rows.filter(b => b.bankId === bookState.bankId);
    }
    rows.sort((a, b) => (b.createdAt || '') < (a.createdAt || '') ? -1 : 1);

    return '<div class="kpi-strip">'
      + kpi('Cheque Books', rows.length, 'Registered')
      + kpi('Total Leaves',
          arr(db.chequeLeaves).length, 'Across all books')
      + kpi('Available',
          arr(db.chequeLeaves).filter(l => l.status === 'Available').length,
          'Ready to issue')
      + kpi('Issued',
          arr(db.chequeLeaves).filter(l => l.status === 'Issued').length,
          'Outstanding')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📚 Cheque Books (' + rows.length + ')</h3>'
      + '<button class="btn primary" onclick="openChequeBookForm()">'
      + '＋ Add Cheque Book</button></div>'
      + '<label class="field" style="max-width:280px;margin-bottom:14px">'
      + 'Filter by bank'
      + '<select onchange="bookState.bankId=this.value;render()">'
      + '<option value="">All banks</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '" '
          + (bookState.bankId === b.id ? 'selected' : '') + '>'
          + esc(b.accountName || b.bankName) + '</option>').join('')
      + '</select></label>'

      + (rows.length
        ? rows.map(b => {
            const leaves = arr(db.chequeLeaves)
              .filter(l => l.bookId === b.id);
            const counts = {
              available: leaves.filter(l => l.status === 'Available').length,
              issued: leaves.filter(l => l.status === 'Issued').length,
              cleared: leaves.filter(l => l.status === 'Cleared').length,
              bounced: leaves.filter(l => l.status === 'Bounced').length
            };
            const bank = b.bankId ? bankObj(b.bankId) : null;
            return '<div class="book-card">'
              + '<div style="display:flex;justify-content:space-between;'
              + 'align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:10px">'
              + '<div>'
              + '<div style="font-weight:700;font-size:14px">'
              + (bank ? esc(bank.bankName) : '—') + ' · Book '
              + esc(b.bookNo || '—') + '</div>'
              + '<div style="font-size:11.5px;color:var(--text-3);'
              + 'margin-top:4px">Range ' + esc(b.startNo) + ' – '
              + esc(b.endNo) + ' · ' + leaves.length + ' leaves</div>'
              + '</div>'
              + '<div style="display:flex;gap:6px">'
              + '<button class="btn sm" onclick="toggleBookExpand(\''
              + b.id + '\')">👁 Leaves</button>'
              + (counts.issued === 0 && counts.cleared === 0 && counts.bounced === 0
                  ? '<button class="btn sm danger" onclick="deleteChequeBook(\''
                    + b.id + '\')">🗑</button>'
                  : '')
              + '</div></div>'
              + '<div style="display:grid;grid-template-columns:'
              + 'repeat(4,1fr);gap:8px;font-size:12px">'
              + '<div><span style="color:var(--green);font-weight:700">'
              + counts.available + '</span> '
              + '<span style="color:var(--text-3)">available</span></div>'
              + '<div><span style="color:var(--accent);font-weight:700">'

  function saveChequeBook(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const bankId = f.bookBank.value;
    const bank = bankObj(bankId);
    if (!bank) { toast('Bank required', 'error'); return; }
    const start = NN(f.bookStart.value);
    const end = NN(f.bookEnd.value);
    if (!start || !end || end < start) {
      toast('Invalid leaf range', 'error');
      return;
    }
    if (end - start > 500) {
      toast('Range too large (max 500 leaves per book)', 'error');
      return;
    }
    /* Check for overlaps */
    const overlap = arr(db.chequeBooks).some(b =>
      b.bankId === bankId
      && !(end < b.startNo || start > b.endNo));
    if (overlap) {
      toast('Leaf range overlaps with an existing book', 'error');
      return;
    }

    const bookId = uid();
    db.chequeBooks.push({
      id: bookId,
      bankId: bankId,
      bankName: bank.bankName,
      bookNo: f.bookNo.value.trim(),
      startNo: start,
      endNo: end,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    });
    /* Generate leaves */
    for (let n = start; n <= end; n++) {
      db.chequeLeaves.push({
        id: uid(),
        bookId: bookId,
        bankId: bankId,
        bankName: bank.bankName,
        leafNo: String(n),
        status: 'Available',
        createdAt: nowISO()
      });
    }
    logActivity('CHEQUE_BOOK_CREATED', 'Cheque Book',
      bank.bankName + ' ' + (start + '–' + end),
      (end - start + 1) + ' leaves');
    save();
    closeModal();
    render();
    toast('✅ Book registered with ' + (end - start + 1) + ' leaves',
      'success');
  }
  window.saveChequeBook = saveChequeBook;

  function deleteChequeBook(id) {
    if (!requirePerm('delete')) return;
    const b = bookObj(id);
    if (!b) return;
    const used = arr(db.chequeLeaves)
      .filter(l => l.bookId === id && l.status !== 'Available').length;
    if (used > 0) {
      toast('Cannot delete — ' + used + ' leaves already used', 'error');
      return;
    }
    confirmBox('Delete Cheque Book?',
      'Remove book and all ' + arr(db.chequeLeaves)
        .filter(l => l.bookId === id).length + ' unused leaves?',
      () => {
        db.chequeBooks = arr(db.chequeBooks).filter(x => x.id !== id);
        db.chequeLeaves = arr(db.chequeLeaves)
          .filter(x => x.bookId !== id);
        logActivity('CHEQUE_BOOK_DELETED', 'Cheque Book',
          b.bankName + ' ' + b.bookNo, '');
        save();
        render();
        toast('Book deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }

  function saveCustomerCheque(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const customerId = f.ccCustomer.value;
    const customer = custObj(customerId);
    if (!customer) { toast('Customer required', 'error'); return; }
    const chequeNo = f.ccNo.value.trim();
    const amount = NN(f.ccAmount.value);
    if (!chequeNo) { toast('Cheque number required', 'error'); return; }
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }

    /* Duplicate cheque warning */
    const dupe = arr(db.customerCheques).find(c =>
      c.customerId === customerId
      && (c.chequeNo || '').toLowerCase() === chequeNo.toLowerCase()
      && c.status !== 'Bounced');
    if (dupe) {
      if (!confirm('⚠ Cheque #' + chequeNo + ' from ' + customer.name
        + ' already recorded on ' + dateFmt(dupe.receivedDate)
        + ' (' + dupe.status + ').\n\nProceed anyway?')) return;
    }

    /* Credit limit check for cheques */
    const outstandingCheques = arr(db.customerCheques)
      .filter(c => c.customerId === customerId
        && (c.status === 'In Hand' || c.status === 'Issued'))
      .reduce((a, c) => a + NN(c.amount), 0);
    const newOutstanding = outstandingCheques + amount;
    if (NN(customer.chequeLimit) > 0
      && newOutstanding > NN(customer.chequeLimit)) {
      if (!confirm('⚠ Cheque limit exceeded for ' + customer.name + '.\n\n'
        + 'Current outstanding cheques: ' + money(outstandingCheques) + '\n'
        + 'This cheque: ' + money(amount) + '\n'
        + 'New total: ' + money(newOutstanding) + '\n'
        + 'Limit: ' + money(customer.chequeLimit) + '\n\nProceed anyway?')) {
        return;
      }
    }

    const cheque = {
      id: uid(),
      customerId: customerId,
      customerName: customer.name,
      chequeNo: chequeNo,
      bank: f.ccBank.value.trim(),
      amount: amount,
      receivedDate: f.ccReceived.value || today(),
      dueDate: f.ccDue.value || today(),
      status: 'In Hand',
      splits: [],
      notes: f.ccNotes.value.trim(),
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    };
    db.customerCheques.push(cheque);
    logActivity('CHEQUE_RECEIVED', 'Customer Cheque',
      customer.name + ' · #' + chequeNo, money(amount));
    save();
    closeModal();
    render();
    toast('✅ Cheque received — customer balance updated', 'success');
  }
  window.saveCustomerCheque = saveCustomerCheque;

  function showCustomerChequeDetail(id) {
    const c = custChequeObj(id);
    if (!c) return;
    const statusInfo = CUST_CHEQUE_STATUS[c.status]
      || { label: c.status, cls: '' };
    const splits = arr(c.splits);
    const settled = arr(db.chequeSettlements)
      .filter(s => s.chequeId === id)
      .reduce((a, s) => a + NN(s.amount), 0);
    const unallocated = NN(c.amount) - splits
      .reduce((a, s) => a + NN(s.amount), 0);

    let actions = '';
    if (c.status === 'In Hand') {
      actions += '<button class="btn primary" '
        + 'onclick="closeModal();depositCheque(\'' + id + '\')">'
        + '🏦 Deposit to Bank</button>'
        + '<button class="btn" '
        + 'onclick="closeModal();endorseChequeToSupplier(\'' + id + '\')">'
        + '↪ Endorse to Supplier</button>'
        + '<button class="btn" '
        + 'onclick="closeModal();splitCustomerCheque(\'' + id + '\')">'
        + '✂ Split</button>'
        + '<button class="btn danger" '
        + 'onclick="closeModal();bounceCustomerCheque(\'' + id + '\')">'
        + '⛔ Mark Bounced</button>';
    } else if (c.status === 'Deposited') {
      actions += '<button class="btn primary" '
        + 'onclick="closeModal();clearCustomerCheque(\'' + id + '\')">'
        + '✅ Mark Cleared</button>'
        + '<button class="btn danger" '
        + 'onclick="closeModal();bounceCustomerCheque(\'' + id + '\')">'
        + '⛔ Bounced</button>';
    } else if (c.status === 'Issued') {
      actions += '<button class="btn primary" '
        + 'onclick="closeModal();clearCustomerCheque(\'' + id + '\')">'
        + '✅ Mark Cleared</button>'
        + '<button class="btn danger" '
        + 'onclick="closeModal();bounceCustomerCheque(\'' + id + '\')">'
        + '⛔ Bounced</button>';
    } else if (c.status === 'Bounced') {
      actions += '<button class="btn primary" '
        + 'onclick="closeModal();openSettlementForm(\'' + id + '\')">'
        + '💰 Record Recovery</button>';
    }

    /* Show splits table if any */
    let splitsBlock = '';
    if (splits.length) {
      splitsBlock = '<div class="detail-block" style="margin-top:14px">'
        + '<div class="detail-block-title">Allocations ('
        + splits.length + ')</div>'
        + splits.map(s => {
          const sup = supName(s.supplierId);
          return '<div style="display:flex;justify-content:space-between;'
            + 'padding:7px 0;font-size:12.5px;border-bottom:1px dashed '
            + 'var(--border-2)">'
            + '<span>' + esc(sup) + ' · '
            + dateFmt(s.date) + (s.status
                ? ' <span class="pill pill-soft">' + s.status + '</span>'
                : '') + '</span>'
            + '<strong>' + money(s.amount) + '</strong></div>';
        }).join('')
        + (unallocated > 0.01
            ? '<div style="display:flex;justify-content:space-between;'
              + 'padding:7px 0;font-size:12.5px;color:var(--amber)">'
              + '<span>Unallocated</span>'
              + '<strong>' + money(unallocated) + '</strong></div>'
            : '')
        + '</div>';
    }

    /* Settlements (for bounced) */
    let settleBlock = '';
    if (c.status === 'Bounced' && settled > 0) {
      const list = arr(db.chequeSettlements)
        .filter(s => s.chequeId === id);
      settleBlock = '<div class="detail-block" style="margin-top:14px">'
        + '<div class="detail-block-title">Recoveries ('
        + list.length + ')</div>'
        + list.map(s =>
            '<div style="display:flex;justify-content:space-between;'
            + 'padding:6px 0;font-size:12.5px;border-bottom:1px dashed '
            + 'var(--border-2)">'
            + '<span>' + dateFmt(s.date) + ' · ' + esc(s.method)
            + (s.reference ? ' · ' + esc(s.reference) : '') + '</span>'
            + '<strong>' + money(s.amount) + '</strong></div>').join('')
        + '</div>';
    }

    openModal('🧾 Cheque #' + esc(c.chequeNo || '—'),
      '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">'
      + kpi('Amount', money(c.amount), '')
      + kpi('Status', statusInfo.label, '')
      + kpi('Received', dateFmt(c.receivedDate), '')
      + kpi('Due', dateFmt(c.dueDate), '')
      + '</div>'

      + '<div class="detail-block" style="margin-bottom:14px">'
      + '<div class="detail-block-title">Details</div>'
      + detailRow('Customer', c.customerName)
      + detailRow('Bank', c.bank || '—')
      + (c.bouncedDate
          ? detailRow('Bounced', dateFmt(c.bouncedDate)) : '')
      + (c.bounceReason
          ? detailRow('Bounce Reason', c.bounceReason) : '')
      + (c.issuedToSupplierId
          ? detailRow('Issued To', supName(c.issuedToSupplierId)) : '')
      + (c.depositedToBankId
          ? detailRow('Deposited To',
              bankObj(c.depositedToBankId)
                ? bankObj(c.depositedToBankId).bankName : '—') : '')
      + (c.clearedDate
          ? detailRow('Cleared', dateFmt(c.clearedDate)) : '')
      + (c.notes ? detailRow('Notes', c.notes) : '')
      + (c.status === 'Bounced' && settled > 0
          ? detailRow('Recovered', money(settled))
            + detailRow('Still Owed',
                money(Math.max(0, NN(c.amount) - settled)))
          : '')
      + '</div>'

      + splitsBlock
      + settleBlock

      + (actions
          ? '<div class="form-actions" style="flex-wrap:wrap;'

      + '<button class="btn primary" onclick="closeModal()">Close</button>'

  /* ═════════════════════════════════════════════════════════════════════

  function depositCheque(id) {
    if (!requirePerm('write')) return;
    const c = custChequeObj(id);
    if (!c) return;
    if (!arr(db.banks).length) { toast('No banks to deposit to', 'warn'); return; }
    openModal('🏦 Deposit Cheque to Bank',
      '<form onsubmit="confirmDepositCheque(event,\'' + id + '\')">'
      + '<div class="alert-mini">Cheque #' + esc(c.chequeNo)
      + ' · ' + money(c.amount) + '</div>'

    const date = e.target.depDate.value || today();

    logActivity('CHEQUE_DEPOSITED', 'Customer Cheque',

  function clearCustomerCheque(id) {
    if (!requirePerm('write')) return;
    const c = custChequeObj(id);
    if (!c) return;
    confirmBox('Mark Cheque Cleared?',
      'Cheque #' + c.chequeNo + ' · ' + money(c.amount)
      + '\n\nThis confirms the cheque has cleared the bank.',
      () => {
        c.status = 'Cleared';
        c.clearedDate = today();
        /* If deposited to a bank, add a bank transaction */
        if (c.depositedToBankId) {
          if (!Array.isArray(db.bankTransactions)) db.bankTransactions = [];
          /* Add a deposit transaction if not already recorded */
          const exists = arr(db.bankTransactions).some(t =>
            t.chequeId === c.id && t.type === 'deposit');
          if (!exists) {
            db.bankTransactions.push({
              id: uid(),
              bankAccountId: c.depositedToBankId,
              date: today(),
              type: 'deposit',
              amount: NN(c.amount),
              reference: 'CHQ-' + c.chequeNo,
              chequeId: c.id,
              description: 'Customer cheque cleared — ' + c.customerName,
              createdAt: nowISO()
            });
          }
        }
        logActivity('CHEQUE_CLEARED', 'Customer Cheque',
          '#' + c.chequeNo, money(c.amount));
        save();
        render();
        toast('✅ Cheque cleared', 'success');
      }, { confirmLabel: 'Mark Cleared', danger: false });

  window.clearCustomerCheque = clearCustomerCheque;

  function bounceCustomerCheque(id) {
    if (!requirePerm('write')) return;
    const c = custChequeObj(id);
    if (!c) return;
    openModal('⛔ Mark Cheque Bounced',
      '<div class="alert-mini" style="background:var(--red-soft);'
      + 'color:var(--red)">'
      + '⚠ Marking this cheque bounced will restore the customer\'s '
      + 'balance by ' + money(c.amount)
      + '. They will owe this amount again.</div>'
      + '<form onsubmit="confirmBounceCheque(event,\'' + id + '\')">'
      + '<label class="field" style="margin-top:14px">Bounce Reason'
      + '<select name="bReason" required>'
      + ['Insufficient Funds','Signature Mismatch','Account Closed',
         'Payment Stopped','Refer to Drawer','Post-Dated','Technical Error',
         'Other'].map(r =>
          '<option value="' + r + '">' + r + '</option>').join('')
      + '</select></label>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="bNotes" rows="2"></textarea></label>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn danger">Confirm Bounce</button>'
      + '</div></form>');
  }
  window.bounceCustomerCheque = bounceCustomerCheque;

  function confirmBounceCheque(e, id) {
    e.preventDefault();
    const c = custChequeObj(id);
    if (!c) return;
    const reason = e.target.bReason.value;
    const notes = e.target.bNotes.value.trim();

    c.status = 'Bounced';
    c.bouncedDate = today();
    c.bounceReason = reason;
    c.bounceNotes = notes;

    /* If this cheque was issued to a supplier, reverse that too */
    if (c.issuedToSupplierId) {
      /* Mark the payment as reversed if exists */
      const payment = arr(db.payments).find(p =>
        arr(p.allocations).some(a =>
          a.chequeId === c.id)
        || (p.chequeNo === c.chequeNo && p.supplierId === c.issuedToSupplierId)
      );
      if (payment) {
        payment.fullyReversed = true;
        payment.reversedAt = nowISO();
        payment.reversedReason = 'Customer cheque bounced: ' + reason;
      }
    }

    /* If deposited to a bank, reverse that deposit */
    if (c.depositedToBankId) {
      const deposit = arr(db.bankTransactions).find(t =>
        t.chequeId === c.id && t.type === 'deposit');
      if (deposit) {
        deposit.status = 'reversed';
        deposit.reversedAt = nowISO();
        deposit.reversedReason = 'Cheque bounced';
      }
    }

    logActivity('CHEQUE_BOUNCED', 'Customer Cheque',
      '#' + c.chequeNo + ' (' + c.customerName + ')',
      reason + ' · ' + money(c.amount));
    save();
    closeModal();
    render();
    toast('⛔ Cheque bounced — customer balance restored', 'warn', 5000);
  }
  window.confirmBounceCheque = confirmBounceCheque;

      + '<br>Endorsing passes this cheque to a supplier to settle '
      + 'your payable. Customer balance stays reduced.</div>'
      + '<form onsubmit="confirmEndorse(event,\'' + chequeId + '\')">'
      + '<label class="field" style="margin-top:14px">Supplier '
      + '<span class="req">*</span>'
      + '<select name="enSupplier" required>'
      + '<option value="">— Select supplier —</option>'
      + arr(db.suppliers).map(s =>
          '<option value="' + s.id + '">'
          + esc(s.name) + ' · Payable ' + money(supplierBalance(s.id))
          + '</option>').join('')
      + '</select></label>'
      + '<label class="field" style="margin-top:14px">Date'
      + '<input name="enDate" type="date" value="' + today() + '"></label>'

      + 'placeholder="e.g. Settling October balance"></textarea></label>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">Endorse</button>'
      + '</div></form>', { wide: true });
  }
  window.endorseChequeToSupplier = endorseChequeToSupplier;

  function confirmEndorse(e, chequeId) {
    e.preventDefault();
    const c = custChequeObj(chequeId);
    if (!c) return;
    const supplierId = e.target.enSupplier.value;
    const supplier = supObj(supplierId);
    if (!supplier) { toast('Supplier required', 'error'); return; }
    const date = e.target.enDate.value || today();
    const notes = e.target.enNotes.value.trim();

    /* Create a payment record that reduces supplier payable */
    const payment = {
      id: uid(),
      date: date,
      supplierId: supplierId,
      mode: 'Cheque',
      amount: NN(c.amount),
      reference: 'END-' + c.chequeNo,
      chequeNo: c.chequeNo,
      chequeBank: c.bank,
      chequeStatus: 'Issued',
      notes: notes || ('Endorsed customer cheque #' + c.chequeNo),
      allocations: [{
        chequeId: c.id,
        amount: NN(c.amount)
      }],
      fullyReversed: false,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    };
    db.payments.push(payment);

    /* Update cheque */
    c.status = 'Issued';
    c.issuedToSupplierId = supplierId;
    c.issuedDate = date;
    if (!Array.isArray(c.splits)) c.splits = [];
    c.splits.push({
      supplierId: supplierId,
      amount: NN(c.amount),
      date: date,
      status: 'Issued',
      paymentId: payment.id
    });

    logActivity('CHEQUE_ENDORSED', 'Customer Cheque',
      '#' + c.chequeNo + ' → ' + supplier.name, money(c.amount));
    save();
    closeModal();
    render();
    toast('✅ Cheque endorsed to ' + supplier.name, 'success');
  }
  window.confirmEndorse = confirmEndorse;

  /* ═════════════════════════════════════════════════════════════════════
     SPLIT CHEQUE
  ═════════════════════════════════════════════════════════════════════ */
  function splitCustomerCheque(chequeId) {
    if (!requirePerm('write')) return;
    const c = custChequeObj(chequeId);
    if (!c) return;
    const allocated = arr(c.splits)
      .reduce((a, s) => a + NN(s.amount), 0);
    const unallocated = NN(c.amount) - allocated;

    openModal('✂ Split Cheque #' + esc(c.chequeNo),
      '<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">'
      + kpi('Total', money(c.amount), '')
      + kpi('Allocated', money(allocated),
          arr(c.splits).length + ' split(s)')
      + kpi('Unallocated', money(unallocated), '')
      + '</div>'
      + (unallocated > 0.01 && arr(db.suppliers).length
        ? '<form onsubmit="addSplit(event,\'' + chequeId + '\')" '
          + 'style="margin-top:14px">'
          + '<label class="field">Supplier <span class="req">*</span>'
          + '<select name="spSupplier" required>'
          + '<option value="">— Select supplier —</option>'
          + arr(db.suppliers).map(s =>
              '<option value="' + s.id + '">'
              + esc(s.name) + '</option>').join('')
          + '</select></label>'
          + '<div class="form-grid" style="margin-top:14px">'
          + '<label class="field">Amount <span class="req">*</span>'
          + '<input name="spAmount" type="number" step="0.01" '
          + 'min="0.01" max="' + unallocated + '" required '
          + 'value="' + unallocated.toFixed(2) + '"></label>'
          + '<label class="field">Date'
          + '<input name="spDate" type="date" value="' + today()
          + '"></label>'
          + '</div>'
          + '<div class="form-actions">'
          + '<button type="button" class="btn" onclick="closeModal()">'
          + 'Cancel</button>'
          + '<button type="submit" class="btn primary">Add Split</button>'
          + '</div></form>'
        : unallocated <= 0.01
          ? '<div class="alert-mini" style="margin-top:14px">'
            + '✓ Fully allocated</div>'
          : '<div class="alert-mini" style="margin-top:14px;'
            + 'background:var(--amber-soft);color:var(--amber)">'
            + 'Add a supplier first</div>')
      + (arr(c.splits).length
        ? '<div class="detail-block" style="margin-top:14px">'
          + '<div class="detail-block-title">Existing Splits</div>'
          + c.splits.map((s, i) =>
              '<div style="display:flex;justify-content:space-between;'
              + 'align-items:center;padding:8px 0;font-size:12.5px;'
              + 'border-bottom:1px dashed var(--border-2)">'
              + '<span>' + esc(supName(s.supplierId))
              + ' · ' + dateFmt(s.date)
              + ' <span class="pill pill-soft">'
              + esc(s.status || 'Split') + '</span></span>'
              + '<span style="display:flex;gap:8px;align-items:center">'
              + '<strong>' + money(s.amount) + '</strong>'
              + '<button class="btn sm danger" '
              + 'onclick="removeSplit(\'' + chequeId + '\',' + i + ')">'
              + '✕</button></span></div>').join('')
          + '</div>'
        : '')
      + '<div class="form-actions" style="margin-top:14px">'
      + '<button class="btn primary" onclick="closeModal()">Done</button>'
      + '</div>', { wide: true });
  }
  window.splitCustomerCheque = splitCustomerCheque;

  function addSplit(e, chequeId) {
    e.preventDefault();
    const c = custChequeObj(chequeId);
    if (!c) return;
    const supplierId = e.target.spSupplier.value;
    const amount = NN(e.target.spAmount.value);
    const date = e.target.spDate.value || today();
    if (!supplierId) { toast('Supplier required', 'error'); return; }
    if (amount <= 0) { toast('Amount required', 'error'); return; }

    /* Create a payment record reducing supplier payable */
    const supplier = supObj(supplierId);
    const payment = {
      id: uid(),
      date: date,
      supplierId: supplierId,
      mode: 'Cheque',
      amount: amount,
      reference: 'SPL-' + c.chequeNo + '-' + (arr(c.splits).length + 1),
      chequeNo: c.chequeNo,
      chequeBank: c.bank,
      chequeStatus: 'Issued',
      notes: 'Split from customer cheque #' + c.chequeNo,
      allocations: [{
        chequeId: c.id,
        amount: amount
      }],
      fullyReversed: false,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    };
    db.payments.push(payment);

    if (!Array.isArray(c.splits)) c.splits = [];
    c.splits.push({
      supplierId: supplierId,
      amount: amount,
      date: date,
      status: 'Issued',
      paymentId: payment.id
    });
    c.status = 'Issued';

    logActivity('CHEQUE_SPLIT', 'Customer Cheque',
      '#' + c.chequeNo + ' → ' + (supplier ? supplier.name : ''),
      money(amount));
    save();
    closeModal();
    render();
    splitCustomerCheque(chequeId);
    toast('✅ Split added', 'success');
  }
  window.addSplit = addSplit;

  function removeSplit(chequeId, idx) {
    const c = custChequeObj(chequeId);
    if (!c || !c.splits[idx]) return;
    const split = c.splits[idx];
    confirmBox('Remove Split?',
      'Remove ' + money(split.amount) + ' split to '
      + supName(split.supplierId) + '?',
      () => {
        /* Reverse the payment */
        if (split.paymentId) {
          const payment = arr(db.payments).find(p =>
            p.id === split.paymentId);
          if (payment) payment.fullyReversed = true;
        }
        c.splits.splice(idx, 1);
        /* If no more splits, back to In Hand */
        if (!c.splits.length) c.status = 'In Hand';
        logActivity('CHEQUE_SPLIT_REMOVED', 'Customer Cheque',
          '#' + c.chequeNo, money(split.amount));
        save();
        closeModal();
        render();
        splitCustomerCheque(chequeId);
        toast('Split removed', 'success');
      }, { confirmLabel: 'Remove', danger: true });
  }
  window.removeSplit = removeSplit;

  /* ═════════════════════════════════════════════════════════════════════
     BOUNCE RECOVERY SETTLEMENT
  ═════════════════════════════════════════════════════════════════════ */
  function openSettlementForm(chequeId) {
    if (!requirePerm('write')) return;
    const c = custChequeObj(chequeId);
    if (!c) return;
    const settled = arr(db.chequeSettlements)
      .filter(s => s.chequeId === chequeId)
      .reduce((a, s) => a + NN(s.amount), 0);
    const outstanding = Math.max(0, NN(c.amount) - settled);

    openModal('💰 Record Recovery — Cheque #' + esc(c.chequeNo),
      '<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">'
      + kpi('Cheque', money(c.amount), '')
      + kpi('Recovered', money(settled), 'So far')
      + kpi('Outstanding', money(outstanding), '')
      + '</div>'
      + (outstanding <= 0.01
        ? '<div class="alert-mini" style="margin-top:14px">'
          + '✓ Fully recovered</div>'
        : '<form onsubmit="saveSettlement(event,\'' + chequeId + '\')" '
          + 'style="margin-top:14px">'
          + '<div class="form-grid">'
          + '<label class="field">Amount <span class="req">*</span>'
          + '<input name="stAmount" type="number" step="0.01" '
          + 'min="0.01" max="' + outstanding + '" required '
          + 'value="' + outstanding.toFixed(2) + '"></label>'
          + '<label class="field">Date'
          + '<input name="stDate" type="date" value="' + today()
          + '"></label>'
          + '<label class="field">Method <span class="req">*</span>'
          + '<select name="stMethod">'
          + ['Cash','Bank Transfer','New Cheque','Other'].map(m =>
              '<option value="' + m + '">' + m + '</option>').join('')
          + '</select></label>'
          + '<label class="field">Reference'
          + '<input name="stRef" placeholder="Optional"></label>'
          + '</div>'
          + '<div class="form-actions">'
          + '<button type="button" class="btn" onclick="closeModal()">'
          + 'Cancel</button>'
          + '<button type="submit" class="btn primary">'
          + 'Record Recovery</button>'
          + '</div></form>')
      + (arr(db.chequeSettlements).filter(s => s.chequeId === chequeId).length
        ? '<div class="detail-block" style="margin-top:14px">'
          + '<div class="detail-block-title">Recovery History</div>'
          + arr(db.chequeSettlements).filter(s => s.chequeId === chequeId)
            .map(s =>
              '<div style="display:flex;justify-content:space-between;'
              + 'padding:7px 0;font-size:12.5px;border-bottom:1px dashed '
              + 'var(--border-2)">'
              + '<span>' + dateFmt(s.date) + ' · ' + esc(s.method)
              + (s.reference ? ' · ' + esc(s.reference) : '') + '</span>'
              + '<strong>' + money(s.amount) + '</strong></div>').join('')
          + '</div>'
        : '')
      + '<div class="form-actions" style="margin-top:14px">'
      + '<button class="btn primary" onclick="closeModal()">Done</button>'
      + '</div>', { wide: true });
  }
  window.openSettlementForm = openSettlementForm;

  function saveSettlement(e, chequeId) {
    e.preventDefault();
    const c = custChequeObj(chequeId);
    if (!c) return;
    const amount = NN(e.target.stAmount.value);
    const date = e.target.stDate.value || today();
    const method = e.target.stMethod.value;
    const reference = e.target.stRef.value.trim();
    if (amount <= 0) { toast('Amount required', 'error'); return; }

    db.chequeSettlements.push({
      id: uid(),
      chequeId: chequeId,
      date: date,
      amount: amount,
      method: method,
      reference: reference,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    });

    /* If fully recovered, mark cheque as settled */
    const settled = arr(db.chequeSettlements)
      .filter(s => s.chequeId === chequeId)
      .reduce((a, s) => a + NN(s.amount), 0);
    if (settled >= NN(c.amount) - 0.01) {
      c.status = 'Settled';
      c.settledDate = date;
    }

    logActivity('CHEQUE_SETTLED', 'Customer Cheque',
      '#' + c.chequeNo + ' · ' + method, money(amount));
    save();
    closeModal();
    render();
    toast('✅ Recovery recorded', 'success');
  }
  window.saveSettlement = saveSettlement;

  let ownState = { tab: 'Available', bankId: '', bookId: '' };

        .filter(l => l.status === t).length;

    let rows = arr(db.chequeLeaves)
      .filter(l => l.status === ownState.tab);
    if (ownState.bankId) {
      rows = rows.filter(l => l.bankId === ownState.bankId);
    }
    if (ownState.bookId) {
      rows = rows.filter(l => l.bookId === ownState.bookId);

    rows.sort((a, b) =>
      String(a.leafNo).localeCompare(String(b.leafNo)));

      .filter(l => l.status === 'Issued')
      .reduce((a, l) => a + NN(l.amount), 0);

      + kpi('Available', counts['Available'], 'Ready to issue')

      + '＋ Issue Cheque</button>'

      + '</select></label>'

          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Leaf','Bank','Status','Supplier','Amount','Due','Issued','']
