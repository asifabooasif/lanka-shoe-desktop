      + '</div></form>', { wide: true });
  }
  window.openStockMonthForm = openStockMonthForm;

  function reloadStockForm(ym) {
    /* Reopen the form for the new month */
    closeModal();
    setTimeout(() => openStockMonthForm(ym), 100);
  }
  window.reloadStockForm = reloadStockForm;

  /* Live update totals + COGS as the user types */
  function updateStockRow(input) {
    const table = input.closest('table');
    if (!table) return;
    const rows = table.querySelectorAll('tbody tr');
    let totalOpen = 0, totalClose = 0;
    rows.forEach(tr => {
      const openInput = tr.querySelector('[name^="open_"]');
      const closeInput = tr.querySelector('[name^="close_"]');
      const changeCell = tr.querySelector('.stock-change-cell');
      const o = NN(openInput ? openInput.value : 0);
      const c = NN(closeInput ? closeInput.value : 0);
      totalOpen += o;
      totalClose += c;
      const change = c - o;
      if (changeCell) {
        changeCell.textContent = (change > 0 ? '+' : '') + money(change);
        changeCell.style.color = change > 0 ? 'var(--green)'
          : change < 0 ? 'var(--red)' : 'var(--text-3)';
      }
    });

    const totOpenEl = document.getElementById('totalOpening');
    const totCloseEl = document.getElementById('totalClosing');
    const totChangeEl = document.getElementById('totalChange');
    if (totOpenEl) totOpenEl.textContent = money(totalOpen);
    if (totCloseEl) totCloseEl.textContent = money(totalClose);
    if (totChangeEl) {
      const change = totalClose - totalOpen;
      totChangeEl.textContent = (change > 0 ? '+' : '') + money(change);
    }

    /* Recompute COGS preview */
    const purchases = NN(document.querySelector(
      '#modalWrap [name="smMonth"]')
      ? (function () {
          const m = document.querySelector(
            '#modalWrap [name="smMonth"]').value;
          return monthlyPurchases(m);
        })()
      : 0);
    const cogs = totalOpen + purchases - totalClose;
    const cogsEl = document.getElementById('cogsValue');
    const breakdownEl = document.getElementById('cogsBreakdown');
    if (cogsEl) cogsEl.textContent = money(cogs);
    if (breakdownEl) {
      breakdownEl.textContent = '(' + money(totalOpen) + ' + '
        + money(purchases) + ' − ' + money(totalClose) + ')';
    }
  }
  window.updateStockRow = updateStockRow;

  function saveStockMonth(e, ym, existingId) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const notes = f.smNotes.value.trim();
    const cats = arr(db.stockCategories);

    const categoryValues = cats.map(c => {
      const openInput = f.querySelector('[name="open_' + c.id + '"]');
      const closeInput = f.querySelector('[name="close_' + c.id + '"]');
      return {
        categoryId: c.id,
        categoryName: c.name,
        opening: NN(openInput ? openInput.value : 0),
        closing: NN(closeInput ? closeInput.value : 0)
      };
    });

    const totalOpening = categoryValues
      .reduce((a, c) => a + NN(c.opening), 0);
    const totalClosing = categoryValues
      .reduce((a, c) => a + NN(c.closing), 0);

    if (existingId) {
      const s = stockObj(existingId);
      if (!s) return;
      s.categories = categoryValues;
      s.totalOpening = totalOpening;
      s.totalClosing = totalClosing;
      s.notes = notes;
      s.updatedAt = nowISO();
      logActivity('STOCK_UPDATED', 'Stock', monthName(ym),
        'Closing ' + money(totalClosing));
    } else {
      if (stockMonthByYM(ym)) {
        toast('Stock for ' + monthName(ym) + ' already exists', 'error');
        return;
      }
      db.stockMonths.push({
        id: uid(),
        month: ym,
        categories: categoryValues,
        totalOpening: totalOpening,
        totalClosing: totalClosing,
        notes: notes,
        createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      });
      logActivity('STOCK_CREATED', 'Stock', monthName(ym),
        'Closing ' + money(totalClosing));
    }

    /* Auto-carry to next month if it exists but has no closing */
    const [y, m] = ym.split('-').map(Number);
    const next = new Date(y, m, 1);
    const nextYM = next.getFullYear() + '-'
      + String(next.getMonth() + 1).padStart(2, '0');
    const nextEntry = stockMonthByYM(nextYM);
    if (nextEntry) {
      /* Update next month's opening from this month's closing */
      nextEntry.categories.forEach(nc => {
        const thisCat = categoryValues
          .find(c => c.categoryId === nc.categoryId);
        if (thisCat && NN(nc.closing) === 0) {
          nc.opening = NN(thisCat.closing);
        }
      });
      nextEntry.updatedAt = nowISO();
    }

    save();
    closeModal();
    render();
    toast(existingId ? '✅ Stock updated' : '✅ Stock month saved',
      'success');
  }
  window.saveStockMonth = saveStockMonth;

  function deleteStockMonth(id) {
    if (!requirePerm('delete')) return;
    const s = stockObj(id);
    if (!s) return;
    confirmBox('Delete Stock Month?',
      'Remove all data for ' + monthName(s.month)
      + '?\nThis may affect P&L calculations for that month.',
      () => {
        db.stockMonths = arr(db.stockMonths).filter(x => x.id !== id);
        logActivity('STOCK_DELETED', 'Stock', monthName(s.month), '');
        save();
        render();
        toast('Stock month deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteStockMonth = deleteStockMonth;

  /* ═════════════════════════════════════════════════════════════════════
     STOCK CATEGORIES MANAGER
  ═════════════════════════════════════════════════════════════════════ */
  function openStockCategoriesManager() {
    if (!requirePerm('write')) return;
    const cats = arr(db.stockCategories);

    openModal('🏷️ Stock Categories',
      '<div class="alert-mini">Define categories used to enter stock '
      + 'values each month. Examples: Running Shoes, Formal Shoes, '
      + 'Sandals, School Shoes, Kids Shoes, Slippers.</div>'
      + '<div style="margin-top:14px">'
      + '<table class="stock-entry-table"><thead><tr>'
      + '<th>Category Name</th><th style="width:120px">Actions</th>'
      + '</tr></thead><tbody>'
      + (cats.length
          ? cats.map(c =>
              '<tr><td><input type="text" '
              + 'value="' + esc(c.name) + '" '
              + 'onchange="renameStockCategory(\'' + c.id + '\',this.value)" '
              + 'style="padding:8px 10px;font-size:12.5px"></td>'
              + '<td>'
              + '<button class="btn sm danger" '
              + 'onclick="deleteStockCategory(\'' + c.id + '\')">🗑</button>'
              + '</td></tr>').join('')
          : '<tr><td colspan="2" style="text-align:center;'
            + 'padding:30px;color:var(--text-4)">No categories yet</td></tr>')
      + '</tbody></table>'
      + '</div>'
      + '<div style="margin-top:14px">'
      + '<div class="form-grid" style="grid-template-columns:1fr auto;'
      + 'gap:10px;align-items:end">'
      + '<label class="field">New Category Name'
      + '<input id="newStockCatName" placeholder="e.g. Sports Shoes"></label>'
      + '<button class="btn primary" '
      + 'onclick="addStockCategory()">＋ Add Category</button>'
      + '</div></div>'
      + '<div class="form-actions">'
      + '<button class="btn primary" onclick="closeModal()">Done</button>'
      + '</div>', { wide: true });
  }
  window.openStockCategoriesManager = openStockCategoriesManager;

  function addStockCategory() {
    const inp = document.getElementById('newStockCatName');
    if (!inp) return;
    const name = inp.value.trim();
    if (!name) { toast('Name required', 'error'); return; }
    if (arr(db.stockCategories)
        .some(c => c.name.toLowerCase() === name.toLowerCase())) {
      toast('Category already exists', 'error');
      return;
    }
    db.stockCategories.push({
      id: uid(),
      name: name,
      openingValue: 0,
      createdAt: nowISO()
    });
    logActivity('STOCK_CATEGORY_CREATED', 'Stock Category', name, '');
    save();
    openStockCategoriesManager();
    toast('✅ Category added', 'success');
  }
  window.addStockCategory = addStockCategory;

  function renameStockCategory(id, newName) {
    const c = stockCatObj(id);
    if (!c) return;
    newName = newName.trim();
    if (!newName) { openStockCategoriesManager(); return; }
    if (arr(db.stockCategories)
        .some(x => x.id !== id
          && x.name.toLowerCase() === newName.toLowerCase())) {
      toast('Name already used', 'error');
      openStockCategoriesManager();
      return;
    }
    c.name = newName;
    /* Update name in all stock month entries */
    arr(db.stockMonths).forEach(s => {
      arr(s.categories).forEach(sc => {
        if (sc.categoryId === id) sc.categoryName = newName;
      });
    });
    logActivity('STOCK_CATEGORY_RENAMED', 'Stock Category', newName, '');
    save();
    toast('Renamed', 'success');
  }
  window.renameStockCategory = renameStockCategory;

  function deleteStockCategory(id) {
    const c = stockCatObj(id);
    if (!c) return;
    /* Check if used in any stock month */
    const used = arr(db.stockMonths)
      .some(s => arr(s.categories).some(sc => sc.categoryId === id));
    if (used) {
      toast('Cannot delete — used in stock entries', 'error');
      return;
    }
    confirmBox('Delete Stock Category?',
      'Remove "' + c.name + '"?',
      () => {
        db.stockCategories = arr(db.stockCategories)
          .filter(x => x.id !== id);
        logActivity('STOCK_CATEGORY_DELETED', 'Stock Category', c.name, '');
        save();
        openStockCategoriesManager();
        toast('Category deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteStockCategory = deleteStockCategory;

  /* ═════════════════════════════════════════════════════════════════════
     EXPORT STOCK CSV
  ═════════════════════════════════════════════════════════════════════ */
  function exportStockCSV() {
    const rows = arr(db.stockMonths)
      .sort((a, b) => a.month < b.month ? 1 : -1)
      .map(s => {
        const totals = computeCOGS(s.month);
        return [
          s.month, monthName(s.month),
          totals.opening, totals.purchases, totals.closing,
          totals.cogs, s.notes || ''
        ];
      });
    if (!rows.length) { toast('No stock data to export', 'warn'); return; }
    download('stock_summary_' + today() + '.csv',
      toCSV(['Month','MonthName','Opening','Purchases','Closing','COGS',
             'Notes'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' stock months', 'success');
  }
  window.exportStockCSV = exportStockCSV;

  /* ═════════════════════════════════════════════════════════════════════
     PUBLIC HELPERS (used by Part 11/12 P&L and Reports)
  ═════════════════════════════════════════════════════════════════════ */
  function getStockValueAt(ym) {
    const entry = stockMonthByYM(ym);
    if (!entry) return 0;
    return entry.categories.reduce((a, c) => a + NN(c.closing), 0);
  }
  window.getStockValueAt = getStockValueAt;

  function getCOGSForMonth(ym) {
    return computeCOGS(ym).cogs;
  }
  window.getCOGSForMonth = getCOGSForMonth;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="stockSummary"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const group = '<div class="nav-group" data-group="stock">'
      + '<div class="nav-label">Stock</div>'
      + item('stockSummary', '📦', 'Stock Summary')
      + '</div>';

    /* Insert after Cheques group */
    const chequesGroup = nav.querySelector('[data-view="chequeBooks"]');
    if (chequesGroup) {
      chequesGroup.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    stockSummary: 'Stock Summary'
  });

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Stock Summary', ico: '📦', kind: 'view',
        action: () => goTo('stockSummary') },
      { label: 'Enter Stock Month', ico: '＋', kind: 'action',
        action: () => openStockMonthForm() },
      { label: 'Manage Stock Categories', ico: '🏷️', kind: 'action',
        action: () => openStockCategoriesManager() }
    ]);
  };

  /* CSS */
  (function injectCSS() {
    if (document.getElementById('_part9CSS')) return;
    const style = document.createElement('style');
    style.id = '_part9CSS';
    style.textContent = ''
      + '.stock-entry-table{width:100%;border-collapse:collapse;'
      + 'font-size:12.5px}'
      + '.stock-entry-table th{background:var(--surface-2);text-align:left;'
      + 'padding:10px 12px;font-size:10.5px;text-transform:uppercase;'
      + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
      + 'border-bottom:1px solid var(--border)}'
      + '.stock-entry-table td{padding:10px 12px;'
      + 'border-bottom:1px solid var(--border-2)}'
      + '.stock-entry-table input{width:100%;text-align:right;'
      + 'font-family:inherit}';
    document.head.appendChild(style);
  })();

  console.log('%c✅ Part 9 — Stock Summary & COGS loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Monthly stock values · Auto-carry · COGS · Trend chart',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 10 — PAYMENT PLANS / INSTALLMENTS
   Adds: Payment plans for customers paying in installments.
         Each installment paid → creates a receipt → customer balance
         updates via Part 5.
   Depends on: Parts 1–9
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part10Loaded) return;
  window._part10Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════════════════ */
  const planObj = id => arr(db.paymentPlans).find(p => p.id === id);
  window.planObj = planObj;

  const FREQUENCIES = {
    weekly:    { label: 'Weekly',    days: 7 },
    biweekly:  { label: 'Biweekly',  days: 14 },
    monthly:   { label: 'Monthly',   days: 30 },
    quarterly: { label: 'Quarterly', days: 90 }
  };
  window.FREQUENCIES = FREQUENCIES;

  /* ─── Build installment schedule ─── */
  function buildInstallmentSchedule(startDate, num, frequency, total, downPayment) {
    const schedule = [];
    const principal = NN(total) - NN(downPayment);
    if (num <= 0 || principal <= 0) return schedule;
    const step = FREQUENCIES[frequency]
      ? FREQUENCIES[frequency].days : 30;
    const per = +(principal / num).toFixed(2);
    /* First installment lands one period after start */
    let d = startDate;
    for (let i = 0; i < num; i++) {
      d = shiftDate(d, step);
      schedule.push({
        n: i + 1,
        dueDate: d,
        amount: per,
        paidAmount: 0,
        paidDate: null,
        receiptId: null,
        status: 'pending'
      });
    }
    /* Fix rounding on last installment */
    const sum = per * num;
    const diff = +(principal - sum).toFixed(2);
    if (diff !== 0 && schedule.length) {
      schedule[schedule.length - 1].amount =
        +(schedule[schedule.length - 1].amount + diff).toFixed(2);
    }
    return schedule;
  }
  window.buildInstallmentSchedule = buildInstallmentSchedule;

  /* ─── Recompute statuses ─── */
  function refreshPlanStatuses(plan) {
    if (!plan || !Array.isArray(plan.installments)) return plan;
    const t = today();
    plan.installments.forEach(ins => {
      const paid = NN(ins.paidAmount);
      const total = NN(ins.amount);
      if (paid >= total - 0.01) {
        ins.status = 'paid';
      } else if (paid > 0) {
        ins.status = ins.dueDate < t ? 'overdue' : 'partial';
      } else {
        ins.status = ins.dueDate < t ? 'overdue' : 'pending';
      }
    });
    const totalPaid = plan.installments
      .reduce((a, i) => a + NN(i.paidAmount), 0);
    const totalTarget = plan.installments
      .reduce((a, i) => a + NN(i.amount), 0);
    if (plan.status === 'cancelled') {
      /* keep */
    } else if (totalPaid >= totalTarget - 0.01) {
      plan.status = 'completed';
    } else {
      plan.status = 'active';
    }
    return plan;
  }
  window.refreshPlanStatuses = refreshPlanStatuses;

  /* ─── Plan summary for list/KPIs ─── */
  function planSummary(plan) {
    if (!plan) return {
      total: 0, paid: 0, remaining: 0,
      overdue: 0, overdueCount: 0,
      nextDue: null, nextAmount: 0, progress: 0
    };
    const ins = plan.installments || [];
    const total = ins.reduce((a, i) => a + NN(i.amount), 0);
    const paid = ins.reduce((a, i) => a + NN(i.paidAmount), 0);
    const remaining = total - paid;
    const t = today();
    let overdue = 0, overdueCount = 0;
    let nextDue = null, nextAmount = 0;
    ins.forEach(i => {
      const out = NN(i.amount) - NN(i.paidAmount);
      if (out <= 0.01) return;
      if (i.dueDate < t) {
        overdue += out;
        overdueCount++;
      } else if (!nextDue || i.dueDate < nextDue) {
        nextDue = i.dueDate;
        nextAmount = out;
      }
    });
    return {
      total: total, paid: paid, remaining: remaining,
      overdue: overdue, overdueCount: overdueCount,
      nextDue: nextDue, nextAmount: nextAmount,
      progress: total > 0 ? Math.round((paid / total) * 100) : 0
    };
  }
  window.planSummary = planSummary;

  /* ═════════════════════════════════════════════════════════════════════
     PLANS LIST VIEW
  ═════════════════════════════════════════════════════════════════════ */
  let planState = {
    filter: 'active', q: '', customerId: ''
  };
  window.planState = planState;

  function viewPaymentPlans() {
    arr(db.paymentPlans).forEach(refreshPlanStatuses);

    let list = arr(db.paymentPlans).slice();
    if (planState.filter === 'active') {
      list = list.filter(p => p.status === 'active');
    } else if (planState.filter === 'overdue') {
      list = list.filter(p => planSummary(p).overdueCount > 0);
    } else if (planState.filter === 'completed') {
      list = list.filter(p => p.status === 'completed');
    } else if (planState.filter === 'cancelled') {
      list = list.filter(p => p.status === 'cancelled');
    }
    if (planState.q) {
      const q = planState.q.toLowerCase();
      list = list.filter(p =>
        (p.customerName || '').toLowerCase().includes(q)
        || (p.notes || '').toLowerCase().includes(q));
    }
    if (planState.customerId) {
      list = list.filter(p => p.customerId === planState.customerId);
    }

    /* Sort: overdue first, then newest */
    list.sort((a, b) => {
      const ao = planSummary(a).overdueCount > 0 ? 0 : 1;
      const bo = planSummary(b).overdueCount > 0 ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return (b.createdAt || '') < (a.createdAt || '') ? -1 : 1;
    });

    /* KPIs */
    const all = arr(db.paymentPlans);
    const activeCount = all.filter(p => p.status === 'active').length;
    const totalRemaining = all
      .filter(p => p.status === 'active')
      .reduce((a, p) => a + planSummary(p).remaining, 0);
    const totalOverdue = all
      .reduce((a, p) => a + planSummary(p).overdue, 0);
    const overduePlans = all
      .filter(p => planSummary(p).overdueCount > 0).length;

    return '<div class="kpi-strip">'
      + kpi('Active Plans', activeCount, 'In progress')
      + kpi('Total Outstanding', money(totalRemaining),
          'Across active plans')
      + kpi('Overdue', money(totalOverdue),
          overduePlans + ' plan(s) affected')
      + kpi('Completed', all.filter(p => p.status === 'completed').length,
          'All time')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>💳 Payment Plans ('
      + list.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportPlansCSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openPlanForm()">'
      + '＋ New Plan</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(planState.q) + '" '
      + 'oninput="planState.q=this.value;render()" '
      + 'placeholder="Customer or notes"></label>'
      + '<label class="field">Filter'
      + '<select onchange="planState.filter=this.value;render()">'
      + [['active','Active'],['overdue','Overdue only'],
         ['completed','Completed'],['cancelled','Cancelled'],
         ['all','All']].map(([k, l]) =>
          '<option value="' + k + '" '
          + (planState.filter === k ? 'selected' : '') + '>'
          + l + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Customer'
      + '<select onchange="planState.customerId=this.value;render()">'
      + '<option value="">All customers</option>'
      + arr(db.customers).map(c =>
          '<option value="' + c.id + '" '
          + (planState.customerId === c.id ? 'selected' : '') + '>'
          + esc(c.name) + '</option>').join('')
      + '</select></label>'
      + '</div>'

      + (list.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Customer','Total','Paid','Remaining','Progress',
             'Next Due','Status','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + list.map(p => {
            const s = planSummary(p);
            const badge = p.status === 'completed'
              ? '<span class="pill pill-ok">Completed</span>'
              : p.status === 'cancelled'
                ? '<span class="pill pill-muted">Cancelled</span>'
                : s.overdueCount > 0
                  ? '<span class="pill pill-danger">Overdue '
                    + money(s.overdue) + '</span>'
                  : '<span class="pill pill-soft">Active</span>';
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showPlanDetail(\'' + p.id + '\')">'
              + '<td style="padding:11px 12px"><strong>'
              + esc(p.customerName) + '</strong><div '
              + 'style="font-size:10.5px;color:var(--text-3);'
              + 'margin-top:2px">'
              + p.numInstallments + ' × ' + FREQUENCIES[p.frequency].label
              + '</div></td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums">'
              + money(s.total) + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--green)">'
              + money(s.paid) + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:700;'
              + 'color:' + (s.remaining > 0 ? 'var(--amber)'
                  : 'var(--text-3)') + '">'
              + money(s.remaining) + '</td>'
              + '<td style="padding:11px 12px;min-width:110px">'
              + '<div style="height:6px;background:var(--surface-3);'
              + 'border-radius:3px;overflow:hidden">'
              + '<div style="height:100%;width:' + s.progress + '%;'
              + 'background:' + (s.progress >= 100
                  ? 'var(--green)' : 'var(--accent)') + '"></div></div>'
              + '<div style="font-size:10.5px;color:var(--text-3);'
              + 'margin-top:2px">' + s.progress + '%</div>'
              + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px">'
              + (s.nextDue
                  ? dateFmt(s.nextDue)
                    + '<div style="font-size:10.5px;color:var(--text-3)">'
                    + money(s.nextAmount) + '</div>'
                  : '—') + '</td>'
              + '<td style="padding:11px 12px">' + badge + '</td>'
              + '<td style="padding:11px 12px" '
              + 'onclick="event.stopPropagation()">'
              + '<button class="btn sm danger" '
              + 'onclick="deletePlan(\'' + p.id + '\')">🗑</button></td>'
              + '</tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">💳</div>'
          + (arr(db.paymentPlans).length
              ? 'No plans match filters'
              : 'No payment plans yet<br>'
                + '<button class="btn primary" style="margin-top:12px" '
                + 'onclick="openPlanForm()">＋ Create First Plan</button>')
          + '</div>')
      + '</div>';
  }
  views.paymentPlans = viewPaymentPlans;
  window.viewPaymentPlans = viewPaymentPlans;

  /* ═════════════════════════════════════════════════════════════════════
     PLAN FORM
  ═════════════════════════════════════════════════════════════════════ */
  function openPlanForm(existingId) {
    if (!requirePerm('write')) return;
    if (!arr(db.customers).length) {
      toast('Add a customer first', 'warn');
      return;
    }
    const p = existingId ? planObj(existingId) : null;
    const customers = arr(db.customers).slice()
      .sort((a, b) => a.name.localeCompare(b.name));

    openModal(p ? '✎ Edit Plan' : '＋ New Payment Plan',
      '<form onsubmit="savePlan(event,\'' + (existingId || '') + '\')">'
      + '<div class="alert-mini">'
      + 'ℹ A payment plan schedules a customer\'s purchase over '
      + 'multiple installments. Each time you record a payment on an '
      + 'installment, a receipt is created automatically.'
      + '</div>'
      + '<div class="form-grid" style="margin-top:14px">'
      + '<label class="field">Customer <span class="req">*</span>'
      + '<select name="plCustomer" required>'
      + '<option value="">— Select customer —</option>'
      + customers.map(c =>
          '<option value="' + c.id + '" '
          + (p && p.customerId === c.id ? 'selected' : '') + '>'
          + esc(c.name) + (c.phone ? ' · ' + esc(c.phone) : '')
          + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Start Date <span class="req">*</span>'
      + '<input name="plStart" type="date" required '
      + 'value="' + (p ? p.startDate : today()) + '"></label>'
      + '<label class="field">Total Amount (Rs.) <span class="req">*</span>'
      + '<input name="plTotal" type="number" step="0.01" min="0.01" '
      + 'required value="' + (p ? NN(p.totalAmount) : '') + '"></label>'
      + '<label class="field">Down Payment (Rs.)'
      + '<input name="plDown" type="number" step="0.01" min="0" '
      + 'value="' + (p ? NN(p.downPayment) : 0) + '"></label>'
      + '<label class="field">Number of Installments <span class="req">*</span>'
      + '<input name="plNum" type="number" min="1" max="60" required '
      + 'value="' + (p ? p.numInstallments : 6) + '"></label>'
      + '<label class="field">Frequency <span class="req">*</span>'
      + '<select name="plFreq">'
      + Object.keys(FREQUENCIES).map(k =>
          '<option value="' + k + '" '
          + (p && p.frequency === k ? 'selected' : '') + '>'
          + FREQUENCIES[k].label + '</option>').join('')
      + '</select></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="plNotes" rows="2" '
      + 'placeholder="e.g. School shoes for family, 2 pairs/month">'
      + esc(p ? (p.notes || '') : '') + '</textarea></label>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (p ? 'Save Changes' : 'Create Plan') + '</button>'
      + '</div></form>', { wide: true });
  }
  window.openPlanForm = openPlanForm;

  function savePlan(e, existingId) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const customerId = f.plCustomer.value;
    const customer = custObj(customerId);
    if (!customer) { toast('Customer required', 'error'); return; }
    const totalAmount = NN(f.plTotal.value);
    if (totalAmount <= 0) { toast('Total must be > 0', 'error'); return; }
    const downPayment = NN(f.plDown.value);
    if (downPayment > totalAmount) {
      toast('Down payment cannot exceed total', 'error');
      return;
    }
    const numInstallments = Math.max(1, Math.floor(NN(f.plNum.value) || 1));
    const frequency = f.plFreq.value;
    const startDate = f.plStart.value || today();
    const notes = f.plNotes.value.trim();

    /* Cannot edit a plan with paid installments */
    if (existingId) {
      const existing = planObj(existingId);
      if (!existing) return;
      const s = planSummary(existing);
      if (s.paid > 0) {
        toast('Cannot edit — installments already paid', 'error');
        return;
      }
      existing.customerId = customerId;
      existing.customerName = customer.name;
      existing.startDate = startDate;
      existing.totalAmount = totalAmount;
      existing.downPayment = downPayment;
      existing.numInstallments = numInstallments;
      existing.frequency = frequency;
      existing.notes = notes;
      existing.installments = buildInstallmentSchedule(
        startDate, numInstallments, frequency, totalAmount, downPayment);
      refreshPlanStatuses(existing);
      logActivity('PLAN_UPDATED', 'Payment Plan', customer.name,
        money(totalAmount));
    } else {
      const plan = {
        id: uid(),
        customerId: customerId,
        customerName: customer.name,
        startDate: startDate,
        totalAmount: totalAmount,
        downPayment: downPayment,
        numInstallments: numInstallments,
        frequency: frequency,
        notes: notes,
        installments: buildInstallmentSchedule(
          startDate, numInstallments, frequency, totalAmount, downPayment),
        status: 'active',
        createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      };
      refreshPlanStatuses(plan);
      db.paymentPlans.push(plan);

      /* If down payment > 0, auto-create a receipt for it */
      if (downPayment > 0) {
        const receipt = {
          id: uid(),
          date: startDate,
          customerId: customerId,
          customerName: customer.name,
          amount: downPayment,
          method: 'Cash',
          reference: 'DOWN-' + plan.id.slice(-6).toUpperCase(),
          notes: 'Down payment for plan',
          allocations: [],
          _planId: plan.id,
          _installmentN: 0,
          createdAt: nowISO()
        };
        if (!Array.isArray(db.receipts)) db.receipts = [];
        db.receipts.push(receipt);
        /* Add to cash drawer */
        if (!Array.isArray(db.cashTransactions)) db.cashTransactions = [];
        db.cashTransactions.push({
          id: uid(),
          date: startDate,
          type: 'in',
          amount: downPayment,
          category: 'Down payment',
          reference: 'DOWN-' + plan.id.slice(-6).toUpperCase(),
          notes: 'Plan down payment — ' + customer.name,
          sourceType: 'receipt',
          sourceId: receipt.id,
          createdAt: nowISO()
        });
      }

      logActivity('PLAN_CREATED', 'Payment Plan', customer.name,
        totalAmount + ' · ' + numInstallments
        + ' × ' + FREQUENCIES[frequency].label);
    }

    save();
    closeModal();
    render();
    toast(existingId ? '✅ Plan updated' : '✅ Plan created', 'success');
  }
  window.savePlan = savePlan;

  function deletePlan(id) {
    if (!requirePerm('delete')) return;
    const p = planObj(id);
    if (!p) return;
    const s = planSummary(p);
    if (s.paid > 0) {
      toast('Cannot delete — payments already recorded. Cancel instead.',
        'warn');
      return;
    }
    confirmBox('Delete Plan?',
      'Remove the payment plan for ' + p.customerName + '?',
      () => {
        db.paymentPlans = arr(db.paymentPlans).filter(x => x.id !== id);
        logActivity('PLAN_DELETED', 'Payment Plan', p.customerName, '');
        save();
        render();
        toast('Plan deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deletePlan = deletePlan;

  function cancelPlan(id) {
    if (!requirePerm('write')) return;
    const p = planObj(id);
    if (!p) return;
    confirmBox('Cancel Plan?',
      'Mark plan for ' + p.customerName + ' as cancelled?\n'
      + 'Already recorded payments are kept.',
      () => {
        p.status = 'cancelled';
        p.cancelledAt = nowISO();
        logActivity('PLAN_CANCELLED', 'Payment Plan', p.customerName, '');
        save();
        render();
        toast('Plan cancelled', 'warn');
      }, { confirmLabel: 'Cancel Plan', danger: true });
  }
  window.cancelPlan = cancelPlan;

  /* ═════════════════════════════════════════════════════════════════════
     PLAN DETAIL MODAL
  ═════════════════════════════════════════════════════════════════════ */
  function showPlanDetail(id) {
    const p = planObj(id);
    if (!p) return;
    refreshPlanStatuses(p);
    const s = planSummary(p);
    const ins = p.installments || [];

    const rows = ins.map(inst => {
      const outstanding = NN(inst.amount) - NN(inst.paidAmount);
      const badge = inst.status === 'paid'
        ? '<span class="pill pill-ok">Paid</span>'
        : inst.status === 'overdue'
          ? '<span class="pill pill-danger">Overdue</span>'
          : inst.status === 'partial'
            ? '<span class="pill pill-warn">Partial</span>'
            : '<span class="pill pill-soft">Pending</span>';

      return '<tr style="border-bottom:1px solid var(--border-2)">'
        + '<td style="padding:11px 12px;font-weight:600">#'
        + inst.n + '</td>'
        + '<td style="padding:11px 12px;font-size:11.5px">'
        + dateFmt(inst.dueDate) + '</td>'
        + '<td style="padding:11px 12px;text-align:right;'
        + 'font-variant-numeric:tabular-nums">'
        + money(inst.amount) + '</td>'
        + '<td style="padding:11px 12px;text-align:right;'
        + 'font-variant-numeric:tabular-nums;color:var(--green)">'
        + money(inst.paidAmount) + '</td>'
        + '<td style="padding:11px 12px;text-align:right;'
        + 'font-variant-numeric:tabular-nums;font-weight:700;color:'
        + (outstanding > 0.01 ? 'var(--amber)' : 'var(--text-3)') + '">'
        + money(outstanding) + '</td>'
        + '<td style="padding:11px 12px">' + badge + '</td>'
        + '<td style="padding:11px 12px;text-align:right">'
        + (outstanding > 0.01
            ? '<button class="btn sm primary" '
              + 'onclick="openInstallmentPay(\'' + p.id + '\',' + inst.n
              + ')">💰 Pay</button>'
            : (inst.paidDate
                ? '<span style="font-size:11px;color:var(--text-3)">'
                  + dateFmt(inst.paidDate) + '</span>'
                : '—'))
        + '</td>'
        + '</tr>';
    }).join('');

    openModal('💳 Plan — ' + esc(p.customerName),
      '<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">'
      + kpi('Total', money(s.total),
          p.numInstallments + ' × '
          + FREQUENCIES[p.frequency].label)
      + kpi('Paid', money(s.paid),
          s.progress + '% complete')
      + kpi('Remaining', money(s.remaining),
          s.overdueCount
            ? s.overdueCount + ' overdue'
            : 'On track')
      + kpi('Next Due', s.nextDue ? dateFmt(s.nextDue) : '—',
          s.nextAmount ? money(s.nextAmount) : '')
      + '</div>'

      + '<div class="detail-block" style="margin-bottom:14px">'
      + '<div class="detail-block-title">Plan Details</div>'
      + detailRow('Customer', p.customerName)
      + detailRow('Start Date', dateFmt(p.startDate))
      + detailRow('Total Amount', money(p.totalAmount))
      + (p.downPayment > 0
          ? detailRow('Down Payment', money(p.downPayment)) : '')
      + detailRow('Installments', p.numInstallments + ' × '
          + FREQUENCIES[p.frequency].label)
      + detailRow('Status', p.status)
      + (p.notes ? detailRow('Notes', p.notes) : '')
      + '</div>'

      + '<div class="section-title">Installments</div>'
      + '<div style="overflow-x:auto">'
      + '<table style="width:100%;border-collapse:collapse;'
      + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
      + ['#','Due Date','Amount','Paid','Outstanding','Status','']
          .map(h => '<th style="text-align:left;padding:10px 12px;'
            + 'font-size:10.5px;text-transform:uppercase;'
            + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
            + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>'

      + '<div class="form-actions" style="margin-top:16px">'
      + (p.status === 'active'
          ? '<button class="btn danger" '
            + 'onclick="closeModal();cancelPlan(\'' + p.id + '\')">'
            + '✕ Cancel Plan</button>'
          : '')
      + (s.paid > 0 ? ''
          : '<button class="btn" '
            + 'onclick="closeModal();openPlanForm(\'' + p.id + '\')">'
            + '✎ Edit</button>')
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.showPlanDetail = showPlanDetail;

  /* ═════════════════════════════════════════════════════════════════════
     RECORD INSTALLMENT PAYMENT (creates a receipt)
  ═════════════════════════════════════════════════════════════════════ */
  function openInstallmentPay(planId, n) {
    if (!requirePerm('write')) return;
    const p = planObj(planId);
    if (!p) return;
    const inst = p.installments.find(i => i.n === n);
    if (!inst) return;
    const outstanding = NN(inst.amount) - NN(inst.paidAmount);

    openModal('💰 Record Installment Payment',
      '<div class="alert-mini">'
      + '<strong>Plan:</strong> ' + esc(p.customerName) + '<br>'
      + '<strong>Installment:</strong> #' + inst.n + ' of '
      + p.numInstallments + '<br>'
      + '<strong>Due:</strong> ' + dateFmt(inst.dueDate) + '<br>'
      + '<strong>Outstanding:</strong> ' + money(outstanding)
      + '</div>'
      + '<form onsubmit="saveInstallmentPay(event,\'' + planId + '\','
      + n + ')" style="margin-top:14px">'
      + '<div class="form-grid">'
      + '<label class="field">Amount Received (Rs.) <span class="req">*</span>'
      + '<input name="ipAmount" type="number" step="0.01" '
      + 'min="0.01" max="' + outstanding + '" required '
      + 'value="' + outstanding.toFixed(2) + '" autofocus></label>'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="ipDate" type="date" required value="' + today()
      + '"></label>'
      + '<label class="field">Method'
      + '<select name="ipMethod">'
      + ['Cash','Bank','Cheque','Card','Online'].map(m =>
          '<option value="' + m + '">' + m + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Bank (if Bank method)'
      + '<select name="ipBank">'
      + '<option value="">— None —</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '">'
          + esc(b.accountName || b.bankName) + ' · '
          + esc(b.bankName) + '</option>').join('')
      + '</select></label>'
      + '<label class="field" style="grid-column:1/-1">Reference'
      + '<input name="ipRef" placeholder="Optional receipt / txn ID">'
      + '</label>'
      + '</div>'
      + '<div class="alert-mini" style="margin-top:12px;'
      + 'background:var(--green-soft);color:var(--green)">'
      + '✓ A receipt will be created automatically for '
      + 'this amount.</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + 'Save & Create Receipt</button>'
      + '</div></form>', { wide: true });
  }
  window.openInstallmentPay = openInstallmentPay;

  function saveInstallmentPay(e, planId, n) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const p = planObj(planId);
    if (!p) return;
    const inst = p.installments.find(i => i.n === n);
    if (!inst) return;
    const amount = NN(f.ipAmount.value);
    if (amount <= 0) { toast('Amount required', 'error'); return; }
    const outstanding = NN(inst.amount) - NN(inst.paidAmount);
    if (amount > outstanding + 0.01) {
      toast('Amount exceeds outstanding', 'error');
      return;
    }
    const date = f.ipDate.value || today();
    const method = f.ipMethod.value;
    const bankId = f.ipBank.value || null;
    const reference = f.ipRef.value.trim();

    /* Create receipt */
    const receiptId = uid();
    const receipt = {
      id: receiptId,
      date: date,
      customerId: p.customerId,
      customerName: p.customerName,
      amount: amount,
      method: method,
      bankAccountId: method === 'Bank' ? bankId : null,
      reference: reference || ('PLAN-' + p.id.slice(-4) + '-' + n),
      notes: 'Installment #' + n + ' of ' + p.numInstallments
        + ' — plan ' + p.id.slice(-6).toUpperCase(),
      allocations: [],
      _planId: p.id,
      _installmentN: n,
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    };
    db.receipts.push(receipt);

    /* Update installment */
    inst.paidAmount = NN(inst.paidAmount) + amount;
    if (inst.paidAmount >= NN(inst.amount) - 0.01) {
      inst.paidDate = date;
      inst.receiptId = receiptId;
    } else if (!inst.paidDate) {
      inst.paidDate = date;
      inst.receiptId = receiptId;
    }

    /* Cash drawer if Cash */
    if (method === 'Cash') {
      if (!Array.isArray(db.cashTransactions)) db.cashTransactions = [];
      db.cashTransactions.push({
        id: uid(),
        date: date,
        type: 'in',
        amount: amount,
        category: 'Installment',
        reference: reference || ('PLAN-' + p.id.slice(-4) + '-' + n),
        notes: 'Installment #' + n + ' — ' + p.customerName,
        sourceType: 'receipt',
        sourceId: receiptId,
        createdAt: nowISO()
      });
    }

    refreshPlanStatuses(p);
    logActivity('INSTALLMENT_PAID', 'Payment Plan',
      p.customerName + ' #' + n, money(amount));
    save();
    closeModal();
    render();
    /* Reopen plan detail to show updated state */
    setTimeout(() => showPlanDetail(p.id), 200);
    toast('✅ Payment recorded · Receipt created', 'success');
  }
  window.saveInstallmentPay = saveInstallmentPay;

  /* ═════════════════════════════════════════════════════════════════════
     EXPORT CSV
  ═════════════════════════════════════════════════════════════════════ */
  function exportPlansCSV() {
    arr(db.paymentPlans).forEach(refreshPlanStatuses);
    const rows = arr(db.paymentPlans).map(p => {
      const s = planSummary(p);
      return [
        p.customerName || '', p.status,
        p.startDate, p.totalAmount, p.downPayment,
        p.numInstallments, FREQUENCIES[p.frequency].label,
        s.paid, s.remaining, s.overdue, s.overdueCount,
        s.nextDue || '', p.notes || ''
      ];
    });
    if (!rows.length) { toast('No plans to export', 'warn'); return; }
    download('payment_plans_' + today() + '.csv',
      toCSV(['Customer','Status','StartDate','Total','DownPayment',
             'NumInstallments','Frequency','Paid','Remaining',
             'Overdue','OverdueCount','NextDue','Notes'],
        rows), 'text/csv');
    toast('Exported ' + rows.length + ' plans', 'success');
  }
  window.exportPlansCSV = exportPlansCSV;

  /* ═════════════════════════════════════════════════════════════════════
     PUBLIC HELPERS (used by Part 13/14 for reminders + reports)
  ═════════════════════════════════════════════════════════════════════ */
  function getUpcomingInstallments(days) {
    days = days || 7;
    const t = today();
    const out = [];
    arr(db.paymentPlans)
      .filter(p => p.status === 'active')
      .forEach(p => {
        refreshPlanStatuses(p);
        (p.installments || []).forEach(inst => {
          const outAmt = NN(inst.amount) - NN(inst.paidAmount);
          if (outAmt <= 0.01) return;
          const diff = daysBetween(t, inst.dueDate);
          if (diff >= 0 && diff <= days) {
            out.push({
              planId: p.id,
              customerId: p.customerId,
              customerName: p.customerName,
              installmentN: inst.n,
              dueDate: inst.dueDate,
              amount: outAmt,
              daysAway: diff
            });
          }
        });
      });
    return out.sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
  }
  window.getUpcomingInstallments = getUpcomingInstallments;

  function getOverdueInstallments() {
    const t = today();
    const out = [];
    arr(db.paymentPlans)
      .filter(p => p.status === 'active')
      .forEach(p => {
        refreshPlanStatuses(p);
        (p.installments || []).forEach(inst => {
          const outAmt = NN(inst.amount) - NN(inst.paidAmount);
          if (outAmt <= 0.01) return;
          if (inst.dueDate < t) {
            out.push({
              planId: p.id,
              customerId: p.customerId,
              customerName: p.customerName,
              installmentN: inst.n,
              dueDate: inst.dueDate,
              amount: outAmt,
              daysOverdue: Math.abs(daysBetween(inst.dueDate, t))
            });
          }
        });
      });
    return out.sort((a, b) => b.daysOverdue - a.daysOverdue);
  }
  window.getOverdueInstallments = getOverdueInstallments;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="paymentPlans"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const group = '<div class="nav-group" data-group="plans">'
      + '<div class="nav-label">Plans</div>'
      + item('paymentPlans', '💳', 'Payment Plans')
      + '</div>';

    /* Insert after Sales group (after Receipts) */
    const receiptsItem = nav.querySelector('[data-view="receipts"]');
    if (receiptsItem) {
      receiptsItem.parentElement.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    paymentPlans: 'Payment Plans'
  });

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Payment Plans', ico: '💳', kind: 'view',
        action: () => goTo('paymentPlans') },
      { label: 'New Payment Plan', ico: '＋', kind: 'action',
        action: () => openPlanForm() }
    ]);
  };

  /* ═════════════════════════════════════════════════════════════════════
     Recompute plan statuses on load
  ═════════════════════════════════════════════════════════════════════ */
  setTimeout(() => {
    try {
      arr(db.paymentPlans).forEach(refreshPlanStatuses);
    } catch (e) { console.error(e); }
  }, 200);

  console.log('%c✅ Part 10 — Payment Plans loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Installments · Auto-receipts · Overdue tracking',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 11 — ACCOUNTING CORE
   Adds: Chart of Accounts · Journal Entries (double-entry) ·
         General Ledger · Trial Balance.
   Note: Auto-posting from transactions arrives in Part 16.
   Depends on: Parts 1–10
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part11Loaded) return;
  window._part11Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════════════════ */
  const accountObj = id => arr(db.chartOfAccounts).find(a => a.id === id);
  const accountByCode = code => arr(db.chartOfAccounts)
    .find(a => a.code === String(code));
  const accountByName = name => arr(db.chartOfAccounts)
    .find(a => a.name.toLowerCase() === String(name).toLowerCase());
  const journalObj = id => arr(db.journals).find(j => j.id === id);

  window.accountObj = accountObj;
  window.accountByCode = accountByCode;
  window.accountByName = accountByName;
  window.journalObj = journalObj;

  const ACCOUNT_TYPES = {
    asset:     { label: 'Asset',     normal: 'debit' },
    liability: { label: 'Liability', normal: 'credit' },
    equity:    { label: 'Equity',    normal: 'credit' },
    income:    { label: 'Income',    normal: 'credit' },
    expense:   { label: 'Expense',   normal: 'debit' }
  };
  window.ACCOUNT_TYPES = ACCOUNT_TYPES;

  /* ═════════════════════════════════════════════════════════════════════
     BALANCE CALCULATION
     Walk every journal line; sum debit − credit for a given account
     (returns net debit positive; net credit negative).
  ═════════════════════════════════════════════════════════════════════ */
  function accountMovements(accountId, opts) {
    opts = opts || {};
    const from = opts.from || '';
    const to = opts.to || '';
    const lines = [];
    arr(db.journals).forEach(j => {
      if (from && j.date < from) return;
      if (to && j.date > to) return;
      arr(j.lines).forEach(line => {
        if (line.accountId !== accountId) return;
        lines.push({
          journalId: j.id,
          date: j.date,
          reference: j.reference || '',
          description: j.description || '',
          isOpening: !!j.isOpening,
          isAuto: !!j.isAuto,
          autoSourceType: j.autoSourceType || '',
          debit: NN(line.debit),
          credit: NN(line.credit)
        });
      });
    });
    lines.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.reference || '').localeCompare(b.reference || '');
    });
    return lines;
  }
  window.accountMovements = accountMovements;

  /* Net balance for an account as of a date (or all time) */
  function accountBalance(accountId, opts) {
    const lines = accountMovements(accountId, opts);
    const debit = lines.reduce((a, l) => a + l.debit, 0);
    const credit = lines.reduce((a, l) => a + l.credit, 0);
    const account = accountObj(accountId);
    const type = account ? account.type : 'asset';
    const normal = ACCOUNT_TYPES[type]
      ? ACCOUNT_TYPES[type].normal : 'debit';
    /* Signed balance: positive = natural, negative = contra */
    const net = normal === 'debit' ? debit - credit : credit - debit;
    return { debit: debit, credit: credit, net: net, normal: normal };
  }
  window.accountBalance = accountBalance;

  /* Balance formatted with Dr/Cr suffix */
  function accountBalanceDisplay(accountId, opts) {
    const b = accountBalance(accountId, opts);
    if (Math.abs(b.net) < 0.01) return money(0);
    const suffix = b.net >= 0
      ? (b.normal === 'debit' ? ' Dr' : ' Cr')
      : (b.normal === 'debit' ? ' Cr' : ' Dr');
    return money(Math.abs(b.net)) + suffix;
  }
  window.accountBalanceDisplay = accountBalanceDisplay;

  /* ═════════════════════════════════════════════════════════════════════
     CHART OF ACCOUNTS VIEW
  ═════════════════════════════════════════════════════════════════════ */
  let coaState = { type: '', q: '' };
  window.coaState = coaState;

  function viewChartOfAccounts() {
    let list = arr(db.chartOfAccounts).slice();
    if (coaState.type) list = list.filter(a => a.type === coaState.type);
    if (coaState.q) {
      const q = coaState.q.toLowerCase();
      list = list.filter(a =>
        (a.name || '').toLowerCase().includes(q)
        || (a.code || '').toLowerCase().includes(q));
    }
    list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));

    /* Group counts + type totals */
    const byType = {};
    Object.keys(ACCOUNT_TYPES).forEach(t => {
      byType[t] = arr(db.chartOfAccounts).filter(a => a.type === t).length;
    });

    return '<div class="kpi-strip">'
      + kpi('Total Accounts', arr(db.chartOfAccounts).length, 'In chart')
      + kpi('Assets', byType.asset, 'Balance sheet')
      + kpi('Liabilities', byType.liability, 'Balance sheet')
      + kpi('Equity', byType.equity, 'Balance sheet')
      + kpi('Income', byType.income, 'P&L')
      + kpi('Expenses', byType.expense, 'P&L')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📊 Chart of Accounts</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportCOACSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openAccountForm()">'
      + '＋ New Account</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:2fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(coaState.q) + '" '
      + 'oninput="coaState.q=this.value;render()" '
      + 'placeholder="Account name or code"></label>'
      + '<label class="field">Type'
      + '<select onchange="coaState.type=this.value;render()">'
      + '<option value="">All types</option>'
      + Object.keys(ACCOUNT_TYPES).map(t =>
          '<option value="' + t + '" '
          + (coaState.type === t ? 'selected' : '') + '>'
          + ACCOUNT_TYPES[t].label + '</option>').join('')
      + '</select></label>'
      + '</div>'

      + (list.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Code','Account Name','Type','Current Balance','Lines','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + list.map(a => {
            const bal = accountBalance(a.id);
            const lineCount = accountMovements(a.id).length;
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showAccountDetail(\'' + a.id + '\')">'
              + '<td style="padding:11px 12px;font-family:var(--mono);'
              + 'font-size:11.5px;color:var(--text-3)">'
              + esc(a.code) + '</td>'
              + '<td style="padding:11px 12px"><strong>'
              + esc(a.name) + '</strong></td>'
              + '<td style="padding:11px 12px">'
              + '<span class="pill pill-soft">'
              + ACCOUNT_TYPES[a.type].label + '</span></td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600;color:'
              + (Math.abs(bal.net) < 0.01 ? 'var(--text-3)'
                  : bal.net > 0 ? 'var(--text)' : 'var(--red)') + '">'
              + accountBalanceDisplay(a.id) + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-size:11.5px;color:var(--text-3)">'
              + lineCount + '</td>'
              + '<td style="padding:11px 12px" '
              + 'onclick="event.stopPropagation()">'
              + '<div style="display:flex;gap:4px">'
              + '<button class="btn sm" onclick="showAccountDetail(\''
              + a.id + '\')">👁</button>'
              + (lineCount > 0
                  ? '<button class="btn sm" '
                    + 'onclick="toast(\'Cannot delete — has transactions\',\'warn\')">🗑</button>'
                  : '<button class="btn sm danger" '
                    + 'onclick="deleteAccount(\'' + a.id + '\')">🗑</button>')
              + '</div></td>'
              + '</tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">📊</div>'
          + 'No accounts. Add one or reset the Chart of Accounts '
          + 'from the Setup Wizard.</div>')
      + '</div>';
  }
  views.chartOfAccounts = viewChartOfAccounts;
  window.viewChartOfAccounts = viewChartOfAccounts;

  function openAccountForm(id) {
    if (!requirePerm('write')) return;
    const a = id ? accountObj(id) : null;
    /* Suggest next code based on type */
    const nextCode = () => {
      const base = { asset: 1000, liability: 2000, equity: 3000,
                     income: 4000, expense: 5000 };
      const t = (a && a.type) || 'asset';
      const inRange = arr(db.chartOfAccounts)
        .filter(x => x.type === t)
        .map(x => parseInt(x.code, 10))
        .filter(n => !isNaN(n));
      const start = base[t];
      let next = start;
      while (inRange.indexOf(next) !== -1) next += 100;
      return String(next);
    };

    openModal(a ? '✎ Edit Account' : '＋ New Account',
      '<form onsubmit="saveAccount(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Code <span class="req">*</span>'
      + '<input name="aCode" required value="'
      + esc(a ? a.code : nextCode()) + '" autofocus></label>'
      + '<label class="field">Name <span class="req">*</span>'
      + '<input name="aName" required value="'
      + esc(a ? a.name : '') + '"></label>'
      + '<label class="field">Type <span class="req">*</span>'
      + '<select name="aType" onchange="onAccountTypeChange(this.value)">'
      + Object.keys(ACCOUNT_TYPES).map(t =>
          '<option value="' + t + '" '
          + (a && a.type === t ? 'selected' : '') + '>'
          + ACCOUNT_TYPES[t].label + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Notes'
      + '<input name="aNotes" value="' + esc(a ? (a.notes || '') : '') + '"></label>'
      + '</div>'
      + '<div class="alert-mini">'
      + 'ℹ Codes: Assets 1000–1999 · Liabilities 2000–2999 · '
      + 'Equity 3000–3999 · Income 4000–4999 · Expenses 5000–5999'
      + '</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (a ? 'Save Changes' : 'Create Account') + '</button>'
      + '</div></form>', { wide: true });
  }
  window.openAccountForm = openAccountForm;

  function onAccountTypeChange() {
    /* Reserved for future use (auto-code suggestions) */
  }
  window.onAccountTypeChange = onAccountTypeChange;

  function saveAccount(e, id) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const code = f.aCode.value.trim();
    const name = f.aName.value.trim();
    const type = f.aType.value;
    const notes = f.aNotes.value.trim();
    if (!code || !name) { toast('Code and name required', 'error'); return; }

    /* Duplicate code check */
    const dupeCode = arr(db.chartOfAccounts).find(x =>
      x.id !== id && x.code === code);
    if (dupeCode) { toast('Code already in use', 'error'); return; }
    const dupeName = arr(db.chartOfAccounts).find(x =>
      x.id !== id && x.name.toLowerCase() === name.toLowerCase());
    if (dupeName) { toast('Name already in use', 'error'); return; }

    if (id) {
      const a = accountObj(id);
      if (!a) return;
      a.code = code;
      a.name = name;
      a.type = type;
      a.notes = notes;
      logActivity('ACCOUNT_UPDATED', 'Account', code + ' ' + name, '');
    } else {
      db.chartOfAccounts.push({
        id: uid(),
        code: code,
        name: name,
        type: type,
        notes: notes,
        createdAt: nowISO()
      });
      logActivity('ACCOUNT_CREATED', 'Account', code + ' ' + name, '');
    }
    save();
    closeModal();
    render();
    toast(id ? '✅ Account updated' : '✅ Account created', 'success');
  }
  window.saveAccount = saveAccount;

  function deleteAccount(id) {
    if (!requirePerm('delete')) return;
    const a = accountObj(id);
    if (!a) return;
    const lines = accountMovements(id).length;
    if (lines > 0) {
      toast('Cannot delete — account has ' + lines
        + ' transaction line(s)', 'error');
      return;
    }
    confirmBox('Delete Account?',
      'Remove "' + a.code + ' — ' + a.name + '"?',
      () => {
        db.chartOfAccounts = arr(db.chartOfAccounts)
          .filter(x => x.id !== id);
        logActivity('ACCOUNT_DELETED', 'Account',
          a.code + ' ' + a.name, '');
        save();
        render();
        toast('Account deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteAccount = deleteAccount;

    openModal('📊 ' + esc(a.code) + ' — ' + esc(a.name),

          + ['Date','Reference','Description','Debit','Credit']
              .map(h => '<th style="text-align:left;padding:10px 12px;'

                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')

          + lines.slice(-20).reverse().map(l =>

              + 'white-space:nowrap">' + dateFmt(l.date) + '</td>'
              + '<td style="padding:9px 12px;font-family:var(--mono);'
              + 'font-size:11px;color:var(--text-3)">'
              + esc(l.reference || '—') + '</td>'
              + '<td style="padding:9px 12px;font-size:11.5px">'
              + esc(l.description || '') + '</td>'
              + '<td style="padding:9px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--green)">'
              + (l.debit ? money(l.debit) : '—') + '</td>'
              + '<td style="padding:9px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--red)">'
              + (l.credit ? money(l.credit) : '—') + '</td>'
              + '</tr>').join('')
          + '</tbody></table></div>'
        : '<div class="empty">No movements yet</div>')

      + '<div class="form-actions">'
      + '<button class="btn" onclick="closeModal();'
      + 'ui.view=\'generalLedger\';'
      + 'ledgerState.accountId=\'' + id + '\';render()">'
      + '📒 View Full Ledger</button>'
      + (lines.length === 0
          ? '<button class="btn danger" onclick="closeModal();'
            + 'deleteAccount(\'' + id + '\')">🗑 Delete</button>'
          : '')

      + id + '\')">✎ Edit</button>'
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.showAccountDetail = showAccountDetail;

  function exportCOACSV() {
    const rows = arr(db.chartOfAccounts).map(a => {
      const bal = accountBalance(a.id);
      return [
        a.code, a.name, a.type, a.notes || '',
        bal.debit, bal.credit, bal.net
      ];
    });
    download('chart_of_accounts_' + today() + '.csv',
      toCSV(['Code','Name','Type','Notes','TotalDebits','TotalCredits',
             'NetBalance'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' accounts', 'success');
  }
  window.exportCOACSV = exportCOACSV;

  /* ═════════════════════════════════════════════════════════════════════
     JOURNAL ENTRIES VIEW
  ═════════════════════════════════════════════════════════════════════ */
  let journalState = { q: '', from: '', to: '', type: '' };
  window.journalState = journalState;

  function nextJournalRef() {
    const year = new Date().getFullYear();
    const n = arr(db.journals).filter(j =>
      (j.reference || '').startsWith('JV-' + year)
    ).length + 1;
    return 'JV-' + year + '-' + String(n).padStart(4, '0');
  }
  window.nextJournalRef = nextJournalRef;

  function viewJournalEntries() {
    let list = arr(db.journals).slice();
    if (journalState.q) {
      const q = journalState.q.toLowerCase();
      list = list.filter(j =>
        (j.reference || '').toLowerCase().includes(q)
        || (j.description || '').toLowerCase().includes(q));
    }
    if (journalState.type === 'manual') {
      list = list.filter(j => !j.isOpening && !j.isAuto);
    } else if (journalState.type === 'opening') {
      list = list.filter(j => j.isOpening);
    } else if (journalState.type === 'auto') {
      list = list.filter(j => j.isAuto);
    }
    if (journalState.from) {
      list = list.filter(j => j.date >= journalState.from);
    }
    if (journalState.to) {
      list = list.filter(j => j.date <= journalState.to);
    }
    list.sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);

    const manualCount = arr(db.journals)
      .filter(j => !j.isOpening && !j.isAuto).length;
    const openingCount = arr(db.journals).filter(j => j.isOpening).length;
    const autoCount = arr(db.journals).filter(j => j.isAuto).length;
    const totalDebit = list.reduce((a, j) => a + NN(j.totalDebit), 0);

    return '<div class="kpi-strip">'
      + kpi('Total Entries', arr(db.journals).length, 'All types')
      + kpi('Manual', manualCount, 'Hand-entered')
      + kpi('Opening', openingCount, 'From setup')
      + kpi('Auto', autoCount, 'From transactions')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📒 Journal Entries ('
      + list.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportJournalsCSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openJournalForm()">'
      + '＋ New Journal Entry</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(journalState.q) + '" '
      + 'oninput="journalState.q=this.value;render()" '
      + 'placeholder="Reference or description"></label>'
      + '<label class="field">Type'
      + '<select onchange="journalState.type=this.value;render()">'
      + [['','All types'],['manual','Manual'],['opening','Opening'],
         ['auto','Auto']].map(([k, l]) =>
          '<option value="' + k + '" '
          + (journalState.type === k ? 'selected' : '') + '>'
          + l + '</option>').join('')
      + '</select></label>'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(journalState.from) + '" '
      + 'onchange="journalState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(journalState.to) + '" '
      + 'onchange="journalState.to=this.value;render()"></label>'
      + '</div>'

      + (list.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Date','Reference','Description','Lines','Debit','Credit','Type','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + list.map(j => {
            const badge = j.isOpening
              ? '<span class="pill pill-soft">Opening</span>'
              : j.isAuto
                ? '<span class="pill pill-info">Auto</span>'
                : '<span class="pill pill-muted">Manual</span>';
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showJournalDetail(\''
              + j.id + '\')">'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'white-space:nowrap">' + dateFmt(j.date) + '</td>'
              + '<td style="padding:11px 12px;font-family:var(--mono);'
              + 'font-size:11.5px">' + esc(j.reference || '—') + '</td>'
              + '<td style="padding:11px 12px;font-size:12px">'
              + esc((j.description || '').slice(0, 60)) + '</td>'
              + '<td style="padding:11px 12px;text-align:center;'
              + 'font-size:11.5px">' + arr(j.lines).length + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums">'
              + money(j.totalDebit) + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums">'
              + money(j.totalCredit) + '</td>'
              + '<td style="padding:11px 12px">' + badge + '</td>'
              + '<td style="padding:11px 12px" '

              + '<div style="display:flex;gap:4px">'
              + '<button class="btn sm" onclick="showJournalDetail(\''

              + (j.isOpening || j.isAuto
                  ? '<button class="btn sm" disabled '
                    + 'title="Auto/opening entries are locked">🔒</button>'
                  : '<button class="btn sm danger" '
                    + 'onclick="deleteJournal(\'' + j.id + '\')">🗑</button>')
              + '</div></td>'
              + '</tr>';

          + 'No journal entries match</div>')

  views.journalEntries = viewJournalEntries;
  window.viewJournalEntries = viewJournalEntries;

  /* ═════════════════════════════════════════════════════════════════════
     MANUAL JOURNAL FORM (double-entry with N lines)
  ═════════════════════════════════════════════════════════════════════ */
  let _journalDraft = null;

  function openJournalForm() {
    if (!requirePerm('write')) return;
    const accounts = arr(db.chartOfAccounts).slice()
      .sort((a, b) => a.code.localeCompare(b.code));
    if (accounts.length < 2) {
      toast('Add at least 2 accounts first', 'warn');
      return;
    }

    _journalDraft = {
      date: today(),
      reference: nextJournalRef(),
      description: '',
      lines: [
        { accountId: '', debit: '', credit: '', description: '' },
        { accountId: '', debit: '', credit: '', description: '' }
      ]
    };

    openModal('＋ New Journal Entry',
      '<form onsubmit="saveJournalForm(event)">'
      + '<div class="form-grid" style="grid-template-columns:1fr 1fr 2fr">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="jDate" type="date" required '
      + 'value="' + today() + '" onchange="_journalDraft.date=this.value"></label>'
      + '<label class="field">Reference'
      + '<input name="jRef" value="' + esc(_journalDraft.reference) + '" '
      + 'onchange="_journalDraft.reference=this.value"></label>'
      + '<label class="field">Description <span class="req">*</span>'
      + '<input name="jDesc" required placeholder="e.g. Owner drawings, '
      + 'Bank charge adjustment, Correction…" '
      + 'onchange="_journalDraft.description=this.value"></label>'
      + '</div>'

      + '<div class="section-title" style="margin-top:20px">Journal Lines</div>'
      + '<div id="journalLinesBox"></div>'
      + '<button type="button" class="btn sm" onclick="journalAddLine()" '
      + 'style="margin-top:8px">＋ Add Line</button>'

      + '<div id="journalTotalsBox" style="margin-top:16px;'
      + 'padding:14px 18px;background:var(--surface-2);border-radius:10px;'
      + 'font-size:13px"></div>'

      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">Post Journal</button>'
      + '</div></form>', { wide: true });

    setTimeout(() => { renderJournalLines(); renderJournalTotals(); }, 60);
  }
  window.openJournalForm = openJournalForm;

  function journalAddLine() {
    _journalDraft.lines.push({
      accountId: '', debit: '', credit: '', description: ''
    });
    renderJournalLines();
    renderJournalTotals();
  }
  window.journalAddLine = journalAddLine;

  function journalRemoveLine(i) {
    if (_journalDraft.lines.length <= 2) {
      toast('At least 2 lines required', 'warn');
      return;
    }
    _journalDraft.lines.splice(i, 1);
    renderJournalLines();
    renderJournalTotals();
  }
  window.journalRemoveLine = journalRemoveLine;

  function journalUpdateLine(i, field, value) {
    if (!_journalDraft.lines[i]) return;
    _journalDraft.lines[i][field] = value;
    /* Enforce: only debit OR credit per line */
    if (field === 'debit' && NN(value) > 0) {
      _journalDraft.lines[i].credit = '';
    } else if (field === 'credit' && NN(value) > 0) {
      _journalDraft.lines[i].debit = '';
    }
    /* Re-render will happen on the change of the input */
    if (field === 'debit' || field === 'credit') {
      renderJournalTotals();
    }
  }
  window.journalUpdateLine = journalUpdateLine;

  function renderJournalLines() {
    const box = document.getElementById('journalLinesBox');
    if (!box) return;
    const accounts = arr(db.chartOfAccounts).slice()
      .sort((a, b) => a.code.localeCompare(b.code));

    box.innerHTML = _journalDraft.lines.map((l, i) =>

          '<option value="' + a.id + '" '

      + '</select>'
      + '<input type="number" step="0.01" min="0" placeholder="Debit" '
      + 'value="' + (l.debit || '') + '" '
      + 'oninput="journalUpdateLine(' + i + ',\'debit\',this.value);'

      + '<input type="number" step="0.01" min="0" placeholder="Credit" '
