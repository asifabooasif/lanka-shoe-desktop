<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 14 — DETAIL REPORTS
   Adds: Customer Statements · Supplier Statements · Aging Reports ·
         Sales Analysis · Comparison (M/M, Y/Y) ·
         Customer Business Report (for sales-persons)
   Depends on: Parts 1–13
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part14Loaded) return;
  window._part14Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     LEDGER BUILDERS
  ═════════════════════════════════════════════════════════════════════ */

  /* ─── Customer ledger with running balance ───
     Sources: opening + credit sales (Dr) + receipts (Cr)
              + bounced (Dr) + settlements (Cr) + plan down (Cr) */
  function customerLedgerRows(customerId, from, to) {
    const c = custObj(customerId);
    if (!c) return { rows: [], opening: 0, closing: 0, totalDebit: 0,
                     totalCredit: 0 };

    const events = [];

    /* Opening */
    if (NN(c.openingBalance) !== 0 && c.since) {
      events.push({
        date: c.since,
        type: 'Opening',
        ref: '',
        desc: 'Opening balance',
        debit: NN(c.openingBalance),
        credit: 0,
        icon: '📌',
        kind: 'opening'
      });
    }

    /* Credit sales */
    arr(db.sales).forEach(s => {
      if (s.customerId !== customerId) return;
      if (s.type !== 'credit') return;
      events.push({
        date: s.date,
        type: 'Credit Sale',
        ref: s.reference || '',
        desc: (s.categoryId ? catName(s.categoryId) : 'Sale')
          + (s.notes ? ' · ' + s.notes.slice(0, 40) : ''),
        debit: NN(s.amount),
        credit: 0,
        icon: '📝',
        kind: 'sale',
        link: { view: 'sales', id: s.id }
      });
    });

    /* Cash sales — shown as info rows (no balance impact) */
    arr(db.sales).forEach(s => {
      if (s.customerId !== customerId) return;
      if (s.type !== 'cash') return;
      events.push({
        date: s.date,
        type: 'Cash Sale',
        ref: s.reference || '',
        desc: (s.categoryId ? catName(s.categoryId) : 'Sale')
          + ' · Paid at sale',
        debit: 0,
        credit: 0,
        info: NN(s.amount),
        icon: '💵',
        kind: 'cashsale',
        link: { view: 'sales', id: s.id }
      });
    });

    /* Receipts (payment received) */
    arr(db.receipts).forEach(r => {
      if (r.customerId !== customerId) return;
      events.push({
        date: r.date,
        type: 'Receipt',
        ref: r.reference || '',
        desc: r.method
          + (r._planId
              ? ' · Installment #' + r._installmentN
              : '')
          + (r.notes ? ' · ' + r.notes.slice(0, 40) : ''),
        debit: 0,
        credit: NN(r.amount),
        icon: r._planId ? '💳' : '📥',
        kind: 'receipt',
        link: { view: 'receipts', id: r.id }
      });
    });

    /* Customer cheques — bounced adds debit, settlement credits */
    arr(db.customerCheques).forEach(cq => {
      if (cq.customerId !== customerId) return;
      if (cq.status === 'Bounced') {
        events.push({
          date: cq.bouncedDate || cq.dueDate,
          type: 'Cheque Bounced',
          ref: '#' + (cq.chequeNo || ''),
          desc: (cq.bounceReason || 'Bounced')
            + ' · ' + money(cq.amount) + ' reversed',
          debit: NN(cq.amount),
          credit: 0,
          icon: '⛔',
          kind: 'bounce'
        });
      }
    });

    /* Cheque settlements (recovery) */
    arr(db.chequeSettlements).forEach(st => {
      const cq = custChequeObj(st.chequeId);
      if (!cq || cq.customerId !== customerId) return;
      events.push({
        date: st.date,
        type: 'Cheque Recovered',
        ref: '#' + (cq.chequeNo || ''),
        desc: st.method + (st.reference
          ? ' · ' + st.reference : ''),
        debit: 0,
        credit: NN(st.amount),
        icon: '💰',
        kind: 'recovery'
      });
    });

    /* Sort by date + kind priority */
    events.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      const order = { opening: 0, sale: 1, cashsale: 2, receipt: 3,
                     bounce: 4, recovery: 5 };
      return (order[a.kind] || 99) - (order[b.kind] || 99);
    });

    /* Opening balance as at `from` */
    let openingBal = 0;
    if (from) {
      events.forEach(e => {
        if (e.date < from) {
          openingBal += NN(e.debit) - NN(e.credit);
        }
      });
    }

    /* Filter to range */
    const inRange = events.filter(e =>
      (!from || e.date >= from) && (!to || e.date <= to));

    /* Running balance */
    let running = openingBal;
    const rows = inRange.map(e => {
      running += NN(e.debit) - NN(e.credit);
      return Object.assign({}, e, { balance: running });
    });

    const totalDebit = rows.reduce((a, e) => a + NN(e.debit), 0);
    const totalCredit = rows.reduce((a, e) => a + NN(e.credit), 0);

    return {
      customer: c,
      rows: rows,
      opening: openingBal,
      closing: running,
      totalDebit: totalDebit,
      totalCredit: totalCredit
    };
  }
  window.customerLedgerRows = customerLedgerRows;

  /* ─── Supplier ledger rows ─── */
  function supplierLedgerRows(supplierId, from, to) {
    const s = supObj(supplierId);
    if (!s) return { rows: [], opening: 0, closing: 0, totalDebit: 0,
                     totalCredit: 0 };
    const events = [];

    if (NN(s.openingBalance) !== 0) {
      events.push({
        date: s.since || today(),
        type: 'Opening',
        ref: '',
        desc: 'Opening balance',
        debit: 0, credit: NN(s.openingBalance),
        icon: '📌', kind: 'opening'
      });
    }

    arr(db.purchases).forEach(p => {
      if (p.supplierId !== supplierId) return;
      events.push({
        date: p.date,
        type: 'Purchase',
        ref: p.invoiceNo || '',
        desc: (p.categoryId ? catName(p.categoryId) : 'Purchase')
          + (p.description ? ' · ' + p.description.slice(0, 40) : ''),
        debit: 0, credit: NN(p.amount),
        icon: '🛒', kind: 'purchase',
        link: { view: 'purchases', id: p.id }
      });
    });

    arr(db.payments).forEach(p => {
      if (p.supplierId !== supplierId || p.fullyReversed) return;
      events.push({
        date: p.date,
        type: 'Payment',
        ref: p.reference || '',
        desc: p.mode + (p.chequeNo ? ' · Chq ' + p.chequeNo : '')
          + (p.notes ? ' · ' + p.notes.slice(0, 40) : ''),
        debit: NN(p.amount), credit: 0,
        icon: '💸', kind: 'payment',
        link: { view: 'payments', id: p.id }
      });
    });

    arr(db.supplierReturns).forEach(r => {
      if (r.supplierId !== supplierId) return;
      events.push({
        date: r.date,
        type: 'Return',
        ref: r.reference || '',
        desc: r.reason || 'Return / Debit note',
        debit: NN(r.amount), credit: 0,
        icon: '↩️', kind: 'return'
      });
    });

    events.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      const order = { opening: 0, purchase: 1, payment: 2, return: 3 };
      return (order[a.kind] || 99) - (order[b.kind] || 99);
    });

    let openingBal = 0;
    if (from) {
      events.forEach(e => {
        if (e.date < from) {
          openingBal += NN(e.credit) - NN(e.debit);
        }
      });
    }

    const inRange = events.filter(e =>
      (!from || e.date >= from) && (!to || e.date <= to));

    let running = openingBal;
    const rows = inRange.map(e => {
      running += NN(e.credit) - NN(e.debit);
      return Object.assign({}, e, { balance: running });
    });

    const totalDebit = rows.reduce((a, e) => a + NN(e.debit), 0);
    const totalCredit = rows.reduce((a, e) => a + NN(e.credit), 0);

    return {
      supplier: s,
      rows: rows,
      opening: openingBal,
      closing: running,
      totalDebit: totalDebit,
      totalCredit: totalCredit
    };
  }
  window.supplierLedgerRows = supplierLedgerRows;

  /* ─── Customer aging (unpaid credit sales) ─── */
  function customerAging(customerId, asOf) {
    asOf = asOf || today();
    const unpaid = [];
    arr(db.sales).forEach(s => {
      if (s.customerId !== customerId) return;
      if (s.type !== 'credit') return;
      const outstanding = NN(s.amount) - NN(s.allocatedAmount);
      if (outstanding <= 0.01) return;
      unpaid.push({
        sale: s,
        outstanding: outstanding,
        dueDate: s.expectedPaymentDate || s.date
      });
    });

    const c = custObj(customerId);
    const creditDays = c ? NN(c.creditDays) || 30 : 30;

    let current = 0, d30 = 0, d60 = 0, d90 = 0;
    unpaid.forEach(u => {
      const age = Math.abs(daysBetween(u.dueDate, asOf));
      const isOverdue = u.dueDate < asOf;
      const overdueDays = isOverdue
        ? Math.abs(daysBetween(u.dueDate, asOf)) : 0;
      if (!isOverdue) current += u.outstanding;
      else if (overdueDays <= 30) d30 += u.outstanding;
      else if (overdueDays <= 60) d60 += u.outstanding;
      else d90 += u.outstanding;
    });

    return {
      current: current, d30: d30, d60: d60, d90: d90,
      total: current + d30 + d60 + d90,
      unpaidCount: unpaid.length,
      unpaid: unpaid
    };
  }
  window.customerAging = customerAging;

  /* ─── Customer reliability ─── */
  function customerReliability(customerId) {
    const settled = arr(db.sales)
      .filter(s => s.customerId === customerId
        && s.type === 'credit'
        && s.status === 'settled');
    if (!settled.length) {
      return { label: 'New', cls: 'pill-muted', onTimePct: null,
               avgDays: null, bounceCount: 0 };
    }
    const onTime = settled.filter(s =>
      NN(s.daysToSettle) <= NN(s.creditDays) + 0.5).length;
    const onTimePct = Math.round((onTime / settled.length) * 100);
    const avgDays = settled.reduce((a, s) =>
      a + NN(s.daysToSettle), 0) / settled.length;
    const bounceCount = arr(db.customerCheques)
      .filter(c => c.customerId === customerId
        && c.status === 'Bounced').length;

    let cls, label;
    if (onTimePct >= 90 && bounceCount === 0) {
      cls = 'pill-ok'; label = 'Trusted';
    } else if (onTimePct >= 70 && bounceCount <= 1) {
      cls = 'pill-warn'; label = 'Watch';
    } else {
      cls = 'pill-danger'; label = 'Risky';
    }
    return {
      label: label, cls: cls, onTimePct: onTimePct,
      avgDays: Math.round(avgDays), bounceCount: bounceCount
    };
  }
  window.customerReliability = customerReliability;

  /* ─── Customer tier ─── */
  function computeCustomerTiers() {
    const rows = arr(db.customers).map(c => {
      const sales = arr(db.sales).filter(s => s.customerId === c.id);
      const ltv = sales.reduce((a, s) => a + NN(s.amount), 0);
      const rel = customerReliability(c.id);
      return { customer: c, ltv: ltv, reliability: rel };
    });
    /* Sort by LTV desc */
    rows.sort((a, b) => b.ltv - a.ltv);
    const n = rows.length;

    rows.forEach((r, i) => {
      const pct = n > 0 ? i / n : 1;
      const relOk = r.reliability.label === 'Trusted';
      const relWatch = r.reliability.label === 'Watch'
        || r.reliability.label === 'New';
      if (pct < 0.05 && relOk && r.ltv > 0) {
        r.tier = 'platinum';
      } else if (pct < 0.20 && (relOk || relWatch) && r.ltv > 0) {
        r.tier = 'gold';
      } else if (pct < 0.50 && r.ltv > 0) {
        r.tier = 'silver';
      } else {
        r.tier = 'bronze';
      }
    });
    return rows;
  }
  window.computeCustomerTiers = computeCustomerTiers;

  const TIER_INFO = {

  function customerTier(customerId) {
    const tiers = computeCustomerTiers();
    const found = tiers.find(t => t.customer.id === customerId);
    return found ? found.tier : 'bronze';
  }

  let agingState = { tab: 'receivable', asOf: today() };
  window.agingState = agingState;

  function viewAgingReport() {
    const tab = agingState.tab;
    const asOf = agingState.asOf;

    const kpis = tab === 'receivable'
      ? (() => {
          let cur = 0, d30 = 0, d60 = 0, d90 = 0;
          arr(db.customers).forEach(c => {
            const a = customerAging(c.id, asOf);
            cur += a.current; d30 += a.d30;
            d60 += a.d60; d90 += a.d90;
          });
          return { cur, d30, d60, d90, total: cur + d30 + d60 + d90 };
        })()
      : (() => {
          const g = globalAging();
          return { cur: g.current, d30: g.d30, d60: g.d60, d90: g.d90,
                   total: g.total };
        })();

    return '<div class="card">'
      + '<div class="card-head"><h3>⏳ Aging Report</h3>'
      + '<button class="btn sm" onclick="printAgingReport()">🖨 Print</button>'
      + '</div>'

      + '<div class="tabs-bar" style="margin-bottom:14px">'
      + ['receivable','payable'].map(t =>
          '<div class="tab-chip ' + (tab === t ? 'active' : '') + '" '
          + 'onclick="agingState.tab=\'' + t + '\';render()">'
          + (t === 'receivable' ? '📥 Customer Receivables'
              : '📤 Supplier Payables')
          + '</div>').join('')
      + '</div>'

      + '<div class="form-grid" style="grid-template-columns:1fr 2fr;'
      + 'margin-bottom:16px">'
      + '<label class="field">As of Date'
      + '<input type="date" value="' + esc(asOf) + '" '
      + 'onchange="agingState.asOf=this.value;render()"></label>'
      + '<div></div></div>'

      + '<div class="aging-strip">'
      + agingCell('Current', kpis.cur, 'var(--green)')
      + agingCell('1–30 days', kpis.d30, 'var(--amber)')
      + agingCell('31–60 days', kpis.d60, '#ea580c')

  let salesAnalysisState = { period: 'thisMonth', from: '', to: '' };
  window.salesAnalysisState = salesAnalysisState;

  function viewSalesAnalysis() {
    const range = resolvePeriodRange(salesAnalysisState.period,
      salesAnalysisState.from, salesAnalysisState.to);

    const sales = arr(db.sales).filter(s =>
      (!range.from || s.date >= range.from)
      && (!range.to || s.date <= range.to));

    const total = sales.reduce((a, s) => a + NN(s.amount), 0);
    const cashTotal = sales.filter(s => s.type === 'cash')
      .reduce((a, s) => a + NN(s.amount), 0);
    const creditTotal = sales.filter(s => s.type === 'credit')
      .reduce((a, s) => a + NN(s.amount), 0);
    const avgTicket = sales.length ? total / sales.length : 0;

    /* By category */
    const byCat = {};
    sales.forEach(s => {
      const cid = s.categoryId || '_none';
      if (!byCat[cid]) byCat[cid] = { count: 0, total: 0, cash: 0,
                                       credit: 0 };
      byCat[cid].count++;
      byCat[cid].total += NN(s.amount);
      if (s.type === 'cash') byCat[cid].cash += NN(s.amount);
      else byCat[cid].credit += NN(s.amount);
    });
    const catRows = Object.keys(byCat).map(cid => ({
      name: cid === '_none' ? 'Uncategorised' : catName(cid),
      count: byCat[cid].count,
      total: byCat[cid].total,
      cash: byCat[cid].cash,
      credit: byCat[cid].credit,
      share: total > 0 ? (byCat[cid].total / total) * 100 : 0
    })).sort((a, b) => b.total - a.total);

    /* By customer */
    const byCust = {};
    sales.forEach(s => {
      if (!s.customerId) return;
      if (!byCust[s.customerId]) byCust[s.customerId] = {
        count: 0, total: 0
      };
      byCust[s.customerId].count++;
      byCust[s.customerId].total += NN(s.amount);
    });
    const custRows = Object.keys(byCust).map(cid => ({
      customer: custObj(cid),
      count: byCust[cid].count,
      total: byCust[cid].total,
      share: total > 0 ? (byCust[cid].total / total) * 100 : 0
    })).sort((a, b) => b.total - a.total);

    /* By month */
    const monthly = {};
    sales.forEach(s => {
      const m = s.date.slice(0, 7);
      if (!monthly[m]) monthly[m] = 0;
      monthly[m] += NN(s.amount);
    });
    const monthRows = Object.keys(monthly).sort().map(m => ({
      month: m, total: monthly[m]
    }));

    /* By day of week */
    const byDow = [0, 0, 0, 0, 0, 0, 0];
    const dowNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    sales.forEach(s => {
      const d = new Date(s.date + 'T00:00:00');
      if (!isNaN(d.getTime())) byDow[d.getDay()] += NN(s.amount);
    });

    return '<div class="card">'
      + '<div class="card-head"><h3>📊 Sales Analysis</h3>'
      + '<button class="btn sm" onclick="printSalesAnalysis()">🖨 Print</button>'
      + '</div>'

      + '<div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Period'
      + '<select onchange="salesAnalysisState.period=this.value;render()">'
      + [['thisMonth','This Month'],['lastMonth','Last Month'],
         ['thisQuarter','This Quarter'],['thisYear','This Year'],
         ['lastYear','Last Year'],['allTime','All Time'],
         ['custom','Custom Range']].map(([k, l]) =>
          '<option value="' + k + '" '
          + (salesAnalysisState.period === k ? 'selected' : '')
          + '>' + l + '</option>').join('')
      + '</select></label>'
      + (salesAnalysisState.period === 'custom'
        ? '<label class="field">From'
          + '<input type="date" value="' + esc(salesAnalysisState.from)
          + '" onchange="salesAnalysisState.from=this.value;render()">'
          + '</label>'
          + '<label class="field">To'
          + '<input type="date" value="' + esc(salesAnalysisState.to)
          + '" onchange="salesAnalysisState.to=this.value;render()">'
          + '</label>'
        : '<label class="field">Range'
          + '<input value="' + dateFmt(range.from || '') + ' → '
          + dateFmt(range.to || '') + '" disabled '
          + 'style="background:var(--surface-2)"></label><div></div>')
      + '</div>'

      + '<div class="kpi-strip">'
      + kpi('Total Sales', money(total),
          sales.length + ' bills')
      + kpi('Cash Sales', money(cashTotal),
          total > 0
            ? Math.round(cashTotal / total * 100) + '% of total' : '—')
      + kpi('Credit Sales', money(creditTotal),
          total > 0
            ? Math.round(creditTotal / total * 100) + '% of total' : '—')
      + kpi('Average Ticket', money(avgTicket),
          sales.length ? 'Per bill' : '—')
      + '</div>'

      /* By category */
      + '<div class="section-title">By Category</div>'
      + (catRows.length
        ? '<div style="overflow-x:auto">'
          + '<table class="stmt-table"><thead><tr>'
          + ['Category','Bills','Cash','Credit','Total','Share %']
              .map(h => '<th style="text-align:left;padding:10px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + catRows.map(r =>
              '<tr style="border-bottom:1px solid var(--border-2)">'
              + '<td style="padding:9px 12px"><strong>'
              + esc(r.name) + '</strong></td>'
              + '<td style="padding:9px 12px;text-align:right">'
              + r.count + '</td>'
              + '<td style="padding:9px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--green)">'
              + money(r.cash) + '</td>'
              + '<td style="padding:9px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;color:var(--amber)">'
              + money(r.credit) + '</td>'
              + '<td style="padding:9px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:700">'
              + money(r.total) + '</td>'
              + '<td style="padding:9px 12px;text-align:right">'
              + r.share.toFixed(1) + '%</td></tr>').join('')
          + '</tbody></table></div>'
        : '<div class="empty">No sales in period</div>')

      /* Top customers */
      + '<div class="section-title">Top Customers</div>'
      + (custRows.length
        ? '<div style="overflow-x:auto">'
          + '<table class="stmt-table"><thead><tr>'
          + ['#','Customer','Bills','Total','Share %','']
              .map(h => '<th style="text-align:left;padding:10px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + custRows.slice(0, 20).map((r, i) =>
              '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" '
              + 'onclick="selectCustomerForStatement(\'' + r.customer.id
              + '\');ui.view=\'customerStatements\';render()">'
              + '<td style="padding:9px 12px;font-weight:600">#'
              + (i + 1) + '</td>'
              + '<td style="padding:9px 12px"><strong>'
              + esc(r.customer.name) + '</strong></td>'
              + '<td style="padding:9px 12px;text-align:right">'
              + r.count + '</td>'
              + '<td style="padding:9px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:700">'
              + money(r.total) + '</td>'
              + '<td style="padding:9px 12px;text-align:right">'
              + r.share.toFixed(1) + '%</td>'
              + '<td style="padding:9px 12px">'
              + '→</td></tr>').join('')
          + '</tbody></table></div>'
        : '')

      /* By day-of-week */
      + (sales.length
        ? '<div class="section-title">By Day of Week</div>'
          + '<div style="display:grid;grid-template-columns:'
          + 'repeat(7,1fr);gap:10px">'
          + byDow.map((v, i) => {
            const max = Math.max(1, ...byDow);
            return '<div style="text-align:center;padding:12px 8px;'
              + 'background:var(--surface-2);border-radius:10px">'
              + '<div style="font-size:10.5px;text-transform:uppercase;'
              + 'color:var(--text-3);font-weight:700">'
              + dowNames[i] + '</div>'
              + '<div style="font-size:14px;font-weight:800;margin-top:6px;'
              + 'color:var(--accent-text)">' + fmtCompact(v) + '</div>'
              + '<div style="height:4px;background:var(--surface-3);'
              + 'border-radius:2px;margin-top:6px;overflow:hidden">'
              + '<div style="height:100%;width:'
              + (v / max * 100).toFixed(0) + '%;background:var(--accent)">'
              + '</div></div></div>';
          }).join('')
          + '</div>'
        : '')

      + '</div>';
  }
  views.salesAnalysis = viewSalesAnalysis;

    const html = '<div style="padding:8px">'

  let cmpState = {
    mode: 'month',
    monthA: thisMonth(),
    monthB: (() => {
      const d = new Date();

      d.setMonth(d.getMonth() - 1);

      fromB = cfg.monthB + '-01'; toB = cfg.monthB + '-31';
    } else {
      labelA = String(cfg.yearA);
      labelB = String(cfg.yearB);
      fromA = cfg.yearA + '-01-01'; toA = cfg.yearA + '-12-31';
      fromB = cfg.yearB + '-01-01'; toB = cfg.yearB + '-12-31';
    }

    const snap = (from, to) => {
      const sales = arr(db.sales).filter(s =>
        s.date >= from && s.date <= to);
      const cashSales = sales.filter(s => s.type === 'cash')
        .reduce((a, s) => a + NN(s.amount), 0);
      const creditSales = sales.filter(s => s.type === 'credit')
        .reduce((a, s) => a + NN(s.amount), 0);
      const purchases = arr(db.purchases)
        .filter(p => p.date >= from && p.date <= to)
        .reduce((a, p) => a + NN(p.amount), 0);
      const expenses = arr(db.expenses)
        .filter(e => e.date >= from && e.date <= to)
        .reduce((a, e) => a + NN(e.amount), 0);
      const receipts = arr(db.receipts)
        .filter(r => r.date >= from && r.date <= to)
        .reduce((a, r) => a + NN(r.amount), 0);
      const payments = arr(db.payments)
        .filter(p => !p.fullyReversed && p.date >= from && p.date <= to)
        .reduce((a, p) => a + NN(p.amount), 0);
      return {
        totalSales: cashSales + creditSales,
        cashSales: cashSales,
        creditSales: creditSales,
        purchases: purchases,
        expenses: expenses,
        receipts: receipts,
        payments: payments,
        grossProfit: cashSales + creditSales - purchases,
        netProfit: cashSales + creditSales - purchases - expenses,
        salesCount: sales.length,
        avgTicket: sales.length
          ? (cashSales + creditSales) / sales.length : 0
      };
    };

    const A = snap(fromA, toA);
    const B = snap(fromB, toB);

    const diffPct = (a, b) => b === 0 ? (a === 0 ? 0 : 100)
      : ((a - b) / Math.abs(b)) * 100;

    const rows = [
      { label: 'Total Sales', a: A.totalSales, b: B.totalSales,
        delta: diffPct(A.totalSales, B.totalSales) },
      { label: 'Cash Sales', a: A.cashSales, b: B.cashSales,
        delta: diffPct(A.cashSales, B.cashSales) },
      { label: 'Credit Sales', a: A.creditSales, b: B.creditSales,
        delta: diffPct(A.creditSales, B.creditSales) },
      { label: 'Purchases', a: A.purchases, b: B.purchases,
        delta: diffPct(A.purchases, B.purchases), invert: true },
      { label: 'Expenses', a: A.expenses, b: B.expenses,
        delta: diffPct(A.expenses, B.expenses), invert: true },
      { label: 'Receipts', a: A.receipts, b: B.receipts,
        delta: diffPct(A.receipts, B.receipts) },
      { label: 'Payments', a: A.payments, b: B.payments,
        delta: diffPct(A.payments, B.payments), invert: true },
      { label: 'Gross Profit', a: A.grossProfit, b: B.grossProfit,
        delta: diffPct(A.grossProfit, B.grossProfit) },
      { label: 'Net Profit', a: A.netProfit, b: B.netProfit,
        delta: diffPct(A.netProfit, B.netProfit) },
      { label: 'Sales Count', a: A.salesCount, b: B.salesCount,
        delta: diffPct(A.salesCount, B.salesCount), numOnly: true },
      { label: 'Avg Ticket', a: A.avgTicket, b: B.avgTicket,
        delta: diffPct(A.avgTicket, B.avgTicket) }
    ];

    return '<div class="card">'
      + '<div class="card-head"><h3>📊 Comparison Report</h3>'
      + '<button class="btn sm" onclick="printComparison()">🖨 Print</button>'
      + '</div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'auto 1fr 1fr;margin-bottom:14px">'
      + '<label class="field">Compare by'
      + '<select onchange="cmpState.mode=this.value;render()">'
      + '<option value="month" '
      + (cfg.mode === 'month' ? 'selected' : '') + '>Month</option>'
      + '<option value="year" '
      + (cfg.mode === 'year' ? 'selected' : '') + '>Year</option>'
      + '</select></label>'
      + (cfg.mode === 'month'
        ? '<label class="field">' + labelA + ' (current)'
          + '<input type="month" value="' + cfg.monthA + '" '
          + 'onchange="cmpState.monthA=this.value;render()"></label>'
          + '<label class="field">' + labelB + ' (compare)'
          + '<input type="month" value="' + cfg.monthB + '" '
          + 'onchange="cmpState.monthB=this.value;render()"></label>'
        : '<label class="field">' + labelA + ' (current)'
          + '<input type="number" min="2000" max="2100" '
          + 'value="' + cfg.yearA + '" '
          + 'onchange="cmpState.yearA=+this.value;render()"></label>'
          + '<label class="field">' + labelB + ' (compare)'
          + '<input type="number" min="2000" max="2100" '
          + 'value="' + cfg.yearB + '" '
          + 'onchange="cmpState.yearB=+this.value;render()"></label>')
      + '</div>'

      + '<div style="overflow-x:auto">'
      + '<table class="stmt-table"><thead><tr>'
      + ['Metric', labelA, labelB, 'Change', '%']
          .map((h, i) => '<th style="text-align:'
            + (i === 0 ? 'left' : 'right') + ';padding:11px 12px;'
            + 'font-size:10.5px;text-transform:uppercase;'
            + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
            + 'border-bottom:1px solid var(--border)">'
            + esc(h) + '</th>').join('')
      + '</tr></thead><tbody>'
      + rows.map(r => {
        const deltaColor = r.invert
          ? (r.delta > 0 ? 'var(--red)'
              : r.delta < 0 ? 'var(--green)' : 'var(--text-3)')
          : (r.delta > 0 ? 'var(--green)'
              : r.delta < 0 ? 'var(--red)' : 'var(--text-3)');
        const arrow = r.delta > 0.5 ? '▲'
          : r.delta < -0.5 ? '▼' : '−';
        return '<tr style="border-bottom:1px solid var(--border-2)">'
          + '<td style="padding:11px 12px">' + esc(r.label) + '</td>'
          + '<td style="padding:11px 12px;text-align:right;'
          + 'font-variant-numeric:tabular-nums;font-weight:700">'
          + (r.numOnly ? r.a : money(r.a)) + '</td>'
          + '<td style="padding:11px 12px;text-align:right;'
          + 'font-variant-numeric:tabular-nums">'
          + (r.numOnly ? r.b : money(r.b)) + '</td>'
          + '<td style="padding:11px 12px;text-align:right;'
          + 'font-variant-numeric:tabular-nums;color:' + deltaColor + '">'
          + (r.numOnly ? (r.a - r.b).toFixed(0)
              : money(r.a - r.b)) + '</td>'
          + '<td style="padding:11px 12px;text-align:right;'
          + 'font-weight:700;color:' + deltaColor + '">'
          + arrow + ' ' + Math.abs(r.delta).toFixed(1) + '%</td>'
          + '</tr>';
      }).join('')
      + '</tbody></table></div>'
      + '</div>';
  }
  views.comparison = viewComparison;
  window.viewComparison = viewComparison;

  function printComparison() {
    const cfg = cmpState;
    let labelA, labelB, fromA, toA, fromB, toB;
    if (cfg.mode === 'month') {
      labelA = monthName(cfg.monthA); labelB = monthName(cfg.monthB);
      fromA = cfg.monthA + '-01'; toA = cfg.monthA + '-31';

    } else {
      labelA = String(cfg.yearA); labelB = String(cfg.yearB);
      fromA = cfg.yearA + '-01-01'; toA = cfg.yearA + '-12-31';
      fromB = cfg.yearB + '-01-01'; toB = cfg.yearB + '-12-31';
    }
    const snap = (from, to) => {
      const sales = arr(db.sales).filter(s =>
        s.date >= from && s.date <= to);
      const cash = sales.filter(s => s.type === 'cash')
        .reduce((a, s) => a + NN(s.amount), 0);

  /* ═════════════════════════════════════════════════════════════════════
     SECTION 6 — CUSTOMER BUSINESS REPORT (Sales-person)
  ═════════════════════════════════════════════════════════════════════ */
  function buildCustomerBusinessReport(customerId) {
    const c = custObj(customerId);
    if (!c) return null;

    const sales = arr(db.sales).filter(s => s.customerId === customerId);
    const total = sales.reduce((a, s) => a + NN(s.amount), 0);
    const cashSales = sales.filter(s => s.type === 'cash')
      .reduce((a, s) => a + NN(s.amount), 0);
    const creditSales = sales.filter(s => s.type === 'credit')
      .reduce((a, s) => a + NN(s.amount), 0);
    const bills = sales.length;
    const avgTicket = bills ? total / bills : 0;
    const biggestBill = sales.length
      ? Math.max.apply(null, sales.map(s => NN(s.amount))) : 0;
    const firstSale = sales.slice().sort((a, b) =>
      (a.date || '') < (b.date || '') ? -1 : 1)[0];
    const lastSale = sales.slice().sort((a, b) =>
      (b.date || '') < (a.date || '') ? -1 : 1)[0];
    const daysSinceLast = lastSale
      ? Math.abs(daysBetween(lastSale.date, today())) : null;

    /* Frequency: avg days between sales */
    let frequency = null;
    if (sales.length >= 2) {
      const sorted = sales.slice().sort((a, b) =>
        (a.date || '') < (b.date || '') ? -1 : 1);
      let totalGap = 0;
      for (let i = 1; i < sorted.length; i++) {
        totalGap += Math.abs(daysBetween(sorted[i - 1].date, sorted[i].date));
      }
      frequency = Math.round(totalGap / (sorted.length - 1));
    }

    /* Peak buying month */
    const byMonth = {};
    sales.forEach(s => {
      const m = s.date.slice(0, 7);
      byMonth[m] = (byMonth[m] || 0) + NN(s.amount);
    });
    const peakMonth = Object.keys(byMonth)
      .sort((a, b) => byMonth[b] - byMonth[a])[0];

    /* Cash vs credit split */
    const cashPct = total > 0 ? Math.round(cashSales / total * 100) : 0;
    const creditPct = 100 - cashPct;

    /* Rank among all customers */
    const allLTV = arr(db.customers).map(x => ({
      id: x.id,
      ltv: arr(db.sales).filter(s => s.customerId === x.id)
        .reduce((a, s) => a + NN(s.amount), 0)
    })).sort((a, b) => b.ltv - a.ltv);
    const rank = allLTV.findIndex(x => x.id === customerId) + 1;

    /* Reliability + aging + tier */
    const rel = customerReliability(customerId);
    const aging = customerAging(customerId);
    const tier = customerTier(customerId);
    const tierInfo = TIER_INFO[tier];
    const balance = customerBalance(customerId);

    /* Last payment */
    const lastReceipt = arr(db.receipts)
      .filter(r => r.customerId === customerId)
      .sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1)[0];

    /* Recommendation */
    let recommendation = 'Regular follow-up — customer is on track.';
    if (aging.d90 > 0) {
      recommendation = 'URGENT: ' + money(aging.d90)
        + ' is 90+ days overdue. Call to arrange payment.';
    } else if (aging.d60 > 0) {
      recommendation = 'Chase ' + money(aging.d60)
        + ' overdue 60+ days. Send WhatsApp reminder.';
    } else if (aging.d30 > 0) {
      recommendation = 'Follow up on ' + money(aging.d30)
        + ' overdue balance.';
    } else if (daysSinceLast !== null && daysSinceLast > 60) {
      recommendation = 'Customer hasn\'t bought in ' + daysSinceLast
        + ' days. Visit to re-engage.';
    } else if (rel.label === 'Risky') {
      recommendation = 'High bounce history — verify before credit sale.';
    } else if (tier === 'platinum' || tier === 'gold') {
      recommendation = 'Top customer — offer loyalty discount on next visit.';
    }

    /* Last 5 sales */
    const recentSales = sales.slice()
      .sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1)
      .slice(0, 5);

    return {
      customer: c,
      sales: sales,
      total: total,
      cashSales: cashSales,
      creditSales: creditSales,
      bills: bills,
      avgTicket: avgTicket,
      biggestBill: biggestBill,
      firstSale: firstSale,
      lastSale: lastSale,
      daysSinceLast: daysSinceLast,
      frequency: frequency,
      peakMonth: peakMonth,
      cashPct: cashPct,
      creditPct: creditPct,
      rank: rank,
      totalCustomers: allLTV.length,
      reliability: rel,
      aging: aging,
      tier: tier,
      tierInfo: tierInfo,
      balance: balance,
      lastReceipt: lastReceipt,
      recommendation: recommendation,
      recentSales: recentSales
    };
  }

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 15 — COMPLIANCE + COMMUNICATION
   Adds: VAT Report · Tax Summary · Smart Reminder Queue ·
         WhatsApp Single + Templates · Bulk Campaigns · Email Digest
   Depends on: Parts 1–14
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part15Loaded) return;
  window._part15Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     SECTION 1 — VAT REPORT (IRD-ready)
  ═════════════════════════════════════════════════════════════════════ */
  let vatState = { period: 'thisMonth', month: thisMonth(),
                   from: '', to: '' };
  window.vatState = vatState;

  function computeVAT(from, to) {
    const vat = db.settings.vat || { rate: 18, inclusive: true };
    const rate = NN(vat.rate) / 100;
    const inclusive = vat.inclusive !== false;

    const sales = arr(db.sales).filter(s =>
      (!from || s.date >= from) && (!to || s.date <= to));
    const purchases = arr(db.purchases).filter(p =>
      (!from || p.date >= from) && (!to || p.date <= to));

    /* Output VAT */
    let outputBase = 0, outputVAT = 0, outputTotal = 0;
    let taxableSales = 0;
    sales.forEach(s => {
      const amt = NN(s.amount);
      const vatAmt = NN(s.vatAmount);
      if (vatAmt > 0) {
        outputVAT += vatAmt;
        outputBase += amt - vatAmt;
        outputTotal += amt;
      } else if (inclusive) {
        const base = amt / (1 + rate);
        outputBase += base;
        outputVAT += amt - base;
        outputTotal += amt;
      } else {
        outputBase += amt;
        outputVAT += amt * rate;
        outputTotal += amt * (1 + rate);
      }
      taxableSales++;
    });

    /* Input VAT */
    let inputBase = 0, inputVAT = 0, inputTotal = 0;
    let taxablePurchases = 0;
    purchases.forEach(p => {
      const amt = NN(p.amount);
      const base = inclusive ? amt / (1 + rate) : amt;
      inputBase += base;
      inputVAT += base * rate;
      inputTotal += amt;
      taxablePurchases++;
    });

    const netVAT = outputVAT - inputVAT;

    return {
      outputBase: outputBase,
      outputVAT: outputVAT,
      outputTotal: outputTotal,
      inputBase: inputBase,
      inputVAT: inputVAT,
      inputTotal: inputTotal,
      netVAT: netVAT,
      rate: NN(vat.rate),
      inclusive: inclusive,
      taxableSales: taxableSales,
      taxablePurchases: taxablePurchases
    };
  }
  window.computeVAT = computeVAT;

  function viewVATReport() {
    const range = resolvePeriodRange(vatState.period,
      vatState.from, vatState.to);
    /* If period is a month, use the month field */
    let from = range.from, to = range.to;
    if (vatState.period === 'month') {
      from = vatState.month + '-01';
      to = vatState.month + '-31';
    }
    const vat = computeVAT(from, to);
    const settings = db.settings.vat || {};

    return '<div class="kpi-strip">'
      + kpi('Output VAT', money(vat.outputVAT),
          'On sales @ ' + vat.rate + '%')
      + kpi('Input VAT', money(vat.inputVAT),
          'On purchases @ ' + vat.rate + '%')
      + kpi(vat.netVAT >= 0 ? 'Net VAT Payable' : 'VAT Refundable',
          money(Math.abs(vat.netVAT)),
          vat.netVAT >= 0 ? 'To be paid to IRD' : 'To claim back')
      + kpi('Rate', vat.rate + '%',
          vat.inclusive ? 'VAT-inclusive pricing' : 'VAT-added pricing')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>🧾 VAT Report</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="printVATReport()">🖨 Print</button>'
      + '<button class="btn sm" onclick="exportVATCSV()">⬇ CSV</button>'
      + '<button class="btn sm" onclick="openVATSettings()">⚙ Settings</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;'
      + 'margin-bottom:14px">'
      + '<label class="field">Period'
      + '<select onchange="vatState.period=this.value;render()">'
      + [['month','Specific Month'],['thisMonth','This Month'],
         ['thisQuarter','This Quarter'],['thisYear','This Year'],
         ['custom','Custom Range']].map(([k, l]) =>
          '<option value="' + k + '" '
          + (vatState.period === k ? 'selected' : '') + '>'
          + l + '</option>').join('')
      + '</select></label>'
      + (vatState.period === 'month'
        ? '<label class="field">Month'
          + '<input type="month" value="' + esc(vatState.month) + '" '
          + 'onchange="vatState.month=this.value;render()"></label>'
          + '<div></div>'
        : vatState.period === 'custom'
          ? '<label class="field">From'
            + '<input type="date" value="' + esc(vatState.from) + '" '
            + 'onchange="vatState.from=this.value;render()"></label>'
            + '<label class="field">To'
            + '<input type="date" value="' + esc(vatState.to) + '" '
            + 'onchange="vatState.to=this.value;render()"></label>'
          : '<label class="field">Range'
            + '<input value="' + dateFmt(from || '') + ' → '
            + dateFmt(to || '') + '" disabled '
            + 'style="background:var(--surface-2)"></label><div></div>')
      + '</div>'

      + '<div class="vat-summary">'
      + '<div class="vat-block">'
      + '<div class="vat-block-title" style="color:var(--green)">'
      + '📈 Output VAT (Sales)</div>'
      + vatRow('Taxable sales (base)', money(vat.outputBase))
      + vatRow('Transactions', vat.taxableSales)
      + vatRow('VAT @ ' + vat.rate + '%', money(vat.outputVAT), true,
          'var(--green)')
      + vatRow('Total sales (incl. VAT)', money(vat.outputTotal),
          false, 'var(--text-3)')
      + '</div>'
      + '<div class="vat-block">'
      + '<div class="vat-block-title" style="color:var(--red)">'
      + '📉 Input VAT (Purchases)</div>'
      + vatRow('Taxable purchases (base)', money(vat.inputBase))
      + vatRow('Transactions', vat.taxablePurchases)
      + vatRow('VAT @ ' + vat.rate + '%', money(vat.inputVAT), true,
          'var(--red)')
      + vatRow('Total purchases (incl. VAT)', money(vat.inputTotal),
          false, 'var(--text-3)')
      + '</div>'
      + '</div>'

      + '<div class="vat-net" style="background:'
      + (vat.netVAT >= 0 ? 'var(--red-soft)' : 'var(--green-soft)') + '">'
      + '<div style="font-size:12px;text-transform:uppercase;'
      + 'letter-spacing:.08em;font-weight:800;color:'
      + (vat.netVAT >= 0 ? 'var(--red)' : 'var(--green)') + '">'
      + (vat.netVAT >= 0 ? 'Net VAT Payable to IRD' : 'VAT Refundable') + '</div>'
      + '<div style="font-size:32px;font-weight:900;margin-top:8px;color:'
      + (vat.netVAT >= 0 ? 'var(--red)' : 'var(--green)') + ';'
      + 'font-variant-numeric:tabular-nums">'
      + money(Math.abs(vat.netVAT)) + '</div>'
      + '<div style="font-size:11.5px;color:'
      + (vat.netVAT >= 0 ? 'var(--red)' : 'var(--green)') + ';'
      + 'opacity:.85;margin-top:4px">'
      + 'Output ' + money(vat.outputVAT) + ' − Input '
      + money(vat.inputVAT) + '</div>'
      + '</div>'

      + ((settings.tinNumber || settings.vatNumber)
          ? '<div class="detail-block" style="margin-top:16px">'
            + '<div class="detail-block-title">Tax Registration</div>'
            + (settings.tinNumber
                ? detailRow('TIN Number', settings.tinNumber) : '')
            + (settings.vatNumber
                ? detailRow('VAT Reg No', settings.vatNumber) : '')
            + '</div>'
          : '')
      + '</div>';
  }
  views.vatReport = viewVATReport;
  window.viewVATReport = viewVATReport;

  function vatRow(label, value, bold, color) {
    return '<div style="display:flex;justify-content:space-between;'
      + 'padding:8px 0;font-size:12.5px;'
      + 'border-bottom:1px dashed var(--border-2)">'
      + '<span style="color:var(--text-3)">' + esc(label) + '</span>'
      + '<span style="font-variant-numeric:tabular-nums;'
      + (bold ? 'font-weight:700;font-size:14px;' : 'font-weight:600;')
      + 'color:' + (color || 'var(--text)') + '">'
      + esc(value) + '</span></div>';
  }

  function openVATSettings() {
    if (!requirePerm('write')) return;
    const v = db.settings.vat || {};
    openModal('⚙ VAT Settings',
      '<form onsubmit="saveVATSettings(event)">'
      + '<div class="form-grid">'
      + '<label class="field">VAT Rate (%)'
      + '<input name="vRate" type="number" step="0.01" min="0" max="30" '
      + 'value="' + NN(v.rate || 18) + '"></label>'
      + '<label class="field">VAT Pricing'
      + '<select name="vInclusive">'
      + '<option value="yes" '
      + (v.inclusive !== false ? 'selected' : '') + '>'
      + 'Prices include VAT</option>'
      + '<option value="no" '
      + (v.inclusive === false ? 'selected' : '') + '>'
      + 'VAT is added on top</option>'
      + '</select></label>'
      + '<label class="field">TIN Number'
      + '<input name="vTin" value="' + esc(v.tinNumber || '') + '"></label>'
      + '<label class="field">VAT Registration No'
      + '<input name="vVat" value="' + esc(v.vatNumber || '') + '"></label>'
      + '</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">Save</button>'
      + '</div></form>', { wide: true });
  }
  window.openVATSettings = openVATSettings;

  function saveVATSettings(e) {
    e.preventDefault();
    const f = e.target;
    if (!db.settings.vat) db.settings.vat = {};
    db.settings.vat.registered = true;
    db.settings.vat.rate = NN(f.vRate.value) || 18;
    db.settings.vat.inclusive = f.vInclusive.value === 'yes';
    db.settings.vat.tinNumber = f.vTin.value.trim();
    db.settings.vat.vatNumber = f.vVat.value.trim();
    logActivity('VAT_SETTINGS_UPDATED', 'Settings', '',
      'Rate ' + db.settings.vat.rate + '%');
    save();
    closeModal();
    render();
    toast('✅ VAT settings saved', 'success');
  }
  window.saveVATSettings = saveVATSettings;

  function printVATReport() {
    const range = resolvePeriodRange(vatState.period,
      vatState.from, vatState.to);
    let from = range.from, to = range.to;
    if (vatState.period === 'month') {
      from = vatState.month + '-01';
      to = vatState.month + '-31';
    }
    const vat = computeVAT(from, to);
    const settings = db.settings.vat || {};
    const shop = db.settings.shopName || 'Lanka Shoe';
    const rangeLabel = (from || to)
      ? (from ? dateFmt(from) : 'Start') + ' — '
        + (to ? dateFmt(to) : 'Today')

    const html = '<div style="padding:8px">'
      + printLetterhead('VAT REPORT', rangeLabel)
      + (settings.tinNumber || settings.vatNumber
          ? '<div style="margin-bottom:16px;font-size:11px;color:#666">'
            + (settings.tinNumber
                ? 'TIN: ' + esc(settings.tinNumber) + '&nbsp;&nbsp;&nbsp;'
                : '')

                ? 'VAT Reg: ' + esc(settings.vatNumber) : '')

          : '')
      + '<table style="width:100%;border-collapse:collapse;font-size:12px;'
      + 'margin-bottom:20px">'
      + '<tbody>'
      + printRow('VAT Rate', vat.rate + '%')
      + printRow('Pricing', vat.inclusive ? 'VAT-inclusive' : 'VAT-added')
      + '</tbody></table>'

      + '<h3 style="font-size:12px;text-transform:uppercase;'
      + 'letter-spacing:.08em;color:#10b981;margin:20px 0 8px;'
      + 'border-bottom:1px solid #ddd;padding-bottom:4px">'
      + 'Output VAT (on Sales)</h3>'
      + '<table style="width:100%;border-collapse:collapse;font-size:12px;'
      + 'margin-bottom:20px">'
      + '<tbody>'
      + printRow('Taxable sales (base)', money(vat.outputBase))

  ═════════════════════════════════════════════════════════════════════ */
  let taxState = { year: thisYear() };
  window.taxState = taxState;

  function computeAnnualTax(year) {
    const from = year + '-01-01';
    const to = year + '-12-31';

    const sales = arr(db.sales).filter(s =>
      s.date >= from && s.date <= to);
    const totalSales = sales.reduce((a, s) => a + NN(s.amount), 0);
    const cashSales = sales.filter(s => s.type === 'cash')
      .reduce((a, s) => a + NN(s.amount), 0);
    const creditSales = totalSales - cashSales;

    const purchases = arr(db.purchases)
      .filter(p => p.date >= from && p.date <= to)
      .reduce((a, p) => a + NN(p.amount), 0);
    const expenses = arr(db.expenses)
      .filter(e => e.date >= from && e.date <= to)
      .reduce((a, e) => a + NN(e.amount), 0);

    /* COGS from stock months */
    let cogs = 0;
    for (let m = 1; m <= 12; m++) {
      const ym = year + '-' + String(m).padStart(2, '0');
      const c = computeCOGS(ym);
      if (c.cogs > 0) cogs += c.cogs;
    }

    /* If no COGS from stock, use purchases as proxy */
    const cogsUsed = cogs > 0 ? cogs : purchases;

    const grossProfit = totalSales - cogsUsed;
    const operatingExpenses = expenses;
    const netProfit = grossProfit - operatingExpenses;

    /* Sri Lankan resident income tax (simplified: progressive). */
    /* Standard deduction LKR 1.2M, then 6% up to 500K, 12% up to 500K, 18% up to 500K, 24% up to 500K, 30% up to 500K, 36% above. */
    const personalRelief = 1200000;
    const taxable = Math.max(0, netProfit - personalRelief);

    /* Simple progressive brackets */
    const brackets = [
      { upto: 500000, rate: 0.06 },
      { upto: 500000, rate: 0.12 },
      { upto: 500000, rate: 0.18 },
      { upto: 500000, rate: 0.24 },
      { upto: 500000, rate: 0.30 },
      { upto: Infinity, rate: 0.36 }
    ];
    let remaining = taxable;
    let tax = 0;
    const bracketDetails = [];
    brackets.forEach(b => {
      if (remaining <= 0) return;
      const amt = Math.min(remaining, b.upto);
      const t = amt * b.rate;
      tax += t;
      bracketDetails.push({
        bracket: amt, rate: b.rate * 100, tax: t
      });
      remaining -= amt;
    });

    return {
      year: year,
      totalSales: totalSales,
      cashSales: cashSales,
      creditSales: creditSales,
      purchases: purchases,
      cogs: cogsUsed,
      grossProfit: grossProfit,
      expenses: operatingExpenses,
      netProfit: netProfit,
      personalRelief: personalRelief,
      taxable: taxable,
      brackets: bracketDetails,
      tax: tax,
      effectiveRate: netProfit > 0 ? (tax / netProfit) * 100 : 0
    };
  }
  window.computeAnnualTax = computeAnnualTax;

  let reminderState = { filter: 'all', search: '', snoozeHours: 24 };
  window.reminderState = reminderState;

  function buildReminderQueue() {
    const items = [];
    const t = today();

    /* ── 1. Bounced customer cheques to recover ── */
    arr(db.customerCheques).forEach(cq => {
      if (cq.status !== 'Bounced') return;
      const settled = arr(db.chequeSettlements)
        .filter(s => s.chequeId === cq.id)
        .reduce((a, s) => a + NN(s.amount), 0);
      const outstanding = Math.max(0, NN(cq.amount) - settled);
      if (outstanding <= 0.01) return;
      const daysOld = Math.abs(daysBetween(cq.bouncedDate
        || cq.dueDate, t));
      items.push({
        id: 'bounce-' + cq.id,
        priority: daysOld > 90 ? 'urgent'
          : daysOld > 60 ? 'high'
          : daysOld > 30 ? 'medium' : 'low',
        icon: '⛔',
        color: 'var(--red)',
        title: cq.customerName + ' — recover bounced cheque',
        desc: money(outstanding) + ' outstanding · '
          + daysOld + ' days since bounce',
        customerId: cq.customerId,
        supplierId: null,
        phone: custObj(cq.customerId)
          ? custObj(cq.customerId).phone : '',
        action: 'recover',
        actionLabel: 'WhatsApp reminder',
        whatsappText: 'Dear ' + cq.customerName + ',\n\n'
          + 'This is a reminder from '
          + (db.settings.shopName || 'Lanka Shoe') + '. '
          + 'Your cheque #' + cq.chequeNo + ' for '
          + money(outstanding) + ' was returned unpaid on '
          + dateFmt(cq.bouncedDate || cq.dueDate) + '. '
          + 'Please arrange settlement at your earliest.\n\n'
          + 'Thank you,\n' + (db.settings.shopName || 'Lanka Shoe'),
        daysOld: daysOld,
        amount: outstanding
      });
    });

    /* ── 2. Overdue credit sales ── */
    arr(db.customers).forEach(c => {
      const overdue = arr(db.sales).filter(s =>
        s.customerId === c.id
        && s.type === 'credit'
        && s.status !== 'settled'
        && NN(s.amount) - NN(s.allocatedAmount) > 0.01);
      if (!overdue.length) return;
      const total = overdue.reduce((a, s) =>
        a + NN(s.amount) - NN(s.allocatedAmount), 0);
      const oldest = overdue.slice().sort((a, b) =>
        (a.expectedPaymentDate || a.date) <
        (b.expectedPaymentDate || b.date) ? -1 : 1)[0];
      const daysOld = Math.abs(daysBetween(
        oldest.expectedPaymentDate || oldest.date, t));
      items.push({
        id: 'overdue-' + c.id,
        priority: daysOld > 90 ? 'urgent'
          : daysOld > 60 ? 'high'
          : daysOld > 30 ? 'medium' : 'low',
        icon: '💰',
        color: 'var(--amber)',
        title: c.name + ' — overdue credit balance',
        desc: money(total) + ' across ' + overdue.length
          + ' bill(s) · oldest ' + daysOld + ' days',
        customerId: c.id,
        supplierId: null,
        phone: c.phone || '',
        action: 'chase-payment',
        actionLabel: 'WhatsApp',
        whatsappText: 'Dear ' + c.name + ',\n\n'
          + 'Your outstanding balance with us is ' + money(total)
          + '. Kindly arrange payment at your earliest convenience.\n\n'
          + 'Thank you,\n' + (db.settings.shopName || 'Lanka Shoe'),
        daysOld: daysOld,
        amount: total
      });
    });

    /* ── 3. Overdue plan installments ── */
    arr(db.paymentPlans)
      .filter(p => p.status === 'active')
      .forEach(p => {
        (p.installments || []).forEach(ins => {
          const out = NN(ins.amount) - NN(ins.paidAmount);
          if (out <= 0.01) return;
          if (ins.dueDate >= t) return;
          const daysOld = Math.abs(daysBetween(ins.dueDate, t));
          items.push({
            id: 'plan-' + p.id + '-' + ins.n,
            priority: daysOld > 60 ? 'urgent'
              : daysOld > 30 ? 'high' : 'medium',
            icon: '💳',
            color: 'var(--purple)',
            title: p.customerName + ' — installment #'
              + ins.n + ' overdue',
            desc: money(out) + ' overdue since '
              + dateFmt(ins.dueDate) + ' (' + daysOld + ' days)',
            customerId: p.customerId,
            supplierId: null,
            phone: custObj(p.customerId)
              ? custObj(p.customerId).phone : '',
            action: 'chase-plan',
            actionLabel: 'WhatsApp',
            whatsappText: 'Dear ' + p.customerName + ',\n\n'
              + 'Your installment #' + ins.n + ' of '
              + money(ins.amount) + ' was due on '
              + dateFmt(ins.dueDate) + '. Outstanding: '
              + money(out) + '.\n\n'
              + 'Kindly settle at your earliest.\n\n'
              + 'Regards,\n' + (db.settings.shopName || 'Lanka Shoe'),
            daysOld: daysOld,
            amount: out
          });
        });
      });

    /* ── 4. Own cheques due in next 7 days ── */
    const next7 = shiftDate(t, 7);
    arr(db.chequeLeaves).forEach(l => {
      if (l.status !== 'Issued') return;
      if (!l.dueDate) return;
      if (l.dueDate < t) {
        /* overdue */
        const daysOver = Math.abs(daysBetween(l.dueDate, t));
        items.push({
          id: 'own-overdue-' + l.id,
          priority: 'urgent',
          icon: '🚫',
          color: 'var(--red)',
          title: 'Own cheque OVERDUE — ' + money(l.amount),
          desc: 'Leaf ' + l.leafNo + ' · ' + (l.bankName || '')
            + ' · due ' + dateFmt(l.dueDate)
            + ' (' + daysOver + ' days overdue)',
          customerId: null,
          supplierId: l.supplierId,
          phone: '',
          action: 'view-own-cheque',
          actionLabel: 'View',
          link: { view: 'ownCheques', id: l.id },
          daysOld: daysOver,
          amount: NN(l.amount)
        });
      } else if (l.dueDate <= next7) {
        const daysAway = daysBetween(t, l.dueDate);
        items.push({
          id: 'own-due-' + l.id,
          priority: daysAway <= 2 ? 'high' : 'medium',
          icon: '🎯',
          color: 'var(--accent)',
          title: 'Own cheque due in ' + daysAway + ' day'
            + (daysAway === 1 ? '' : 's') + ' — ' + money(l.amount),
          desc: 'Leaf ' + l.leafNo + ' · ' + (l.bankName || '')
            + ' · ' + (l.payee || supName(l.supplierId)),
          customerId: null,
          supplierId: l.supplierId,
          phone: '',
          action: 'view-own-cheque',
          actionLabel: 'View',
          link: { view: 'ownCheques', id: l.id },
          daysOld: -daysAway,
          amount: NN(l.amount)
        });
      }
    });

    /* ── 5. Supplier 90+ overdue ── */
    arr(db.suppliers).forEach(s => {
      const aging = supplierAging(s.id);
      if (aging.d90 > 0) {
        items.push({
          id: 'sup-90-' + s.id,
          priority: 'urgent',
          icon: '📋',
          color: 'var(--red)',
          title: s.name + ' — 90+ day payables',
          desc: money(aging.d90) + ' overdue 90+ days · total payable '
            + money(aging.total),
          customerId: null,
          supplierId: s.id,
          phone: s.phone || '',
          action: 'pay-supplier',
          actionLabel: 'Pay',
          link: { view: 'payments' },
          daysOld: 90,
          amount: aging.d90
        });
      } else if (aging.d60 > 0) {
        items.push({
          id: 'sup-60-' + s.id,
          priority: 'high',
          icon: '📋',
          color: '#ea580c',
          title: s.name + ' — 60-90 day payables',
          desc: money(aging.d60) + ' overdue',
          customerId: null,
          supplierId: s.id,
          phone: s.phone || '',
          action: 'pay-supplier',
          actionLabel: 'Pay',
          link: { view: 'payments' },
          daysOld: 60,
          amount: aging.d60
        });
      }
    });

    /* ── 6. Incoming customer cheques due in next 7 days ── */
    arr(db.customerCheques).forEach(cq => {
      if (cq.status !== 'In Hand' && cq.status !== 'Deposited') return;
      if (!cq.dueDate) return;
      if (cq.dueDate < t || cq.dueDate > next7) return;
      const daysAway = daysBetween(t, cq.dueDate);
      items.push({
        id: 'in-chq-' + cq.id,
        priority: 'low',
        icon: '📅',
        color: 'var(--green)',
        title: 'Party cheque clears in ' + daysAway + ' day'
          + (daysAway === 1 ? '' : 's') + ' — ' + money(cq.amount),
        desc: cq.customerName + ' · #' + cq.chequeNo
          + ' · ' + (cq.bank || ''),
        customerId: cq.customerId,
        supplierId: null,
        phone: '',
        action: 'view-party-cheque',
        actionLabel: 'View',
        link: { view: 'customerCheques', id: cq.id },
        daysOld: -daysAway,
        amount: NN(cq.amount)
      });
    });

    /* ── 7. Stock not entered this month ── */
    if (arr(db.stockCategories).length
      && !stockMonthByYM(thisMonth())) {
      items.push({
        id: 'stock-month',
        priority: 'low',
        icon: '📦',
        color: 'var(--text-3)',
        title: 'Stock for ' + monthName(thisMonth()) + ' not entered',
        desc: 'Enter opening + closing to calculate accurate COGS',
        customerId: null,
        supplierId: null,
        phone: '',
        action: 'view-stock',
        actionLabel: 'Enter',
        link: { view: 'stockSummary' },
        daysOld: 0,
        amount: 0
      });
    }

    /* Sort by priority then daysOld desc */
    const order = { urgent: 0, high: 1, medium: 2, low: 3 };
    items.sort((a, b) => {
      const p = (order[a.priority] || 9) - (order[b.priority] || 9);
      if (p !== 0) return p;
      return (b.daysOld || 0) - (a.daysOld || 0);
    });

    return items;

    const phoneEl = document.querySelector('#modalWrap [name="waPhone"]');

    if (!phoneEl || !ta) return;
    const phone = phoneEl.value.replace(/\D/g, '');
    if (!phone) { toast('Phone number required', 'warn'); return; }
    /* SL numbers: if 10 digits starting with 0, convert to 94 */
    let finalPhone = phone;
    if (phone.startsWith('0') && phone.length === 10) {
      finalPhone = '94' + phone.slice(1);
    } else if (phone.length === 9 && !phone.startsWith('94')) {
      finalPhone = '94' + phone;
    }
    const text = encodeURIComponent(ta.value);
    const url = 'https://wa.me/' + finalPhone + '?text=' + text;

  function computeCampaignRecipients(filter, minBalance) {
    filter = filter || 'overdue';
    minBalance = NN(minBalance);
    const out = [];

    arr(db.customers).forEach(c => {
      if (!c.phone) return;
      const bal = customerBalance(c.id);
      if (bal < minBalance) return;

      let match = false;
      if (filter === 'overdue') {
        const overdue = arr(db.sales).filter(s =>
          s.customerId === c.id
          && s.type === 'credit'
          && s.status !== 'settled'
          && s.expectedPaymentDate
          && s.expectedPaymentDate < today()
          && NN(s.amount) - NN(s.allocatedAmount) > 0.01);
        match = overdue.length > 0;
      } else if (filter === 'bounced') {
        match = arr(db.customerCheques)
          .some(cq => cq.customerId === c.id && cq.status === 'Bounced');
      } else if (filter === 'credit') {
        match = bal > 0;
      } else if (filter === 'all') {
        match = true;
      }

      if (!match) return;
      out.push({
        customerId: c.id,
        name: c.name,
        phone: c.phone,
        balance: bal
      });
    });

    return out;
  }
  window.computeCampaignRecipients = computeCampaignRecipients;

  function saveCampaign(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const name = f.cmName.value.trim();
    const filter = f.cmFilter.value;
    const minBal = NN(f.cmMinBal.value);
    const message = f.cmMessage.value.trim();
    if (!name) { toast('Name required', 'error'); return; }
    if (!message) { toast('Message required', 'error'); return; }

    const recs = computeCampaignRecipients(filter, minBal);
    if (!recs.length) { toast('No recipients to send to', 'error'); return; }

    /* Personalize per recipient */
    const recipients = recs.map(r => {
      const personal = message
        .replace(/\{name\}/g, r.name)
        .replace(/\{balance\}/g, money(r.balance))
        .replace(/\{amount\}/g, money(r.balance))
        .replace(/\{shop\}/g, db.settings.shopName || 'Lanka Shoe')
        .replace(/\{days\}/g, '')
        .replace(/\{dueDate\}/g, '');
      return {
        customerId: r.customerId,
        name: r.name,
        phone: r.phone,
        balance: r.balance,
        message: personal,
        status: 'pending',
        sentAt: null
      };
    });

    const campaign = {
      id: uid(),
      name: name,
      template: message,
      filter: filter,
      recipients: recipients,
      status: 'draft',
      createdAt: nowISO(),
      createdBy: (getCurrentUser() || {}).username || 'system'
    };
    db.campaigns.push(campaign);
    logActivity('CAMPAIGN_CREATED', 'Campaign', name,
      recipients.length + ' recipients');
    save();
    closeModal();
    render();
    toast('✅ Campaign created — ' + recipients.length + ' recipients',

  function runCampaignSend(id, idx) {
    const c = arr(db.campaigns).find(x => x.id === id);
    if (!c) return;
    const r = c.recipients[idx];
    if (!r) return;
    let phone = (r.phone || '').replace(/\D/g, '');
    if (phone.startsWith('0') && phone.length === 10) {
      phone = '94' + phone.slice(1);
    } else if (phone.length === 9 && !phone.startsWith('94')) {
      phone = '94' + phone;
    }
    const text = encodeURIComponent(r.message);
    const url = 'https://wa.me/' + phone + '?text=' + text;
    try {
      window.open(url, '_blank');
    } catch (e) {}
  }
  window.runCampaignSend = runCampaignSend;

  function runCampaignMarkSent(id, idx, flag) {
    const c = arr(db.campaigns).find(x => x.id === id);
    if (!c) return;
    const r = c.recipients[idx];
    if (!r) return;
    r.status = flag ? 'sent' : 'pending';
    r.sentAt = flag ? nowISO() : null;
    /* Update campaign status */
    if (c.recipients.every(x => x.status === 'sent')) {
      c.status = 'completed';
    } else if (!flag) {
      c.status = 'running';
    }
    save();
    renderCampaignRunUI(id);
  }
  window.runCampaignMarkSent = runCampaignMarkSent;

  function runCampaignMarkAllSent(id) {
    const c = arr(db.campaigns).find(x => x.id === id);
    if (!c) return;
    c.recipients.forEach(r => {
      r.status = 'sent';
      r.sentAt = nowISO();
    });
    c.status = 'completed';
    save();
    renderCampaignRunUI(id);
    toast('All marked sent', 'success');

  function buildDigestData() {
    const t = today();
    const weekStart = shiftDate(t, -6);
    const lastWeekStart = shiftDate(t, -13);
    const lastWeekEnd = shiftDate(t, -7);

    const salesToday = arr(db.sales).filter(s => s.date === t);
    const salesWeek = arr(db.sales).filter(s =>
      s.date >= weekStart && s.date <= t);
    const salesLastWeek = arr(db.sales).filter(s =>
      s.date >= lastWeekStart && s.date <= lastWeekEnd);

    const receiptsToday = arr(db.receipts)
      .filter(r => r.date === t);
    const expensesToday = arr(db.expenses)
      .filter(e => e.date === t);

    const overdueCount = buildReminderQueue()
      .filter(x => x.priority === 'urgent'
        || x.priority === 'high').length;

    const balanceTotal = arr(db.customers).reduce((a, c) => {
      const bal = customerBalance(c.id);
      return a + (bal > 0 ? bal : 0);
    }, 0);

    const bouncedCount = arr(db.customerCheques)
      .filter(c => c.status === 'Bounced').length;

    /* Top customers this week */
    const topMap = {};
    salesWeek.forEach(s => {
      if (!s.customerId) return;
      topMap[s.customerId] = (topMap[s.customerId] || 0)
        + NN(s.amount);
    });
    const topCustomers = Object.keys(topMap)
      .map(id => ({ name: custName(id), amount: topMap[id] }))
      .sort((a, b) => b.amount - a.amount).slice(0, 5);

    return {
      date: t,
      salesTodayCount: salesToday.length,
      salesTodayTotal: salesToday.reduce((a, s) =>
        a + NN(s.amount), 0),
      salesWeekTotal: salesWeek.reduce((a, s) =>
        a + NN(s.amount), 0),
      salesLastWeekTotal: salesLastWeek.reduce((a, s) =>
        a + NN(s.amount), 0),
      receiptsToday: receiptsToday.reduce((a, r) =>
        a + NN(r.amount), 0),
      expensesToday: expensesToday.reduce((a, e) =>
        a + NN(e.amount), 0),
      overdueCount: overdueCount,
      balanceTotal: balanceTotal,
      bouncedCount: bouncedCount,
      topCustomers: topCustomers
    };
  }
  window.buildDigestData = buildDigestData;

  function sendDigestNow() {
    ensureEmailDigestSettings();
    const cfg = db.settings.emailDigest;
    if (!cfg.email) {
      toast('Set recipient email first', 'warn');
      return;
    }
    const html = buildDigestHTML(buildDigestData());
    const subject = 'Daily Digest — '
      + (db.settings.shopName || 'Lanka Shoe')
      + ' — ' + dateFmt(today());

    /* Best-effort: mailto with plain text summary */
    const data = buildDigestData();
    const body = 'Sales Today: ' + money(data.salesTodayTotal) + '\n'
      + 'Receipts Today: ' + money(data.receiptsToday) + '\n'
      + 'This Week Sales: ' + money(data.salesWeekTotal) + '\n'

      + 'Overdue Alerts: ' + data.overdueCount + '\n'
      + 'Bounced Cheques: ' + data.bouncedCount + '\n\n'
      + 'View the full report in the app.';
    const url = 'mailto:' + encodeURIComponent(cfg.email)
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(body);

    cfg.lastSentAt = nowISO();
    logActivity('DIGEST_SENT', 'Digest', cfg.email, subject);
    save();
