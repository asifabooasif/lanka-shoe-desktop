      + ['Cash','Bank','Cheque','Card','Online'].map(m =>
          '<option value="' + m + '" '
          + (receiptState.method === m ? 'selected' : '') + '>'
          + m + '</option>').join('')
      + '</select></label>'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(receiptState.from) + '" '
      + 'onchange="receiptState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(receiptState.to) + '" '
      + 'onchange="receiptState.to=this.value;render()"></label>'
      + '</div>'

      + (rows.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Date','Customer','Method','Reference','Amount','Allocated','Allocs','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + rows.map(r => {
            const allocTotal = arr(r.allocations)
              .reduce((a, x) => a + NN(x.amount), 0);
            return '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showReceiptDetail(\''
              + r.id + '\')">'

              + 'white-space:nowrap">' + dateFmt(r.date) + '</td>'
              + '<td style="padding:11px 12px"><strong>'
              + esc(r.customerName || '—') + '</strong></td>'
              + '<td style="padding:11px 12px">'
              + '<span class="pill pill-soft">'
              + esc(r.method || '—') + '</span></td>'
              + '<td style="padding:11px 12px;font-family:var(--mono);'
              + 'font-size:11px;color:var(--text-3)">'
              + esc(r.reference || '—') + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600">'
              + money(r.amount) + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-size:11.5px">'
              + money(allocTotal) + '</td>'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + arr(r.allocations).length + '</td>'
              + '<td style="padding:11px 12px" onclick="event.stopPropagation()">'
              + '<div style="display:flex;gap:4px">'
              + '<button class="btn sm" onclick="openReceiptForm(\''
              + r.id + '\')">✎</button>'
              + '<button class="btn sm danger" onclick="deleteReceipt(\''
              + r.id + '\')">🗑</button>'
              + '</div></td></tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">📥</div>'
          + 'No receipts yet<br>'
          + '<button class="btn primary" style="margin-top:12px" '
          + 'onclick="openReceiptForm()">＋ Record First Receipt</button></div>')
      + '</div>';
  }
  views.receipts = viewReceipts;
  window.viewReceipts = viewReceipts;

  /* ═════════════════════════════════════════════════════════════════════
     RECEIPTS — form
  ═════════════════════════════════════════════════════════════════════ */
  function nextReceiptRef() {
    const year = new Date().getFullYear();
    const n = arr(db.receipts).filter(r =>
      (r.reference || '').startsWith('RCP-' + year)
    ).length + 1;
    return 'RCP-' + year + '-' + String(n).padStart(4, '0');
  }
  window.nextReceiptRef = nextReceiptRef;

  function openReceiptForm(id, presetCustomerId, presetAmount) {
    if (!requirePerm('write')) return;
    const r = id ? receiptObj(id) : null;
    const customers = arr(db.customers).slice()
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!customers.length) {
      toast('Add a customer first', 'warn');
      return;
    }

    const selCust = r ? r.customerId : (presetCustomerId || '');

    openModal(r ? '✎ Edit Receipt' : '＋ New Receipt',
      '<form onsubmit="saveReceipt(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="rDate" type="date" required '
      + 'value="' + (r ? r.date : today()) + '"></label>'
      + '<label class="field">Customer <span class="req">*</span>'
      + '<select name="rCustomer" required onchange="onReceiptCustomerChange()">'
      + '<option value="">— Select customer —</option>'
      + customers.map(c =>
          '<option value="' + c.id + '" '
          + (selCust === c.id ? 'selected' : '') + '>'
          + esc(c.name) + (c.phone ? ' · ' + esc(c.phone) : '')
          + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="rAmount" type="number" step="0.01" min="0.01" '
      + 'required value="' + (r ? NN(r.amount)
          : (presetAmount ? NN(presetAmount) : '')) + '"></label>'
      + '<label class="field">Method <span class="req">*</span>'
      + '<select name="rMethod" onchange="onReceiptMethodChange(this.value)">'
      + ['Cash','Bank','Cheque','Card','Online'].map(m =>
          '<option value="' + m + '" '
          + (r && r.method === m ? 'selected' : '') + '>'
          + m + '</option>').join('')
      + '</select></label>'
      + '<label class="field" id="bankWrap" '
      + 'style="' + (r && r.method === 'Bank' ? '' : 'display:none') + '">'
      + 'Bank Account'
      + '<select name="rBankAccount">'
      + '<option value="">— Select bank —</option>'
      + arr(db.banks).map(b =>
          '<option value="' + b.id + '" '
          + (r && r.bankAccountId === b.id ? 'selected' : '') + '>'
          + esc(b.accountName || b.bankName) + ' · '
          + esc(b.bankName) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Reference'
      + '<input name="rReference" value="'
      + esc(r ? (r.reference || '') : nextReceiptRef()) + '"></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Notes'
      + '<textarea name="rNotes" rows="2">'
      + esc(r ? (r.notes || '') : '') + '</textarea></label>'
      + '<div id="receiptOutstanding" style="margin-top:14px"></div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (r ? 'Save Changes' : 'Record Receipt') + '</button>'
      + '</div></form>', { wide: true });

    setTimeout(onReceiptCustomerChange, 80);
    setTimeout(() => onReceiptMethodChange(
      document.querySelector('#modalWrap [name="rMethod"]').value
    ), 80);
  }
  window.openReceiptForm = openReceiptForm;

  function onReceiptMethodChange(method) {
    const wrap = document.getElementById('bankWrap');
    if (wrap) wrap.style.display = method === 'Bank' ? '' : 'none';
  }
  window.onReceiptMethodChange = onReceiptMethodChange;

  function onReceiptCustomerChange() {
    const sel = document.querySelector('#modalWrap [name="rCustomer"]');
    const el = document.getElementById('receiptOutstanding');
    if (!sel || !el) return;
    const cid = sel.value;
    if (!cid) { el.innerHTML = ''; return; }
    const unpaid = arr(db.sales)
      .filter(s => s.customerId === cid
        && s.type === 'credit'
        && NN(s.allocatedAmount) < NN(s.amount) - 0.01);
    if (!unpaid.length) {
      el.innerHTML = '<div style="font-size:12.5px;color:var(--text-3);'
        + 'padding:10px 14px;background:var(--surface-2);'
        + 'border-radius:8px">'
        + '✓ This customer has no outstanding credit sales. '
        + 'Amount will be recorded as advance.</div>';
      return;
    }
    const total = unpaid.reduce((a, s) =>
      a + (NN(s.amount) - NN(s.allocatedAmount)), 0);
    el.innerHTML = '<div style="font-size:12.5px;padding:12px 16px;'
      + 'background:var(--accent-soft);border-radius:10px;'
      + 'color:var(--accent-text)">'
      + '<strong>' + unpaid.length + ' unpaid credit sale'
      + (unpaid.length === 1 ? '' : 's') + '</strong> — '
      + 'total outstanding <strong>' + money(total) + '</strong><br>'
      + '<span style="font-size:11.5px;opacity:.85">'
      + 'Receipt will be allocated FIFO (oldest first).</span></div>';
  }
  window.onReceiptCustomerChange = onReceiptCustomerChange;

  function saveReceipt(e, id) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const customerId = f.rCustomer.value;
    const customer = custObj(customerId);
    if (!customer) { toast('Customer required', 'error'); return; }
    const amount = NN(f.rAmount.value);
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }
    const method = f.rMethod.value;
    const bankAccountId = method === 'Bank'
      ? f.rBankAccount.value : null;

    const data = {
      date: f.rDate.value || today(),
      customerId: customerId,
      customerName: customer.name,
      amount: amount,
      method: method,
      bankAccountId: bankAccountId || null,
      reference: f.rReference.value.trim(),
      notes: f.rNotes.value.trim(),
      categoryId: null
    };

    if (id) {
      const r = receiptObj(id);
      if (!r) return;
      /* Rebuild allocations */
      const allocs = autoAllocateReceipt(data);
      Object.assign(r, data);
      r.allocations = allocs;
      r.updatedAt = nowISO();
      logActivity('RECEIPT_UPDATED', 'Receipt',
        customer.name + ' — ' + money(amount), method);
    } else {
      const allocs = autoAllocateReceipt(data);
      db.receipts.push(Object.assign({
        id: uid(),
        allocations: allocs,
        createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      }, data));
      logActivity('RECEIPT_CREATED', 'Receipt',
        customer.name + ' — ' + money(amount), method);
    }

    rebuildSaleAllocations();
    save();
    closeModal();
    render();
    toast(id ? '✅ Receipt updated' : '✅ Receipt recorded', 'success');
  }
  window.saveReceipt = saveReceipt;

  function deleteReceipt(id) {
    if (!requirePerm('delete')) return;
    const r = receiptObj(id);
    if (!r) return;
    if (arr(r.allocations).length) {
      toast('Cannot delete — receipt has allocations. Edit instead.',
        'error');
      return;
    }
    confirmBox('Delete Receipt?',
      'Remove ' + money(r.amount) + ' from ' + r.customerName + '?',
      () => {
        db.receipts = arr(db.receipts).filter(x => x.id !== id);
        rebuildSaleAllocations();
        logActivity('RECEIPT_DELETED', 'Receipt',
          r.customerName + ' — ' + money(r.amount), '');
        save();
        render();
        toast('Receipt deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deleteReceipt = deleteReceipt;

  /* ═════════════════════════════════════════════════════════════════════
     RECEIPTS — detail
  ═════════════════════════════════════════════════════════════════════ */
  function showReceiptDetail(id) {
    const r = receiptObj(id);
    if (!r) return;
    const allocs = arr(r.allocations);
    const bank = r.bankAccountId ? bankObj(r.bankAccountId) : null;

    openModal('📥 Receipt — ' + esc(r.customerName),
      '<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">'
      + kpi('Amount', money(r.amount), r.method)
      + kpi('Date', dateFmt(r.date), '')
      + kpi('Allocated', money(allocs.reduce((a, x) =>
          a + NN(x.amount), 0)),
          allocs.length + ' sale(s)')
      + '</div>'
      + '<div class="detail-block" style="margin-bottom:14px">'
      + '<div class="detail-block-title">Details</div>'
      + detailRow('Customer', r.customerName)
      + detailRow('Method', r.method)
      + (bank
          ? detailRow('Bank', bank.accountName + ' · ' + bank.bankName)
          : '')
      + detailRow('Reference', r.reference || '—')
      + detailRow('Notes', r.notes || '—')
      + '</div>'
      + (allocs.length
        ? '<div class="detail-block" style="margin-bottom:14px">'
          + '<div class="detail-block-title">Allocated to Sales (FIFO)</div>'
          + allocs.map(a => {
            const s = saleObj(a.saleId);
            return '<div style="display:flex;justify-content:space-between;'
              + 'padding:7px 0;font-size:12.5px;border-bottom:1px dashed '
              + 'var(--border-2);cursor:pointer" '
              + 'onclick="closeModal();showSaleDetail(\'' + a.saleId + '\')">'
              + '<span>' + (s ? dateFmt(s.date) + ' · '
                  + esc(s.reference || '—') : '—') + '</span>'
              + '<strong>' + money(a.amount) + '</strong></div>';
          }).join('')
          + '</div>'
        : '')
      + '<div class="form-actions">'
      + '<button class="btn" onclick="closeModal();openReceiptForm(\''
      + id + '\')">✎ Edit</button>'
      + '<button class="btn danger" onclick="closeModal();'
      + 'deleteReceipt(\'' + id + '\')">🗑 Delete</button>'
      + '<button class="btn primary" onclick="closeModal()">Close</button>'
      + '</div>', { wide: true });
  }
  window.showReceiptDetail = showReceiptDetail;

  function exportReceiptsCSV() {
    const rows = arr(db.receipts).map(r => [
      r.date, r.customerName || '', r.method || '',
      r.reference || '', NN(r.amount),
      arr(r.allocations).reduce((a, x) => a + NN(x.amount), 0),
      arr(r.allocations).length,
      r.notes || ''
    ]);
    download('receipts_' + today() + '.csv',
      toCSV(['Date','Customer','Method','Reference','Amount',
             'Allocated','AllocCount','Notes'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' receipts', 'success');
  }
  window.exportReceiptsCSV = exportReceiptsCSV;

  /* ═════════════════════════════════════════════════════════════════════
     CUSTOMER ANALYTICS (append to Part 4 detail modal)
  ═════════════════════════════════════════════════════════════════════ */
  function customerSalesStats(cid) {
    const sales = arr(db.sales).filter(s => s.customerId === cid);
    const total = sales.reduce((a, s) => a + NN(s.amount), 0);
    const cashSales = sales.filter(s => s.type === 'cash')
      .reduce((a, s) => a + NN(s.amount), 0);
    const creditSales = sales.filter(s => s.type === 'credit')
      .reduce((a, s) => a + NN(s.amount), 0);
    const settled = sales.filter(s => s.status === 'settled')
      .filter(s => s.type === 'credit');
    const avgDays = settled.length
      ? settled.reduce((a, s) => a + NN(s.daysToSettle), 0) / settled.length
      : 0;
    const bounceCount = arr(db.customerCheques)
      .filter(cq => cq.customerId === cid && cq.status === 'Bounced')
      .length;
    const totalCheques = arr(db.customerCheques)
      .filter(cq => cq.customerId === cid).length;
    const onTimeCount = settled.filter(s =>
      NN(s.daysToSettle) <= NN(s.creditDays)).length;
    const onTimePct = settled.length
      ? Math.round((onTimeCount / settled.length) * 100)
      : null;
    return {
      count: sales.length,
      total: total,
      cashSales: cashSales,
      creditSales: creditSales,
      cashPct: total > 0 ? Math.round((cashSales / total) * 100) : 0,
      creditPct: total > 0 ? Math.round((creditSales / total) * 100) : 0,
      settledCount: settled.length,
      avgDays: avgDays,
      onTimePct: onTimePct,
      bounceCount: bounceCount,
      totalCheques: totalCheques
    };
  }
  window.customerSalesStats = customerSalesStats;

  /* Patch customer detail to show sales analytics */
  const origCustomerDetail = window.showCustomerDetail;
  if (typeof origCustomerDetail === 'function'
    && !origCustomerDetail.__part5Patched) {
    const patched = function (id) {
      origCustomerDetail.apply(this, arguments);
      setTimeout(() => {
        const body = document.querySelector('#modalWrap .modal-body');
        if (!body) return;
        const stats = customerSalesStats(id);
        if (!stats.count) return;
        const extra = '<div class="kpi-strip" '
          + 'style="grid-template-columns:repeat(3,1fr);margin-top:6px">'
          + kpi('Sales', money(stats.total),
              stats.count + ' transactions')
          + kpi('Cash vs Credit',
              stats.cashPct + '% / ' + stats.creditPct + '%',
              money(stats.cashSales) + ' / ' + money(stats.creditSales))
          + kpi('Avg Settle Days',
              stats.avgDays ? stats.avgDays.toFixed(0) + 'd' : '—',
              stats.onTimePct != null
                ? stats.onTimePct + '% on time' : 'no data')
          + '</div>';
        const formActions = body.querySelector('.form-actions');
        if (formActions) formActions.insertAdjacentHTML('beforebegin', extra);
      }, 60);
    };
    patched.__part5Patched = true;
    window.showCustomerDetail = patched;
  }

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK — add Sales group
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="sales"]')) return;
    const me = getCurrentUser();
    if (!me) return;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const group = '<div class="nav-group" data-group="sales">'
      + '<div class="nav-label">Sales</div>'
      + item('sales', '🛒', 'Sales')
      + item('receipts', '📥', 'Receipts')
      + '</div>';

    /* Insert after Master Data group */
    const masterGroup = nav.querySelector('[data-view="customers"]');
    if (masterGroup) {
      const mg = masterGroup.parentElement;
      mg.insertAdjacentHTML('afterend', group);
    } else {
      nav.insertAdjacentHTML('beforeend', group);
    }
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    sales: 'Sales',
    receipts: 'Receipts'
  });

  /* Command palette extension */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Sales', ico: '🛒', kind: 'view',
        action: () => goTo('sales') },
      { label: 'New Sale', ico: '＋', kind: 'action',
        action: () => openSaleForm() },
      { label: 'Go to Receipts', ico: '📥', kind: 'view',
        action: () => goTo('receipts') },
      { label: 'New Receipt', ico: '＋', kind: 'action',
        action: () => openReceiptForm() }
    ]);
  };

  /* CSS */
  (function injectCSS() {
    if (document.getElementById('_part5CSS')) return;
    const style = document.createElement('style');
    style.id = '_part5CSS';
    style.textContent = ''
      + '.pill-warn{background:var(--amber-soft);color:var(--amber)}';
    document.head.appendChild(style);
  })();

  /* ═════════════════════════════════════════════════════════════════════
     Rebuild allocations on load (safety)
  ═════════════════════════════════════════════════════════════════════ */
  setTimeout(() => {
    try { rebuildSaleAllocations(); } catch (e) { console.error(e); }
  }, 200);

  console.log('%c✅ Part 5 — Sales & Receipts loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   Sales · Receipts · Auto-classifier · FIFO matching',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 6 — PURCHASES & PAYMENTS
   Adds: Purchase entries (duplicate invoice check, credit limit warning),
         Payments to suppliers (Bank / Cash / Cheque modes),
         Supplier returns (debit notes),
         Payment voucher printing, Supplier aging quick view.
   Depends on: Parts 1 + 2 + 3 + 4 + 5
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part6Loaded) return;
  window._part6Loaded = true;

  const purchaseObj = id => arr(db.purchases).find(p => p.id === id);
  const paymentObj = id => arr(db.payments).find(p => p.id === id);
  const returnObj = id => arr(db.supplierReturns).find(r => r.id === id);
  window.purchaseObj = purchaseObj;
  window.paymentObj = paymentObj;
  window.returnObj = returnObj;

  /* ═════════════════════════════════════════════════════════════════════
     SUPPLIER AGING (reused by multiple views)
  ═════════════════════════════════════════════════════════════════════ */
  function supplierAging(id) {
    const s = supObj(id);
    if (!s) return { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };
    const items = [];
    if (NN(s.openingBalance) > 0) {
      items.push({
        date: s.since || today(),
        amount: NN(s.openingBalance),
        label: 'Opening'
      });
    }
    arr(db.purchases).filter(p => p.supplierId === id).forEach(p => {
      items.push({
        date: p.date,
        amount: NN(p.amount),
        label: p.invoiceNo || ''
      });
    });
    items.sort((a, b) => a.date < b.date ? -1 : 1);

    let available = arr(db.payments)
      .filter(p => p.supplierId === id && !p.fullyReversed)
      .reduce((a, p) => a + NN(p.amount), 0)
      + arr(db.supplierReturns)
        .filter(r => r.supplierId === id)
        .reduce((a, r) => a + NN(r.amount), 0);

    const creditDays = NN(s.creditDays) || 30;
    let current = 0, d30 = 0, d60 = 0, d90 = 0;
    items.forEach(it => {
      if (available >= it.amount) { available -= it.amount; return; }
      const amt = it.amount - available;
      available = 0;
      const age = daysBetween(it.date, today());
      const eff = Math.max(0, age - creditDays);
      if (eff <= 30) current += amt;
      else if (eff <= 60) d30 += amt;
      else if (eff <= 90) d60 += amt;
      else d90 += amt;
    });
    return {
      current: current, d30: d30, d60: d60, d90: d90,
      total: current + d30 + d60 + d90
    };
  }
  window.supplierAging = supplierAging;

  function globalAging() {
    const out = { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };
    arr(db.suppliers).forEach(s => {
      const a = supplierAging(s.id);
      out.current += a.current;
      out.d30 += a.d30;
      out.d60 += a.d60;
      out.d90 += a.d90;
    });
    out.total = out.current + out.d30 + out.d60 + out.d90;
    return out;
  }
  window.globalAging = globalAging;

  /* ═════════════════════════════════════════════════════════════════════
     PURCHASES — list
  ═════════════════════════════════════════════════════════════════════ */
  let purchaseState = {
    q: '', supplierId: '', categoryId: '', from: '', to: ''
  };
  window.purchaseState = purchaseState;

  function viewPurchases() {
    let rows = arr(db.purchases).slice();
    if (purchaseState.q) {
      const q = purchaseState.q.toLowerCase();
      rows = rows.filter(p =>
        (p.invoiceNo || '').toLowerCase().includes(q)
        || (p.description || '').toLowerCase().includes(q)
        || (supName(p.supplierId) || '').toLowerCase().includes(q));
    }
    if (purchaseState.supplierId) {
      rows = rows.filter(p => p.supplierId === purchaseState.supplierId);
    }
    if (purchaseState.categoryId) {
      rows = rows.filter(p => p.categoryId === purchaseState.categoryId);
    }
    if (purchaseState.from) {
      rows = rows.filter(p => p.date >= purchaseState.from);
    }
    if (purchaseState.to) {
      rows = rows.filter(p => p.date <= purchaseState.to);
    }
    rows.sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);

    const total = rows.reduce((a, p) => a + NN(p.amount), 0);
    const thisMonth = rows.filter(p => p.date.slice(0, 7) === thisMonth())
      .reduce((a, p) => a + NN(p.amount), 0);

    return '<div class="kpi-strip">'
      + kpi('Total Purchases', money(arr(db.purchases)
          .reduce((a, p) => a + NN(p.amount), 0)),
          arr(db.purchases).length + ' invoices')
      + kpi('This Month', money(thisMonth), monthName(thisMonth()))
      + kpi('Filtered Total', money(total), rows.length + ' matching')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>🛒 Purchases (' + rows.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportPurchasesCSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openPurchaseForm()">'
      + '＋ New Purchase</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(purchaseState.q) + '" '
      + 'oninput="purchaseState.q=this.value;render()" '
      + 'placeholder="Invoice, supplier, notes"></label>'
      + '<label class="field">Supplier'
      + '<select onchange="purchaseState.supplierId=this.value;render()">'
      + '<option value="">All suppliers</option>'
      + arr(db.suppliers).map(s =>
          '<option value="' + s.id + '" '

  /* ═════════════════════════════════════════════════════════════════════
     PURCHASES — form
  ═════════════════════════════════════════════════════════════════════ */
  function openPurchaseForm(id) {
    if (!requirePerm('write')) return;
    const p = id ? purchaseObj(id) : null;
    if (!arr(db.suppliers).length) {
      toast('Add a supplier first', 'warn');
      return;
    }

    openModal(p ? '✎ Edit Purchase' : '＋ New Purchase',
      '<form onsubmit="savePurchase(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="pDate" type="date" required '
      + 'value="' + (p ? p.date : today()) + '"></label>'
      + '<label class="field">Supplier <span class="req">*</span>'
      + '<select name="pSupplier" required onchange="onPurchaseSupplierChange()">'
      + '<option value="">— Select supplier —</option>'
      + arr(db.suppliers).slice().sort((a, b) =>
          a.name.localeCompare(b.name)).map(s =>
          '<option value="' + s.id + '" '
          + (p && p.supplierId === s.id ? 'selected' : '') + '>'
          + esc(s.name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Invoice No <span class="req">*</span>'
      + '<input name="pInvoice" required value="'
      + esc(p ? (p.invoiceNo || '') : '') + '" autofocus></label>'
      + '<label class="field">Category'
      + '<select name="pCategory">'
      + '<option value="">— None —</option>'
      + arr(db.categories).map(c =>
          '<option value="' + c.id + '" '
          + (p && p.categoryId === c.id ? 'selected' : '') + '>'
          + esc(c.name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="pAmount" type="number" step="0.01" min="0.01" '
      + 'required value="' + (p ? NN(p.amount) : '') + '"></label>'
      + '<label class="field">Due Date'
      + '<input name="pDueDate" type="date" '
      + 'value="' + (p ? (p.dueDate || '') : shiftDate(today(), 30))
      + '"></label>'
      + '</div>'
      + '<label class="field" style="margin-top:14px">Description'
      + '<textarea name="pDesc" rows="2">'
      + esc(p ? (p.description || '') : '') + '</textarea></label>'
      + '<div id="purchaseInfo" style="margin-top:14px"></div>'
      + '<div class="form-actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Cancel</button>'
      + '<button type="submit" class="btn primary">'
      + (p ? 'Save Changes' : 'Add Purchase') + '</button>'
      + '</div></form>', { wide: true });

    setTimeout(onPurchaseSupplierChange, 80);
  }
  window.openPurchaseForm = openPurchaseForm;

  function onPurchaseSupplierChange() {
    const sel = document.querySelector('#modalWrap [name="pSupplier"]');
    const el = document.getElementById('purchaseInfo');
    if (!sel || !el) return;
    const sid = sel.value;
    if (!sid) { el.innerHTML = ''; return; }
    const s = supObj(sid);
    if (!s) { el.innerHTML = ''; return; }
    const bal = supplierBalance(sid);
    const limit = NN(s.creditLimit);
    const overLimit = limit > 0 && bal > limit;
    const aging = supplierAging(sid);

    el.innerHTML = '<div style="padding:12px 16px;background:'
      + (overLimit ? 'var(--red-soft)' : 'var(--accent-soft)') + ';'
      + 'border-radius:10px;font-size:12.5px;color:'
      + (overLimit ? 'var(--red)' : 'var(--accent-text)') + '">'
      + '<div style="display:flex;justify-content:space-between;'
      + 'align-items:center;flex-wrap:wrap;gap:10px">'
      + '<div><strong>' + esc(s.name) + '</strong> · '
      + 'Current payable <strong>' + money(bal) + '</strong>'
      + (limit > 0 ? ' · Limit ' + money(limit) : '')
      + '</div>'
      + (aging.d90 > 0
          ? '<span>⚠ 90+ overdue: ' + money(aging.d90) + '</span>'
          : '')
      + (overLimit
          ? '<span style="font-weight:700">⛔ OVER LIMIT</span>'
          : '')
      + '</div></div>';
  }
  window.onPurchaseSupplierChange = onPurchaseSupplierChange;

  function savePurchase(e, id) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    const supplierId = f.pSupplier.value;
    if (!supplierId) { toast('Supplier required', 'error'); return; }
    const invoiceNo = f.pInvoice.value.trim();
    const amount = NN(f.pAmount.value);
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }

    /* Duplicate invoice check */
    if (!id && invoiceNo) {
      const dupe = arr(db.purchases).find(p =>
        (p.invoiceNo || '').trim().toLowerCase()
        === invoiceNo.toLowerCase()
        && p.supplierId === supplierId);
      if (dupe) {
        if (!confirm('⚠ Duplicate invoice "' + invoiceNo
          + '" already recorded for this supplier on '
          + dateFmt(dupe.date) + '.\n\nProceed anyway?')) return;
      }
    }

    /* Credit limit warning */
    const s = supObj(supplierId);
    if (!id && s && NN(s.creditLimit) > 0) {
      const newBal = supplierBalance(supplierId) + amount;
      if (newBal > NN(s.creditLimit)) {
        if (!confirm('⚠ Credit limit exceeded for ' + s.name + '.\n\n'
          + 'Current: ' + money(supplierBalance(supplierId)) + '\n'
          + 'New purchase: ' + money(amount) + '\n'
          + 'New total: ' + money(newBal) + '\n'
          + 'Limit: ' + money(s.creditLimit) + '\n\nProceed anyway?')) {
          return;
        }
      }
    }

    const data = {
      date: f.pDate.value || today(),
      supplierId: supplierId,
      invoiceNo: invoiceNo,
      categoryId: f.pCategory.value,
      amount: amount,
      dueDate: f.pDueDate.value || shiftDate(today(), 30),
      description: f.pDesc.value.trim()
    };

    if (id) {
      const p = purchaseObj(id);
      if (!p) return;
      Object.assign(p, data);
      p.updatedAt = nowISO();
      logActivity('PURCHASE_UPDATED', 'Purchase',
        (s ? s.name : '—') + ' — ' + invoiceNo, money(amount));
    } else {
      db.purchases.push(Object.assign({
        id: uid(), createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      }, data));
      logActivity('PURCHASE_CREATED', 'Purchase',
        (s ? s.name : '—') + ' — ' + invoiceNo, money(amount));
    }
    save();
    closeModal();
    render();
    toast(id ? '✅ Purchase updated' : '✅ Purchase added', 'success');
  }
  window.savePurchase = savePurchase;

  function deletePurchase(id) {
    if (!requirePerm('delete')) return;
    const p = purchaseObj(id);
    if (!p) return;
    const used = arr(db.payments).some(x =>
      x.allocations && arr(x.allocations)
        .some(a => a.purchaseId === id));
    if (used) {
      toast('Cannot delete — purchase has payment allocations', 'error');
      return;
    }
    confirmBox('Delete Purchase?',
      'Remove ' + (p.invoiceNo || 'invoice')
      + ' (' + money(p.amount) + ')?',
      () => {
        db.purchases = arr(db.purchases).filter(x => x.id !== id);
        logActivity('PURCHASE_DELETED', 'Purchase',
          p.invoiceNo || '', money(p.amount));
        save();
        render();
        toast('Purchase deleted', 'success');
      }, { confirmLabel: 'Delete', danger: true });
  }
  window.deletePurchase = deletePurchase;

  ═════════════════════════════════════════════════════════════════════ */

  function exportPurchasesCSV() {
    const rows = arr(db.purchases).map(p => [
      p.date, p.invoiceNo || '', supName(p.supplierId),
      p.categoryId ? catName(p.categoryId) : '',
      NN(p.amount), p.dueDate || '', p.description || ''
    ]);
    download('purchases_' + today() + '.csv',
      toCSV(['Date','Invoice','Supplier','Category','Amount','DueDate',
             'Description'], rows), 'text/csv');
    toast('Exported ' + rows.length + ' purchases', 'success');

  /* ═════════════════════════════════════════════════════════════════════
     PAYMENTS — list
  ═════════════════════════════════════════════════════════════════════ */
  let paymentState = {
    q: '', supplierId: '', mode: '', from: '', to: ''
  };
  window.paymentState = paymentState;

  function viewPayments() {
    let rows = arr(db.payments).slice();
    if (paymentState.q) {
      const q = paymentState.q.toLowerCase();
      rows = rows.filter(p =>
        (p.reference || '').toLowerCase().includes(q)
        || (supName(p.supplierId) || '').toLowerCase().includes(q));
    }
    if (paymentState.supplierId) {
      rows = rows.filter(p => p.supplierId === paymentState.supplierId);
    }
    if (paymentState.mode) {
      rows = rows.filter(p => p.mode === paymentState.mode);
    }
    if (paymentState.from) rows = rows.filter(p => p.date >= paymentState.from);
    if (paymentState.to) rows = rows.filter(p => p.date <= paymentState.to);
    rows.sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);

    const total = rows.reduce((a, p) =>
      a + (p.fullyReversed ? 0 : NN(p.amount)), 0);

    return '<div class="kpi-strip">'
      + kpi('Total Paid',
          money(arr(db.payments).filter(p => !p.fullyReversed)
            .reduce((a, p) => a + NN(p.amount), 0)),
          arr(db.payments).length + ' payments')
      + kpi('This Month',
          money(arr(db.payments).filter(p =>
            p.date.slice(0, 7) === thisMonth() && !p.fullyReversed)
            .reduce((a, p) => a + NN(p.amount), 0)),
          monthName(thisMonth()))
      + kpi('Filtered', money(total), rows.length + ' matching')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>💸 Payments (' + rows.length + ')</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportPaymentsCSV()">⬇ CSV</button>'
      + '<button class="btn primary" onclick="openPaymentForm()">'
      + '＋ New Payment</button>'
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(paymentState.q) + '" '
      + 'oninput="paymentState.q=this.value;render()" '
      + 'placeholder="Reference or supplier"></label>'
      + '<label class="field">Supplier'
      + '<select onchange="paymentState.supplierId=this.value;render()">'
      + '<option value="">All suppliers</option>'
      + arr(db.suppliers).map(s =>
          '<option value="' + s.id + '" '
          + (paymentState.supplierId === s.id ? 'selected' : '') + '>'
          + esc(s.name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Mode'
      + '<select onchange="paymentState.mode=this.value;render()">'
      + '<option value="">All modes</option>'
      + ['Bank','Cash','Cheque'].map(m =>
          '<option value="' + m + '" '
          + (paymentState.mode === m ? 'selected' : '') + '>'
          + m + '</option>').join('')
      + '</select></label>'
      + '<label class="field">From'
      + '<input type="date" value="' + esc(paymentState.from) + '" '
      + 'onchange="paymentState.from=this.value;render()"></label>'
      + '<label class="field">To'
      + '<input type="date" value="' + esc(paymentState.to) + '" '
      + 'onchange="paymentState.to=this.value;render()"></label>'
      + '</div>'

      + (rows.length
        ? '<div style="overflow-x:auto">'
          + '<table style="width:100%;border-collapse:collapse;'
          + 'font-size:12.5px"><thead><tr style="background:var(--surface-2)">'
          + ['Date','Supplier','Mode','Reference','Amount','Status','']
              .map(h => '<th style="text-align:left;padding:11px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">' + h + '</th>')
              .join('')
          + '</tr></thead><tbody>'
          + rows.map(p =>
              '<tr style="border-bottom:1px solid var(--border-2);'
              + 'cursor:pointer" onclick="showPaymentDetail(\''
              + p.id + '\')">'
              + '<td style="padding:11px 12px;font-size:11.5px;'
              + 'white-space:nowrap">' + dateFmt(p.date) + '</td>'
              + '<td style="padding:11px 12px"><strong>'
              + esc(supName(p.supplierId)) + '</strong></td>'
              + '<td style="padding:11px 12px">'
              + '<span class="pill pill-soft">'
              + esc(p.mode || '—') + '</span></td>'
              + '<td style="padding:11px 12px;font-family:var(--mono);'
              + 'font-size:11px;color:var(--text-3)">'
              + esc(p.reference || '—') + '</td>'
              + '<td style="padding:11px 12px;text-align:right;'
              + 'font-variant-numeric:tabular-nums;font-weight:600;'
              + 'color:' + (p.fullyReversed ? 'var(--text-3)'
                  : 'var(--text)') + '">'
              + money(p.amount) + '</td>'
              + '<td style="padding:11px 12px">'
              + (p.fullyReversed

              + '<td style="padding:11px 12px" onclick="event.stopPropagation()">'

              + (p.fullyReversed ? ''

              + p.id + '\')">🗑</button>'
              + '</div></td></tr>').join('')
          + '</tbody></table></div>'
        : '<div class="empty"><div class="big">💸</div>'

     PAYMENTS — form (mode-aware)
  ═════════════════════════════════════════════════════════════════════ */
  function nextPaymentRef() {
    const year = new Date().getFullYear();
    const n = arr(db.payments).filter(p =>
      (p.reference || '').startsWith('PAY-' + year)
    ).length + 1;
    return 'PAY-' + year + '-' + String(n).padStart(4, '0');
  }
  window.nextPaymentRef = nextPaymentRef;

    if (p && p.fullyReversed) {

      toast('Add a supplier first', 'warn');
      return;

    openModal(p ? '✎ Edit Payment' : '＋ New Payment',
      '<form onsubmit="savePayment(event,\'' + (id || '') + '\')">'
      + '<div class="form-grid">'
      + '<label class="field">Date <span class="req">*</span>'
      + '<input name="payDate" type="date" required '
      + 'value="' + (p ? p.date : today()) + '"></label>'
      + '<label class="field">Supplier <span class="req">*</span>'
      + '<select name="paySupplier" required onchange="onPaymentSupplierChange()">'
      + '<option value="">— Select supplier —</option>'
      + arr(db.suppliers).slice().sort((a, b) =>
          a.name.localeCompare(b.name)).map(s =>
          '<option value="' + s.id + '" '
          + (p && p.supplierId === s.id ? 'selected' : '') + '>'
          + esc(s.name) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Payment Mode <span class="req">*</span>'
      + '<select name="payMode" onchange="onPaymentModeChange(this.value)">'

      + '<label class="field">Amount (Rs.) <span class="req">*</span>'
      + '<input name="payAmount" type="number" step="0.01" min="0.01" '
      + 'required value="' + (p ? NN(p.amount) : '') + '"></label>'
      + '<label class="field">Reference'

      + arr(db.banks).map(b =>
          '<option value="' + b.id + '" '
          + (p && p.bankAccountId === b.id ? 'selected' : '') + '>'

      + '<div id="payChequeFields" style="margin-top:14px;display:none">'
      + '<div class="form-grid">'
      + '<label class="field">Cheque Number <span class="req">*</span>'
      + '<input name="payChequeNo" value="'
      + esc(p ? (p.chequeNo || '') : '') + '"></label>'
      + '<label class="field">Bank'
      + '<input name="payChequeBank" value="'
      + esc(p ? (p.chequeBank || '') : '') + '"></label>'
      + '<label class="field">Due Date'
      + '<input name="payChequeDue" type="date" '
      + 'value="' + (p && p.chequeDueDate ? p.chequeDueDate
          : shiftDate(today(), 30)) + '"></label>'
      + '</div>'

      + (p ? 'Save Changes' : 'Record Payment') + '</button>'
      + '</div></form>', { wide: true });

    setTimeout(() => {

  function savePayment(e, id) {
    e.preventDefault();

    const f = e.target;

    if (!supplierId) { toast('Supplier required', 'error'); return; }
    const amount = NN(f.payAmount.value);
    if (amount <= 0) { toast('Amount must be > 0', 'error'); return; }
    const mode = f.payMode.value;
    const s = supObj(supplierId);

    /* Allocate the payment FIFO to outstanding purchases */
    const allocations = allocatePaymentToPurchases(supplierId, amount, id);

    const data = {
      date: f.payDate.value || today(),
      supplierId: supplierId,
      mode: mode,
      amount: amount,
      reference: f.payRef.value.trim(),
      notes: f.payNotes.value.trim(),
      allocations: allocations
    };

    if (mode === 'Bank') {
      const bankId = f.payBank.value;
      if (!bankId) { toast('Bank account required', 'error'); return; }
      const bal = bankBalance(bankId);
      if (bal - amount < 0 && !id) {
        if (!confirm('⚠ Bank balance will go negative.\n\n'
          + 'Current: ' + money(bal) + '\n'
          + 'Payment: ' + money(amount) + '\n'
          + 'After: ' + money(bal - amount) + '\n\nProceed anyway?')) {
          return;
        }
      }
      data.bankAccountId = bankId;
      data.chequeNo = null;
      data.chequeBank = null;
      data.chequeDueDate = null;
    } else if (mode === 'Cash') {
      data.bankAccountId = null;
      data.chequeNo = null;
      data.chequeBank = null;
      data.chequeDueDate = null;
    } else if (mode === 'Cheque') {
      const chequeNo = f.payChequeNo.value.trim();
      if (!chequeNo) { toast('Cheque number required', 'error'); return; }
      data.bankAccountId = null;
      data.chequeNo = chequeNo;
      data.chequeBank = f.payChequeBank.value.trim();
      data.chequeDueDate = f.payChequeDue.value || shiftDate(today(), 30);
      data.chequeStatus = 'Issued';
    }

    if (id) {
      const old = paymentObj(id);
      if (!old) return;
      Object.assign(old, data);
      old.updatedAt = nowISO();
      logActivity('PAYMENT_UPDATED', 'Payment',
        (s ? s.name : '—') + ' — ' + money(amount), mode);
    } else {
      db.payments.push(Object.assign({
        id: uid(),
        fullyReversed: false,
        createdAt: nowISO(),
        createdBy: (getCurrentUser() || {}).username || 'system'
      }, data));
      logActivity('PAYMENT_CREATED', 'Payment',
        (s ? s.name : '—') + ' — ' + money(amount), mode);
    }

    save();
    closeModal();
    render();
    toast(id ? '✅ Payment updated' : '✅ Payment recorded', 'success');
  }

  function allocatePaymentToPurchases(supplierId, amount, excludePaymentId) {
    let remaining = amount;
    const allocations = [];
    /* Outstanding amounts per purchase */
    const outstanding = {};
    arr(db.purchases)
      .filter(p => p.supplierId === supplierId)
      .sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1)
      .forEach(p => { outstanding[p.id] = NN(p.amount); });
    /* Subtract existing allocations (excluding this payment if editing) */
    arr(db.payments)
      .filter(p => p.supplierId === supplierId
        && !p.fullyReversed
        && p.id !== excludePaymentId)
      .forEach(p => {
        arr(p.allocations).forEach(a => {
          if (outstanding[a.purchaseId] != null) {
            outstanding[a.purchaseId] -= NN(a.amount);
          }
        });
      });
    /* Opening balance allocation first (if supplier has opening) */
    const s = supObj(supplierId);
    if (s && NN(s.openingBalance) > 0) {
      const already = arr(db.payments)
        .filter(p => p.supplierId === supplierId
          && !p.fullyReversed
          && p.id !== excludePaymentId)
        .flatMap(p => arr(p.allocations))
        .filter(a => a.purchaseId === '_opening')
        .reduce((a, x) => a + NN(x.amount), 0);
      const remainOpening = Math.max(0, NN(s.openingBalance) - already);
      if (remainOpening > 0) {
        const alloc = Math.min(remaining, remainOpening);
        allocations.push({ purchaseId: '_opening', amount: alloc });
        remaining -= alloc;
      }
    }
    /* Then FIFO to purchases */
    Object.keys(outstanding)
      .filter(pid => outstanding[pid] > 0.01)
      .forEach(pid => {
        if (remaining <= 0) return;
        const alloc = Math.min(remaining, outstanding[pid]);
        allocations.push({ purchaseId: pid, amount: alloc });
        remaining -= alloc;
      });
    return allocations;
  }
  window.allocatePaymentToPurchases = allocatePaymentToPurchases;

  function buildSupplierLedger(supplierId) {
    const s = supObj(supplierId);
    if (!s) return { rows: [], balance: 0 };
    const events = [];
    if (NN(s.openingBalance) !== 0) {
      events.push({
        date: s.since || today(),
        type: 'Opening', ref: 'Opening Balance',
        desc: 'Opening balance',
        debit: 0, credit: NN(s.openingBalance)
      });
    }
    arr(db.purchases).filter(p => p.supplierId === supplierId).forEach(p => {
      events.push({
        date: p.date, type: 'Purchase', ref: p.invoiceNo || '',
        desc: (p.categoryId ? catName(p.categoryId) + ' · ' : '')
          + (p.description || ''),
        debit: 0, credit: NN(p.amount)
      });
    });
    arr(db.payments)
      .filter(p => p.supplierId === supplierId && !p.fullyReversed)
      .forEach(p => {
        events.push({
          date: p.date, type: 'Payment',
          ref: p.reference || '',
          desc: p.mode + (p.chequeNo ? ' · Chq ' + p.chequeNo : ''),
          debit: NN(p.amount), credit: 0
        });
      });
    arr(db.supplierReturns)
      .filter(r => r.supplierId === supplierId)
      .forEach(r => {
        events.push({
          date: r.date, type: 'Return',
          ref: r.reference || '',
          desc: r.reason || 'Return / Debit note',
          debit: NN(r.amount), credit: 0
        });
      });
    events.sort((a, b) => a.date < b.date ? -1 : 1);
    let running = 0;
    events.forEach(e => {
      running += NN(e.credit) - NN(e.debit);
      e.balance = running;
    });
    return { rows: events, balance: running };
  }
