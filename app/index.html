      + '.reminder-high{border-left:4px solid #ea580c}'
      + '.reminder-medium{border-left:4px solid var(--amber)}'
      + '.reminder-low{border-left:4px solid var(--green)}'
      + '.reminder-icon{width:44px;height:44px;border-radius:12px;'
      + 'display:grid;place-items:center;font-size:20px;'
      + 'flex-shrink:0}'
      + '.reminder-title{font-weight:700;font-size:13px;'
      + 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
      + '.reminder-desc{font-size:11.5px;color:var(--text-3);'
      + 'margin-top:3px;overflow:hidden;text-overflow:ellipsis;'
      + 'white-space:nowrap}'
      + '.reminder-actions{display:flex;gap:6px;align-items:center;'
      + 'flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}'
      + '.reminder-badge{padding:3px 10px;border-radius:12px;'
      + 'font-size:10px;font-weight:800;letter-spacing:.04em}'
      + '.reminder-badge-urgent{background:var(--red-soft);'
      + 'color:var(--red)}'
      + '.reminder-badge-high{background:var(--amber-soft);'
      + 'color:var(--amber)}'
      + '.reminder-badge-medium{background:var(--amber-soft);'
      + 'color:var(--amber)}'
      + '.reminder-badge-low{background:var(--green-soft);'
      + 'color:var(--green)}'
      + '.campaign-row{display:flex;gap:12px;padding:12px 14px;'
      + 'border:1px solid var(--border-2);border-radius:10px;'
      + 'margin-bottom:8px;align-items:center;background:var(--surface)}'
      + '.campaign-row-sent{background:var(--green-soft);'
      + 'border-color:var(--green-bd)}'
      + '.nav-badge{margin-left:auto;padding:2px 8px;'
      + 'background:var(--red);color:#fff;border-radius:10px;'
      + 'font-size:10px;font-weight:700;min-width:20px;'
      + 'text-align:center}'
      + '.alert-mini{padding:10px 14px;background:var(--accent-soft);'
      + 'border-radius:8px;font-size:12px;color:var(--accent-text);'
      + 'line-height:1.5}'
      + '.stmt-table{width:100%;border-collapse:collapse;font-size:12.5px}'
      + '.pill-ok{background:var(--green-soft);color:var(--green)}'
      + '.pill-warn{background:var(--amber-soft);color:var(--amber)}'
      + '.pill-soft{background:var(--accent-soft);color:var(--accent-text)}';
    document.head.appendChild(style);
  })();

  console.log('%c✅ Part 15 — Compliance + Communication loaded',
    'color:#10b981;font-weight:bold;font-size:13px');
  console.log('%c   VAT · Tax · Smart Reminders · WhatsApp · Bulk · Digest',
    'color:#a78bfa;font-size:12px');

})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PART 16 — FINAL ADMIN
   Adds: Audit Log · Backup & Restore (JSON + CSV) ·
         Google Sheets Sync · Auto-Recalculation Engine ·
         Recycle Bin (soft delete) · Comprehensive Settings
   Depends on: Parts 1–15
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  if (window._part16Loaded) return;
  window._part16Loaded = true;

  /* ═════════════════════════════════════════════════════════════════════
     SECTION 1 — AUDIT LOG VIEW
  ═════════════════════════════════════════════════════════════════════ */
  let auditState = { search: '', user: '', action: '', limit: 200 };
  window.auditState = auditState;

  function viewAuditLog() {
    if (!requirePerm('reports')) {
      return '<div class="card"><div class="empty">⛔ No access</div></div>';
    }
    let list = arr(db.activityLog).slice().reverse();
    if (auditState.search) {
      const q = auditState.search.toLowerCase();
      list = list.filter(x =>
        (x.label || '').toLowerCase().includes(q)
        || (x.detail || '').toLowerCase().includes(q)
        || (x.action || '').toLowerCase().includes(q));
    }
    if (auditState.user) list = list.filter(x => x.username === auditState.user);
    if (auditState.action) list = list.filter(x => x.action === auditState.action);
    list = list.slice(0, auditState.limit);

    const users = Array.from(new Set(
      arr(db.activityLog).map(x => x.username).filter(Boolean)
    )).sort();
    const actions = Array.from(new Set(
      arr(db.activityLog).map(x => x.action).filter(Boolean)
    )).sort();

    return '<div class="kpi-strip">'
      + kpi('Total Events', arr(db.activityLog).length, 'All time')
      + kpi('Users', users.length, 'Distinct users')
      + kpi('Today',
          arr(db.activityLog).filter(x =>
            (x.at || '').slice(0, 10) === today()).length,
          'Since midnight')
      + kpi('Showing', list.length, 'Current filter')
      + '</div>'

      + '<div class="card">'
      + '<div class="card-head"><h3>📜 Audit Log</h3>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button class="btn sm" onclick="exportAuditCSV()">⬇ CSV</button>'
      + (hasPerm('delete')
          ? '<button class="btn sm danger" '
            + 'onclick="clearAuditLog()">🗑 Clear</button>'
          : '')
      + '</div></div>'

      + '<div class="form-grid" style="grid-template-columns:'
      + 'repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px">'
      + '<label class="field">Search'
      + '<input value="' + esc(auditState.search) + '" '
      + 'oninput="auditState.search=this.value;render()" '
      + 'placeholder="Label, detail, action"></label>'
      + '<label class="field">User'
      + '<select onchange="auditState.user=this.value;render()">'
      + '<option value="">All users</option>'
      + users.map(u => '<option value="' + esc(u) + '" '
          + (auditState.user === u ? 'selected' : '') + '>'
          + esc(u) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Action'
      + '<select onchange="auditState.action=this.value;render()">'
      + '<option value="">All actions</option>'
      + actions.map(a => '<option value="' + esc(a) + '" '
          + (auditState.action === a ? 'selected' : '') + '>'
          + esc(a) + '</option>').join('')
      + '</select></label>'
      + '<label class="field">Show'
      + '<select onchange="auditState.limit=+this.value;render()">'
      + [100, 200, 500, 2000].map(n =>
          '<option value="' + n + '" '
          + (auditState.limit === n ? 'selected' : '') + '>'
          + n + ' latest</option>').join('')
      + '</select></label>'
      + '</div>'

      + (list.length
        ? '<div style="overflow-x:auto">'
          + '<table class="audit-table"><thead><tr>'
          + ['When','User','Action','Entity','Detail']
              .map(h => '<th style="text-align:left;padding:10px 12px;'
                + 'font-size:10.5px;text-transform:uppercase;'
                + 'letter-spacing:.06em;color:var(--text-3);font-weight:700;'
                + 'border-bottom:1px solid var(--border)">'
                + h + '</th>').join('')
          + '</tr></thead><tbody>'
          + list.map(x =>
              '<tr style="border-bottom:1px solid var(--border-2)">'
              + '<td style="padding:9px 12px;font-size:11.5px;'
              + 'color:var(--text-3);white-space:nowrap">'
              + dateTimeFmt(x.at) + '</td>'
              + '<td style="padding:9px 12px">'
              + '<span class="pill ' + (x.role === 'owner'
                  ? 'pill-warn' : 'pill-soft') + '">'
              + esc(x.username || 'system') + '</span></td>'
              + '<td style="padding:9px 12px;font-weight:600;font-size:12px">'
              + esc(x.action) + '</td>'
              + '<td style="padding:9px 12px;font-size:11.5px">'
              + esc(x.entity || '') + '</td>'
              + '<td style="padding:9px 12px;font-size:11.5px;'
              + 'color:var(--text-3)">'
              + esc(x.label || '')
              + (x.detail ? ' — ' + esc(x.detail) : '')
              + '</td></tr>').join('')
          + '</tbody></table></div>'
        : '<div class="empty">No events match filters</div>')
      + '</div>';
  }
  views.auditLog = viewAuditLog;
  window.viewAuditLog = viewAuditLog;

  function exportAuditCSV() {
    const rows = arr(db.activityLog).map(x => [
      x.at || '', x.username || '', x.role || '',
      x.action || '', x.entity || '',
      x.label || '', x.detail || ''
    ]);
    download('audit_log_' + today() + '.csv',
      toCSV(['When','User','Role','Action','Entity','Label','Detail'],
        rows), 'text/csv');
    toast('Audit log exported', 'success');
  }
  window.exportAuditCSV = exportAuditCSV;

  function clearAuditLog() {
    if (!requirePerm('delete')) return;
    const n = arr(db.activityLog).length;
    confirmBox('Clear Audit Log?',
      'Delete all ' + n + ' log entries?\nThis cannot be undone.',
      () => {
        db.activityLog = [];
        logActivity('AUDIT_CLEARED', 'System', '',
          'Cleared ' + n + ' entries');
        save();
        render();
        toast('Audit log cleared', 'success');
      }, { confirmLabel: 'Clear All', danger: true });
  }
  window.clearAuditLog = clearAuditLog;

  /* ═════════════════════════════════════════════════════════════════════
     SECTION 2 — BACKUP & RESTORE
  ═════════════════════════════════════════════════════════════════════ */
  const BACKUP_KEYS = [
    'customers','suppliers','categories','banks','chartOfAccounts',
    'sales','receipts','purchases','payments','supplierReturns',
    'expenses','cashTransactions','customerCheques','chequeSplits',
    'chequeSettlements','chequeBooks','chequeLeaves','bankTransactions',
    'bankFees','bankTransfers','stockMonths','stockCategories',
    'paymentPlans','journals','openingBalances','reminderLog',
    'campaigns','activityLog','users','settings'
  ];
  window.BACKUP_KEYS = BACKUP_KEYS;

  function buildBackupObject(keys) {
    keys = keys || BACKUP_KEYS;
    const out = {
      _meta: {
        app: 'LankaShoe',
        version: 'P16',
        exportedAt: nowISO(),
        exportedBy: (getCurrentUser() || {}).username || 'system',
        keyCount: keys.length
      }
    };
    keys.forEach(k => {
      if (db[k] !== undefined) out[k] = db[k];
    });
    return out;
  }
  window.buildBackupObject = buildBackupObject;

  function downloadFullBackup() {
    if (!hasPerm('*')) { toast('Owner only', 'error'); return; }
    const data = buildBackupObject();
    const json = JSON.stringify(data, null, 2);
    const fname = 'lankashoe_backup_'
      + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)
      + '.json';
    download(fname, json, 'application/json');

    if (!db.settings.backup) db.settings.backup = {};
    db.settings.backup.lastBackupAt = nowISO();
    db.settings.backup.lastBackupSize = json.length;
    db.settings.backup.lastBackupCount =
      (db.settings.backup.lastBackupCount || 0) + 1;
    logActivity('BACKUP_CREATED', 'Backup', fname,
      (json.length / 1024).toFixed(1) + ' KB');
    save();
    toast('✅ Backup downloaded (' + (json.length / 1024).toFixed(1)
      + ' KB)', 'success', 5000);
    if (ui.view === 'backup') render();
  }
  window.downloadFullBackup = downloadFullBackup;

  function downloadSelectiveBackup() {
    if (!hasPerm('*')) { toast('Owner only', 'error'); return; }
    const checked = Array.from(
      document.querySelectorAll('.bkpKey:checked'))
      .map(cb => cb.value);
    if (!checked.length) { toast('Select at least one section', 'warn'); return; }
    const data = buildBackupObject(checked);
    const json = JSON.stringify(data, null, 2);
    const fname = 'lankashoe_partial_'
      + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)
      + '.json';
    download(fname, json, 'application/json');
    logActivity('BACKUP_PARTIAL', 'Backup', fname, checked.join(', '));
    save();
    toast('✅ Partial backup downloaded', 'success');
  }
  window.downloadSelectiveBackup = downloadSelectiveBackup;

  function downloadCSVBundle() {
    const keys = BACKUP_KEYS.filter(k =>
      Array.isArray(db[k]) && db[k].length);
    if (!keys.length) { toast('No data to export', 'warn'); return; }
    keys.forEach((k, idx) => {
      const arr_ = db[k];
      if (!arr_.length) return;
      const headers = Array.from(arr_.reduce((s, r) => {
        Object.keys(r || {}).forEach(h => s.add(h));
        return s;
      }, new Set()));
      const rows = arr_.map(r => headers.map(h => {
        const v = r[h];
        if (v && typeof v === 'object') return JSON.stringify(v);
        return v;
      }));
      setTimeout(() => {
        download(k + '_' + today() + '.csv',
          toCSV(headers, rows), 'text/csv');
      }, idx * 250);
    });
    toast('Exporting ' + keys.length + ' CSV files…', 'info');
  }
  window.downloadCSVBundle = downloadCSVBundle;

  function downloadPrintableSnapshot() {
    const u = getCurrentUser();
    const snap = '<!DOCTYPE html><html><head><meta charset="utf-8">'
      + '<title>Lanka Shoe — Snapshot</title>'
      + '<style>body{font-family:Inter,Arial,sans-serif;padding:20px;'
      + 'color:#111}h1{font-size:20px;margin:0 0 6px}'
      + 'h2{font-size:14px;margin:24px 0 6px;text-transform:uppercase;'
      + 'letter-spacing:.05em;color:#666;'
      + 'border-bottom:2px solid #eee;padding-bottom:4px}'
      + 'table{width:100%;border-collapse:collapse;font-size:11px}'
      + 'th,td{padding:6px 8px;text-align:left;'
      + 'border-bottom:1px solid #eee}'
      + 'th{background:#f3f4f6;font-size:10px;text-transform:uppercase;'
      + 'color:#666}.num{text-align:right}</style></head><body>'
      + '<h1>' + esc(db.settings.shopName || 'Lanka Shoe') + '</h1>'
      + '<div style="color:#666;font-size:12px">Data snapshot · '
      + dateTimeFmt(nowISO()) + ' · by '
      + esc(u ? u.username : 'system') + '</div>'

      + '<h2>Customers (' + arr(db.customers).length + ')</h2>'
      + '<table><tr><th>Name</th><th>Phone</th><th class="num">Balance</th></tr>'
      + arr(db.customers).slice(0, 100).map(c => {
          const bal = customerBalance(c.id);
          return '<tr><td>' + esc(c.name) + '</td>'
            + '<td>' + esc(c.phone || '') + '</td>'
            + '<td class="num">' + money(bal) + '</td></tr>';
        }).join('')
      + '</table>'

      + '<h2>Suppliers (' + arr(db.suppliers).length + ')</h2>'
      + '<table><tr><th>Name</th><th>Phone</th><th class="num">Payable</th></tr>'
      + arr(db.suppliers).slice(0, 100).map(s => {
          const bal = supplierBalance(s.id);
          return '<tr><td>' + esc(s.name) + '</td>'
            + '<td>' + esc(s.phone || '') + '</td>'
            + '<td class="num">' + money(bal) + '</td></tr>';
        }).join('')
      + '</table>'

      + '<h2>Banks</h2>'
      + '<table><tr><th>Bank</th><th>Account</th>'
      + '<th class="num">Balance</th></tr>'
      + arr(db.banks).map(b =>
          '<tr><td>' + esc(b.bankName) + '</td>'
          + '<td>' + esc(b.accountName || '') + '</td>'
          + '<td class="num">' + money(bankBalance(b.id)) + '</td></tr>'
        ).join('')
      + '</table>'

      + '<h2>Summary</h2>'
      + '<table>'
      + '<tr><td>Total Sales</td><td class="num">'
      + money(arr(db.sales).reduce((a, s) => a + NN(s.amount), 0))
      + '</td></tr>'
      + '<tr><td>Total Purchases</td><td class="num">'
      + money(arr(db.purchases).reduce((a, p) => a + NN(p.amount), 0))
      + '</td></tr>'
      + '<tr><td>Total Receipts</td><td class="num">'
      + money(arr(db.receipts).reduce((a, r) => a + NN(r.amount), 0))
      + '</td></tr>'
      + '<tr><td>Total Payments</td><td class="num">'
      + money(arr(db.payments).filter(p => !p.fullyReversed)
        .reduce((a, p) => a + NN(p.amount), 0))
      + '</td></tr>'
      + '<tr><td>Total Expenses</td><td class="num">'
      + money(arr(db.expenses).reduce((a, e) => a + NN(e.amount), 0))
      + '</td></tr>'
      + '</table>'

      + '<div style="margin-top:40px;text-align:center;font-size:10px;'
      + 'color:#888">Generated by Lanka Shoe Management System</div>'
      + '</body></html>';
    download('snapshot_' + today() + '.html', snap, 'text/html');
    logActivity('SNAPSHOT_DOWNLOADED', 'Backup', 'HTML snapshot', '');
    save();
    toast('✅ Snapshot downloaded', 'success');
  }
  window.downloadPrintableSnapshot = downloadPrintableSnapshot;

  /* ─── Backup view ─── */
  function viewBackup() {
    if (!hasPerm('*')) {
      return '<div class="card"><div class="empty">⛔ Owner only</div></div>';
    }
    const cfg = db.settings.backup || {};
    const daysSince = cfg.lastBackupAt
      ? Math.abs(daysBetween(cfg.lastBackupAt.slice(0, 10), today()))
      : 9999;
    const warn = daysSince > (cfg.autoRemindDays || 7);

    let totalSize = 0, totalRecs = 0;
    BACKUP_KEYS.forEach(k => {
      if (Array.isArray(db[k])) {
        totalRecs += db[k].length;
        try { totalSize += JSON.stringify(db[k]).length; } catch (e) {}
      }
    });

    return '<div class="kpi-strip">'
      + kpi('Data Size', (totalSize / 1024).toFixed(1) + ' KB',
          totalRecs + ' total records')
      + kpi('Backups Taken', cfg.lastBackupCount || 0, 'Lifetime')
      + kpi('Last Backup', cfg.lastBackupAt
          ? dateFmt(cfg.lastBackupAt.slice(0, 10)) : 'Never',
          cfg.lastBackupAt ? daysSince + ' days ago' : 'No backup yet')
      + '</div>'

      + (warn
        ? '<div class="card" style="background:var(--amber-soft);'
          + 'border-color:var(--amber)">'
          + '<div style="display:flex;gap:12px;align-items:center;'
          + 'color:var(--amber);font-size:13px">'
          + '<span style="font-size:22px">⚠️</span>'
          + '<div><strong>Backup reminder</strong> — '
          + (daysSince > 9999
              ? 'You have never taken a backup.'
              : 'Last backup was ' + daysSince + ' days ago.')
          + ' Download a backup now to protect your data.'
          + '</div></div></div>'
        : '')

      + '<div class="card">'
      + '<div class="card-head"><h3>💾 Backup & Restore</h3></div>'

      + '<div class="section-title" style="margin-top:0">Full Backup</div>'
      + '<div class="alert-mini">'
      + 'Full backup downloads a JSON file with <strong>everything</strong>. '
      + 'Store it in Google Drive / email it to yourself. Keep at least '
      + 'one off-device copy.'
      + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
      + '<button class="btn primary" onclick="downloadFullBackup()">'
      + '⬇ Full Backup (.json)</button>'
      + '<button class="btn" onclick="downloadCSVBundle()">'
      + '📊 Export All as CSV</button>'
      + '<button class="btn" onclick="downloadPrintableSnapshot()">'
      + '🖨 HTML Snapshot</button>'
      + '<button class="btn" onclick="openRestoreWizard()">'
      + '⬆ Restore from Backup</button>'
      + '</div>'

      + '<div class="section-title">Selective Backup</div>'
      + '<div id="selectiveKeys" style="display:grid;'
      + 'grid-template-columns:repeat(auto-fill,minmax(200px,1fr));'
      + 'gap:8px;margin-bottom:12px">'
      + BACKUP_KEYS.filter(k => db[k] !== undefined).map(k =>
          '<label style="display:flex;align-items:center;gap:8px;'
          + 'padding:8px 10px;border:1px solid var(--border);'
          + 'border-radius:8px;font-size:12.5px;cursor:pointer;'
          + 'background:var(--surface-2)">'
          + '<input type="checkbox" class="bkpKey" value="' + k + '">'
          + '<span style="flex:1">' + esc(k) + '</span>'
          + '<span style="color:var(--text-3);font-size:11px">'
          + (Array.isArray(db[k]) ? db[k].length : 'obj')
          + '</span></label>').join('')
      + '</div>'
      + '<div style="display:flex;gap:8px">'
      + '<button class="btn sm" onclick="toggleAllBackupKeys(true)">'
      + 'Select All</button>'
      + '<button class="btn sm" onclick="toggleAllBackupKeys(false)">'
      + 'Clear</button>'
      + '<button class="btn primary" onclick="downloadSelectiveBackup()">'
      + '⬇ Export Selected</button>'
      + '</div>'

      + '<div class="section-title">Backup Reminder Settings</div>'
      + '<label class="field" style="max-width:200px">'
      + 'Remind every (days)'
      + '<input type="number" min="1" max="90" value="'
      + (cfg.autoRemindDays || 7) + '" '
      + 'onchange="db.settings.backup.autoRemindDays=+this.value;'
      + 'save();render()"></label>'
      + '</div>';
  }
  views.backup = viewBackup;
  window.viewBackup = viewBackup;

  function toggleAllBackupKeys(flag) {
    document.querySelectorAll('.bkpKey').forEach(cb => {
      cb.checked = flag;
    });
  }
  window.toggleAllBackupKeys = toggleAllBackupKeys;

  /* ═════════════════════════════════════════════════════════════════════
     SECTION 3 — RESTORE WIZARD
  ═════════════════════════════════════════════════════════════════════ */
  function openRestoreWizard() {
    if (!hasPerm('*')) { toast('Owner only', 'error'); return; }
    openModal('⬆ Restore from Backup',
      '<div class="alert-mini" '
      + 'style="background:var(--red-soft);color:var(--red)">'
      + '⚠️ Restoring will modify your data. Choose the mode carefully. '
      + 'A backup of current data will be downloaded automatically.'
      + '</div>'
      + '<div class="form-grid" style="grid-template-columns:1fr;'
      + 'margin-top:14px">'
      + '<label class="field">Backup File (.json)'
      + '<input id="restoreFile" type="file" '
      + 'accept=".json,application/json"></label>'
      + '<label class="field">Restore Mode'
      + '<select id="restoreMode">'
      + '<option value="replace">🔴 Replace All — wipe existing data '
      + 'in selected sections</option>'
      + '<option value="merge">🟡 Merge — keep existing, add new by ID</option>'
      + '<option value="merge-overwrite">🟠 Merge & Overwrite — '
      + 'keep existing, overwrite by ID</option>'
      + '</select></label>'
      + '<label class="field">Sections to Restore'
      + '<div id="restoreKeyPicker" style="padding:10px;'
      + 'border:1px solid var(--border);border-radius:8px;'
      + 'max-height:200px;overflow:auto">'
      + '<div style="color:var(--text-3);font-size:12px">'
      + 'Upload a file to see available sections…</div>'
      + '</div></label>'
      + '</div>'
      + '<div class="form-actions">'
      + '<button class="btn" onclick="closeModal()">Cancel</button>'
      + '<button class="btn primary" onclick="executeRestore()">⬆ Restore</button>'
      + '</div>', { wide: true });

    setTimeout(() => {
      const fileEl = document.getElementById('restoreFile');
      if (!fileEl) return;
      fileEl.addEventListener('change', () => {
        const file = fileEl.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const parsed = JSON.parse(ev.target.result);
            window._pendingRestore = parsed;
            const keys = Object.keys(parsed)
              .filter(k => k !== '_meta' && (Array.isArray(parsed[k])

              + '</div>'

                  + '<span style="color:var(--text-3);font-size:11px">'
                  + (Array.isArray(parsed[k]) ? parsed[k].length : 'obj')
                  + ' records</span></label>').join('');
          } catch (err) {
            toast('Invalid JSON file', 'error');
            console.error(err);
          }
        };
        reader.readAsText(file);
      });
    }, 100);
  }
  window.openRestoreWizard = openRestoreWizard;

  function executeRestore() {
    const parsed = window._pendingRestore;
    if (!parsed) { toast('Upload a backup file first', 'warn'); return; }
    const mode = document.getElementById('restoreMode').value;
    const keys = Array.from(
      document.querySelectorAll('.rstKey:checked')).map(cb => cb.value);
    if (!keys.length) { toast('Select at least one section', 'warn'); return; }

    if (mode === 'replace') {
      if (!confirm('⚠ REPLACE ALL — Wipe current data in:\n\n'
        + keys.join(', ') + '\n\nProceed?')) return;
    }

    /* Auto-backup before restore */
    try {
      const pre = buildBackupObject();
      download('pre_restore_backup_' + today() + '.json',
        JSON.stringify(pre, null, 2), 'application/json');
    } catch (e) {}

    let added = 0, merged = 0, replaced = 0;

    keys.forEach(k => {
      const incoming = parsed[k];
      if (!Array.isArray(incoming)) {
        if (mode === 'replace') {
          db[k] = incoming;
        }
        return;
      }
      if (mode === 'replace') {
        db[k] = incoming.slice();
        replaced += incoming.length;
      } else {
        if (!Array.isArray(db[k])) db[k] = [];
        const existingIds = new Set(db[k].map(x => x && x.id).filter(Boolean));
        incoming.forEach(rec => {
          if (!rec || !rec.id) {
            if (mode === 'merge') { db[k].push(rec); added++; }
            return;
          }
          if (!existingIds.has(rec.id)) {
            db[k].push(rec);
            added++;
          } else if (mode === 'merge-overwrite') {
            const idx = db[k].findIndex(x => x.id === rec.id);
            if (idx >= 0) { db[k][idx] = rec; merged++; }
          }
        });
      }
    });

    logActivity('RESTORE_EXECUTED', 'Backup',
      'Mode: ' + mode,
      'Sections: ' + keys.join(', ')
        + ' · added:' + added + ' overwritten:' + merged
        + ' replaced:' + replaced);
    save();
    closeModal();
    render();
    toast('✅ Restore complete — added ' + added
      + ', overwritten ' + merged + ', replaced ' + replaced, 'success', 6000);
  }
  window.executeRestore = executeRestore;

  function sheetsAppsScriptCode() {
    return 'function doPost(e) {\n'
      + '  try {\n'
      + '    var data = JSON.parse(e.postData.contents);\n'
      + '    var ss = SpreadsheetApp.getActiveSpreadsheet();\n'
      + '    \n'
      + '    Object.keys(data).forEach(function(sheetName) {\n'
      + '      if (sheetName === "_meta") return;\n'
      + '      var rows = data[sheetName];\n'
      + '      if (!Array.isArray(rows) || rows.length === 0) return;\n'
      + '      \n'
      + '      var sheet = ss.getSheetByName(sheetName);\n'
      + '      if (!sheet) {\n'
      + '        sheet = ss.insertSheet(sheetName);\n'
      + '      } else {\n'
      + '        sheet.clear();\n'
      + '      }\n'
      + '      \n'
      + '      // Collect all possible keys\n'
      + '      var keys = {};\n'
      + '      rows.forEach(function(r) {\n'
      + '        Object.keys(r || {}).forEach(function(k) { keys[k] = true; });\n'
      + '      });\n'
      + '      var headers = Object.keys(keys);\n'
      + '      \n'
      + '      // Write headers\n'
      + '      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);\n'
      + '      sheet.getRange(1, 1, 1, headers.length).setFontWeight("bold");\n'
      + '      \n'
      + '      // Write rows\n'
      + '      var values = rows.map(function(r) {\n'
      + '        return headers.map(function(h) {\n'
      + '          var v = r[h];\n'
      + '          if (v === null || v === undefined) return "";\n'
      + '          if (typeof v === "object") return JSON.stringify(v);\n'
      + '          return v;\n'
      + '        });\n'
      + '      });\n'
      + '      if (values.length > 0) {\n'
      + '        sheet.getRange(2, 1, values.length, headers.length)\n'
      + '          .setValues(values);\n'
      + '      }\n'
      + '      sheet.autoResizeColumns(1, headers.length);\n'
      + '    });\n'
      + '    \n'
      + '    return ContentService.createTextOutput(\n'
      + '      JSON.stringify({ ok: true, received: new Date() })\n'
      + '    ).setMimeType(ContentService.MimeType.JSON);\n'
      + '  } catch(err) {\n'
      + '    return ContentService.createTextOutput(\n'
      + '      JSON.stringify({ ok: false, error: err.toString() })\n'
      + '    ).setMimeType(ContentService.MimeType.JSON);\n'
      + '  }\n'
      + '}\n\n'
      + 'function doGet(e) {\n'
      + '  return ContentService.createTextOutput(\n'
      + '    "Lanka Shoe Sheets Sync ready"\n'
      + '  );\n'
      + '}';
  }

    toast('Testing…', 'info');

  async function pushToSheets() {
    const url = db.settings.sheetsSync
      ? db.settings.sheetsSync.webAppUrl : '';
    if (!url) { toast('Save the Web App URL first', 'warn'); return; }

    const keys = Array.from(
      document.querySelectorAll('.sheetsKey:checked'))
      .map(cb => cb.value);
    if (!keys.length) { toast('Select at least one section', 'warn'); return; }

    const payload = { _meta: { sentAt: nowISO() } };
    keys.forEach(k => { payload[k] = arr(db[k]); });

    toast('Pushing ' + keys.length + ' sections…', 'info');

    try {
      const res = await fetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json && json.ok) {
        if (!db.settings.sheetsSync) db.settings.sheetsSync = {};
        db.settings.sheetsSync.lastPushAt = nowISO();
        logActivity('SHEETS_PUSHED', 'Sheets',
          keys.length + ' sections', '');
        save();
        render();
        toast('✅ Pushed to Google Sheets', 'success', 5000);

  function recalcAll() {
    if (!requirePerm('write')) return;
    const start = Date.now();
    let fixes = 0;

    /* 1. Rebuild sale allocations from receipts */
    try {
      const before = JSON.stringify(arr(db.sales).map(s =>
        [s.id, s.allocatedAmount, s.status]));
      rebuildSaleAllocations();
      const after = JSON.stringify(arr(db.sales).map(s =>
        [s.id, s.allocatedAmount, s.status]));
      if (before !== after) fixes++;
    } catch (e) { console.warn(e); }

    /* 2. Refresh plan statuses */
    try {
      arr(db.paymentPlans).forEach(p => refreshPlanStatuses(p));
    } catch (e) { console.warn(e); }

    /* 3. Clean old trash */
    try {
      const days = NN(db.settings.trashRetentionDays) || 30;
      const cutoff = shiftDate(today(), -days);
      const before = arr(db.trash).length;
      db.trash = arr(db.trash).filter(t =>
        (t.deletedAt || '').slice(0, 10) >= cutoff);
      if (db.trash.length < before) fixes++;
    } catch (e) { console.warn(e); }

    /* 4. Trim activity log to 5000 */
    try {
      if (arr(db.activityLog).length > 5000) {
        db.activityLog = db.activityLog.slice(-5000);
      }
    } catch (e) { console.warn(e); }

    /* 5. Ensure backups of monthly stock carried forward */
    try {
      arr(db.stockMonths).forEach(s => {
        /* Nothing to do here — opening is computed dynamically */
      });
    } catch (e) {}

    if (!Array.isArray(db.recalcLog)) db.recalcLog = [];
    db.recalcLog.push({
      id: uid(),
      at: nowISO(),
      by: (getCurrentUser() || {}).username || 'system',
      durationMs: Date.now() - start,
      fixes: fixes
    });
    if (db.recalcLog.length > 200) {
      db.recalcLog = db.recalcLog.slice(-200);
    }

    logActivity('RECALC_RUN', 'System', '',
      'Duration: ' + (Date.now() - start) + 'ms');
    save();
    render();
    toast('✅ Recalculation complete (' + (Date.now() - start) + 'ms)',
      'success');
  }
  window.recalcAll = recalcAll;

      try {

        if (dateEl && dateEl.value && dateEl.value < today()) {

      if (backdated && !id) {

      }
      return r;
    };
    patched.__part16Patched = true;

  /* ═════════════════════════════════════════════════════════════════════

  function softDelete(collection, id, label) {
    if (!requirePerm('delete')) return false;
    const list = arr(db[collection]);
    const idx = list.findIndex(x => x.id === id);
    if (idx === -1) return false;
    const item = list[idx];
    const trashEntry = {
      id: uid(),
      collection: collection,
      originalCollection: collection,
      item: JSON.parse(JSON.stringify(item)),
      label: label || collection,
      deletedBy: (getCurrentUser() || {}).username || 'system',
      deletedAt: nowISO()
    };
    if (!Array.isArray(db.trash)) db.trash = [];
    db.trash.unshift(trashEntry);
    list.splice(idx, 1);
    logActivity('SOFT_DELETE', collection, label || id, '');
    return true;
  }
  window.softDelete = softDelete;

  function restoreFromTrash(trashId) {
    if (!requirePerm('write')) return;
    const t = arr(db.trash).find(x => x.id === trashId);
    if (!t) return;
    const target = t.originalCollection || t.collection;
    if (!Array.isArray(db[target])) db[target] = [];
    db[target].push(t.item);
    db.trash = arr(db.trash).filter(x => x.id !== trashId);
    logActivity('TRASH_RESTORE', target, t.label || '', '');
    save();
    render();
    toast('✅ Restored', 'success');
  }

  function viewSettings() {
    const s = db.settings || {};

    return '<div class="settings-layout">'
      + '<aside class="settings-nav">'
      + SETTINGS_SECTIONS.map(sec =>
          '<div class="settings-nav-item '
          + (settingsTab === sec.key ? 'active' : '') + '" '
          + 'onclick="settingsTab=\'' + sec.key + '\';render()">'
          + '<span style="width:20px;text-align:center">'
          + sec.ico + '</span>' + esc(sec.label) + '</div>').join('')
      + '</aside>'
      + '<div class="settings-panel">'
      + renderSettingsSection(settingsTab)
      + '</div></div>';
  }
  views.settings = viewSettings;
  window.viewSettings = viewSettings;

  function renderSettingsSection(key) {
    const s = db.settings || {};

    if (key === 'profile') {
      return '<div class="settings-panel-head">'
        + '<h2>Business Profile</h2>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-top:4px">Shop info shown on all printed documents.</div>'
        + '</div>'
        + '<div class="settings-body">'
        + '<form onsubmit="saveProfileSettings(event)">'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Basic Details</div>'
        + '<div class="form-grid">'
        + '<label class="field">Shop Name'
        + '<input name="pShopName" required value="'
        + esc(s.shopName || '') + '"></label>'
        + '<label class="field">Owner Name'
        + '<input name="pOwnerName" value="'
        + esc(s.ownerName || '') + '"></label>'
        + '<label class="field">Phone'
        + '<input name="pPhone" value="' + esc(s.businessPhone || '')
        + '"></label>'
        + '<label class="field">Email'
        + '<input name="pEmail" type="email" value="'
        + esc(s.businessEmail || '') + '"></label>'
        + '<label class="field">Business Reg No'
        + '<input name="pReg" value="' + esc(s.businessRegNo || '')
        + '"></label>'
        + '<label class="field">Business Start Date'
        + '<input name="pStart" type="date" value="'
        + esc(s.businessStartDate || today()) + '"></label>'
        + '<label class="field">Fiscal Year Starts'
        + '<select name="pFiscal">'
        + MONTHS_FULL.map((m, i) =>
            '<option value="' + (i + 1) + '" '
            + (NN(s.fiscalYearStart) === (i + 1) ? 'selected' : '')
            + '>' + m + '</option>').join('')
        + '</select></label>'
        + '</div>'
        + '<label class="field" style="margin-top:14px">Address'
        + '<textarea name="pAddress" rows="2">'
        + esc(s.businessAddress || '') + '</textarea></label>'
        + '</div>'
        + '<div class="settings-actions">'
        + '<button type="submit" class="btn primary">Save Profile</button>'
        + '</div></form></div>';
    }

    if (key === 'appearance') {
      return '<div class="settings-panel-head">'
        + '<h2>Appearance</h2>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-top:4px">Theme and density.</div></div>'
        + '<div class="settings-body">'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Theme</div>'
        + '<div style="display:grid;grid-template-columns:'
        + 'repeat(auto-fill,minmax(180px,1fr));gap:12px">'
        + THEMES.map(t =>
            '<div class="theme-swatch '
            + (s.theme === t ? 'active' : '') + '" '
            + 'onclick="db.settings.theme=\'' + t
            + '\';save();applySettings();render()">'
            + '<div class="theme-swatch-preview theme-' + t + '"></div>'
            + '<div style="font-weight:700;font-size:12.5px;'
            + 'text-transform:capitalize;margin-top:8px">' + t + '</div>'
            + '</div>').join('')
        + '</div></div>'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Density</div>'
        + '<div class="seg" style="display:inline-flex">'
        + ['compact','comfortable','spacious'].map(d =>
            '<button type="button" class="seg-btn '
            + (s.density === d ? 'active' : '') + '" '
            + 'onclick="db.settings.density=\'' + d
            + '\';save();applySettings();render()">'
            + d.charAt(0).toUpperCase() + d.slice(1) + '</button>').join('')
        + '</div></div>'
        + '</div>';
    }

    if (key === 'financial') {
      return '<div class="settings-panel-head">'
        + '<h2>Currency & Format</h2>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-top:4px">Currency symbol and number format.</div></div>'
        + '<div class="settings-body">'
        + '<form onsubmit="saveFinancialSettings(event)">'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Currency</div>'
        + '<div class="form-grid">'
        + '<label class="field">Currency Code'
        + '<input name="fCode" value="'
        + esc(s.currency || 'LKR') + '"></label>'
        + '<label class="field">Symbol'
        + '<input name="fSymbol" value="'
        + esc(s.currencySymbol || 'Rs.') + '"></label>'
        + '<label class="field">Symbol Position'
        + '<select name="fPos">'
        + '<option value="before" '
        + (s.currencyPosition !== 'after' ? 'selected' : '')
        + '>Before (Rs. 100)</option>'
        + '<option value="after" '
        + (s.currencyPosition === 'after' ? 'selected' : '')
        + '>After (100 Rs.)</option>'
        + '</select></label>'
        + '<label class="field">Decimal Places'
        + '<select name="fDec">'
        + [0,1,2,3].map(n =>
            '<option value="' + n + '" '
            + (NN(s.decimalPlaces) === n ? 'selected' : '') + '>'
            + n + '</option>').join('')
        + '</select></label>'
        + '</div></div>'
        + '<div class="settings-actions">'
        + '<button type="submit" class="btn primary">Save</button>'
        + '</div></form></div>';
    }

    if (key === 'vat') {
      const v = s.vat || {};
      return '<div class="settings-panel-head">'
        + '<h2>Tax / VAT</h2>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-top:4px">VAT rate and registration details.</div></div>'
        + '<div class="settings-body">'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">VAT Registration</div>'
        + '<button class="btn primary" onclick="openVATSettings()">'
        + 'Edit VAT Settings</button>'
        + '<div class="form-grid" style="margin-top:16px">'
        + '<label class="field">Current Rate'
        + '<input value="' + NN(v.rate || 18) + '%" disabled '
        + 'style="background:var(--surface-2)"></label>'
        + '<label class="field">Pricing'
        + '<input value="' + (v.inclusive !== false
            ? 'VAT-inclusive' : 'VAT added on top') + '" disabled '
        + 'style="background:var(--surface-2)"></label>'
        + '<label class="field">TIN Number'
        + '<input value="' + esc(v.tinNumber || '—') + '" disabled '
        + 'style="background:var(--surface-2)"></label>'
        + '<label class="field">VAT Reg No'
        + '<input value="' + esc(v.vatNumber || '—') + '" disabled '
        + 'style="background:var(--surface-2)"></label>'
        + '</div></div>'
        + '</div>';
    }

    if (key === 'defaults') {
      return '<div class="settings-panel-head">'
        + '<h2>Defaults</h2>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-top:4px">Default values used across the system.</div></div>'
        + '<div class="settings-body">'
        + '<form onsubmit="saveDefaultsSettings(event)">'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Customer & Supplier</div>'
        + '<div class="form-grid">'
        + '<label class="field">Default Credit Days'
        + '<input name="dCreditDays" type="number" min="0" max="365" '
        + 'value="' + NN(s.defaultCreditDays || 30) + '"></label>'
        + '<label class="field">Default Cheque Days'
        + '<input name="dChequeDays" type="number" min="0" max="365" '
        + 'value="' + NN(s.defaultChequeDays || 30) + '"></label>'
        + '<label class="field">Trash Retention (days)'
        + '<input name="dTrash" type="number" min="1" max="365" '
        + 'value="' + NN(s.trashRetentionDays || 30) + '"></label>'
        + '</div></div>'
        + '<div class="settings-actions">'
        + '<button type="submit" class="btn primary">Save Defaults</button>'
        + '</div></form></div>';
    }

    if (key === 'danger') {
      return '<div class="settings-panel-head">'
        + '<h2>⚠️ Danger Zone</h2>'
        + '<div style="font-size:12.5px;color:var(--red);'
        + 'margin-top:4px">These actions cannot be undone.</div></div>'
        + '<div class="settings-body">'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Recalculate Everything</div>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-bottom:12px">Runs the auto-recalculation engine: '
        + 'rebuilds sale allocations, refreshes plan statuses, purges '
        + 'old trash, trims logs.</div>'
        + '<button class="btn primary" onclick="recalcAll()">'
        + '↺ Run Recalculation</button>'
        + '</div>'
        + '<div class="settings-section">'
        + '<div class="settings-section-title">Reset All Data</div>'
        + '<div style="font-size:12.5px;color:var(--text-3);'
        + 'margin-bottom:12px">Erase everything and restart. '
        + 'You will be logged out.</div>'
        + '<button class="btn danger" onclick="resetAllData()">'
        + '🗑 Reset All Data</button>'
        + '</div>'
        + '</div>';
    }

    return '<div class="settings-panel-head"><h2>Settings</h2></div>';
  }
  window.renderSettingsSection = renderSettingsSection;

  function saveProfileSettings(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    db.settings.shopName = f.pShopName.value.trim();
    db.settings.ownerName = f.pOwnerName.value.trim();
    db.settings.businessPhone = f.pPhone.value.trim();
    db.settings.businessEmail = f.pEmail.value.trim();
    db.settings.businessRegNo = f.pReg.value.trim();
    db.settings.businessStartDate = f.pStart.value || today();
    db.settings.fiscalYearStart = NN(f.pFiscal.value) || 1;
    db.settings.businessAddress = f.pAddress.value.trim();
    logActivity('SETTINGS_PROFILE_UPDATED', 'Settings', '', '');
    save();
    applySettings();
    render();
    toast('✅ Profile saved', 'success');
  }
  window.saveProfileSettings = saveProfileSettings;

  function saveFinancialSettings(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    db.settings.currency = f.fCode.value.trim();
    db.settings.currencySymbol = f.fSymbol.value.trim() || 'Rs.';
    db.settings.currencyPosition = f.fPos.value;
    db.settings.decimalPlaces = NN(f.fDec.value);
    save();
    render();
    toast('✅ Saved', 'success');
  }
  window.saveFinancialSettings = saveFinancialSettings;

  function saveDefaultsSettings(e) {
    e.preventDefault();
    if (!requirePerm('write')) return;
    const f = e.target;
    db.settings.defaultCreditDays = NN(f.dCreditDays.value) || 30;
    db.settings.defaultChequeDays = NN(f.dChequeDays.value) || 30;
    db.settings.trashRetentionDays = NN(f.dTrash.value) || 30;
    save();
    render();
    toast('✅ Defaults saved', 'success');
  }
  window.saveDefaultsSettings = saveDefaultsSettings;

  function resetAllData() {
    if (!hasPerm('*')) { toast('Owner only', 'error'); return; }
    confirmBox('Reset All Data?',
      'This will ERASE everything including customers, sales, '
      + 'suppliers, cheques, and settings. You will be logged out.\n\n'
      + 'Are you absolutely sure?',
      () => {
        try {
          const backup = buildBackupObject();
          download('pre_reset_backup_' + today() + '.json',
            JSON.stringify(backup, null, 2), 'application/json');
        } catch (e) {}
        setTimeout(() => {
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          location.reload();
        }, 600);
      }, { confirmLabel: 'Yes, Erase Everything', danger: true });
  }
  window.resetAllData = resetAllData;

  /* ═════════════════════════════════════════════════════════════════════
     NAV HOOK
  ═════════════════════════════════════════════════════════════════════ */
  const origRenderNav = window.renderNav;
  window.renderNav = function () {
    origRenderNav.apply(this, arguments);
    const nav = document.getElementById('nav');
    if (!nav || nav.querySelector('[data-view="auditLog"]')) return;
    const me = getCurrentUser();
    if (!me) return;
    const isOwner = ROLES[me.role] && ROLES[me.role].level >= 100;

    const item = (view, ico, label) =>
      '<div class="nav-item' + (ui.view === view ? ' active' : '')
      + '" data-view="' + view + '" '
      + 'onclick="goTo(\'' + view + '\')" title="' + esc(label) + '">'
      + '<span class="ico">' + ico + '</span>'
      + '<span>' + esc(label) + '</span></div>';

    const adminGroup = '<div class="nav-group" data-group="admin">'
      + '<div class="nav-label">Admin</div>'
      + item('auditLog', '📜', 'Audit Log')
      + (isOwner ? item('backup', '💾', 'Backup & Restore') : '')
      + (isOwner ? item('sheetsSync', '📊', 'Sheets Sync') : '')
      + item('trash', '🗑', 'Recycle Bin')
      + item('settings', '⚙️', 'Settings')
      + '</div>';

    nav.insertAdjacentHTML('beforeend', adminGroup);
  };

  /* Titles */
  window.titles = Object.assign(window.titles || {}, {
    auditLog: 'Audit Log',
    backup: 'Backup & Restore',
    sheetsSync: 'Google Sheets Sync',
    trash: 'Recycle Bin',
    settings: 'Settings'
  });

  /* Command palette */
  const origGetCpItems = window.getCpItems;
  window.getCpItems = function () {
    const base = origGetCpItems ? origGetCpItems() : [];
    return base.concat([
      { label: 'Go to Audit Log', ico: '📜', kind: 'view',
        action: () => goTo('auditLog') },
      { label: 'Go to Backup', ico: '💾', kind: 'view',
        action: () => goTo('backup') },
      { label: 'Go to Sheets Sync', ico: '📊', kind: 'view',
        action: () => goTo('sheetsSync') },
      { label: 'Go to Recycle Bin', ico: '🗑', kind: 'view',
        action: () => goTo('trash') },
      { label: 'Go to Settings', ico: '⚙️', kind: 'view',
        action: () => goTo('settings') },
      { label: 'Download Full Backup', ico: '⬇', kind: 'action',
        action: () => downloadFullBackup() },
      { label: 'Run Recalculation', ico: '↺', kind: 'action',
        action: () => recalcAll() }
    ]);
  };

      /* Settings layout */
      + '.settings-layout{display:grid;grid-template-columns:220px 1fr;'

      /* Tables */

      + '.pill-danger{background:var(--red-soft);color:var(--red)}'
      + '.pill-soft{background:var(--accent-soft);color:var(--accent-text)}'
      + '.alert-mini{padding:10px 14px;background:var(--accent-soft);'

      + 'line-height:1.5}'
      + '.section-title{font-size:11.5px;font-weight:800;'

    document.head.appendChild(style);
